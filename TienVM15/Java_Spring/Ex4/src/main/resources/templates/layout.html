<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Material Management System</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- 1. BANNER SECTION -->
    <header class="banner">
        <div class="logo-area">
            <i class="bi bi-file-earmark-zip-fill" style="font-size: 28px; color: #ffffff;"></i>
            <div class="logo-text">
                <h1>Material System</h1>
            </div>
        </div>

        <div class="header-right">
            <!-- Search bar (Bonus 2: Search Materials) -->
            <form th:action="@{/materials}" method="get" class="search-box">
                <input type="text" name="query" th:value="${searchQuery}" placeholder="Search materials or subjects...">
                <button type="submit" style="background: none; border: none; cursor: pointer;">
                    <i class="bi bi-search" style="color: #ffffff; font-size: 14px;"></i>
                </button>
            </form>
            
            <i class="bi bi-person-circle" style="font-size: 28px; cursor: pointer;"></i>
        </div>
    </header>

    <div class="main-wrapper">
        <!-- 2. MENU LEFT SECTION (SIDEBAR) -->
        <aside class="menu-left">
            <ul class="nav-links">
                <!-- Dashboard -->
                <li class="menu-item">
                    <a th:href="@{/}" th:class="'menu-link' + (${#request.getRequestURI() == '/'} ? ' active' : '')">
                        <i class="bi bi-speedometer2"></i>
                        <span>Dashboard</span>
                    </a>
                </li>

                <!-- Training Management Section -->
                <li class="menu-item">
                    <span class="menu-link" style="font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; color: var(--text-muted); margin-top: 15px; padding-left: 16px;">
                        Training Management
                    </span>
                    <ul class="submenu">
                        <!-- Subject Management -->
                        <li class="menu-item">
                            <a th:href="@{/subjects}" th:class="'menu-link' + (${#request.getRequestURI().startsWith('/subjects')} ? ' active' : '')">
                                <i class="bi bi-journal-bookmark-fill"></i>
                                <span>Subject Management</span>
                            </a>
                        </li>
                        
                        <!-- Material Management -->
                        <li class="menu-item">
                            <a th:href="@{/materials}" th:class="'menu-link' + (${#request.getRequestURI().startsWith('/materials')} ? ' active' : '')">
                                <i class="bi bi-file-earmark-arrow-up-fill"></i>
                                <span>Material Management</span>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </aside>

        <!-- 3. BODY SECTION -->
        <main class="body-content">
            <div th:replace="~{:: body}">
                <!-- Content will be injected here -->
            </div>
        </main>
    </div>

    <!-- 4. FOOTER SECTION -->
    <footer class="main-footer">
        <div class="footer-text">&copy; 2026 - Training Material Management System. All rights reserved.</div>
    </footer>

</body>
</html>
