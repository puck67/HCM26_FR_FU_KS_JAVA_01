<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<head>
    <title>Dashboard - Material Management</title>
</head>
<body>
    <div th:fragment="body">
        
        <!-- Welcome card -->
        <div class="welcome-container" style="margin-bottom: 35px;">
            <h2 class="welcome-title">WELCOME TO TRAINING MATERIAL MANAGEMENT SYSTEM</h2>
            <p class="welcome-subtitle">Seamlessly upload, download, search, and categorize learning materials (lecture slides, assignments, source codes, etc.) for academic subjects.</p>
            <div style="margin-top: 15px; display: flex; justify-content: center; gap: 15px;">
                <a th:href="@{/materials}" class="btn btn-primary">
                    <i class="bi bi-file-earmark-arrow-up"></i> Manage Learning Materials
                </a>
                <a th:href="@{/subjects}" class="btn btn-secondary">
                    <i class="bi bi-journal-plus"></i> Configure Subjects
                </a>
            </div>
        </div>

        <!-- Stats grid -->
        <div class="stats-grid">
            <!-- Total Subjects -->
            <div class="stats-card">
                <div class="stats-icon">
                    <i class="bi bi-journal-bookmark"></i>
                </div>
                <div class="stats-info">
                    <span class="stats-label">Total Subjects</span>
                    <span class="stats-value" th:text="${totalSubjects}">0</span>
                </div>
            </div>

            <!-- Total Materials -->
            <div class="stats-card">
                <div class="stats-icon">
                    <i class="bi bi-files"></i>
                </div>
                <div class="stats-info">
                    <span class="stats-label">Total Materials</span>
                    <span class="stats-value" th:text="${totalMaterials}">0</span>
                </div>
            </div>

            <!-- Total Storage Used -->
            <div class="stats-card">
                <div class="stats-icon">
                    <i class="bi bi-hdd-network"></i>
                </div>
                <div class="stats-info">
                    <span class="stats-label">Storage Occupied</span>
                    <span class="stats-value" th:text="${formattedStorage}">0 B</span>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
