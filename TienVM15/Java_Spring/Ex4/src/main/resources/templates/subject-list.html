<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<head>
    <title>Subject Management - Material Management</title>
</head>
<body>
    <div th:fragment="body">
        
        <div class="card">
            <div class="card-title">
                <span>Subject Management System</span>
                <a th:href="@{/subjects/create}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Add Subject
                </a>
            </div>

            <div class="card-body" style="padding: 0;">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Subject Code</th>
                                <th>Subject Name</th>
                                <th style="width: 150px;">Duration (Hours)</th>
                                <th style="width: 150px;">Materials Count</th>
                                <th style="width: 200px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sub : ${allSubjects}">
                                <td th:text="${sub.id}">1</td>
                                <td>
                                    <strong th:text="${sub.code}" style="color: var(--accent-blue);">JAVA01</strong>
                                </td>
                                <td th:text="${sub.name}">Java Programming</td>
                                <td th:text="${sub.duration + ' hrs'}" style="text-align: center;">40 hrs</td>
                                <td th:text="${#lists.size(sub.materials)}" style="text-align: center; font-weight: bold;">0</td>
                                <td>
                                    <!-- Edit -->
                                    <a th:href="@{/subjects/edit/{id}(id=${sub.id})}" class="action-link action-edit">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </a>
                                    
                                    <!-- Delete -->
                                    <a th:href="@{/subjects/delete/{id}(id=${sub.id})}" 
                                       class="action-link action-delete"
                                       onclick="return confirm('Are you sure you want to delete this subject? Note: All learning materials under this subject will be deleted recursively!');">
                                        <i class="bi bi-trash"></i> Delete
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(allSubjects)}">
                                <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">
                                    No subjects available. Click "Add Subject" to create one.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
