<div xmlns:th="http://www.thymeleaf.org" th:fragment="body">
    <div class="card">
        <div class="card-title">
            <span>Courses Management</span>
            <a th:href="@{/courses/create}" class="btn btn-primary" style="padding: 8px 16px; font-size: 14px;">+ Add Course</a>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Course Code</th>
                        <th>Start Date</th>
                        <th>Course Name</th>
                        <th>Category</th>
                        <th>Instructor</th>
                        <th>Lessons Count</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${courses}">
                        <td th:text="${course.courseCode}" style="font-weight: 600; color: var(--accent-blue);">JAVA101</td>
                        <td th:text="${course.startDate}">2026-06-10</td>
                        <td th:text="${course.courseName}">Java Programming</td>
                        <td th:text="${course.category}">IT</td>
                        <td th:text="${course.instructor}">John</td>
                        <td th:text="${#lists.size(course.lessons)}">0</td>
                        <td>
                            <a th:href="@{/lesson/detail(courseCode=${course.courseCode}, startDate=${course.startDate})}" 
                               class="action-link action-edit">Manage Lessons</a>
                            <a th:href="@{/courses/edit/{id}(id=${course.courseCode + '_' + course.startDate})}" 
                               class="action-link action-edit">Edit</a>
                            <a th:href="@{/courses/delete/{id}(id=${course.courseCode + '_' + course.startDate})}" 
                               class="action-link action-delete" 
                               onclick="return confirm('Are you sure you want to delete this course?')">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(courses)}">
                        <td colspan="7" style="text-align: center; color: var(--text-muted);">No courses available. Click "+ Add Course" to create one.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
