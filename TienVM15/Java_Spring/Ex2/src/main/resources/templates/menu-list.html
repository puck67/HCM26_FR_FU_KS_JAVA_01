<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<head>
    <title>Menu Configuration - Menu Management</title>
</head>
<body>
    <div th:fragment="body">
        
        <div class="card">
            <div class="card-title">
                <span>Menu Configuration Management</span>
                <a th:href="@{/menus/create}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i>
                    Add Menu Item
                </a>
            </div>

            <div class="card-body" style="padding: 0;">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Name</th>
                                <th>URL</th>
                                <th>Icon</th>
                                <th>Parent Menu</th>
                                <th style="width: 120px;">Display Order</th>
                                <th style="width: 100px;">Status</th>
                                <th style="width: 200px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${allMenus}">
                                <td th:text="${m.id}">1</td>
                                <td>
                                    <strong th:text="${m.name}" style="color: var(--accent-blue);">Dashboard</strong>
                                </td>
                                <td>
                                    <code th:text="${m.url != '#' ? m.url : '(none)'}">/</code>
                                </td>
                                <td>
                                    <span th:if="${m.icon != null && m.icon != ''}">
                                        <i th:class="'bi bi-' + ${m.icon}"></i>
                                        <code th:text="${m.icon}">house</code>
                                    </span>
                                    <span th:unless="${m.icon != null && m.icon != ''}" style="color: var(--text-muted); font-size: 12px;">(none)</span>
                                </td>
                                <td>
                                    <span th:if="${m.parent != null}" th:text="${m.parent.name}" class="btn-secondary" style="font-size: 12px; padding: 2px 8px; border-radius: 4px;">User Management</span>
                                    <span th:unless="${m.parent != null}" style="color: var(--text-muted); font-style: italic; font-size: 12px;">Root Menu</span>
                                </td>
                                <td th:text="${m.displayOrder}" style="text-align: center; font-weight: bold;">1</td>
                                <td>
                                    <span th:if="${m.status}" style="color: var(--success-border); font-weight: bold;">
                                        <i class="bi bi-check-circle-fill"></i> Active
                                    </span>
                                    <span th:unless="${m.status}" style="color: var(--text-muted);">
                                        <i class="bi bi-x-circle"></i> Inactive
                                    </span>
                                </td>
                                <td>
                                    <!-- Edit -->
                                    <a th:href="@{/menus/edit/{id}(id=${m.id})}" class="action-link action-edit">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </a>
                                    
                                    <!-- Delete with Custom Confirm message showing Cascade Warning -->
                                    <a th:href="@{/menus/delete/{id}(id=${m.id})}" 
                                       class="action-link action-delete"
                                       th:data-confirm-msg="'Are you sure you want to delete this menu? Note: All sub-menus will be deleted too! (Cascade Delete)'"
                                       onclick="return confirm(this.getAttribute('data-confirm-msg'));">
                                        <i class="bi bi-trash"></i> Delete
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(allMenus)}">
                                <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 30px;">
                                    No menus configured. Click "Add Menu Item" to start.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
