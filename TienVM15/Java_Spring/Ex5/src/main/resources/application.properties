# App Port
server.port=8080

# H2 Database Connection (File-Based for long term persistence)
spring.datasource.url=jdbc:h2:file:./db/trainingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console configuration (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configurations
# Secret key must be at least 256 bits (32 bytes) for HS256 algorithm
app.jwt.secret=9a67471b40284dfa189f76a5c1bc25619a67471b40284dfa189f76a5c1bc2561
# Access Token expiration: 15 minutes (900000 ms)
app.jwt.expiration-ms=900000
# Refresh Token expiration: 7 days (604800000 ms)
app.jwt.refresh-expiration-ms=604800000
