<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Management System</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- 1. BANNER SECTION -->
    <header class="banner">
        <div class="logo-area">
            <i class="bi bi-shield-lock-fill" style="font-size: 28px; color: #ffffff;"></i>
            <div class="logo-text">
                <h1>Security System</h1>
            </div>
        </div>

        <!-- Bonus 2: Display active user and role in the Header -->
        <div class="header-right" sec:authorize="isAuthenticated()">
            <div class="user-info-text">
                <span>Welcome, <strong sec:authentication="name" style="color: #38bdf8;">username</strong></span>
                <span class="user-role-badge">
                    <span sec:authorize="hasRole('SUPER_ADMIN')">SUPER_ADMIN</span>
                    <span sec:authorize="hasRole('ADMIN') and !hasRole('SUPER_ADMIN')">ADMIN</span>
                    <span sec:authorize="hasRole('TEACHER') and !hasRole('ADMIN') and !hasRole('SUPER_ADMIN')">TEACHER</span>
                </span>
            </div>
            
            <a th:href="@{/logout}" class="btn-logout">
                <i class="bi bi-box-arrow-right"></i> Log out
            </a>
        </div>
    </header>

    <div class="main-wrapper">
        <!-- 2. MENU LEFT SECTION (SIDEBAR) -->
        <aside class="menu-left" sec:authorize="isAuthenticated()">
            <ul class="nav-links">
                <!-- Dashboard link (shown to all SUPER_ADMIN, ADMIN, TEACHER) -->
                <li class="menu-item">
                    <a th:href="@{/dashboard}" th:class="'menu-link' + (${#request.getRequestURI() == '/dashboard'} ? ' active' : '')">
                        <span class="menu-icon-text">
                            <i class="bi bi-speedometer2"></i>
                            <span>Dashboard</span>
                        </span>
                    </a>
                </li>

                <!-- Security Management parent section (SUPER_ADMIN, ADMIN) -->
                <li class="menu-item" sec:authorize="hasAnyRole('SUPER_ADMIN', 'ADMIN')">
                    <span class="menu-link" style="font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; color: var(--text-muted); margin-top: 15px; padding-left: 16px;">
                        Security Management
                    </span>
                    
                    <!-- Submenu for dynamic links based on role -->
                    <ul class="submenu">
                        <!-- User Management (SUPER_ADMIN, ADMIN) -->
                        <li class="menu-item">
                            <a th:href="@{/users}" th:class="'menu-link' + (${#request.getRequestURI().startsWith('/users')} ? ' active' : '')">
                                <span class="menu-icon-text">
                                    <i class="bi bi-people-fill"></i>
                                    <span>User Management</span>
                                </span>
                            </a>
                        </li>
                        
                        <!-- Role Management (SUPER_ADMIN only) -->
                        <li class="menu-item" sec:authorize="hasRole('SUPER_ADMIN')">
                            <a th:href="@{/roles}" th:class="'menu-link' + (${#request.getRequestURI().startsWith('/roles')} ? ' active' : '')">
                                <span class="menu-icon-text">
                                    <i class="bi bi-key-fill"></i>
                                    <span>Role Management</span>
                                </span>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </aside>

        <!-- 3. BODY SECTION -->
        <main class="body-content">
            <div th:replace="~{:: body}">
                <!-- Content will be injected here -->
            </div>
        </main>
    </div>

    <!-- 4. FOOTER SECTION -->
    <footer class="main-footer">
        <div class="footer-text">&copy; 2026 - User & Security Management System. Built with Spring Security</div>
    </footer>

</body>
</html>
