<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Security System</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-wrapper">

    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-shield-lock"></i>
            <h2>System Login</h2>
            <p>Please enter your credentials to proceed</p>
        </div>

        <!-- Error messages -->
        <div th:if="${param.error}" class="alert-box alert-danger">
            <!-- Check if account was inactive (DisabledException) -->
            <span th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null && #strings.contains(session.SPRING_SECURITY_LAST_EXCEPTION.message, 'disabled')}"
                  th:text="'This account is INACTIVE! Access denied.'">Account Inactive!</span>
            <span th:unless="${session.SPRING_SECURITY_LAST_EXCEPTION != null && #strings.contains(session.SPRING_SECURITY_LAST_EXCEPTION.message, 'disabled')}"
                  th:text="'Invalid username or password.'">Invalid credentials.</span>
        </div>

        <!-- Logout notices -->
        <div th:if="${param.logout}" class="alert-box alert-success">
            <span>You have been successfully logged out.</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <!-- Username -->
            <div class="form-group">
                <label for="username">Username</label>
                <div style="position: relative;">
                    <input type="text" id="username" name="username" required placeholder="e.g. superadmin" style="padding-left: 40px;">
                    <i class="bi bi-person" style="position: absolute; left: 14px; top: 12px; color: var(--text-muted); font-size: 16px;"></i>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" name="password" required placeholder="••••••••" style="padding-left: 40px;">
                    <i class="bi bi-lock" style="position: absolute; left: 14px; top: 12px; color: var(--text-muted); font-size: 16px;"></i>
                </div>
            </div>

            <!-- Remember me (optional) -->
            <div class="form-group checkbox-group" style="margin-bottom: 25px;">
                <input type="checkbox" id="remember-me" name="remember-me">
                <label for="remember-me" style="font-weight: 500; cursor: pointer;">Remember my login</label>
            </div>

            <!-- Submit button -->
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>
    </div>

</body>
</html>
