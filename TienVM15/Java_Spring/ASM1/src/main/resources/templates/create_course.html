<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create New Course</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; color: #333; }
        .form-container { max-width: 500px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .error-message { color: red; font-size: 13px; margin-top: 5px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Create New Course</h2>
    
    <!-- BÀI TẬP TASK 2: HOÀN THIỆN THYMELEAF FORM -->
    <!-- 1. Sử dụng th:action để chỉ định url gửi post ("/courses/create") và th:object="${course}" để bind đối tượng. -->
    <form action="#" th:action="@{/courses/create}" th:object="${course}" method="post">
        
        <!-- Ví dụ mẫu cho trường Title: -->
        <div class="form-group">
            <label for="title">Course Title:</label>
            <input type="text" id="title" th:field="*{title}" />
            <div class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <!-- VIẾT TIẾP CODE CỦA BẠN DƯỚI ĐÂY CHO CÁC TRƯỜNG CÒN LẠI: -->
        <!-- 2. Trường instructorName (Tên giảng viên): -->
        
        
        <!-- 3. Trường instructorEmail (Email giảng viên): -->
        
        
        <!-- 4. Trường description (Mô tả khóa học - sử dụng <textarea>): -->
        
        
        <!-- 5. Trường durationHours (Thời lượng khóa học - sử dụng type="number"): -->
        
        
        <div style="margin-top: 20px;">
            <button type="submit">Create Course</button>
        </div>
    </form>
</div>

</body>
</html>
