<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
    <main th:with="activePage='dashboard'">
        <div style="max-width: 900px; margin: 0 auto;">
            <!-- Header card -->
            <div class="card" style="border-color: rgba(99, 102, 241, 0.2);">
                <h1 style="font-size: 1.75rem; font-weight: 700; color: #ffffff; margin-bottom: 0.25rem;">Instructor Control Center</h1>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Manage courses, publish content, and moderate reviews.</p>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-val" th:text="${totalCourses}">0</div>
                    <div class="stat-label">Total Courses</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" th:text="${publishedCourses}">0</div>
                    <div class="stat-label">Published</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" th:text="${pendingReviews}">0</div>
                    <div class="stat-label" style="color: var(--warning);">Pending Reviews</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" th:text="${totalCategories}">0</div>
                    <div class="stat-label">Categories</div>
                </div>
            </div>

            <!-- Quick Action Links -->
            <div class="card">
                <h3 class="card-title">
                    <i class="fa-solid fa-bolt"></i>
                    Quick Action Panel
                </h3>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <a th:href="@{/instructor/courses/create}" class="btn-action-primary">
                        <i class="fa-solid fa-plus"></i>
                        Create New Course
                    </a>
                    <a th:href="@{/instructor/courses}" class="btn-action-primary" style="background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass); box-shadow: none;">
                        <i class="fa-solid fa-gears"></i>
                        Manage All Courses
                    </a>
                    <a th:href="@{/instructor/reviews}" class="btn-action-primary" style="background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass); box-shadow: none;">
                        <i class="fa-regular fa-star"></i>
                        Moderate Reviews
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
