<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
    <main th:with="activePage='courses'">
        <div>
            <!-- Alert banners -->
            <div th:if="${successMessage}" class="alert alert-success">
                <i class="fa-solid fa-circle-check"></i>
                <span th:text="${successMessage}">Success message</span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-error">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span th:text="${errorMessage}">Error message</span>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); padding-bottom: 1rem; margin-bottom: 1.5rem;">
                    <h2 style="font-size: 1.5rem; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fa-solid fa-graduation-cap" style="color: #818cf8;"></i>
                        Course Inventory
                    </h2>
                    <a th:href="@{/instructor/courses/create}" class="btn-action-primary">
                        <i class="fa-solid fa-plus"></i> Create New Course
                    </a>
                </div>

                <div class="table-container">
                    <table th:if="${not #lists.isEmpty(courses)}">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th style="width: 130px;">Status</th>
                                <th>Categories</th>
                                <th style="width: 380px; text-align: center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="course : ${courses}">
                                <td style="font-weight: 600; color: #ffffff;" th:text="${course.title}">Course Title</td>
                                <td>
                                    <span th:if="${course.status == 1}" class="badge badge-draft">Draft</span>
                                    <span th:if="${course.status == 2}" class="badge badge-published">Published</span>
                                    <span th:if="${course.status == 3}" class="badge badge-archived">Archived</span>
                                </td>
                                <td th:text="${course.category}">Spring, Java</td>
                                <td>
                                    <div class="action-buttons" style="justify-content: center; flex-wrap: wrap;">
                                        <!-- Edit -->
                                        <a th:href="@{/instructor/courses/edit/{id}(id=${course.id})}" class="btn-action" title="Edit Course" style="width: auto; padding: 0 0.75rem; font-size: 0.85rem; gap: 0.25rem;">
                                            <i class="fa-solid fa-pen"></i> Edit
                                        </a>
                                        
                                        <!-- Publish / Unpublish -->
                                        <a th:if="${course.status != 2}" th:href="@{/instructor/courses/publish/{id}(id=${course.id})}" class="btn-action btn-download" title="Publish Course" style="width: auto; padding: 0 0.75rem; font-size: 0.85rem; gap: 0.25rem;">
                                            <i class="fa-solid fa-circle-check"></i> Publish
                                        </a>
                                        <a th:if="${course.status == 2}" th:href="@{/instructor/courses/unpublish/{id}(id=${course.id})}" class="btn-action" title="Revert to Draft" style="width: auto; padding: 0 0.75rem; font-size: 0.85rem; gap: 0.25rem;">
                                            <i class="fa-solid fa-circle-pause"></i> Unpublish
                                        </a>
                                        
                                        <!-- Archive -->
                                        <a th:if="${course.status != 3}" th:href="@{/instructor/courses/archive/{id}(id=${course.id})}" class="btn-action" title="Archive Course" style="width: auto; padding: 0 0.75rem; font-size: 0.85rem; gap: 0.25rem; background: rgba(245, 158, 11, 0.05); color: #f59e0b; border-color: rgba(245, 158, 11, 0.25);">
                                            <i class="fa-solid fa-box-archive"></i> Archive
                                        </a>
                                        
                                        <!-- Delete -->
                                        <a th:href="@{/instructor/courses/delete/{id}(id=${course.id})}" class="btn-action btn-delete" title="Delete Course" onclick="return confirm('Are you sure you want to delete this course?')" style="width: auto; padding: 0 0.75rem; font-size: 0.85rem; gap: 0.25rem;">
                                            <i class="fa-solid fa-trash-can"></i> Delete
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div th:if="${#lists.isEmpty(courses)}" style="text-align: center; padding: 4rem 0; color: var(--text-muted);">
                        <i class="fa-regular fa-folder" style="font-size: 3rem; display: block; margin-bottom: 1rem; opacity: 0.5;"></i>
                        <p>No courses found in database.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
