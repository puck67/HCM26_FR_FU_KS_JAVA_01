<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
    <main th:with="activePage='manage-reviews'">
        <div style="max-width: 800px; margin: 0 auto;">
            <!-- Alert banners -->
            <div th:if="${successMessage}" class="alert alert-success">
                <i class="fa-solid fa-circle-check"></i>
                <span th:text="${successMessage}">Success message</span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-error">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span th:text="${errorMessage}">Error message</span>
            </div>

            <!-- Pending Reviews Card -->
            <div class="card">
                <h2 class="card-title">
                    <i class="fa-solid fa-clock-rotate-left" style="color: var(--warning);"></i>
                    Pending Reviews Approval
                </h2>
                
                <div th:each="review : ${pendingReviews}" class="review-item" style="border-left-color: var(--warning); margin-bottom: 2rem; border-bottom: 1px solid rgba(255, 255, 255, 0.03); padding-bottom: 1rem;">
                    <div style="font-size: 0.85rem; color: #818cf8; margin-bottom: 0.5rem;" th:text="${'On: ' + review.course.title}">On Course Title</div>
                    <div class="review-header">
                        <span class="review-author" th:text="${review.authorName + ' (' + review.email + ')'}">Author</span>
                        <span class="review-stars">
                            <i th:each="star : ${#numbers.sequence(1, 5)}" 
                               class="fa-star" th:classappend="${star <= review.rating} ? 'fa-solid' : 'fa-regular'"></i>
                        </span>
                    </div>
                    <p class="review-content" style="margin: 0.5rem 0;" th:text="${review.content}">Review content body text.</p>
                    <div style="display: flex; gap: 0.75rem; margin-top: 0.75rem;">
                        <a th:href="@{/instructor/reviews/approve/{id}(id=${review.id})}" class="btn-action-primary" style="padding: 0.4rem 1rem; font-size: 0.85rem; background: var(--secondary); box-shadow: none;">
                            <i class="fa-solid fa-circle-check"></i> Approve
                        </a>
                        <a th:href="@{/instructor/reviews/delete/{id}(id=${review.id})}" class="btn-action-primary" style="padding: 0.4rem 1rem; font-size: 0.85rem; background: var(--danger); box-shadow: none;" onclick="return confirm('Are you sure you want to reject/delete this review?')">
                            <i class="fa-solid fa-trash-can"></i> Reject
                        </a>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(pendingReviews)}" style="color: var(--text-muted); text-align: center; padding: 2rem 0;">
                    <i class="fa-regular fa-bell-slash" style="font-size: 2rem; display: block; margin-bottom: 0.5rem; opacity: 0.5;"></i>
                    <p>No pending reviews to moderate.</p>
                </div>
            </div>

            <!-- Approved Reviews Card -->
            <div class="card">
                <h2 class="card-title">
                    <i class="fa-solid fa-circle-check" style="color: var(--secondary);"></i>
                    Approved Reviews
                </h2>

                <div th:each="review : ${approvedReviews}" class="review-item" style="border-left-color: var(--secondary); margin-bottom: 2rem; border-bottom: 1px solid rgba(255, 255, 255, 0.03); padding-bottom: 1rem;">
                    <div style="font-size: 0.85rem; color: #818cf8; margin-bottom: 0.5rem;" th:text="${'On: ' + review.course.title}">On Course Title</div>
                    <div class="review-header">
                        <span class="review-author" th:text="${review.authorName + ' (' + review.email + ')'}">Author</span>
                        <span class="review-stars">
                            <i th:each="star : ${#numbers.sequence(1, 5)}" 
                               class="fa-star" th:classappend="${star <= review.rating} ? 'fa-solid' : 'fa-regular'"></i>
                        </span>
                    </div>
                    <p class="review-content" style="margin: 0.5rem 0;" th:text="${review.content}">Review content text body.</p>
                    <div style="margin-top: 0.75rem;">
                        <a th:href="@{/instructor/reviews/delete/{id}(id=${review.id})}" class="btn-action-primary" style="padding: 0.4rem 1rem; font-size: 0.85rem; background: var(--danger); box-shadow: none;" onclick="return confirm('Are you sure you want to delete this approved review?')">
                            <i class="fa-solid fa-trash-can"></i> Delete
                        </a>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(approvedReviews)}" style="color: var(--text-muted); text-align: center; padding: 2rem 0;">
                    <i class="fa-regular fa-comments" style="font-size: 2rem; display: block; margin-bottom: 0.5rem; opacity: 0.5;"></i>
                    <p>No approved reviews found.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
