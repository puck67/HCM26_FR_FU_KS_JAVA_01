<div xmlns:th="http://www.thymeleaf.org" th:fragment="body">
    
    <!-- Success Alert Banner -->
    <div th:if="${successMessage}" class="alert-box alert-success" id="successAlert">
        <!-- SVG Check circle -->
        <svg class="alert-icon-svg" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <span>Add a new Course successfully!</span>
    </div>

    <!-- Error Alert Banner -->
    <div th:if="${errorMessage}" class="alert-box alert-danger">
        <svg class="alert-icon-svg" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span th:text="${errorMessage}">Course already exists!</span>
    </div>

    <!-- Native JS Alert Trigger -->
    <script th:if="${successMessage}">
        alert("Add a new Course successfully");
    </script>

    <!-- Lesson Detail Redirect Link (only shown after successful save) -->
    <div th:if="${savedCourseCode}" class="lesson-detail-link-container" style="margin-bottom: 25px;">
        <a th:href="@{/lesson/detail(courseCode=${savedCourseCode}, startDate=${savedStartDate})}" 
           class="lesson-detail-link" 
           id="lessonDetailLink">
           Lesson Detail
        </a>
        <span style="color: var(--danger-text); font-size: 24px; font-weight: 500; margin-left: 20px;">Thêm chi tiết bài học</span>
    </div>

    <!-- Create New Course Card -->
    <div class="card">
        <div class="card-header" th:text="${course.courseCode != null} ? 'Edit Course' : 'Create New Course'">
            Create New Course
        </div>
        <div class="card-body">
            <form th:action="@{/courses/save(isEdit=${course.courseCode != null})}" method="post" th:object="${course}">
                <div class="form-grid">
                    <!-- Mã khóa học / Course ID -->
                    <div class="form-group">
                        <label for="courseCode">Mã khóa học / Course ID</label>
                        <input type="text" id="courseCode" th:field="*{courseCode}" required placeholder="CRS101" th:readonly="${course.courseCode != null}">
                        <span th:if="${#fields.hasErrors('courseCode')}" th:errors="*{courseCode}" style="color: var(--danger-text); font-size: 12px;">Error</span>
                    </div>

                    <!-- Ngày khai giảng / Start Date -->
                    <div class="form-group">
                        <label for="startDate">Ngày khai giảng / Start Date</label>
                        <input type="date" id="startDate" th:field="*{startDate}" required th:readonly="${course.courseCode != null}">
                        <span th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" style="color: var(--danger-text); font-size: 12px;">Error</span>
                    </div>

                    <!-- Tên khóa học / Course Name -->
                    <div class="form-group full-width">
                        <label for="courseName">Tên khóa học / Course Name</label>
                        <input type="text" id="courseName" th:field="*{courseName}" required placeholder="Java Web Development">
                        <span th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}" style="color: var(--danger-text); font-size: 12px;">Error</span>
                    </div>

                    <!-- Danh mục / Category -->
                    <div class="form-group full-width">
                        <label for="category">Danh mục / Category</label>
                        <select id="category" th:field="*{category}">
                            <option value="Technology">Technology</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Business">Business</option>
                            <option value="Language">Language</option>
                        </select>
                        <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" style="color: var(--danger-text); font-size: 12px;">Error</span>
                    </div>

                    <!-- Giảng viên / Instructor -->
                    <div class="form-group full-width">
                        <label for="instructor">Giảng viên / Instructor</label>
                        <input type="text" id="instructor" th:field="*{instructor}" placeholder="Dr. Nguyen Van A">
                        <span th:if="${#fields.hasErrors('instructor')}" th:errors="*{instructor}" style="color: var(--danger-text); font-size: 12px;">Error</span>
                    </div>
                </div>

                <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 25px;">
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">Save Course</button>
                        <a th:href="@{/courses}" class="btn btn-secondary">Cancel</a>
                    </div>
                    
                    <!-- Screenshot design text label on the right -->
                    <div style="color: #333333; font-size: 18px; font-weight: 500;" th:text="${course.courseCode != null} ? 'Edit Course' : 'Add a new Course (Course Detail Screen)'">
                        Add a new Course (Course Detail Screen)
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
