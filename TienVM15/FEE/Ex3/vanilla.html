    <!-- Native JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.card');
            const avgRatingVal = document.getElementById('avg-rating-value');
            const totalItemsVal = document.getElementById('total-items-value');
            const totalFavVal = document.getElementById('total-fav-value');

            // Initial updates
            updateTotals();

            // Set up event listeners for each card
            cards.forEach(card => {
                const stars = card.querySelectorAll('.star');
                const favBtn = card.querySelector('.fav-btn');
                const tooltip = card.querySelector('.fav-tooltip');

                // 1. Star Rating Logic
                stars.forEach(star => {
                    star.addEventListener('click', () => {
                        const ratingValue = parseInt(star.getAttribute('data-value'), 10);
                        const currentRating = parseInt(card.getAttribute('data-rating'), 10);

                        // If user clicks the current rating, they can reset it to 0, otherwise set it
                        const newRating = (currentRating === ratingValue) ? 0 : ratingValue;
                        card.setAttribute('data-rating', newRating);

                        // Update stars UI inside this card
                        stars.forEach(s => {
                            const val = parseInt(s.getAttribute('data-value'), 10);
                            if (val <= newRating) {
                                s.classList.add('active');
                            } else {
                                s.classList.remove('active');
                            }
                        });

                        updateTotals();
                    });
                });

                // 2. Favorite Toggle Logic
                favBtn.addEventListener('click', () => {
                    const isActive = favBtn.classList.toggle('active');
                    if (isActive) {
                        tooltip.textContent = 'Remove Favorite';
                        favBtn.setAttribute('aria-label', 'Remove Favorite');
                    } else {
                        tooltip.textContent = 'Add to Favorites';
                        favBtn.setAttribute('aria-label', 'Add to Favorites');
                    }
                    updateTotals();
                });
            });

            // Recalculates stats and updates summary footer manually using standard DOM APIs
            function updateTotals() {
                let totalRating = 0;
                let ratedCount = 0;
                let favCount = 0;

                cards.forEach(card => {
                    const rating = parseInt(card.getAttribute('data-rating'), 10) || 0;
                    totalRating += rating;
                    if (rating > 0) {
                        ratedCount++;
                    }

                    const favBtn = card.querySelector('.fav-btn');
                    if (favBtn.classList.contains('active')) {
                        favCount++;
                    }
                });

                // Compute Average Rating (overall average across all items)
                const average = cards.length > 0 ? (totalRating / cards.length).toFixed(1) : '0.0';

                // Manual updates to footer text content
                avgRatingVal.textContent = average;
                totalItemsVal.textContent = cards.length;
                totalFavVal.textContent = favCount;
            }
        });
    </script>
</body>
</html>
