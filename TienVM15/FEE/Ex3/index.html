    <!-- jQuery Event Handling, Visual Effects, Animations, and Query Selectors -->
    <script>
        $(document).ready(function() {
            // Keep track of current totals to only animate on change
            let lastAverage = '0.0';
            let lastFavorites = 0;

            // Initial computation
            updateTotals(true); // silent initial load (no animations)

            // 1. Rating Hover Preview Effect (Problem 03 specification)
            $('.rating-stars').on('mouseenter', '.star', function() {
                const hoverValue = $(this).data('value');
                const $stars = $(this).closest('.rating-stars').find('.star');

                $stars.each(function() {
                    const starVal = $(this).data('value');
                    if (starVal <= hoverValue) {
                        $(this).addClass('hover-pre');
                    } else {
                        $(this).removeClass('hover-pre');
                    }
                });
            }).on('mouseleave', function() {
                // Remove pre-fill styles when leaving the rating stars container
                $(this).find('.star').removeClass('hover-pre');
            });

            // 2. Rating click logic via jQuery delegation
            $('.rating-stars').on('click', '.star', function() {
                const clickedValue = $(this).data('value');
                const $card = $(this).closest('.card');
                const currentRating = parseInt($card.attr('data-rating') || 0, 10);

                // If user clicks the current rating, they can reset it to 0, otherwise set it
                const newRating = (currentRating === clickedValue) ? 0 : clickedValue;
                $card.attr('data-rating', newRating);

                // Update star rendering inside this card
                const $stars = $(this).closest('.rating-stars').find('.star');
                $stars.each(function() {
                    const starVal = $(this).data('value');
                    if (starVal <= newRating) {
                        $(this).addClass('active');
                    } else {
                        $(this).removeClass('active');
                    }
                });

                updateTotals();
            });

            // 3. Favorites button toggle logic via jQuery delegation
            $('.gallery-grid').on('click', '.fav-btn', function() {
                const $btn = $(this);
                const $card = $btn.closest('.card');
                const $tooltip = $card.find('.fav-tooltip');

                // Toggle active state
                const isFavorited = $btn.toggleClass('active').hasClass('active');

                // Update UI text and ARIA properties
                if (isFavorited) {
                    $tooltip.text('Remove Favorite');
                    $btn.attr('aria-label', 'Remove Favorite');
                } else {
                    $tooltip.text('Add to Favorites');
                    $btn.attr('aria-label', 'Add to Favorites');
                }

                updateTotals();
            });

            // 4. Update and Math Logic with jQuery selectors and iteration methods (.each)
            function updateTotals(isInitialLoad = false) {
                let totalRating = 0;
                let activeCardsCount = $('.card').length;
                let totalFavorites = 0;

                // Iterate through cards using jQuery .each()
                $('.card').each(function() {
                    const cardRating = parseInt($(this).attr('data-rating') || 0, 10);
                    totalRating += cardRating;

                    const isFav = $(this).find('.fav-btn').hasClass('active');
                    if (isFav) {
                        totalFavorites++;
                    }
                });

                const averageRatingStr = activeCardsCount > 0 ? (totalRating / activeCardsCount).toFixed(1) : '0.0';

                // 5. Visual animations using jQuery's fadeIn/fadeOut for number changes (Problem 03 specification)
                const $avgLabel = $('#avg-rating-value');
                const $totalFavLabel = $('#total-fav-value');

                if (isInitialLoad) {
                    $avgLabel.text(averageRatingStr);
                    $('#total-items-value').text(activeCardsCount);
                    $totalFavLabel.text(totalFavorites);
                } else {
                    // Animate Average Rating if changed
                    if (averageRatingStr !== lastAverage) {
                        $avgLabel.fadeOut(150, function() {
                            $(this).text(averageRatingStr).fadeIn(150);
                        });
                    }

                    // Animate Total Favorites if changed
                    if (totalFavorites !== lastFavorites) {
                        $totalFavLabel.fadeOut(150, function() {
                            $(this).text(totalFavorites).fadeIn(150);
                        });
                    }
                }

                // Cache values for future comparisons
                lastAverage = averageRatingStr;
                lastFavorites = totalFavorites;
            }
        });
    </script>
</body>
</html>
