<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Enterprise Management Portal</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <!-- Premium Style -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- 5 Seconds Loading Overlay -->
    <div id="loading-overlay" style="display: none;">
        <div class="spinner-premium"></div>
        <div class="loading-progress">Loading content...</div>
        <p class="text-muted small mt-2">Simulating Enterprise Network Request (5s delay)</p>
    </div>

    <div id="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <i class="fas fa-cubes mr-3 text-success"></i>CMS Core
                </div>
            </div>

            <ul class="list-unstyled components">
                <p class="text-muted small text-uppercase font-weight-bold px-3">Applications</p>
                <li id="menu-view">
                    <a href="#" data-page="view-content.html"><i class="fas fa-table"></i>View Contents</a>
                </li>
                <li id="menu-add">
                    <a href="#" data-page="add-content.html"><i class="fas fa-edit"></i>Form Content</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <!-- Top Navbar -->
            <nav class="navbar navbar-expand-lg navbar-light navbar-custom mb-4">
                <button type="button" id="sidebarCollapse" class="btn btn-light bg-white border">
                    <i class="fas fa-align-left text-success"></i>
                </button>
                
                <div class="ml-auto d-flex align-items-center">
                    <!-- User Profile Dropdown -->
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle text-dark font-weight-bold" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <i class="far fa-user-circle mr-2 text-success" style="font-size: 1.2rem;"></i> 
                            <span id="userDisplayEmail">User</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-right shadow-sm border-0" aria-labelledby="navbarDropdown" style="border-radius: 12px; padding: 8px;">
                            <a class="dropdown-item py-2" href="#" id="menu-profile" data-page="edit-profile.html">
                                <i class="fas fa-user-cog mr-2 text-muted"></i>User Profile
                            </a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item py-2 text-danger font-weight-bold" href="login.html" id="logoutBtn">
                                <i class="fas fa-sign-out-alt mr-2"></i>Logout
                            </a>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Main Content Insertion Area -->
            <div id="main-content-area">
                <!-- Dynamically populated via CMSApp.router.load -->
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
    <!-- Application Logic -->
    <script src="app.js"></script>

    <script>
        $(document).ready(function() {
            // Check Session
            const userEmail = CMSApp.storage.get('userEmail');
            if (!userEmail) {
                window.location.href = 'login.html';
                return;
            }
            $('#userDisplayEmail').text(userEmail);

            // Toggle Sidebar
            $('#sidebarCollapse').on('click', function() {
                $('#sidebar').toggleClass('active');
            });

            // Handle navigation clicks
            $('#sidebar ul li a, #menu-profile').on('click', function(e) {
                e.preventDefault();
                const pageUrl = $(this).attr('data-page');
                const targetLi = $(this).closest('li');
                
                CMSApp.router.load(pageUrl, targetLi);
            });

            // Logout
            $('#logoutBtn').on('click', function() {
                CMSApp.storage.remove('userEmail');
            });

            // Default startup route - load view-content.html
            CMSApp.router.load('view-content.html', '#menu-view');
        });
    </script>
</body>
</html>
