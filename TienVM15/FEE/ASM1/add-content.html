<div class="card shadow-sm border-0 bg-white">
    <div class="card-header bg-white border-bottom py-3">
        <h4 class="mb-0 text-dark font-weight-bold"><i class="fas fa-edit mr-2 text-success"></i>Form Content</h4>
    </div>
    <div class="card-body p-4">
        <div id="contentAlert" class="alert alert-success alert-dismissible fade show border-0 shadow-sm" style="display: none; background-color: rgba(16, 185, 129, 0.1); color: var(--success);" role="alert">
            <i class="fas fa-check-circle mr-2"></i>New content article added successfully and synced!
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        
        <form id="contentForm" novalidate>
            <div class="form-group">
                <label for="title">Article Title</label>
                <input type="text" class="form-control" id="title" placeholder="Enter title" required>
                <div class="invalid-feedback" id="titleError">Title is required (10 to 200 characters).</div>
                <small class="form-text text-muted" id="titleCount">0 / 200 characters</small>
            </div>

            <div class="form-group">
                <label for="brief">Brief Outline</label>
                <textarea class="form-control" id="brief" rows="3" placeholder="Brief outline" required></textarea>
                <div class="invalid-feedback" id="briefError">Brief outline is required (30 to 150 characters).</div>
                <small class="form-text text-muted" id="briefCount">0 / 150 characters</small>
            </div>

            <div class="form-group">
                <label for="contentBody">Content Body</label>
                <textarea class="form-control" id="contentBody" rows="6" placeholder="Content Body" required></textarea>
                <div class="invalid-feedback" id="bodyError">Content body is required (50 to 1000 characters).</div>
                <small class="form-text text-muted" id="bodyCount">0 / 1000 characters</small>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary font-weight-bold shadow-sm px-4">Submit Button</button>
                <button type="reset" class="btn btn-secondary font-weight-bold px-4 ml-2">Reset Button</button>
            </div>
        </form>
    </div>
</div>

<script>
    $(document).ready(function() {
        const $title = $('#title');
        const $brief = $('#brief');
        const $body = $('#contentBody');
        
        const validator = CMSApp.validator;
        const storage = CMSApp.storage;

        // Counter helpers
        function updateCounter($el, $counter, max) {
            const len = $el.val().length;
            $counter.text(`${len} / ${max} characters`);
            if (len > max) {
                $counter.addClass('text-danger').removeClass('text-muted');
            } else {
                $counter.addClass('text-muted').removeClass('text-danger');
            }
        }

        // Keyup/Input counters
        $title.on('input keyup', () => updateCounter($title, $('#titleCount'), 200));
        $brief.on('input keyup', () => updateCounter($brief, $('#briefCount'), 150));
        $body.on('input keyup', () => updateCounter($body, $('#bodyCount'), 1000));

        // Real-time Validation mapping
        $title.on('keyup blur', () => validator.validateField($title, val => validator.rules.range(val.trim(), 10, 200), '#titleError'));
        $brief.on('keyup blur', () => validator.validateField($brief, val => validator.rules.range(val.trim(), 30, 150), '#briefError'));
        $body.on('keyup blur', () => validator.validateField($body, val => validator.rules.range(val.trim(), 50, 1000), '#bodyError'));

        // Form Submit
        $('#contentForm').on('submit', function(e) {
            e.preventDefault();

            const isTitleValid = validator.validateField($title, val => validator.rules.range(val.trim(), 10, 200), '#titleError');
            const isBriefValid = validator.validateField($brief, val => validator.rules.range(val.trim(), 30, 150), '#briefError');
            const isBodyValid = validator.validateField($body, val => validator.rules.range(val.trim(), 50, 1000), '#bodyError');

            if (!isTitleValid) validator.shakeField($title);
            if (!isBriefValid) validator.shakeField($brief);
            if (!isBodyValid) validator.shakeField($body);

            if (isTitleValid && isBriefValid && isBodyValid) {
                let contents = storage.get('contents', []);
                
                const d = new Date();
                const formattedDate = d.getFullYear() + '-' + 
                                      String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                                      String(d.getDate()).padStart(2, '0') + ' ' + 
                                      String(d.getHours()).padStart(2, '0') + ':' + 
                                      String(d.getMinutes()).padStart(2, '0');

                contents.unshift({
                    id: Date.now(),
                    title: $title.val().trim(),
                    brief: $brief.val().trim(),
                    content: $body.val().trim(),
                    createdDate: formattedDate
                });

                storage.set('contents', contents);

                $('#contentAlert').fadeIn();
                $('#contentForm')[0].reset();
                
                // Reset text counters
                $('#titleCount').text('0 / 200 characters');
                $('#briefCount').text('0 / 150 characters');
                $('#bodyCount').text('0 / 1000 characters');

                setTimeout(() => $('#contentAlert').fadeOut(), 4000);
            }
        });
    });
</script>
