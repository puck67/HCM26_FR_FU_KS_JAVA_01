<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Premium Portal Register</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <!-- Premium Style -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-wrapper">

    <div class="auth-card">
        <div class="auth-logo"><i class="fas fa-cubes mr-2"></i>CMS</div>
        <div class="auth-title">Register your Account</div>
        
        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="username">User Name</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-transparent border-right-0"><i class="far fa-user text-muted"></i></span>
                    </div>
                    <input type="text" id="username" class="form-control border-left-0 pl-0" placeholder="User Name" required>
                </div>
                <div class="invalid-feedback" id="usernameError">Username must be between 3 and 30 characters.</div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-transparent border-right-0"><i class="far fa-envelope text-muted"></i></span>
                    </div>
                    <input type="email" id="email" class="form-control border-left-0 pl-0" placeholder="Email" required>
                </div>
                <div class="invalid-feedback" id="emailError">Please enter a valid email address (at least 5 characters).</div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-transparent border-right-0"><i class="fas fa-lock text-muted"></i></span>
                    </div>
                    <input type="password" id="password" class="form-control border-left-0 pl-0" placeholder="Password" required>
                </div>
                <div class="invalid-feedback" id="passwordError">Password must be between 8 and 30 characters.</div>
            </div>

            <div class="form-group">
                <label for="repassword">Confirm Password</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-transparent border-right-0"><i class="fas fa-shield-alt text-muted"></i></span>
                    </div>
                    <input type="password" id="repassword" class="form-control border-left-0 pl-0" placeholder="Re-enter Password" required>
                </div>
                <div class="invalid-feedback" id="repasswordError">Passwords do not match.</div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block btn-submit shadow mt-4">Create Account</button>
            
            <div class="text-center mt-4">
                <span class="text-muted small">Already have an account?</span>
                <a href="login.html" class="text-success small font-weight-bold ml-1">Login here</a>
            </div>
        </form>
    </div>

    <!-- jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
    <!-- Application Logic -->
    <script src="app.js"></script>

    <script>
        $(document).ready(function() {
            const $username = $('#username');
            const $email = $('#email');
            const $password = $('#password');
            const $repassword = $('#repassword');
            const validator = CMSApp.validator;

            // Inline Real-time Field Validations
            $username.on('blur keyup', function() {
                validator.validateField($username, val => validator.rules.range(val.trim(), 3, 30), '#usernameError');
            });

            $email.on('blur keyup', function() {
                validator.validateField($email, val => validator.rules.email(val.trim()) && validator.rules.minLength(val.trim(), 5), '#emailError');
            });

            $password.on('blur keyup', function() {
                validator.validateField($password, val => validator.rules.range(val, 8, 30), '#passwordError');
            });

            $repassword.on('blur keyup', function() {
                validator.validateField($repassword, val => val === $password.val() && val !== '', '#repasswordError');
            });

            // Form Submit handler
            $('#registerForm').on('submit', function(e) {
                e.preventDefault();

                const isUserValid = validator.validateField($username, val => validator.rules.range(val.trim(), 3, 30), '#usernameError');
                const isEmailValid = validator.validateField($email, val => validator.rules.email(val.trim()) && validator.rules.minLength(val.trim(), 5), '#emailError');
                const isPasswordValid = validator.validateField($password, val => validator.rules.range(val, 8, 30), '#passwordError');
                const isRepassValid = validator.validateField($repassword, val => val === $password.val() && val !== '', '#repasswordError');

                if (!isUserValid) validator.shakeField($username);
                if (!isEmailValid) validator.shakeField($email);
                if (!isPasswordValid) validator.shakeField($password);
                if (!isRepassValid) validator.shakeField($repassword);

                if (isUserValid && isEmailValid && isPasswordValid && isRepassValid) {
                    alert('Registration successful! Redirecting to Login page...');
                    window.location.href = 'login.html';
                }
            });
        });
    </script>
</body>
</html>
