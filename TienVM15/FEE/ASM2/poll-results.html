<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Poll Results</title>
    <style>
        /* This style tag is inside head and should NOT be imported/applied to the main document */
        h3 {
            color: red; 
            text-transform: uppercase;
        }
        .text-chart {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div style="padding: 15px; border-radius: 4px; border: 1px solid #c8e6c9; background-color: #e8f5e9;">
        <h3 style="color: #28a745; margin-bottom: 15px;">Detailed Results: Great poll</h3>
        
        <div style="margin-bottom: 15px;">
            <p style="font-weight: 600; margin-bottom: 5px;">1. Is it necessary to you?</p>
            <div style="display: flex; align-items: center; margin-bottom: 5px;">
                <span style="width: 80px; font-size: 0.9rem;">Yes (75%):</span>
                <div style="flex-grow: 1; height: 12px; background-color: #e2e8f0; border-radius: 6px; overflow: hidden; margin: 0 10px;">
                    <div style="width: 75%; height: 100%; background-color: #28a745;"></div>
                </div>
                <span style="font-size: 0.9rem; font-weight: bold;">150 votes</span>
            </div>
            <div style="display: flex; align-items: center;">
                <span style="width: 80px; font-size: 0.9rem;">No (25%):</span>
                <div style="flex-grow: 1; height: 12px; background-color: #e2e8f0; border-radius: 6px; overflow: hidden; margin: 0 10px;">
                    <div style="width: 25%; height: 100%; background-color: #6c757d;"></div>
                </div>
                <span style="font-size: 0.9rem; font-weight: bold;">50 votes</span>
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <p style="font-weight: 600; margin-bottom: 5px;">2. Often pass polls?</p>
            <div style="display: flex; align-items: center; margin-bottom: 5px;">
                <span style="width: 100px; font-size: 0.9rem;">Once a month:</span>
                <div style="flex-grow: 1; height: 12px; background-color: #e2e8f0; border-radius: 6px; overflow: hidden; margin: 0 10px;">
                    <div style="width: 40%; height: 100%; background-color: #17a2b8;"></div>
                </div>
                <span style="font-size: 0.9rem; font-weight: bold;">80 votes</span>
            </div>
            <div style="display: flex; align-items: center;">
                <span style="width: 100px; font-size: 0.9rem;">Once a week:</span>
                <div style="flex-grow: 1; height: 12px; background-color: #e2e8f0; border-radius: 6px; overflow: hidden; margin: 0 10px;">
                    <div style="width: 60%; height: 100%; background-color: #28a745;"></div>
                </div>
                <span style="font-size: 0.9rem; font-weight: bold;">120 votes</span>
            </div>
        </div>

        <div>
            <p style="font-weight: 600; margin-bottom: 5px;">3. How old are you?</p>
            <div style="display: flex; align-items: center; margin-bottom: 5px;">
                <span style="width: 80px; font-size: 0.9rem;">18-20:</span>
                <div style="flex-grow: 1; height: 12px; background-color: #e2e8f0; border-radius: 6px; overflow: hidden; margin: 0 10px;">
                    <div style="width: 70%; height: 100%; background-color: #ffc107;"></div>
                </div>
                <span style="font-size: 0.9rem; font-weight: bold;">140 votes</span>
            </div>
            <div style="display: flex; align-items: center;">
                <span style="width: 80px; font-size: 0.9rem;">21-23:</span>
                <div style="flex-grow: 1; height: 12px; background-color: #e2e8f0; border-radius: 6px; overflow: hidden; margin: 0 10px;">
                    <div style="width: 30%; height: 100%; background-color: #28a745;"></div>
                </div>
                <span style="font-size: 0.9rem; font-weight: bold;">60 votes</span>
            </div>
        </div>
    </div>
</body>
</html>
