<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CMS System</title>
  <!-- Bootstrap 4 CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2><i class="fas fa-cubes mr-2"></i>CMS Portal</h2>
        <p>Sign in to manage your contents</p>
      </div>
      <div class="auth-body">
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email" class="font-weight-600">Email Address</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text bg-white border-right-0"><i class="fas fa-envelope text-muted"></i></span>
              </div>
              <input type="email" class="form-control border-left-0" id="email" name="email" 
                     placeholder="Enter email" size="50" maxlength="50" required>
            </div>
          </div>
          <div class="form-group mb-4">
            <label for="password" class="font-weight-600">Password</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text bg-white border-right-0"><i class="fas fa-lock text-muted"></i></span>
              </div>
              <input type="password" class="form-control border-left-0" id="password" name="password" 
                     placeholder="Enter password" size="50" maxlength="50" required>
            </div>
          </div>
          <div class="form-group d-flex justify-content-between align-items-center mb-4">
            <div class="custom-control custom-checkbox">
              <input type="checkbox" class="custom-control-input" id="rememberMe">
              <label class="custom-control-label text-muted font-weight-normal" for="rememberMe" style="cursor: pointer;">Remember Me</label>
            </div>
          </div>
          <button type="submit" class="btn btn-green btn-block">
            <i class="fas fa-sign-in-alt mr-2"></i>Login
          </button>
        </form>
      </div>
      <div class="auth-footer">
        Don't have an account? <a href="register.html">Click here to Register</a>
      </div>
    </div>
  </div>

  <!-- JavaScript Dependencies (jQuery standard, Popper, Bootstrap) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
  <!-- Custom JS -->
  <script src="js/main.js"></script>
</body>
</html>
