<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CMS System</title>
  <!-- Bootstrap 4 CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2><i class="fas fa-user-plus mr-2"></i>Create Account</h2>
        <p>Join us to start managing your contents</p>
      </div>
      <div class="auth-body">
        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="username" class="font-weight-600">Username</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text bg-white border-right-0"><i class="fas fa-user text-muted"></i></span>
              </div>
              <input type="text" class="form-control border-left-0" id="username" name="username" 
                     placeholder="Enter Username" size="50" maxlength="50" required>
            </div>
          </div>
          <div class="form-group">
            <label for="email" class="font-weight-600">Email Address</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text bg-white border-right-0"><i class="fas fa-envelope text-muted"></i></span>
              </div>
              <input type="email" class="form-control border-left-0" id="email" name="email" 
                     placeholder="Enter Email Address" size="50" maxlength="50" required>
            </div>
          </div>
          <div class="form-group">
            <label for="password" class="font-weight-600">Password</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text bg-white border-right-0"><i class="fas fa-lock text-muted"></i></span>
              </div>
              <input type="password" class="form-control border-left-0" id="password" name="password" 
                     placeholder="Enter Password" size="50" maxlength="50" required>
            </div>
          </div>
          <div class="form-group mb-4">
            <label for="repassword" class="font-weight-600">Repeat Password</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text bg-white border-right-0"><i class="fas fa-lock text-muted"></i></span>
              </div>
              <input type="password" class="form-control border-left-0" id="repassword" name="repassword" 
                     placeholder="Repeat Password" required>
            </div>
          </div>
          <button type="submit" class="btn btn-green btn-block">
            <i class="fas fa-check-circle mr-2"></i>Register
          </button>
        </form>
      </div>
      <div class="auth-footer">
        Already have an account? <a href="login.html">Click here to Login</a>
      </div>
    </div>
  </div>

  <!-- JavaScript Dependencies (jQuery standard, Popper, Bootstrap) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
  <!-- Custom JS -->
  <script src="js/main.js"></script>
</body>
</html>
