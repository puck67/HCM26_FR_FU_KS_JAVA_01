<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - CMS System</title>
  <!-- Bootstrap 4 CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Top Navbar -->
  <nav class="dashboard-navbar">
    <div class="d-flex align-items-center">
      <button id="mobile-toggle" class="navbar-toggle-btn mr-2">
        <i class="fas fa-bars"></i>
      </button>
      <a href="edit-profile.html" class="navbar-brand">
        <i class="fas fa-cubes"></i> CMS <span>Portal</span>
      </a>
    </div>
    <div class="navbar-user-menu">
      <div class="dropdown">
        <button class="user-profile-btn dropdown-toggle" type="button" id="userMenuDropdown" data-toggle="dropdown"
          aria-haspopup="true" aria-expanded="false">
          <i class="fas fa-user-circle mr-1"></i> User Profile
        </button>
        <div class="dropdown-menu dropdown-menu-right shadow border-0 mt-2" aria-labelledby="userMenuDropdown">
          <a class="dropdown-item active" href="edit-profile.html"><i class="fas fa-user-cog mr-2 text-muted"></i>Edit
            Profile</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="login.html"><i class="fas fa-sign-out-alt mr-2 text-muted"></i>Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="dashboard-wrapper">
    <aside class="dashboard-sidebar">
      <div class="sidebar-search-box">
        <div class="input-group">
          <input type="text" class="form-control" placeholder="Search..." aria-label="Search">
          <div class="input-group-append">
            <span class="input-group-text bg-transparent border-left-0 text-white-50"><i
                class="fas fa-search"></i></span>
          </div>
        </div>
      </div>
      <ul class="sidebar-nav">
        <li class="sidebar-nav-item">
          <a href="view-content.html">
            <i class="fas fa-list-ul"></i> View contents
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a href="add-content.html">
            <i class="fas fa-plus-circle"></i> Form content
          </a>
        </li>
      </ul>
    </aside>

    <main class="dashboard-content">
      <div class="content-card">
        <div class="content-header">
          <h1>Edit Profile</h1>
        </div>
        <form id="edit-profile-form" novalidate>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="firstname" class="font-weight-600">First Name</label>
              <input type="text" class="form-control" id="firstname" name="firstname" placeholder="Your First Name"
                size="50" maxlength="50" required>
            </div>
            <div class="form-group col-md-6">
              <label for="lastname" class="font-weight-600">Last Name</label>
              <input type="text" class="form-control" id="lastname" name="lastname" placeholder="Your Last Name"
                size="50" maxlength="50" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="email" class="font-weight-600">Email Address</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="example@domain.com"
                size="50" maxlength="50" required>
            </div>
            <div class="form-group col-md-6">
              <label for="phone" class="font-weight-600">Phone</label>
              <input type="text" class="form-control" id="phone" name="phone" placeholder="Your Phone Number" required>
            </div>
          </div>
          <div class="form-group mb-4">
            <label for="description" class="font-weight-600">Description</label>
            <textarea class="form-control" id="description" name="description" rows="5"
              placeholder="Your Description"></textarea>
          </div>
          <div class="form-group">
            <button type="submit" class="btn btn-green mr-2">
              <i class="fas fa-save mr-2"></i>Submit
            </button>
            <button type="reset" class="btn btn-green">
              <i class="fas fa-undo mr-2"></i>Reset
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- JavaScript Dependencies (jQuery standard, Popper, Bootstrap) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
  <!-- Custom JS -->
  <script src="js/main.js"></script>
</body>

</html>
