<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Template</title>
</head>
<body>
  <div class="modal-header border-0 bg-light">
    <h5 class="modal-title font-weight-bold text-dark" id="loginModalLabel">Login</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  
  <div class="modal-body p-4">
    <div id="login-error-container"></div>
    
    <form id="login-form" novalidate>
      <!-- Alias -->
      <div class="form-group mb-3" id="grp-login-alias">
        <label for="login-alias" class="font-weight-bold text-secondary text-sm">Alias:</label>
        <input type="text" class="form-control custom-input" id="login-alias" name="alias" placeholder="JoeSixpack">
        <div class="invalid-feedback-custom"></div>
      </div>
      
      <!-- Password -->
      <div class="form-group mb-3" id="grp-login-password">
        <label for="login-password" class="font-weight-bold text-secondary text-sm">Password:</label>
        <input type="password" class="form-control custom-input" id="login-password" name="password" placeholder="••••••">
        <div class="invalid-feedback-custom"></div>
      </div>
      
      <!-- Remember me -->
      <div class="form-group form-check mb-4">
        <input type="checkbox" class="form-check-input" id="login-remember" name="remember">
        <label class="form-check-label text-secondary text-sm" for="login-remember">Remember me</label>
      </div>
      
      <!-- Actions -->
      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-green px-4 py-2 font-weight-bold text-white" id="btn-login-submit">Sign in</button>
        <button type="button" class="btn btn-secondary px-4 py-2 font-weight-bold" data-dismiss="modal">Close</button>
      </div>
    </form>
  </div>
</body>
</html>
