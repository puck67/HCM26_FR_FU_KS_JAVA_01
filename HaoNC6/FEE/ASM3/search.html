<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search - Visitor Portal</title>
  <meta name="description" content="Search for registered visitors by any field." />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <a class="navbar-brand" href="#">🌐 Visitor Portal</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="person.html">Person</a></li>
        <li class="nav-item active"><a class="nav-link" href="search.html">Search</a></li>
        <li class="nav-item"><a class="nav-link" href="help.html">Help</a></li>
      </ul>
    </div>
  </nav>

  <div class="search-page-wrapper">
    <div class="search-page-card">

      <!-- Banner -->
      <img src="banner.png" alt="Beautiful Lake Banner" class="page-banner" />

      <!-- Section title -->
      <div class="section-title">Search Visitor</div>

      <div class="page-body">

        <!-- Search Bar -->
        <div class="search-bar">
          <label for="searchInput">First name:</label>
          <input type="text" id="searchInput" placeholder="Keyword..." />
          <button id="btnSearch" class="btn-search">Search</button>
          <span class="search-hint">(Type any keyword and click Search button)</span>
        </div>

        <!-- No results message -->
        <div id="noResults" class="alert alert-info" style="display:none; font-size:13px;">
          No visitors found matching your search.
        </div>

        <!-- Results Table -->
        <div class="table-responsive">
          <table class="table table-bordered table-sm" id="resultsTable">
            <thead>
              <tr>
                <th>First name</th>
                <th>Last name</th>
                <th>Gender</th>
                <th>Telephone</th>
                <th>You're in</th>
                <th>Hobbies</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody id="resultsBody">
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <footer>
    <p class="mb-0">&copy; 2026 Visitor Portal - ASM3 Front-End Essentials</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
  <script src="search.js"></script>
</body>
</html>
