<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main-layout(~{::div})}">
<body>
<div>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/subjects">Subjects</a></li>
            <li class="breadcrumb-item active" th:text="${subject.subject_name} + ' Materials'"></li>
        </ol>
    </nav>

    <h3 class="mb-4">Subject: <span class="text-primary" th:text="${subject.subject_name}"></span> (<span th:text="${subject.subject_code}"></span>)</h3>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">Upload Material</div>
                <div class="card-body">
                    <form th:action="@{/materials/upload}" method="post" enctype="multipart/form-data">
                        <input type="hidden" name="subjectId" th:value="${subject.subject_id}">

                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Select File (PDF, DOCX, PPTX, ZIP, TXT - Max 10MB)</label>
                            <input type="file" name="file" class="form-validate form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Material Description</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Enter file description..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-success w-100">🚀 Upload Material</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-light">Material List</div>
                <div class="card-body p-0">
                    <table class="table table-striped align-middle mb-0">
                        <thead>
                        <tr>
                            <th class="ps-3">File Name</th>
                            <th>Description</th>
                            <th>Size</th>
                            <th>Upload Date</th>
                            <th class="text-end target pe-3">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${materials.isEmpty()}">
                            <td colspan="5" class="text-center text-muted py-4">No materials uploaded yet for this subject.</td>
                        </tr>
                        <tr th:each="m : ${materials}">
                            <td class="ps-3">
                                <span class="fw-bold text-dark" th:text="${m.file_name}"></span>
                            </td>
                            <td th:text="${m.description}"></td>
                            <td th:text="${m.file_size / 1024} + ' KB'"></td>
                            <td th:text="${#temporals.format(m.upload_date, 'yyyy-MM-dd HH:mm')}"></td>
                            <td class="text-end pe-3">
                                <a th:href="@{/materials/download/{id}(id=${m.material_id})}" class="btn btn-sm btn-primary">⬇️ Download</a>
                                <a th:href="@{/materials/delete/{id}(id=${m.material_id}, subjectId=${subject.subject_id})}"
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('Do you want to delete this material?')">Delete</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
