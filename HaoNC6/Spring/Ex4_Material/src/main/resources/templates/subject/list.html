<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main-layout(~{::div})}">
<body>
<div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Subject Management</h2>
        <a href="/subjects/add" class="btn btn-primary">+ Add Subject</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-3">ID</th>
                    <th>Subject Code</th>
                    <th>Subject Name</th>
                    <th>Duration (hours)</th>
                    <th class="text-end pe-3">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${subjects}">
                    <td class="ps-3" th:text="${s.subject_id}"></td>
                    <td><strong th:text="${s.subject_code}"></strong></td>
                    <td th:text="${s.subject_name}"></td>
                    <td th:text="${s.duration}"></td>
                    <td class="text-end pe-3">
                        <a th:href="@{/materials/subject/{id}(id=${s.subject_id})}" class="btn btn-sm btn-outline-success">📁 Materials</a>
                        <a th:href="@{/subjects/edit/{id}(id=${s.subject_id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <a th:href="@{/subjects/delete/{id}(id=${s.subject_id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this subject?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
