<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Include the head fragment if we had one, or just duplicate head for simplicity, but better use layout -->
    <meta charset="UTF-8">
    <title>Home - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Load styles from layout by replacing head? Thymeleaf layout dialect is not included by default. 
         We'll use standard include/replace mechanism -->
</head>
<body>

<div th:replace="~{layout :: banner}"></div>

<div class="container-fluid flex-grow-1" style="min-height: calc(100vh - 140px);">
    <div class="row h-100">
        <div th:replace="~{layout :: menuLeft}"></div>
        
        <div class="col-md-10 main-content d-flex justify-content-center align-items-center">
            <h1 class="text-center font-weight-bold p-5 m-5">
                WELCOME TO LMS MANAGEMENT SYSTEM -<br>BASED ON SPRING FRAMEWORK
            </h1>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>

</body>
</html>
