<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .navbar-custom {
            background-color: #3b5998;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: white;
        }
        .sidebar {
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            min-height: calc(100vh - 56px - 60px);
        }
        .sidebar a {
            color: #333;
            padding: 15px;
            display: block;
            text-decoration: none;
            border-bottom: 1px solid #e9ecef;
        }
        .sidebar a:hover {
            background-color: #e9ecef;
        }
        .sidebar a i {
            margin-right: 10px;
        }
        .main-content {
            padding: 20px;
        }
        .footer {
            background-color: #343a40;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Banner -->
    <nav class="navbar navbar-expand-lg navbar-custom" th:fragment="banner">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-book"></i> LMS MANAGEMENT SYSTEM
            </a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3">Banner</span>
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" style="width: 200px;">
                <i class="bi bi-person-circle fs-4"></i>
            </div>
        </div>
    </nav>

    <div class="container-fluid flex-grow-1">
        <div class="row h-100">
            <!-- MenuLeft -->
            <div class="col-md-2 sidebar p-0" th:fragment="menuLeft">
                <a th:href="@{/courses/add}"><i class="bi bi-plus-circle"></i> Add a new Course</a>
                <a th:href="@{/courses/management}"><i class="bi bi-journal-bookmark"></i> Courses Management</a>
                <a href="#"><i class="bi bi-people"></i> Students Management</a>
                <div class="text-center mt-5 p-3">
                    <h3 class="text-muted">MenuLeft</h3>
                </div>
            </div>

            <!-- Body Content Placeholder -->
            <div class="col-md-10 main-content">
                <!-- Fragment for body to be replaced by specific pages -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" th:fragment="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 - All rights reserved. Built with Spring Framework</p>
            <div>
                <i class="bi bi-facebook mx-2"></i>
                <i class="bi bi-twitter mx-2"></i>
                <i class="bi bi-youtube mx-2"></i>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <th:block th:fragment="scripts"></th:block>
</body>
</html>
