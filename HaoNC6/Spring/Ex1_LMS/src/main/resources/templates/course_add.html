<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Course - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{layout :: banner}"></div>

<div class="container-fluid flex-grow-1">
    <div class="row h-100">
        <div th:replace="~{layout :: menuLeft}"></div>
        
        <div class="col-md-10 main-content">
            <div class="container mt-4">
                
                <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center" role="alert">
                    <i class="bi bi-check-circle-fill flex-shrink-0 me-2"></i>
                    <div th:text="${successMessage}">
                    </div>
                </div>

                <div th:if="${successMessage}" class="mb-3">
                    <a th:href="@{/courses/{code}/{date}/lessons(code=${course.course_code}, date=${#dates.format(course.start_date, 'yyyy-MM-dd')})}" class="text-primary text-decoration-underline" style="font-size: 1.2rem;">Lesson Detail</a>
                    <span class="ms-2 text-danger font-weight-bold" style="font-size: 1.2rem;">Thêm chi tiết bài học</span>
                </div>

                <div class="card w-75">
                    <div class="card-header bg-light font-weight-bold">
                        Create New Course
                    </div>
                    <div class="card-body">
                        <form th:action="@{/courses/add}" th:object="${course}" method="post">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label text-muted">Mã khóa học / Course ID</label>
                                    <input type="text" class="form-control" th:field="*{course_code}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted">Ngày khai giảng / Start Date</label>
                                    <input type="date" class="form-control" th:field="*{start_date}" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label text-muted">Tên khóa học / Course Name</label>
                                <input type="text" class="form-control" th:field="*{course_name}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label text-muted">Danh mục / Category</label>
                                <select class="form-select" th:field="*{category}">
                                    <option value="Technology">Technology</option>
                                    <option value="Business">Business</option>
                                    <option value="Design">Design</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label text-muted">Giảng viên / Instructor</label>
                                <input type="text" class="form-control" th:field="*{instructor}" required>
                            </div>
                            
                            <div>
                                <button type="submit" class="btn btn-primary px-4">Save Course</button>
                                <button type="button" class="btn btn-secondary px-4">Cancel</button>
                                <span class="ms-3">Add a new Course (Course Detail Screen)</span>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
