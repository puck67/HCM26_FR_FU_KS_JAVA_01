<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ShieldAuth Pro</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <!-- FontAwesome -->
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
            top: 10%;
            left: 10%;
            z-index: 1;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(15, 23, 42, 0) 70%);
            bottom: 10%;
            right: 10%;
            z-index: 1;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 1.5rem;
            animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .login-card {
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            font-size: 2.5rem;
            color: var(--accent-primary);
            margin-bottom: 0.75rem;
        }

        .login-title {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.25rem;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-control-custom {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            transition: all 0.2s ease;
        }

        .form-control-custom:focus {
            background-color: rgba(15, 23, 42, 0.8);
            border-color: var(--accent-primary);
            color: var(--text-primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        .form-icon-wrapper {
            position: relative;
        }

        .form-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .form-control-custom:focus ~ .form-icon {
            color: var(--accent-primary);
        }

        .btn-login {
            background-color: var(--accent-primary);
            border: none;
            color: var(--text-primary);
            font-weight: 600;
            padding: 0.8rem;
            border-radius: 10px;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .btn-login:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .credential-helper {
            margin-top: 1.8rem;
            padding: 1rem;
            background-color: rgba(99, 102, 241, 0.05);
            border: 1px dashed rgba(99, 102, 241, 0.2);
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .credential-helper th {
            color: var(--text-secondary);
            font-weight: 600;
            padding-right: 10px;
        }

        .credential-helper td {
            font-family: monospace;
            color: var(--text-primary);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="login-title">Welcome Back</h1>
            <div class="login-subtitle">Sign in to your secure portal</div>
        </div>

        <!-- Alert messages -->
        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 border-0 rounded-3 py-2 px-3 mb-4" style="background-color: rgba(239, 68, 68, 0.15); color: #ef4444; font-size: 0.85rem;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>Invalid username/password or account disabled.</span>
        </div>
        
        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2 border-0 rounded-3 py-2 px-3 mb-4" style="background-color: rgba(16, 185, 129, 0.15); color: #10b981; font-size: 0.85rem;">
            <i class="fa-solid fa-circle-check"></i>
            <span>You have been signed out successfully.</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
                <div class="form-icon-wrapper">
                    <input type="text" id="username" name="username" class="form-control form-control-custom" placeholder="Enter username" required autofocus>
                    <i class="fa-solid fa-user form-icon"></i>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                <div class="form-icon-wrapper">
                    <input type="password" id="password" name="password" class="form-control form-control-custom" placeholder="Enter password" required>
                    <i class="fa-solid fa-lock form-icon"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-login">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
            </button>
        </form>

        <!-- Initial Setup Credentials helper -->
        <div class="credential-helper">
            <div class="fw-semibold text-indigo-400 mb-1 d-flex align-items-center gap-1">
                <i class="fa-solid fa-circle-info"></i> First-time installation?
            </div>
            <p class="text-secondary mb-2" style="font-size: 0.75rem;">Use default super admin details below:</p>
            <table>
                <tr>
                    <th>Username:</th>
                    <td>superadmin</td>
                </tr>
                <tr>
                    <th>Password:</th>
                    <td>admin123</td>
                </tr>
                <tr>
                    <th>Role:</th>
                    <td>SUPER_ADMIN</td>
                </tr>
            </table>
        </div>
    </div>
</div>

</body>
</html>
