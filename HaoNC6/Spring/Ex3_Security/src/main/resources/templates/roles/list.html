<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: html_head('Role Management')}"></head>
<body>

<!-- Sidebar -->
<div th:replace="~{fragments :: app_sidebar('roles')}"></div>

<!-- Main Area -->
<div class="main-content">
    
    <!-- Top Header -->
    <div th:replace="~{fragments :: app_header}"></div>
    
    <!-- Body Content -->
    <div class="container-fluid py-4 animated-content">
        
        <!-- Page Header -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h2 class="fw-bold mb-1">Role Management</h2>
                <p class="text-secondary small mb-0">Create, edit, or delete system roles.</p>
            </div>
            
            <a th:href="@{/roles/add}" class="btn btn-primary-custom">
                <i class="fa-solid fa-plus me-2"></i>Add Role
            </a>
        </div>

        <!-- Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 rounded-3 py-2.5 px-4 mb-4" role="alert" style="background-color: rgba(16, 185, 129, 0.15); color: #10b981;">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span th:text="${successMessage}">Success!</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.8rem 1rem;"></button>
        </div>
        
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 rounded-3 py-2.5 px-4 mb-4" role="alert" style="background-color: rgba(239, 68, 68, 0.15); color: #ef4444;">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <span th:text="${errorMessage}">Error!</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.8rem 1rem;"></button>
        </div>

        <!-- Roles Table Card -->
        <div class="glass-card" style="max-width: 800px;">
            <div class="table-responsive">
                <table class="table table-custom w-100">
                    <thead>
                        <tr>
                            <th style="width: 100px;">Role ID</th>
                            <th>Role Name</th>
                            <th style="width: 250px; text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="role : ${roles}">
                            <td class="fw-semibold text-white" th:text="'#' + ${role.roleId}">#1</td>
                            <td>
                                <span class="role-badge" 
                                      th:classappend="${role.roleName == 'SUPER_ADMIN'} ? 'superadmin' : (${role.roleName == 'ADMIN'} ? 'admin' : 'teacher')"
                                      th:text="${role.roleName}">Role</span>
                            </td>
                            <td>
                                <div class="d-flex align-items-center justify-content-center gap-2">
                                    <!-- Edit Link -->
                                    <a th:href="@{/roles/edit/{id}(id=${role.roleId})}" 
                                       class="btn btn-sm btn-secondary-custom py-1.5 px-2.5" 
                                       th:classappend="${role.roleName == 'SUPER_ADMIN' || role.roleName == 'ADMIN' || role.roleName == 'TEACHER'} ? 'disabled opacity-50' : ''"
                                       title="Edit Role">
                                        <i class="fa-solid fa-pen-to-square text-indigo-400"></i> Edit
                                    </a>
                                    
                                    <!-- Delete Link -->
                                    <a th:href="@{/roles/delete/{id}(id=${role.roleId})}" 
                                       class="btn btn-sm btn-secondary-custom py-1.5 px-2.5" 
                                       th:classappend="${role.roleName == 'SUPER_ADMIN' || role.roleName == 'ADMIN' || role.roleName == 'TEACHER'} ? 'disabled opacity-50' : ''"
                                       onclick="return confirm('Are you sure you want to delete this role?')" title="Delete Role">
                                        <i class="fa-solid fa-trash-can text-danger"></i> Delete
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
