<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Head Fragment -->
<head th:fragment="html_head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - ShieldAuth Pro'"></title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap & FontAwesome WebJars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    
    <!-- Core Custom Styles -->
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            
            --role-superadmin: #ef4444;
            --role-admin: #3b82f6;
            --role-teacher: #10b981;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Glassmorphism sidebar */
        .sidebar {
            width: 280px;
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color);
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .main-content {
            margin-left: 280px;
            padding: 2.5rem;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        /* Sidebar link styling */
        .sidebar-brand {
            padding: 1.8rem 1.5rem;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-menu {
            list-style: none;
            padding: 1.5rem 1rem;
            margin: 0;
        }

        .sidebar-heading {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin: 1.5rem 0.5rem 0.5rem 0.5rem;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.8rem 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-bottom: 0.3rem;
        }

        .sidebar-link:hover {
            color: var(--text-primary);
            background-color: rgba(99, 102, 241, 0.1);
        }

        .sidebar-link.active {
            color: var(--text-primary);
            background-color: var(--accent-primary);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Top Header Styling */
        .top-navbar {
            background-color: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        /* Badge color mappings */
        .role-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.3em 0.75em;
            border-radius: 100px;
            text-transform: uppercase;
        }
        
        .role-badge.superadmin {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--role-superadmin);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .role-badge.admin {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--role-admin);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .role-badge.teacher {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--role-teacher);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 0.3em 0.6em;
            border-radius: 6px;
            font-weight: 600;
        }

        .status-badge.active {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .status-badge.inactive {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        /* Glass Cards and Forms */
        .glass-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.8rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .table-custom {
            color: var(--text-primary);
            border-collapse: separate;
            border-spacing: 0 0.5rem;
        }

        .table-custom th {
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            padding: 1rem;
        }

        .table-custom td {
            background-color: rgba(30, 41, 59, 0.4);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem;
            vertical-align: middle;
            transition: all 0.2s ease;
        }

        .table-custom tr:hover td {
            background-color: rgba(30, 41, 59, 0.8);
        }

        .table-custom td:first-child {
            border-left: 1px solid var(--border-color);
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }

        .table-custom td:last-child {
            border-right: 1px solid var(--border-color);
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .form-control-custom {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            transition: all 0.2s ease;
        }

        .form-control-custom:focus {
            background-color: var(--bg-primary);
            border-color: var(--accent-primary);
            color: var(--text-primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        .btn-primary-custom {
            background-color: var(--accent-primary);
            border: none;
            color: var(--text-primary);
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-primary-custom:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary-custom {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-secondary-custom:hover {
            background-color: var(--border-color);
            color: var(--text-primary);
        }

        /* Micro-animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animated-content {
            animation: fadeIn 0.4s ease forwards;
        }
    </style>
</head>

<!-- Dynamic Sidebar Fragment -->
<div th:fragment="app_sidebar(activePage)" class="sidebar">
    <div class="sidebar-brand">
        <i class="fa-solid ref fa-shield-halved text-indigo-500" style="color: var(--accent-primary); font-size: 1.5rem;"></i>
        <span>ShieldAuth Pro</span>
    </div>
    
    <ul class="sidebar-menu">
        <li>
            <a th:href="@{/dashboard}" class="sidebar-link" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
        </li>
        
        <!-- Security Section (Visible to SUPER_ADMIN and ADMIN) -->
        <li sec:authorize="hasAnyRole('SUPER_ADMIN', 'ADMIN')">
            <div class="sidebar-heading">Security Management</div>
        </li>
        
        <li sec:authorize="hasAnyRole('SUPER_ADMIN', 'ADMIN')">
            <a th:href="@{/users}" class="sidebar-link" th:classappend="${activePage == 'users'} ? 'active' : ''">
                <i class="fa-solid fa-users-gear"></i>
                <span>User Management</span>
            </a>
        </li>
        
        <li sec:authorize="hasRole('SUPER_ADMIN')">
            <a th:href="@{/roles}" class="sidebar-link" th:classappend="${activePage == 'roles'} ? 'active' : ''">
                <i class="fa-solid fa-user-shield"></i>
                <span>Role Management</span>
            </a>
        </li>
    </ul>
</div>

<!-- Header / Topbar Fragment -->
<div th:fragment="app_header" class="top-navbar">
    <div class="d-flex align-items-center gap-3">
        <!-- User info block -->
        <div class="text-end" th:if="${currentUsername != null}">
            <div class="small fw-semibold text-white" th:text="'Welcome, ' + ${currentUsername}">Welcome, User</div>
            <div class="d-flex align-items-center justify-content-end gap-1 mt-1">
                <span class="role-badge" 
                      th:classappend="${currentUserRole == 'SUPER_ADMIN'} ? 'superadmin' : (${currentUserRole == 'ADMIN'} ? 'admin' : 'teacher')"
                      th:text="${currentUserRole}">Role</span>
            </div>
        </div>
        
        <!-- User Avatar / Icon -->
        <div class="rounded-circle d-flex align-items-center justify-content-center bg-indigo-950 text-indigo-300 border border-indigo-800" 
             style="width: 40px; height: 40px; background-color: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.3);">
            <i class="fa-solid fa-user"></i>
        </div>
        
        <!-- Logout Form -->
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-danger btn-sm px-3 py-2 border-0 rounded-3" title="Log Out">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </form>
    </div>
</div>

</html>
