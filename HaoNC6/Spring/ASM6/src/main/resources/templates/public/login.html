<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Login - CourseShare</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/">CourseShare</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Categories</a></li>
                <li class="nav-item"><a class="nav-link" href="/recent-reviews">Recent Reviews</a></li>
                <li class="nav-item active"><a class="nav-link" href="/login">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="login-box shadow-sm">
        <h3 class="text-center font-weight-bold mb-4" style="color: #0f172a;">Instructor Login</h3>
        
        <div th:if="${param.error}" class="alert alert-danger" style="font-size: 0.9rem;">
            Invalid username and password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" style="font-size: 0.9rem;">
            You have been logged out.
        </div>
        
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username" class="font-weight-bold" style="color: #475569;">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus style="height: 48px; border-radius: 8px;">
            </div>
            <div class="form-group">
                <label for="password" class="font-weight-bold" style="color: #475569;">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required style="height: 48px; border-radius: 8px;">
            </div>
            <button type="submit" class="btn btn-primary btn-block font-weight-bold mt-4" style="height: 48px; border-radius: 8px; font-size: 1rem;">login</button>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
