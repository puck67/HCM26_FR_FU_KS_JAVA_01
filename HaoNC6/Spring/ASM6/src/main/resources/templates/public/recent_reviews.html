<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Reviews - CourseShare</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/">CourseShare</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/categories">Categories</a></li>
                <li class="nav-item active"><a class="nav-link" href="/recent-reviews">Recent Reviews</a></li>
                <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4" style="max-width: 800px;">

    <h3 class="mb-4 font-weight-bold">Most Recent Reviews</h3>

    <div th:if="${not #lists.isEmpty(reviews)}">
        <div th:each="rev : ${reviews}" class="review-card">
            <h5 class="font-weight-bold mb-1" th:text="${rev.course != null} ? ${rev.course.title} : 'Course'">Course</h5>
            <div class="reviewer-name text-muted" th:text="${rev.authorName}">Reviewer</div>
            <div class="stars">
                <span th:each="i : ${#numbers.sequence(1, rev.rating)}">&#9733;</span>
            </div>
            <div class="review-content mt-1" th:text="${rev.content}">Review content here</div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(reviews)}" class="alert alert-info">
        No approved reviews yet.
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
