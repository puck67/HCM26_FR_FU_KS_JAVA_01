<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Courses - CourseShare</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/instructor/dashboard">CourseShare</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="/instructor/dashboard">Dashboard</a></li>
                <li class="nav-item active"><a class="nav-link" href="/instructor/courses">Manage Courses</a></li>
                <li class="nav-item"><a class="nav-link" href="/instructor/reviews">Reviews</a></li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="form-inline d-inline">
                        <button class="btn btn-link nav-link p-0 border-0" type="submit">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5" style="max-width: 950px;">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="font-weight-bold m-0">Manage Courses</h3>
        <a href="/instructor/course/new" class="btn btn-primary font-weight-bold px-3">+ Create New Course</a>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0 !important;">
        <table class="table table-hover m-0">
            <thead class="bg-light">
                <tr>
                    <th class="font-weight-bold py-3" style="color: #475569;">Title</th>
                    <th class="font-weight-bold py-3" style="color: #475569; width: 110px;">Status</th>
                    <th class="font-weight-bold py-3" style="color: #475569;">Categories</th>
                    <th class="font-weight-bold py-3" style="color: #475569; width: 250px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="course : ${courses}">
                    <td class="font-weight-bold align-middle" th:text="${course.title}">Title</td>
                    <td class="align-middle">
                        <span th:if="${course.status == 2}" class="badge px-2 py-1 font-weight-bold" style="background-color: #d1fae5; color: #065f46; font-size: 0.75rem;">PUBLISHED</span>
                        <span th:if="${course.status == 1}" class="badge px-2 py-1 font-weight-bold" style="background-color: #f3f4f6; color: #374151; font-size: 0.75rem;">DRAFT</span>
                        <span th:if="${course.status == 3}" class="badge px-2 py-1 font-weight-bold" style="background-color: #e5e7eb; color: #1f2937; font-size: 0.75rem;">ARCHIVED</span>
                    </td>
                    <td class="align-middle text-muted small" th:text="${course.category}">-</td>
                    <td class="align-middle">
                        <div class="d-flex flex-wrap" style="gap: 4px;">
                            <a th:href="@{/instructor/course/edit/{id}(id=${course.id})}" class="btn btn-sm btn-primary font-weight-bold">Edit</a>

                            <form th:action="@{/instructor/course/delete/{id}(id=${course.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this course?');">
                                <button type="submit" class="btn btn-sm btn-danger font-weight-bold">Delete</button>
                            </form>

                            <form th:action="@{/instructor/course/publish/{id}(id=${course.id})}" method="post" class="d-inline"
                                  th:if="${course.status == 1 or course.status == 3}">
                                <button type="submit" class="btn btn-sm btn-success font-weight-bold">Publish</button>
                            </form>

                            <form th:action="@{/instructor/course/unpublish/{id}(id=${course.id})}" method="post" class="d-inline"
                                  th:if="${course.status == 2}">
                                <button type="submit" class="btn btn-sm btn-warning font-weight-bold">Unpublish</button>
                            </form>

                            <form th:action="@{/instructor/course/archive/{id}(id=${course.id})}" method="post" class="d-inline"
                                  th:if="${course.status != 3}">
                                <button type="submit" class="btn btn-sm btn-secondary font-weight-bold">Archive</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(courses)}">
                    <td colspan="4" class="text-center py-5 text-muted">No courses yet. Click "Create New Course" to get started.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4">
        <a href="/instructor/dashboard" class="btn btn-outline-secondary font-weight-bold">&larr; Back to Dashboard</a>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
