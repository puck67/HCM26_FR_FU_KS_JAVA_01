<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Polls - Great Poll</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="page">

<header class="header">
  <div class="container-fluid">
    <div class="row align-items-center header__row">
      <div class="col-auto">
        <a class="header__logo" href="index.html">Polls</a>
      </div>
      <div class="col">
        <nav class="header__nav" aria-label="Main navigation">
          <a class="header__link" href="index.html">Vote</a>
          <a class="header__link" href="create.html">Create</a>
          <a class="header__link" href="list.html">List</a>
        </nav>
      </div>
      <div class="col-auto">
        <button type="button" class="button header__login-btn" data-toggle="modal" data-target="#loginModal">Login</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="poll-card">
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-8">
          <h1 class="poll-card__title">Great poll</h1>

          <div id="voteFormErrors" class="form-errors" role="alert" hidden></div>
          <div id="voteFormSuccess" class="form-success" role="status" hidden></div>

          <form action="#" method="post" id="voteForm" class="poll-form" novalidate>
            <div class="poll-question" id="questionNecessary">
              <h2 class="poll-question__title">
                1. it is necessary to you? <span class="poll-form__asterisk">*</span>
              </h2>
              <div class="row">
                <div class="col-sm-6">
                  <label class="poll-question__option">
                    <input type="radio" name="necessary" value="yes" required aria-required="true"/>
                    <span>Yes</span>
                  </label>
                </div>
                <div class="col-sm-6">
                  <label class="poll-question__option">
                    <input type="radio" name="necessary" value="no"/>
                    <span>No</span>
                  </label>
                </div>
              </div>
              <span class="field-error" data-for="necessary"></span>
            </div>

            <div class="poll-question">
              <h2 class="poll-question__title">2. Often pass polls?</h2>
              <div class="row">
                <div class="col-sm-6">
                  <label class="poll-question__option">
                    <input type="radio" name="frequency" value="once-a-month"/>
                    <span>Once a month</span>
                  </label>
                </div>
                <div class="col-sm-6">
                  <label class="poll-question__option">
                    <input type="radio" name="frequency" value="once-a-week"/>
                    <span>Once a week</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="poll-question">
              <h2 class="poll-question__title">3. How old are you?</h2>
              <div class="row">
                <div class="col-sm-6">
                  <label class="poll-question__option">
                    <input type="radio" name="age" value="18-20"/>
                    <span>18-20</span>
                  </label>
                </div>
                <div class="col-sm-6">
                  <label class="poll-question__option">
                    <input type="radio" name="age" value="21-23"/>
                    <span>21-23</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="poll-card__actions poll-card__actions--center">
              <button class="button button--retain" type="submit">Retain</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal fade login-modal" id="loginModal" tabindex="-1" role="dialog" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-body">
        <form id="loginForm" class="login-form" novalidate>
          <div id="loginFormErrors" class="form-errors" role="alert" hidden></div>

          <div class="form-group row login-form__row">
            <label class="col-sm-4 col-form-label login-form__label form-label--required" for="loginAlias">Alias</label>
            <div class="col-sm-8">
              <input type="text" class="form-control poll-form__input" id="loginAlias" name="alias" required aria-required="true"/>
              <span class="field-error" data-for="loginAlias"></span>
            </div>
          </div>

          <div class="form-group row login-form__row">
            <label class="col-sm-4 col-form-label login-form__label form-label--required" for="loginPassword">Password</label>
            <div class="col-sm-8">
              <input type="password" class="form-control poll-form__input" id="loginPassword" name="password" required aria-required="true"/>
              <span class="field-error" data-for="loginPassword"></span>
            </div>
          </div>

          <div class="form-group form-check login-form__remember">
            <input type="checkbox" class="form-check-input" id="rememberMe" name="remember"/>
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>

          <div class="login-form__actions">
            <button type="submit" class="button">Sign In</button>
            <button type="button" class="button button--light" data-dismiss="modal">Close</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/validation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
