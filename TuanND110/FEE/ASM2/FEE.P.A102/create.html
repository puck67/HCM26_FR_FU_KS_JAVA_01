<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Interview - Polls</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="page">

<header class="header">
  <div class="container-fluid">
    <div class="row align-items-center header__row">
      <div class="col-auto">
        <a class="header__logo" href="index.html">Polls</a>
      </div>
      <div class="col">
        <nav class="header__nav" aria-label="Main navigation">
          <a class="header__link" href="index.html">Vote</a>
          <a class="header__link" href="create.html">Create</a>
          <a class="header__link" href="list.html">List</a>
        </nav>
      </div>
      <div class="col-auto">
        <button type="button" class="button header__login-btn" data-toggle="modal" data-target="#loginModal">Login</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="poll-card">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <h1 class="poll-card__title">Create Interview</h1>

          <div id="formErrors" class="form-errors" role="alert" hidden></div>
          <div id="formSuccess" class="form-success" role="status" hidden></div>

          <p class="poll-form__required-note">Fields marked with <span class="poll-form__asterisk">*</span> are required.</p>

          <form action="api/validate-poll.php" method="post" id="poll-form" class="poll-form" novalidate>
            <div class="form-group row">
              <label for="pollName" class="col-sm-3 col-form-label form-label--required">Name poll</label>
              <div class="col-sm-9">
                <input type="text" id="pollName" name="pollName" class="form-control poll-form__input" placeholder="Name poll" required minlength="3" maxlength="255" data-min="3" data-max="255" aria-required="true"/>
                <span class="field-error" data-for="pollName"></span>
              </div>
            </div>

            <hr class="poll-form__divider"/>

            <div id="questionsContainer">
              <div class="poll-form__section poll-question-block" data-question-index="0">
                <div class="form-group row">
                  <label for="question-0" class="col-sm-3 col-form-label form-label--required">Your question</label>
                  <div class="col-sm-9">
                    <input type="text" id="question-0" name="questions[0][text]" class="form-control poll-form__input question-text" placeholder="Enter your question" required minlength="3" maxlength="255" data-question-input data-min="3" data-max="255" aria-required="true"/>
                    <span class="field-error" data-for="question-0"></span>
                  </div>
                </div>

                <div class="form-group row">
                  <div class="col-sm-9 offset-sm-3">
                    <div class="form-check poll-form__option">
                      <input type="checkbox" class="form-check-input" id="mandatory-0" name="questions[0][mandatory]"/>
                      <label class="form-check-label" for="mandatory-0">Mandatory</label>
                    </div>
                    <div class="form-check poll-form__option">
                      <input type="checkbox" class="form-check-input" id="multiple-0" name="questions[0][multiple]"/>
                      <label class="form-check-label" for="multiple-0">You can select multiple options</label>
                    </div>
                  </div>
                </div>

                <div class="form-group row">
                  <span class="col-sm-3 col-form-label form-label--required">Possible answers</span>
                  <div class="col-sm-9">
                    <div class="poll-form__answers" data-answers-container>
                      <div class="poll-form__row answer-row" data-answer-index="0">
                        <input type="text" id="answer-0-0" name="questions[0][answers][]" class="form-control poll-form__input poll-form__input--grow answer-text" placeholder="Possible answers" required minlength="3" maxlength="200" data-answer-input data-min="3" data-max="200" aria-required="true"/>
                        <button type="button" class="button button--add-answer" aria-label="Add answer">+</button>
                      </div>
                    </div>
                    <span class="field-error" data-for="answers-0"></span>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-group row">
              <div class="col-sm-9 offset-sm-3">
                <button type="button" class="button button--add-question" id="addQuestionBtn">+ Add question</button>
              </div>
            </div>

            <div class="form-group row poll-card__actions-row">
              <div class="col-sm-9 offset-sm-3">
                <button class="button button--retain" type="submit">Retain</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal fade login-modal" id="loginModal" tabindex="-1" role="dialog" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-body">
        <form id="loginForm" class="login-form" novalidate>
          <div id="loginFormErrors" class="form-errors" role="alert" hidden></div>

          <div class="form-group row login-form__row">
            <label class="col-sm-4 col-form-label login-form__label form-label--required" for="loginAlias">Alias</label>
            <div class="col-sm-8">
              <input type="text" class="form-control poll-form__input" id="loginAlias" name="alias" required aria-required="true"/>
              <span class="field-error" data-for="loginAlias"></span>
            </div>
          </div>

          <div class="form-group row login-form__row">
            <label class="col-sm-4 col-form-label login-form__label form-label--required" for="loginPassword">Password</label>
            <div class="col-sm-8">
              <input type="password" class="form-control poll-form__input" id="loginPassword" name="password" required aria-required="true"/>
              <span class="field-error" data-for="loginPassword"></span>
            </div>
          </div>

          <div class="form-group form-check login-form__remember">
            <input type="checkbox" class="form-check-input" id="rememberMe" name="remember"/>
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>

          <div class="login-form__actions">
            <button type="submit" class="button">Sign In</button>
            <button type="button" class="button button--light" data-dismiss="modal">Close</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/validation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
