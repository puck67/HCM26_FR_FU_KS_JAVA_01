<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>List - Polls</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="page">

<header class="header">
  <div class="container-fluid">
    <div class="row align-items-center header__row">
      <div class="col-auto">
        <a class="header__logo" href="index.html">Polls</a>
      </div>
      <div class="col">
        <nav class="header__nav" aria-label="Main navigation">
          <a class="header__link" href="index.html">Vote</a>
          <a class="header__link" href="create.html">Create</a>
          <a class="header__link" href="list.html">List</a>
        </nav>
      </div>
      <div class="col-auto">
        <button type="button" class="button header__login-btn" data-toggle="modal" data-target="#loginModal">Login</button>
      </div>
    </div>
  </div>
</header>

<main class="poll-list-page">
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div id="listAjaxMessage" class="alert alert-success" role="status" hidden></div>

        <div class="poll-list__tabs btn-group flex-wrap" role="group" aria-label="Poll status tabs">
          <button type="button" class="poll-list__tab poll-list__tab--active button">Active</button>
          <button type="button" class="poll-list__tab button">Drafts</button>
          <button type="button" class="poll-list__tab button">Closed</button>
        </div>

        <div class="table-responsive">
          <table class="poll-table table table-bordered table-striped mb-0">
            <thead class="poll-table__head">
            <tr>
              <th class="poll-table__header" scope="col">#</th>
              <th class="poll-table__header" scope="col">The list of questions and issues within</th>
              <th class="poll-table__header" scope="col">Management</th>
            </tr>
            </thead>
            <tbody id="pollTableBody">
            <tr data-poll-id="98">
              <td class="poll-table__cell">98</td>
              <td class="poll-table__cell">Great poll</td>
              <td class="poll-table__cell">
                <div class="poll-table__actions">
                  <button type="button" class="button poll-table__action-btn view-results-btn" data-poll-id="98">View results</button>
                  <button type="button" class="button poll-table__action-btn">Close poll</button>
                  <button type="button" class="button poll-table__action-btn delete-btn" data-poll-id="98">Delete</button>
                </div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>

        <section id="pollDetailPanel" class="poll-detail-panel" hidden aria-live="polite">
          <h2 class="poll-detail-panel__title">Poll results</h2>
          <div id="pollDetailContent"></div>
        </section>
      </div>
    </div>
  </div>
</main>

<div class="modal fade login-modal" id="loginModal" tabindex="-1" role="dialog" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-body">
        <form id="loginForm" class="login-form" novalidate>
          <div id="loginFormErrors" class="form-errors" role="alert" hidden></div>

          <div class="form-group row login-form__row">
            <label class="col-sm-4 col-form-label login-form__label form-label--required" for="loginAlias">Alias</label>
            <div class="col-sm-8">
              <input type="text" class="form-control poll-form__input" id="loginAlias" name="alias" required aria-required="true"/>
              <span class="field-error" data-for="loginAlias"></span>
            </div>
          </div>

          <div class="form-group row login-form__row">
            <label class="col-sm-4 col-form-label login-form__label form-label--required" for="loginPassword">Password</label>
            <div class="col-sm-8">
              <input type="password" class="form-control poll-form__input" id="loginPassword" name="password" required aria-required="true"/>
              <span class="field-error" data-for="loginPassword"></span>
            </div>
          </div>

          <div class="form-group form-check login-form__remember">
            <input type="checkbox" class="form-check-input" id="rememberMe" name="remember"/>
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>

          <div class="login-form__actions">
            <button type="submit" class="button">Sign In</button>
            <button type="button" class="button button--light" data-dismiss="modal">Close</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/validation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
