<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Materials</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Assessment Materials</h1>

    <div class="card">
        <h2>Create Material</h2>

        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/assessments/upload}" method="post">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="Title" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Description" required></textarea>
            </div>
            <button type="submit">Create</button>
        </form>
    </div>

    <div class="card">
        <h2>Uploaded Materials</h2>

        <div class="action-bar">
            <!-- Import Form -->
            <form th:action="@{/assessments/import}" method="post" enctype="multipart/form-data" class="import-form">
                <input type="file" name="file" accept=".csv" required>
                <button type="submit" class="btn btn-success">Import CSV</button>
            </form>

            <div class="action-buttons">
                <!-- Download Template -->
                <a th:href="@{/assessments/template}" class="btn btn-secondary">Download Template</a>
                <!-- Export -->
                <a th:href="@{/assessments/export}" class="btn btn-primary">Export CSV</a>
            </div>
        </div>

        <p class="empty" th:if="${#lists.isEmpty(materials)}">No materials uploaded yet.</p>

        <table th:unless="${#lists.isEmpty(materials)}">
            <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="material : ${materials}">
                <td th:text="${material.title}"></td>
                <td th:text="${material.description}"></td>
                <td>
                    <a class="download-link" th:if="${material.fileName != null && !material.fileName.isEmpty()}"
                       th:href="@{/assessments/download/{fn}(fn=${material.fileName})}">Download</a>
                    <span th:unless="${material.fileName != null && !material.fileName.isEmpty()}" style="color: #777; font-style: italic;">No file</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
