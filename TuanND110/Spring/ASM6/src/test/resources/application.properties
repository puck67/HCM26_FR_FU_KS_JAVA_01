# ──────────────────────────────────────────────
# ASM6 — Test Configuration (Uses H2 Database)
# ──────────────────────────────────────────────

# ── Database (H2 in-memory in PostgreSQL compatibility mode) ──
spring.datasource.url=jdbc:h2:mem:lms_testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ── SQL Init ────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Disable Thymeleaf cache
spring.thymeleaf.cache=false
