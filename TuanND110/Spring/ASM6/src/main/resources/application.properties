# ──────────────────────────────────────────────
# ASM6 — Base Configuration (shared across all profiles)
# Load profile-specific config via: spring.profiles.active=dev|prod
# ──────────────────────────────────────────────

server.port=8082
spring.application.name=lms-asm6

# Active profile — override with -Dspring.profiles.active=prod for production
spring.profiles.active=dev

# ── Database (overridden per profile) ───────────
spring.datasource.url=${DB_URL:jdbc:h2:mem:lms_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# ── JPA ─────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ── SQL Init ────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ── Thymeleaf ───────────────────────────────────
spring.thymeleaf.cache=false

# ── Logging ─────────────────────────────────────
logging.level.root=INFO
logging.level.com.fpt.lms=INFO
