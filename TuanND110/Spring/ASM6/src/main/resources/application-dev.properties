# ──────────────────────────────────────────────
# ASM6 — Development Configuration
# ──────────────────────────────────────────────

server.port=8082
spring.application.name=lms-asm6


# ── Database (H2) ───────────────────────────────
# Use environment variables for credentials — fallback to H2 in-memory
spring.datasource.url=${DB_URL:jdbc:h2:mem:lms_devdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# ── JPA / Hibernate ─────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── SQL Init ────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ── Thymeleaf ───────────────────────────────────
# Disable cache in dev for hot-reload
spring.thymeleaf.cache=false

# ── Logging ─────────────────────────────────────
logging.level.root=INFO
logging.level.com.fpt.lms=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
