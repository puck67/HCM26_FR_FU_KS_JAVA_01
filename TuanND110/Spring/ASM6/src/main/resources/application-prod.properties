# ──────────────────────────────────────────────
# ASM6 — Production Configuration
# ──────────────────────────────────────────────

server.port=${PORT:8082}
spring.application.name=lms-asm6

# ── Database ────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/lms_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# Connection pool (HikariCP defaults are good, tune if needed)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# ── JPA ─────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
# Disable SQL logging in production for performance
spring.jpa.show-sql=false

# ── SQL Init ────────────────────────────────────
spring.sql.init.mode=never

# ── Thymeleaf ───────────────────────────────────
spring.thymeleaf.cache=true

# ── Logging ─────────────────────────────────────
logging.level.root=WARN
logging.level.com.fpt.lms=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# ── Security ─────────────────────────────────────
# Ensure HTTPS-only session cookie in production
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
