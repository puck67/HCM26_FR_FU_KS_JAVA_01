# ──────────────────────────────────────────────
# Ex5 — Production Configuration
# ──────────────────────────────────────────────

server.port=${PORT:8080}

# ── Database (use real DB in production) ────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ── H2 Console — DISABLED in production ─────────
# NEVER expose H2 console in production!
spring.h2.console.enabled=false

# ── Swagger — DISABLED in production ────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── JWT ──────────────────────────────────────────
# JWT secret MUST be provided via environment variable, never hardcode
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION:3600000}
app.jwt.refresh-expiration-milliseconds=${JWT_REFRESH_EXPIRATION:86400000}

# ── Logging ─────────────────────────────────────
logging.level.root=WARN
logging.level.com.lms.trainingrest=INFO
