<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">
        <div class="header-container">
            <h1>LMS Courses List</h1>
            <a th:href="@{/courses/new}" class="btn btn-primary">Add New Course</a>
        </div>

        <!-- Notification Messages -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <div class="action-bar">
            <!-- Import Form -->
            <form th:action="@{/courses/import}" method="post" enctype="multipart/form-data" class="import-form">
                <input type="file" name="file" accept=".csv" required>
                <button type="submit" class="btn btn-success">Import CSV</button>
            </form>

            <div class="action-buttons">
                <!-- Download Template -->
                <a th:href="@{/courses/template}" class="btn btn-secondary">Download Template</a>
                <!-- Export -->
                <a th:href="@{/courses/export}" class="btn btn-primary">Export CSV</a>
            </div>
        </div>

        <!-- Table displaying courses -->
        <table class="course-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Instructor Name</th>
                    <th>Instructor Email</th>
                    <th>Description</th>
                    <th>Duration (hours)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="course : ${courses}">
                    <td th:text="${course.id}">1</td>
                    <td th:text="${course.title}">Title</td>
                    <td th:text="${course.instructorName}">Instructor</td>
                    <td th:text="${course.instructorEmail}">email@example.com</td>
                    <td th:text="${course.description}">Description</td>
                    <td th:text="${course.durationHours}">30</td>
                </tr>
                <tr th:if="${#lists.isEmpty(courses)}">
                    <td colspan="6" style="text-align: center; color: var(--text-muted);">No courses found. Feel free to add or import some!</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
