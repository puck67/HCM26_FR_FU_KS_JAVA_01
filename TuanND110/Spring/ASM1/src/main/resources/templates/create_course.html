<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Course</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">
        <div class="header-container">
            <h1>Create New Course</h1>
            <a th:href="@{/courses}" class="btn btn-secondary">Back to List</a>
        </div>

        <form th:action="@{/courses/create}" th:object="${course}" method="post">

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}">
                <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="instructorName">Instructor Name</label>
                <input type="text" id="instructorName" th:field="*{instructorName}">
                <span th:if="${#fields.hasErrors('instructorName')}" th:errors="*{instructorName}" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="instructorEmail">Instructor Email</label>
                <input type="text" id="instructorEmail" th:field="*{instructorEmail}">
                <span th:if="${#fields.hasErrors('instructorEmail')}" th:errors="*{instructorEmail}" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="4"></textarea>
                <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="durationHours">Duration (hours)</label>
                <input type="number" id="durationHours" th:field="*{durationHours}">
                <span th:if="${#fields.hasErrors('durationHours')}" th:errors="*{durationHours}" class="error-message"></span>
            </div>

            <button type="submit" class="btn btn-primary">Create Course</button>

        </form>
    </div>

</body>
</html>
