<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categories')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="padding:2rem 0">
  <h1 style="font-size:1.6rem;margin-bottom:.5rem">Course Categories</h1>
  <p style="color:var(--text-muted);margin-bottom:2rem">Browse courses by category</p>

  <div style="display:flex;flex-wrap:wrap;gap:1rem">
    <a th:each="cat : ${categories}"
       th:href="@{/categories/{name}(name=${cat.name})}"
       class="card"
       style="display:flex;flex-direction:column;align-items:center;min-width:150px;text-decoration:none;color:var(--text)">
      <div style="font-size:1.4rem;font-weight:700;color:var(--primary)" th:text="${cat.name}">Name</div>
      <div style="font-size:.85rem;color:var(--text-muted)" th:text="${cat.frequency + ' course(s)'}">0 courses</div>
    </a>
    <div th:if="${#lists.isEmpty(categories)}" class="alert alert-info">No categories yet.</div>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
