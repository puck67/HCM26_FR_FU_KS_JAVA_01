<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LMS - Course Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(135deg, #1e3a8a, #3b82f6); }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .card-header { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; border-radius: 12px 12px 0 0 !important; }
        .form-label { font-weight: 600; color: #374151; }
        .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 0.2rem rgba(59,130,246,0.25); }
        .btn-save { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; border: none; border-radius: 8px; padding: 10px 28px; }
        .btn-save:hover { background: linear-gradient(135deg, #1e40af, #2563eb); color: white; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3 mb-4">
    <span class="navbar-brand fw-bold fs-5"><i class="bi bi-mortarboard-fill me-2"></i>LMS Course Manager</span>
    <a class="btn btn-light btn-sm" href="/courses"><i class="bi bi-arrow-left me-1"></i>Back to List</a>
</nav>

<div class="container" style="max-width: 700px;">
    <!-- Error alert -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-header py-3 px-4">
            <h5 class="mb-0"><i class="bi bi-journal-plus me-2"></i>Course Detail</h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/courses/save}" th:object="${course}" method="post">
                <div class="mb-3">
                    <label for="courseCode" class="form-label">Course Code <span class="text-danger">*</span></label>
                    <input type="text" id="courseCode" class="form-control" th:field="*{courseCode}"
                           placeholder="e.g. CS101" required/>
                </div>
                <div class="mb-3">
                    <label for="startDate" class="form-label">Start Date <span class="text-danger">*</span></label>
                    <input type="date" id="startDate" class="form-control" th:field="*{startDate}" required/>
                </div>
                <div class="mb-3">
                    <label for="courseName" class="form-label">Course Name <span class="text-danger">*</span></label>
                    <input type="text" id="courseName" class="form-control" th:field="*{courseName}"
                           placeholder="e.g. Introduction to Java" required/>
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <input type="text" id="category" class="form-control" th:field="*{category}"
                           placeholder="e.g. Programming, Design..."/>
                </div>
                <div class="mb-4">
                    <label for="instructor" class="form-label">Instructor</label>
                    <input type="text" id="instructor" class="form-control" th:field="*{instructor}"
                           placeholder="e.g. Nguyen Van A"/>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-save" id="saveCourseBtn">
                        <i class="bi bi-floppy-fill me-2"></i>Save Course
                    </button>
                    <a href="/courses" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-1"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
