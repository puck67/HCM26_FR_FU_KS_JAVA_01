<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LMS - Course List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(135deg, #1e3a8a, #3b82f6); }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .card-header { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; border-radius: 12px 12px 0 0 !important; }
        .table thead th { background: #1e3a8a; color: white; border: none; }
        .badge-category { background: #e0f2fe; color: #0369a1; border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; }
        .btn-lesson { background: linear-gradient(135deg, #059669, #10b981); color: white; border: none; border-radius: 8px; }
        .btn-lesson:hover { background: linear-gradient(135deg, #047857, #059669); color: white; }
        .btn-delete { background: linear-gradient(135deg, #dc2626, #ef4444); color: white; border: none; border-radius: 8px; }
        .btn-delete:hover { background: linear-gradient(135deg, #b91c1c, #dc2626); color: white; }
        .table tbody tr:hover { background: #f0f9ff; transition: 0.2s; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3 mb-4">
    <span class="navbar-brand fw-bold fs-5"><i class="bi bi-mortarboard-fill me-2"></i>LMS Course Manager</span>
    <a class="btn btn-light btn-sm" href="/courses/new"><i class="bi bi-plus-circle me-1"></i>Add Course</a>
</nav>

<div class="container">
    <!-- Alert success -->
    <div th:if="${alert}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${alert}"></span>
        <span th:if="${savedCourse}">
            &mdash;
            <a th:href="@{/lessons(code=${savedCourse.courseCode}, date=${savedCourse.startDate})}"
               class="alert-link">View Lesson Detail &rarr;</a>
        </span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between py-3 px-4">
            <h5 class="mb-0"><i class="bi bi-journals me-2"></i>Course List</h5>
            <span class="badge bg-light text-dark" th:text="${#lists.size(courses)} + ' courses'"></span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Course Code</th>
                            <th>Start Date</th>
                            <th>Course Name</th>
                            <th>Category</th>
                            <th>Instructor</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(courses)}">
                            <td colspan="7" class="text-center text-muted py-4">No courses found. Click <strong>Add Course</strong> to create one.</td>
                        </tr>
                        <tr th:each="course, stat : ${courses}">
                            <td class="align-middle text-muted" th:text="${stat.count}"></td>
                            <td class="align-middle fw-semibold text-primary" th:text="${course.courseCode}"></td>
                            <td class="align-middle" th:text="${course.startDate}"></td>
                            <td class="align-middle" th:text="${course.courseName}"></td>
                            <td class="align-middle">
                                <span class="badge-category" th:text="${course.category}"></span>
                            </td>
                            <td class="align-middle" th:text="${course.instructor}"></td>
                            <td class="align-middle text-center">
                                <a th:href="@{/lessons(code=${course.courseCode}, date=${course.startDate})}"
                                   class="btn btn-lesson btn-sm me-1">
                                    <i class="bi bi-list-ul me-1"></i>Lessons
                                </a>
                                <button type="button"
                                        class="btn btn-delete btn-sm"
                                        th:onclick="'confirmDelete(\'' + ${course.courseCode} + '\', \'' + ${course.startDate} + '\')'">
                                    <i class="bi bi-trash me-1"></i>Delete
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title"><i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">Do you want to delete this course? All related lessons will also be removed.</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <a id="confirmDeleteBtn" href="#" class="btn btn-danger">Yes, Delete</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function confirmDelete(code, date) {
        document.getElementById('confirmDeleteBtn').href = '/courses/delete?code=' + code + '&date=' + date;
        new bootstrap.Modal(document.getElementById('deleteModal')).show();
    }
</script>
</body>
</html>
