<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Information</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <div class="container bg-white shadow-sm p-0 mb-5">
        <div class="banner-container">
            <img src="images/banner.jpg" alt="Project Banner" onerror="this.src='https://picsum.photos/1200/250?nature'">
        </div>

        <div class="p-4">
            <h4 class="section-title">Visitor Information</h4>
            
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <form id="registrationForm" novalidate>
                        
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label text-sm-right">First name:</label>
                            <div class="col-sm-6">
                                <input type="text" id="firstName" class="form-control" placeholder="John">
                                <div class="error-message" id="error-firstName">Bắt buộc, tối đa 20 ký tự và không chứa số.</div>
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label text-sm-right">Last name:</label>
                            <div class="col-sm-6">
                                <input type="text" id="lastName" class="form-control" placeholder="Terry">
                                <div class="error-message" id="error-lastName">Bắt buộc, tối đa 20 ký tự và không chứa số.</div>
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label text-sm-right">Gender:</label>
                            <div class="col-sm-4">
                                <select id="gender" class="form-control">
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label text-sm-right">Telephone:</label>
                            <div class="col-sm-6">
                                <input type="text" id="telephone" class="form-control" placeholder="0909090909">
                                <div class="error-message" id="error-telephone">Phải là số và tối đa 11 chữ số.</div>
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label text-sm-right">Email:</label>
                            <div class="col-sm-6">
                                <input type="email" id="email" class="form-control" placeholder="john@domain.com">
                                <div class="error-message" id="error-email">Email không đúng định dạng quy định (tối đa 50 ký tự).</div>
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label text-sm-right">You are in:</label>
                            <div class="col-sm-9 d-flex flex-wrap align-items-center">
                                <div class="custom-control custom-radio custom-control-inline">
                                    <input type="radio" id="regionEurope" name="region" value="Europe" class="custom-control-input">
                                    <label class="custom-control-label" for="regionEurope">Europe</label>
                                </div>
                                <div class="custom-control custom-radio custom-control-inline">
                                    <input type="radio" id="regionAfrica" name="region" value="Africa" class="custom-control-input">
                                    <label class="custom-control-label" for="regionAfrica">Africa</label>
                                </div>
                                <div class="custom-control custom-radio custom-control-inline">
                                    <input type="radio" id="regionAustralia" name="region" value="Australia" class="custom-control-input">
                                    <label class="custom-control-label" for="regionAustralia">Australia</label>
                                </div>
                                <div class="custom-control custom-radio custom-control-inline">
                                    <input type="radio" id="regionAsia" name="region" value="Asia" class="custom-control-input">
                                    <label class="custom-control-label" for="regionAsia">Asia</label>
                                </div>
                                <div class="custom-control custom-radio custom-control-inline">
                                    <input type="radio" id="regionAmerica" name="region" value="America" class="custom-control-input">
                                    <label class="custom-control-label" for="regionAmerica">America</label>
                                </div>
                                <div class="w-100"><div class="error-message" id="error-region">Vui lòng chọn khu vực của bạn.</div></div>
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label text-sm-right">What are your hobbies:</label>
                            <div class="col-sm-9 d-flex flex-wrap align-items-center">
                                <div class="custom-control custom-checkbox custom-control-inline">
                                    <input type="checkbox" name="hobbies" value="Swimming" class="custom-control-input" id="hobby1">
                                    <label class="custom-control-label" for="hobby1">Swimming</label>
                                </div>
                                <div class="custom-control custom-checkbox custom-control-inline">
                                    <input type="checkbox" name="hobbies" value="Cooking" class="custom-control-input" id="hobby2">
                                    <label class="custom-control-label" for="hobby2">Cooking</label>
                                </div>
                                <div class="custom-control custom-checkbox custom-control-inline">
                                    <input type="checkbox" name="hobbies" value="Shopping" class="custom-control-input" id="hobby3">
                                    <label class="custom-control-label" for="hobby3">Shopping</label>
                                </div>
                                <div class="custom-control custom-checkbox custom-control-inline">
                                    <input type="checkbox" name="hobbies" value="Sport" class="custom-control-input" id="hobby4">
                                    <label class="custom-control-label" for="hobby4">Sport</label>
                                </div>
                                <div class="custom-control custom-checkbox custom-control-inline">
                                    <input type="checkbox" name="hobbies" value="Dance" class="custom-control-input" id="hobby5">
                                    <label class="custom-control-label" for="hobby5">Dance</label>
                                </div>
                                <div class="custom-control custom-checkbox custom-control-inline">
                                    <input type="checkbox" name="hobbies" value="Sing" class="custom-control-input" id="hobby6">
                                    <label class="custom-control-label" for="hobby6">Sing</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label text-sm-right">Description:</label>
                            <div class="col-sm-8">
                                <textarea id="description" class="form-control" rows="4" placeholder="One thing to note is you should make sure not to define the background color..."></textarea>
                                <div class="error-message" id="error-description">Mô tả không được vượt quá 200 ký tự.</div>
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="col-sm-3"></div>
                            <div class="col-sm-9">
                                <button type="submit" class="btn btn-custom-green px-4">Register</button>
                                <a href="search.html" class="btn btn-link text-success ml-3">Đến trang tìm kiếm</a>
                            </div>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
