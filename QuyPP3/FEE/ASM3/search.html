<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Visitor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <div class="container bg-white shadow-sm p-0 mb-5">
        <div class="banner-container">
            <img src="images/banner.jpg" alt="Project Banner" onerror="this.src='https://picsum.photos/1200/250?nature'">
        </div>

        <div class="p-4">
            <h4 class="section-title">Search Visitor</h4>
            
            <div class="form-inline mb-4">
                <label class="mr-2 font-weight-bold">Fist name:</label> 
                <input type="text" id="searchKeyword" class="form-control mr-2 w-25" placeholder="Nhập từ khóa...">
                <button type="button" id="btnSearch" class="btn btn-custom-green mr-2">Search...</button>
                <small class="text-muted">(Type any keyword and click Search button to scan all fields)</small>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-striped text-center" id="visitorTable">
                    <thead class="thead-light">
                        <tr>
                            <th>Fist name</th>
                            <th>Last name</th>
                            <th>Gender</th>
                            <th>Telephone</th>
                            <th>You're in</th>
                            <th>Hobbies</th>
                            <th style="width: 40%;">Description</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
            
            <div class="mt-3">
                <a href="person.html" class="btn btn-outline-success">← Quay lại trang Đăng ký</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
