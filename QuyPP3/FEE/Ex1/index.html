<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping List Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="card shadow p-4" style="max-width: 680px; width: 100%;">
    <h1 class="text-center fw-bold mb-4" style="font-size: 1.6rem; color: rgb(23, 9, 115);">Shopping List Manager</h1>

    <!-- Form -->
    <div class="row g-2 align-items-end mb-3">
      <div class="col">
        <label for="itemName" class="form-label">Item Name</label>
        <input type="text" id="itemName" class="form-control" placeholder="e.g., Apples" maxlength="50" />
        <div class="error-msg" id="nameError"></div>
      </div>
      <div class="col">
        <label for="itemCost" class="form-label">Item Cost ($)</label>
        <input type="number" id="itemCost" class="form-control" placeholder="e.g., 2.50" min="0.01" max="9999.99" step="0.01" />
        <div class="error-msg" id="costError"></div>
      </div>
      <div class="col-auto">
        <button id="addBtn" class="btn btn-primary" style="background-color: rgb(104, 171, 216);"
          onclick="addItem()">Add Item +</button>
      </div>
    </div>

    <table class="table table-hover table-bordered">
      <thead class="table-dark">
        <tr>
          <th class="fw-bold">Item Name</th>
          <th class="fw-bold text-center">Cost ($)</th>
          <th class="text-center fw-bold">Action</th>
        </tr>
      </thead>
      <tbody id="tableBody">
      </tbody>
    </table>

    <div class="d-flex justify-content-between align-items-center border border-2 border-dark rounded px-3 py-2 mt-2">
      <span class="fw-bold fs-5">Grand Total:</span>
      <span id="grandTotal" class="fw-bold fs-4 text-danger">$0.00</span>
    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
