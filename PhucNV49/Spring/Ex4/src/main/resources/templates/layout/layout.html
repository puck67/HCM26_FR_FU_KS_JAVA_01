<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Material Hub</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS for Premium Glassmorphism Dark Theme -->
    <style>
        :root {
            --bg-color: #0b0f19;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-bg-hover: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-focus: rgba(255, 255, 255, 0.2);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #6366f1; /* Indigo */
            --accent-secondary: #3b82f6; /* Blue */
            --accent-success: #10b981; /* Emerald */
            --accent-danger: #ef4444; /* Rose */
            --accent-warning: #f59e0b; /* Amber */
            --glow-color: rgba(99, 102, 241, 0.15);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Glowing background circles */
        .bg-glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Sidebar styling */
        .sidebar {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            min-height: 100vh;
            width: 280px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            padding: 2rem 1.5rem;
            transition: all 0.3s ease;
        }

        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 3rem;
            text-decoration: none;
        }

        .sidebar-menu-title {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            margin-top: 1.5rem;
            padding-left: 0.5rem;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.8rem 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .sidebar-link:hover {
            background: var(--glass-bg-hover);
            color: var(--text-primary);
            transform: translateX(4px);
        }

        .sidebar-link.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(59, 130, 246, 0.15));
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: var(--text-primary);
            box-shadow: 0 4px 20px var(--glow-color);
        }

        /* Content Area */
        .main-wrapper {
            margin-left: 280px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header styling */
        .app-header {
            background: rgba(15, 23, 42, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 90;
        }

        .search-box {
            position: relative;
            width: 320px;
        }

        .search-box input {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            background: rgba(15, 23, 42, 0.6);
            border-color: var(--glass-border-focus);
            outline: none;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.1);
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* Main Content container */
        .content-body {
            padding: 2.5rem;
            flex: 1;
        }

        /* Glassmorphic Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.8rem;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Footer styling */
        .app-footer {
            border-top: 1px solid var(--glass-border);
            padding: 1.5rem 2.5rem;
            background: rgba(15, 23, 42, 0.2);
            backdrop-filter: blur(10px);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* Buttons & Forms */
        .btn-glass {
            background: rgba(99, 102, 241, 0.2);
            color: var(--text-primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-glass:hover {
            background: rgba(99, 102, 241, 0.35);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
            color: var(--text-primary);
        }

        .btn-glass-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-glass-danger:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);
            color: #fff;
        }

        .form-control-glass {
            background: rgba(15, 23, 42, 0.3) !important;
            border: 1px solid var(--glass-border) !important;
            color: var(--text-primary) !important;
            border-radius: 8px !important;
            padding: 0.75rem 1rem !important;
            transition: all 0.3s ease !important;
        }

        .form-control-glass:focus {
            background: rgba(15, 23, 42, 0.6) !important;
            border-color: var(--accent-primary) !important;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15) !important;
            outline: none !important;
        }

        .form-select-glass {
            background: rgba(15, 23, 42, 0.3) !important;
            border: 1px solid var(--glass-border) !important;
            color: var(--text-primary) !important;
            border-radius: 8px !important;
            padding: 0.75rem 1rem !important;
            transition: all 0.3s ease !important;
        }

        .form-select-glass:focus {
            background: rgba(15, 23, 42, 0.6) !important;
            border-color: var(--accent-primary) !important;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15) !important;
        }

        .glass-table {
            color: var(--text-primary) !important;
        }

        .glass-table th {
            border-bottom: 2px solid var(--glass-border) !important;
            color: var(--text-secondary) !important;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            background: transparent !important;
        }

        .glass-table td {
            border-bottom: 1px solid var(--glass-border) !important;
            background: transparent !important;
            vertical-align: middle;
            padding: 1rem 0.75rem;
        }

        .glass-table tr:hover td {
            background: rgba(255, 255, 255, 0.02) !important;
        }

        /* Alert styling */
        .glass-alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: #a7f3d0;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .glass-alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .badge-glass-category {
            background: rgba(99, 102, 241, 0.15);
            color: #c7d2fe;
            border: 1px solid rgba(99, 102, 241, 0.25);
            padding: 0.4em 0.8em;
            border-radius: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="/" class="sidebar-brand">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>LMS Material</span>
        </a>

        <div class="sidebar-menu-title">Main Menu</div>
        <a href="/" class="sidebar-link" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
            <i class="fa-solid fa-chart-line"></i>
            <span>Dashboard</span>
        </a>

        <div class="sidebar-menu-title">Training Management</div>
        <a href="/subjects" class="sidebar-link" th:classappend="${activePage == 'subjects'} ? 'active' : ''">
            <i class="fa-solid fa-book-bookmark"></i>
            <span>Subject Management</span>
        </a>
        <a href="/materials" class="sidebar-link" th:classappend="${activePage == 'materials'} ? 'active' : ''">
            <i class="fa-solid fa-folder-open"></i>
            <span>Material Management</span>
        </a>
    </div>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
        <!-- Header -->
        <header class="app-header">
            <div>
                <h4 class="mb-0 text-white font-weight-bold" th:text="${headerTitle ?: 'LMS Material Management System'}">Dashboard</h4>
            </div>
            <!-- Global Search Form -->
            <form action="/materials/search" method="get" class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" name="query" placeholder="Search materials..." th:value="${query}">
            </form>
        </header>

        <!-- Body -->
        <main class="content-body">
            <div th:replace="${content}">
                <!-- Dynamic Content Injection -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="d-flex justify-content-between align-items-center">
                <span>&copy; 2026 LMS Material Hub. All rights reserved.</span>
                <div>
                    <span class="me-3">Training Center Platform</span>
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </div>
        </footer>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
