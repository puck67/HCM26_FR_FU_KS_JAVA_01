<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::#subjectListContent})}">
<body>
    <div id="subjectListContent">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="text-white mb-1">Subject Management</h2>
                <p class="text-secondary">Register new subjects and configure training durations.</p>
            </div>
            <a href="/subjects/new" class="btn btn-glass">
                <i class="fa-solid fa-plus me-1"></i> Add Subject
            </a>
        </div>

        <!-- Success/Error Alert messages -->
        <div th:if="${success}" class="glass-alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="glass-alert-danger" th:text="${error}"></div>

        <!-- Subjects Table -->
        <div class="glass-card">
            <div class="table-responsive">
                <table class="table glass-table">
                    <thead>
                        <tr>
                            <th style="width: 10%;">ID</th>
                            <th style="width: 20%;">Subject Code</th>
                            <th style="width: 35%;">Subject Name</th>
                            <th style="width: 15%;">Duration (Hours)</th>
                            <th style="width: 10%;">Files</th>
                            <th style="width: 10%; text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="subj : ${subjects}">
                            <td th:text="${subj.subjectId}">1</td>
                            <td>
                                <span class="badge bg-dark text-white border border-secondary" th:text="${subj.subjectCode}">JAVA01</span>
                            </td>
                            <td class="text-white font-weight-bold" th:text="${subj.subjectName}">Java Programming</td>
                            <td th:text="${subj.duration + ' Hours'}">40 Hours</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${subj.materials != null ? subj.materials.size() : 0}">0</span>
                            </td>
                            <td style="text-align: right;">
                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/subjects/edit/{id}(id=${subj.subjectId})}" class="btn btn-sm btn-outline-info" title="Edit">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </a>
                                    <a th:href="@{/subjects/delete/{id}(id=${subj.subjectId})}" 
                                       class="btn btn-sm btn-glass-danger" 
                                       onclick="return confirm('Do you want to delete this subject? This will delete all its uploaded materials as well.');" 
                                       title="Delete">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(subjects)}">
                            <td colspan="6" class="text-center text-secondary py-5">No subjects registered yet. Click "Add Subject" to begin.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
