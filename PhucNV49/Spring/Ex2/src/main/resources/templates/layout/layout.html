<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Menu Management System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(14, 165, 233, 0.15);
            --sidebar-width: 280px;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Sidebar Glass Styling */
        .sidebar-container {
            width: var(--sidebar-width);
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            border-right: 1px solid var(--border-color);
        }

        .sidebar-wrapper {
            height: 100vh;
        }

        /* Main Content wrapper */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header / Top Navbar */
        .top-navbar {
            height: 70px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 90;
        }

        /* Nav links interactions */
        .sidebar-item-link {
            transition: all 0.25s ease;
            font-weight: 500;
        }

        .sidebar-item-link:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(3px);
            color: #38bdf8 !important;
        }

        .sidebar-item-link.active {
            background: linear-gradient(90deg, rgba(14, 165, 233, 0.2) 0%, rgba(56, 189, 248, 0.05) 100%);
            border-left: 3px solid #0ea5e9;
            color: #38bdf8 !important;
            font-weight: 600;
        }

        /* Collapsible Chevron Animation */
        .sidebar-item-link .arrow-icon {
            transition: transform 0.3s ease;
        }

        .sidebar-item-link:not(.collapsed) .arrow-icon {
            transform: rotate(180deg);
            color: #38bdf8 !important;
        }

        /* Submenus structure */
        .submenu-list {
            padding-left: 1rem;
            margin-left: 0.75rem;
        }

        .submenu-list .sidebar-item-link {
            font-size: 0.925rem;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Card glowing hover effect */
        .glow-card {
            transition: all 0.3s ease;
        }
        .glow-card:hover {
            transform: translateY(-3px);
            border-color: rgba(56, 189, 248, 0.3) !important;
            box-shadow: 0 8px 30px rgba(14, 165, 233, 0.15);
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .tracking-wide {
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR CONTAINER -->
    <div class="sidebar-container">
        <div th:replace="~{fragments/sidebar-fragment :: sidebar}"></div>
    </div>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
        <!-- TOP NAVBAR -->
        <header class="top-navbar d-flex align-items-center px-4 justify-content-between">
            <div class="d-flex align-items-center">
                <h5 class="mb-0 text-white fw-bold tracking-wide">
                    <i class="bi bi-layers-half text-info me-2"></i>
                    Dynamic Menu Management
                </h5>
            </div>
            
            <div class="d-flex align-items-center gap-3">
                <!-- Simulation Role Selector -->
                <div class="dropdown">
                    <button class="btn btn-dark border-secondary dropdown-toggle d-flex align-items-center gap-2" 
                            type="button" id="roleDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle text-info"></i>
                        <span>Role: <strong th:text="${currentRole}">ADMIN</strong></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end glass-panel" aria-labelledby="roleDropdown">
                        <li><h6 class="dropdown-header">Switch View Role</h6></li>
                        <li><a class="dropdown-item d-flex align-items-center gap-2" th:classappend="${currentRole == 'ADMIN' ? 'active' : ''}" th:href="@{/switch-role(role='ADMIN')}"><i class="bi bi-shield-lock-fill text-danger"></i> Admin</a></li>
                        <li><a class="dropdown-item d-flex align-items-center gap-2" th:classappend="${currentRole == 'TEACHER' ? 'active' : ''}" th:href="@{/switch-role(role='TEACHER')}"><i class="bi bi-journal-bookmark-fill text-warning"></i> Teacher</a></li>
                        <li><a class="dropdown-item d-flex align-items-center gap-2" th:classappend="${currentRole == 'STUDENT' ? 'active' : ''}" th:href="@{/switch-role(role='STUDENT')}"><i class="bi bi-mortarboard-fill text-success"></i> Student</a></li>
                    </ul>
                </div>

                <a href="/menus" class="btn btn-info text-dark fw-semibold d-flex align-items-center gap-1">
                    <i class="bi bi-plus-circle-fill"></i>
                    Configure
                </a>
            </div>
        </header>

        <!-- CONTENT CONTAINER -->
        <main class="flex-grow-1 p-4">
            <div th:replace="${content}">
                <!-- Rendered page content goes here -->
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="footer py-3 px-4 border-top border-secondary text-center mt-auto text-muted small bg-dark bg-opacity-20">
            <p class="mb-0">&copy; 2026 LMS Dynamic Menu Management System. Premium Interface.</p>
        </footer>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Active Link Highlighter & Collapsible Tree Auto-expansion -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const currentPath = window.location.pathname;
            const links = document.querySelectorAll(".sidebar-item-link");
            
            links.forEach(link => {
                const url = link.getAttribute("data-url");
                // Check if the URL matches current path, or if we are in a sub-path (excluding root)
                if (url && (url === currentPath || (currentPath.startsWith(url) && url !== '/'))) {
                    link.classList.add("active");
                    link.classList.remove("text-white");
                    
                    // Walk up parent nodes to expand collapsed menus containing this active link
                    let parent = link.closest(".collapse");
                    while (parent) {
                        // Open the collapse div
                        parent.classList.add("show");
                        
                        // Update the toggle button states associated with this collapse div
                        const triggerId = parent.getAttribute("id");
                        const trigger = document.querySelector(`a[href="#${triggerId}"]`);
                        if (trigger) {
                            trigger.classList.remove("collapsed");
                            trigger.setAttribute("aria-expanded", "true");
                        }
                        
                        // Go further up
                        parent = parent.parentElement.closest(".collapse");
                    }
                }
            });
        });
    </script>
</body>
</html>
