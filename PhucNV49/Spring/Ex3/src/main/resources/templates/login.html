<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Security Management System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(14, 165, 233, 0.2);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient glow background blobs */
        .glow-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(14, 165, 233, 0) 70%);
            z-index: -1;
            filter: blur(40px);
        }
        .blob-1 {
            top: 10%;
            left: 15%;
        }
        .blob-2 {
            bottom: 10%;
            right: 15%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, rgba(139, 92, 246, 0) 70%);
        }

        /* Glassmorphism panel */
        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 16px 48px 0 rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            transition: all 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(14, 165, 233, 0.25);
            box-shadow: 0 16px 48px 0 rgba(14, 165, 233, 0.08);
        }

        .form-control {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            background-color: rgba(15, 23, 42, 0.8);
            border-color: #0ea5e9;
            box-shadow: 0 0 0 4px var(--accent-glow);
            color: var(--text-primary);
        }

        .btn-info {
            background: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 100%);
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 0.025em;
            transition: all 0.25s ease;
        }

        .btn-info:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
        }

        .tracking-wide {
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <!-- Ambient Blobs -->
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>

    <div class="login-card">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-info bg-opacity-10 border border-info border-opacity-20 mb-3 text-info">
                <i class="bi bi-shield-lock-fill fs-1"></i>
            </div>
            <h3 class="fw-bold tracking-wide text-white mb-1">User & Security</h3>
            <p class="text-secondary small">Sign in to access your customized dashboard</p>
        </div>

        <!-- Failure alerts -->
        <div th:if="${param.error}" class="alert alert-danger bg-danger bg-opacity-10 border-danger border-opacity-25 text-danger small rounded p-3 mb-4 d-flex align-items-start gap-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5 mt-0.5"></i>
            <div>
                <strong>Authentication Failed</strong>
                <div class="mt-1" th:text="${session != null && session.containsKey('SPRING_SECURITY_LAST_EXCEPTION') ? session.SPRING_SECURITY_LAST_EXCEPTION.message : 'Invalid username or password.'}">
                    Invalid credentials
                </div>
            </div>
        </div>

        <!-- Logout Alert -->
        <div th:if="${param.logout}" class="alert alert-success bg-success bg-opacity-10 border-success border-opacity-25 text-success small rounded p-3 mb-4 d-flex align-items-start gap-2" role="alert">
            <i class="bi bi-check-circle-fill fs-5 mt-0.5"></i>
            <div>
                <strong>Success</strong>
                <div class="mt-1">You have been successfully logged out.</div>
            </div>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="POST">
            <!-- Username -->
            <div class="mb-3">
                <label for="username" class="form-label text-secondary small font-monospace tracking-wide">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" id="username" class="form-control" placeholder="superadmin" required autofocus autocomplete="username" />
                </div>
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label for="password" class="form-label text-secondary small font-monospace tracking-wide">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="bi bi-key"></i></span>
                    <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-info text-dark w-100 fw-bold">Sign In</button>
        </form>

        <!-- Footer Help -->
        <div class="text-center mt-4 border-top border-secondary border-opacity-20 pt-3">
            <span class="text-secondary small d-block mb-1">Fresh Database Seed? Use:</span>
            <code class="font-monospace text-info small">superadmin</code> / <code class="font-monospace text-info small">admin123</code>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
