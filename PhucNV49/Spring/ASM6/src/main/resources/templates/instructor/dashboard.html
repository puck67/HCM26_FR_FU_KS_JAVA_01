<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="instructor-layout">
  <nav class="instructor-sidebar">
    <div class="sidebar-brand">Instructor Panel</div>
    <ul>
      <li><a th:href="@{/instructor/dashboard}" class="active">Dashboard</a></li>
      <li><a th:href="@{/instructor/courses}">Manage Courses</a></li>
      <li><a th:href="@{/instructor/courses/new}">Create Course</a></li>
      <li><a th:href="@{/instructor/reviews}">Manage Reviews</a></li>
      <li><a th:href="@{/}">View Site</a></li>
    </ul>
  </nav>

  <main class="instructor-main">
    <h1>Dashboard</h1>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number" th:text="${totalCourses}">0</div>
        <div class="stat-label">Total Courses</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" th:text="${publishedCourses}">0</div>
        <div class="stat-label">Published</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" th:text="${pendingReviews}">0</div>
        <div class="stat-label">Pending Reviews</div>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:1rem;margin-bottom:1rem">Recent Courses</h2>
      <table class="table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="course : ${recentCourses}">
            <td th:text="${course.title}">Title</td>
            <td>
              <span th:classappend="${course.status == 1} ? 'badge-draft' : (${course.status == 2} ? 'badge-published' : 'badge-archived')"
                    class="badge"
                    th:text="${course.status == 1} ? 'Draft' : (${course.status == 2} ? 'Published' : 'Archived')">
              </span>
            </td>
            <td th:text="${#temporals.format(course.createdAt,'MMM dd, yyyy')}">Date</td>
            <td>
              <a th:href="@{/instructor/courses/{id}/edit(id=${course.id})}" class="btn btn-sm btn-outline">Edit</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(recentCourses)}">
            <td colspan="4" style="color:var(--text-muted)">No courses yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
