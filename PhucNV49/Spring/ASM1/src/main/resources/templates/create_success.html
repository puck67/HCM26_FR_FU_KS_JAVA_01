<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Created Successfully</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 40px;">

    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center;">
        <h1 style="margin-top: 0; color: #27ae60;">Course Created Successfully!</h1>
        <p style="color: #34495e; font-size: 1.05em;">Your new course has been created and is ready to use.</p>
        <a th:href="@{/courses/new}"
           style="display: inline-block; margin-top: 18px; background-color: #3498db; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 4px;">
            Create Another Course
        </a>
    </div>

</body>
</html>
