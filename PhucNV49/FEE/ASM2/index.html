<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polls Management Portal</title>
    <!-- Bootstrap 4 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark polls-navbar py-2">
        <div class="container">
            <a class="navbar-brand" href="#" id="brand-link">
                <i class="fas fa-poll-h"></i> Polls<span> Portal</span>
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item" id="nav-vote">
                        <a class="nav-link" href="#" data-page="vote"><i class="fas fa-vote-yea mr-1"></i> Vote</a>
                    </li>
                    <li class="nav-item" id="nav-create">
                        <a class="nav-link" href="#" data-page="create"><i class="fas fa-plus-circle mr-1"></i> Create</a>
                    </li>
                    <li class="nav-item" id="nav-list">
                        <a class="nav-link" href="#" data-page="list"><i class="fas fa-list-ul mr-1"></i> List</a>
                    </li>
                </ul>
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item" id="nav-login-wrapper">
                        <a class="nav-link btn btn-primary px-3 text-light d-flex align-items-center" href="#" id="navbar-login-btn">
                            <i class="fas fa-sign-in-alt mr-1"></i> Login
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="polls-container">
        <div class="polls-card">
            <!-- Loading overlay inside card -->
            <div id="loading-overlay" class="loading-overlay">
                <div class="text-center">
                    <div class="spinner-border text-success" role="status" style="width: 2.5rem; height: 2.5rem;">
                        <span class="sr-only">Loading...</span>
                    </div>
                    <div class="mt-2 font-weight-bold text-secondary">Loading page...</div>
                </div>
            </div>

            <!-- Dynamic Content Area -->
            <div id="main-content">
                <!-- Fragments load here -->
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
            <div class="modal-content" style="border-radius: 12px; border: 1px solid #cbd5e1; box-shadow: var(--card-shadow);">
                <div class="modal-body p-4">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                    
                    <h5 class="font-weight-bold text-dark text-center mb-4" id="loginModalLabel">User Login</h5>
                    
                    <form id="navbar-login-form" novalidate>
                        <div class="form-group">
                            <label for="login-alias">Alias:</label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="login-alias" 
                                name="alias" 
                                placeholder="JoeSixpack" 
                                required
                            >
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password:</label>
                            <input 
                                type="password" 
                                class="form-control" 
                                id="login-password" 
                                name="password" 
                                placeholder="********" 
                                required
                            >
                        </div>
                        <div class="form-group form-check">
                            <input type="checkbox" class="form-check-input" id="login-remember" name="remember">
                            <label class="form-check-label text-muted" for="login-remember">Remember me</label>
                        </div>
                        
                        <div class="d-flex justify-content-between gap-3 mt-4">
                            <button type="submit" class="btn btn-primary px-4 w-50" id="login-modal-submit-btn">Sign In</button>
                            <button type="button" class="btn btn-secondary px-4 w-50 ml-2" data-dismiss="modal">Close</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Deletion Confirmation Modal (Classic mimiced design) -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 420px;">
            <div class="modal-content modal-mimic-card">
                <div class="modal-mimic-header">
                    Message from webpage
                </div>
                <div class="modal-body p-4">
                    <div class="d-flex align-items-start gap-3">
                        <span style="font-size: 2rem; color: #3b82f6;" class="mr-3">
                            <i class="fas fa-question-circle"></i>
                        </span>
                        <div class="mt-1 font-weight-bold text-secondary" style="font-size: 1rem;">
                            Are you sure you want to delete this item?
                        </div>
                    </div>
                    
                    <div class="text-right mt-4">
                        <button type="button" class="btn btn-primary px-4" id="delete-confirm-btn" style="min-width: 80px;">OK</button>
                        <button type="button" class="btn btn-secondary px-4 ml-2" data-dismiss="modal" style="min-width: 80px;">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap bundle -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core Application Logic -->
    <script src="js/polls.js"></script>
</body>
</html>
