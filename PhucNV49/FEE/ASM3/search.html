<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Visitors - HR Portal</title>
    <!-- Bootstrap 4 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="hr-wrapper">
        <!-- Top Navigation -->
        <nav class="hr-top-nav">
            <a href="person.html" class="hr-nav-item"><i class="fas fa-user-plus mr-1"></i> Register</a>
            <a href="search.html" class="hr-nav-item active"><i class="fas fa-search mr-1"></i> Search Visitors</a>
            <a href="help.html" class="hr-nav-item"><i class="fas fa-question-circle mr-1"></i> Help</a>
        </nav>

        <div class="hr-card">
            <!-- Lake Banner Image -->
            <div class="hr-banner-container">
                <img src="lake_banner.png" alt="Lake Banner" class="hr-banner-image">
            </div>

            <div class="hr-card-body">
                <h3 class="hr-header-title">Search Visitor</h3>

                <!-- Search Controls Row -->
                <div class="search-controls-row">
                    <form id="search-visitor-form" class="form-inline d-flex align-items-center flex-wrap gap-3">
                        <div class="form-group mr-sm-3 mb-2 flex-grow-1" style="max-width: 480px;">
                            <label for="search-input" class="mr-3 font-weight-bold" style="white-space: nowrap;">Fist name:</label>
                            <input 
                                type="text" 
                                class="form-control w-100" 
                                id="search-input" 
                                placeholder="Search..."
                            >
                        </div>
                        <button type="submit" class="btn btn-primary mb-2 px-4" id="btn-search-visitor">Search...</button>
                    </form>
                    <div class="search-hint">
                        (Type First name Visitor and Click Search button)
                    </div>
                </div>

                <!-- Visitors Table -->
                <div class="table-responsive">
                    <table class="table hr-table table-bordered">
                        <thead>
                            <tr>
                                <th scope="col">First name</th>
                                <th scope="col">Last name</th>
                                <th scope="col">Gender</th>
                                <th scope="col">Telephone</th>
                                <th scope="col">You're in</th>
                                <th scope="col">Hobbies</th>
                                <th scope="col">Description</th>
                            </tr>
                        </thead>
                        <tbody id="visitors-table-body">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>
                </div>
                
                <div id="no-results-message" class="alert alert-warning text-center mt-3 d-none">
                    <i class="fas fa-search-minus mr-2"></i> No matching visitors found.
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap bundle -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- HR Core Logic -->
    <script src="js/hr.js"></script>
</body>
</html>
