<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CMS Portal</title>
    <!-- Bootstrap 4 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                Register
            </div>
            <div class="auth-body">
                <div id="register-alert" class="alert alert-success d-none" role="alert">
                    Registration successful! Redirecting to login...
                </div>
                <form id="register-form" novalidate>
                    <div class="form-group">
                        <label for="reg-username">User name</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="reg-username" 
                            name="username" 
                            placeholder="User name" 
                            required 
                            minlength="3" 
                            maxlength="30"
                        >
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input 
                            type="email" 
                            class="form-control" 
                            id="reg-email" 
                            name="email" 
                            placeholder="E-mail" 
                            required 
                            minlength="5"
                        >
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="reg-password" 
                            name="password" 
                            placeholder="Password" 
                            required 
                            minlength="8" 
                            maxlength="30"
                        >
                    </div>
                    <div class="form-group">
                        <label for="reg-repassword">Re Password</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="reg-repassword" 
                            name="repassword" 
                            placeholder="Re Password" 
                            required 
                            minlength="8" 
                            maxlength="30"
                        >
                    </div>
                    <button type="submit" class="btn btn-primary btn-block mb-3" id="register-btn">Register</button>
                    <div class="text-center">
                        <a href="login.html" class="auth-link">Click here to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap bundle -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom validation library -->
    <script src="js/validation.js"></script>
    <script>
        $(document).ready(function() {
            $('#register-form').on('submit', function(e) {
                e.preventDefault();
                
                const $form = $(this);
                if (validateForm($form)) {
                    // Validated successfully
                    const email = $('#reg-email').val();
                    localStorage.setItem('registeredEmail', email);

                    // Show success alert
                    $('#register-alert').removeClass('d-none');
                    $('#register-btn').html('<i class="fas fa-spinner fa-spin mr-2"></i>Processing...').prop('disabled', true);
                    
                    setTimeout(function() {
                        window.location.href = 'login.html';
                    }, 1500);
                }
            });
        });
    </script>
</body>
</html>
