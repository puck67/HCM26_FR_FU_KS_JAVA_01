<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Dashboard</title>
    <!-- Bootstrap 4 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <script>
        // Quick session check before loading page to ensure security
        if (!localStorage.getItem('userEmail')) {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark dashboard-navbar py-2">
        <a class="navbar-brand ml-3" href="#">
            <i class="fas fa-cubes"></i> CMS <span>Portal</span>
        </a>
        
        <div class="ml-auto mr-3">
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-light d-flex align-items-center gap-2" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="font-weight: 500;">
                        <i class="fas fa-user-circle fa-lg mr-1"></i>
                        <span id="nav-user-email">User</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown">
                        <a class="dropdown-item" href="#" id="nav-profile-btn">
                            <i class="fas fa-user-cog"></i> User Profile
                        </a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item text-danger" href="#" id="logout-btn">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Sidebar and Main Panel Wrapper -->
    <div class="dashboard-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-search-box">
                <i class="fas fa-search"></i>
                <input type="text" class="form-control" placeholder="Search...">
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link" data-target="view_contents" id="menu-view-contents">
                    <i class="fas fa-list-ul"></i>
                    <span>View contents</span>
                </a>
                <a href="#" class="sidebar-link" data-target="add_content" id="menu-form-content">
                    <i class="fas fa-edit"></i>
                    <span>Form content</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="dashboard-content-wrapper">
            <!-- Loading Screen Overlay (absolute-positioned over content area) -->
            <div id="loading-overlay" class="loading-overlay">
                <div class="loading-container">
                    <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;">
                        <span class="sr-only">Loading...</span>
                    </div>
                    <div class="loading-title">Loading</div>
                    <div class="loading-subtitle">Fetching page content...</div>
                    <div class="loading-progress-bar-container">
                        <div id="loading-progress" class="loading-progress-bar"></div>
                    </div>
                </div>
            </div>

            <!-- Dynamic Content Destination -->
            <div id="main-content">
                <!-- Subpages inject here -->
            </div>
        </main>
    </div>

    <!-- jQuery and Bootstrap bundle -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Reusable Validation library -->
    <script src="js/validation.js"></script>
    <!-- Core Application Logic -->
    <script src="js/app.js"></script>
</body>
</html>
