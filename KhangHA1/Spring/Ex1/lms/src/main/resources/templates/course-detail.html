<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::div}, ${title})">

<body>
    <div class="content-wrapper">
        <div th:if="${message}" class="alert alert-success">
            ✅ <span th:text="${message}"></span>
        </div>

        <div class="lesson-link" th:if="${savedCourse != null}">
            <a
                th:href="@{/courses/{code}/{date}/lessons(code=${savedCourse.id.courseCode}, date=${savedCourse.id.startDate})}">Lesson
                Detail</a>
        </div>

        <div class="form-container">
            <h3>Create New Course</h3>
            <form th:action="@{/courses/save}" th:object="${course}" method="post"
                th:with="isSaved=${savedCourse != null}">
                <div class="form-row">
                    <div class="form-group">
                        <label>Mã khóa học / Course ID</label>
                        <input type="text" name="id.courseCode" th:value="${savedCourse?.id?.courseCode}" required>
                    </div>
                    <div class="form-group">
                        <label>Ngày khai giảng / Start Date</label>
                        <input type="date" name="id.startDate" th:value="${savedCourse?.id?.startDate}" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Tên khóa học / Course Name</label>
                    <input type="text" name="courseName" th:value="${savedCourse?.courseName}" required>
                </div>
                <div class="form-group">
                    <label>Danh mục / Category</label>
                    <select name="category">
                        <option value="Technology" th:selected="${savedCourse?.category == 'Technology'}">Technology
                        </option>
                        <option value="Business" th:selected="${savedCourse?.category == 'Business'}">Business</option>
                        <option value="Design" th:selected="${savedCourse?.category == 'Design'}">Design</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Giảng viên / Instructor</label>
                    <input type="text" name="instructor" th:value="${savedCourse?.instructor}" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Course</button>
                    <button type="reset" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
