<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course List</title>
</head>
<body>
    <h2>Courses</h2>
    <a th:href="@{/courses/create}">Create New Course</a>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Instructor</th>
                <th>Email</th>
                <th>Description</th>
                <th>Duration</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="course : ${courses}">
                <td th:text="${course.id}"></td>
                <td th:text="${course.title}"></td>
                <td th:text="${course.instructorName}"></td>
                <td th:text="${course.instructorEmail}"></td>
                <td th:text="${course.description}"></td>
                <td th:text="${course.durationHours}"></td>
                <td>
                    <a th:href="@{/courses/edit/{id}(id=${course.id})}">Edit</a> |
                    <a th:href="@{/courses/delete/{id}(id=${course.id})}">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
