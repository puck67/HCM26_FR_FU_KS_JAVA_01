<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <div class="col-3">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>

            <div class="col-9">

                <h2 class="mt-3">Dashboard</h2>

                <div class="row mt-4">

                    <div class="col-md-4">

                        <div class="card">
                            <div class="card-body">

                                <h5>Total Menus</h5>

                                <h2 th:text="${totalMenus}"></h2>

                            </div>
                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="card">
                            <div class="card-body">

                                <h5>Parent Menus</h5>

                                <h2 th:text="${totalParents}"></h2>

                            </div>
                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="card">
                            <div class="card-body">

                                <h5>Sub Menus</h5>

                                <h2 th:text="${totalChildren}"></h2>

                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
