<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Create Menu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container">

        <h2 class="mt-4">Create Menu</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/menus}" method="post" th:object="${menu}">

            <div class="mb-3">

                <label>Name</label>

                <input type="text" class="form-control" th:field="*{name}">

            </div>

            <div class="mb-3">

                <label>URL</label>

                <input type="text" class="form-control" th:field="*{url}">

            </div>

            <div class="mb-3">

                <label>Icon</label>

                <input type="text" class="form-control" th:field="*{icon}">

            </div>

            <div class="mb-3">

                <label>Display Order</label>

                <input type="number" class="form-control" th:field="*{displayOrder}">

            </div>

            <div class="mb-3">

                <label>Parent Menu</label>

                <select class="form-select" th:field="*{parentId}">

                    <option value="">
                        Root Menu
                    </option>

                    <option th:each="parent : ${parents}" th:value="${parent.id}" th:text="${parent.name}">
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label>Status</label>

                <select class="form-select" th:field="*{status}">

                    <option value="true">Active</option>

                    <option value="false">Inactive</option>

                </select>

            </div>

            <button class="btn btn-primary">
                Save
            </button>

            <a href="/menus" class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</body>

</html>
