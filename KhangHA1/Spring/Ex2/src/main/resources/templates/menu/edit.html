<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Edit Menu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container">

        <h2 class="mt-4">Edit Menu</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/menus/update/{id}(id=${menu.id})}" method="post">

            <div class="mb-3">

                <label>Name</label>

                <input type="text" class="form-control" name="name" th:value="${menu.name}">

            </div>

            <div class="mb-3">

                <label>URL</label>

                <input type="text" class="form-control" name="url" th:value="${menu.url}">

            </div>

            <div class="mb-3">

                <label>Icon</label>

                <input type="text" class="form-control" name="icon" th:value="${menu.icon}">

            </div>

            <div class="mb-3">

                <label>Parent Menu</label>

                <select class="form-select" name="parentId">

                    <option value="">
                        Root Menu
                    </option>

                    <option th:each="parent : ${parents}" th:value="${parent.id}" th:text="${parent.name}"
                        th:selected="${menu.parent != null and parent.id == menu.parent.id}">
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label>Display Order</label>

                <input type="number" class="form-control" name="displayOrder" th:value="${menu.displayOrder}">

            </div>

            <div class="mb-3">

                <label>Status</label>

                <select name="status" class="form-select">

                    <option value="true" th:selected="${menu.status}">
                        Active
                    </option>

                    <option value="false" th:selected="${!menu.status}">
                        Inactive
                    </option>

                </select>

            </div>

            <button class="btn btn-primary">
                Update
            </button>

            <a href="/menus" class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</body>

</html>
