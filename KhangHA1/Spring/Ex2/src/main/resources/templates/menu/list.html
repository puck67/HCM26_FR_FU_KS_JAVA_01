<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Menu List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <div class="col-3">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>

            <div class="col-9">

                <div class="d-flex justify-content-between mt-3">

                    <h2>Menu Management</h2>

                    <a href="/menus/create" class="btn btn-success">
                        Add Menu
                    </a>

                </div>

                <table class="table table-bordered mt-3">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>URL</th>
                            <th>Parent</th>
                            <th>Order</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="menu : ${menus}">

                            <td th:text="${menu.id}"></td>

                            <td th:text="${menu.name}"></td>

                            <td th:text="${menu.url}"></td>

                            <td th:text="${menu.parent != null ? menu.parent.name : '-'}"></td>

                            <td th:text="${menu.displayOrder}"></td>

                            <td>

                                <a class="btn btn-warning btn-sm" th:href="@{/menus/edit/{id}(id=${menu.id})}">
                                    Edit
                                </a>

                                <a class="btn btn-danger btn-sm" th:href="@{/menus/delete/{id}(id=${menu.id})}"
                                    onclick="return confirm('Delete this menu?')">
                                    Delete
                                </a>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</body>

</html>
