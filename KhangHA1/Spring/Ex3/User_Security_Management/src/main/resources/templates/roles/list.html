<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>

<div th:replace="~{layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: sidebar}"></div>
        
        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-md-4 pt-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2">Role Management</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/roles/add}" class="btn btn-sm btn-primary">
                        <i class="fas fa-plus"></i> Add New Role
                    </a>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-sm">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Role Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="role : ${roles}">
                            <td th:text="${role.roleId}"></td>
                            <td th:text="${role.roleName}"></td>
                            <td>
                                <a th:href="@{/roles/edit/{id}(id=${role.roleId})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                                <a th:href="@{/roles/delete/{id}(id=${role.roleId})}" class="btn btn-sm btn-outline-danger" 
                                   onclick="return confirm('Are you sure you want to delete this role?');">Delete</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(roles)}">
                            <td colspan="3" class="text-center">No roles found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
