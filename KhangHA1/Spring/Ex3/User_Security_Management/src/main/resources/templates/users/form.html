<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>

<div th:replace="~{layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: sidebar}"></div>
        
        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-md-4 pt-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2" th:text="${user.userId == null ? 'Add User' : 'Edit User'}"></h1>
            </div>

            <div class="card col-md-8 mx-auto shadow-sm">
                <div class="card-body">
                    <form th:action="${user.userId == null ? '/users/add' : '/users/edit/' + user.userId}" 
                          th:object="${user}" method="post">
                        
                        <input type="hidden" th:field="*{userId}">
                        
                        <div class="form-group">
                            <label for="username">Username <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="username" th:field="*{username}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Password <span th:if="${user.userId == null}" class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" th:field="*{password}" 
                                   th:required="${user.userId == null}">
                            <small th:if="${user.userId != null}" class="form-text text-muted">
                                Leave blank to keep current password.
                            </small>
                        </div>
                        
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}">
                        </div>

                        <div class="form-group">
                            <label for="status">Status</label>
                            <select class="form-control" id="status" th:field="*{status}">
                                <option th:each="stat : ${statuses}" 
                                        th:value="${stat}" th:text="${stat}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Roles</label>
                            <div th:each="role : ${roles}">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" 
                                           th:field="*{roles}" th:value="${role.roleId}" th:id="${'role_' + role.roleId}">
                                    <label class="form-check-label" th:for="${'role_' + role.roleId}" th:text="${role.roleName}"></label>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Save</button>
                        <a th:href="@{/users}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
