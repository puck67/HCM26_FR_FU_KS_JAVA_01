<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header">
    <meta charset="UTF-8">
    <title>Management System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
</head>
<body>

<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <span class="nav-link text-white">
                        Welcome, <span sec:authentication="name">User</span> | 
                        Role: <span sec:authentication="principal.authorities"></span>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="form-inline">
                        <button class="btn btn-outline-light btn-sm ml-2" type="submit">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>
</div>

<div class="container-fluid">
    <div class="row">
        <nav th:fragment="sidebar" class="col-md-2 d-none d-md-block bg-light sidebar" style="min-height: 100vh;">
            <div class="sidebar-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                    </li>
                    
                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted"
                        sec:authorize="hasAnyRole('SUPER_ADMIN', 'ADMIN')">
                        <span>Security Management</span>
                    </h6>
                    
                    <li class="nav-item" sec:authorize="hasAnyRole('SUPER_ADMIN', 'ADMIN')">
                        <a class="nav-link" th:href="@{/users}">
                            <i class="fas fa-users"></i> User Management
                        </a>
                    </li>
                    
                    <li class="nav-item" sec:authorize="hasRole('SUPER_ADMIN')">
                        <a class="nav-link" th:href="@{/roles}">
                            <i class="fas fa-user-shield"></i> Role Management
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        
        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-md-4 pt-3">
            <!-- Content will be injected here in individual pages -->
        </main>
    </div>
</div>

<div th:fragment="scripts">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</div>
</body>
</html>
