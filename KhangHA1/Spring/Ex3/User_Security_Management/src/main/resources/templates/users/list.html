<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: header}"></head>
<body>

<div th:replace="~{layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout :: sidebar}"></div>
        
        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-md-4 pt-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2">User Management</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/users/add}" class="btn btn-sm btn-primary">
                        <i class="fas fa-plus"></i> Add New User
                    </a>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-sm">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Full Name</th>
                            <th>Status</th>
                            <th>Roles</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.userId}"></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.fullName}"></td>
                            <td>
                                <span th:class="${user.status.name() == 'ACTIVE'} ? 'badge badge-success' : 'badge badge-danger'" 
                                      th:text="${user.status}"></span>
                            </td>
                            <td>
                                <span th:each="role, iterStat : ${user.roles}" 
                                      th:text="!${iterStat.last} ? ${role.roleName} + ', ' : ${role.roleName}">
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/users/edit/{id}(id=${user.userId})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                                <a th:href="@{/users/delete/{id}(id=${user.userId})}" class="btn btn-sm btn-outline-danger" 
                                   onclick="return confirm('Are you sure you want to delete this user?');">Delete</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="text-center">No users found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
