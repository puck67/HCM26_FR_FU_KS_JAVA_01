<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Polls — Vote on the latest interview and share your opinion." />
  <title>Polls — Vote</title>

  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg poll-navbar" id="main-navbar">
    <a class="navbar-brand" href="index.html">Polls</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMenu"
      aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link active" href="index.html" id="nav-vote">Vote</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="create.html" id="nav-create">Create</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="list.html" id="nav-list">List</a>
        </li>
      </ul>
      <button class="btn-login" id="btn-login-trigger" type="button">Login</button>
    </div>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="poll-container">
    <h1 class="poll-title">Great poll</h1>

    <form id="vote-form" novalidate>

      <!-- Question 1 -->
      <div class="question-item">
        <p class="question-label">1. It is necessary to you? *</p>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="q1" id="q1-yes" value="yes" />
          <label class="form-check-label" for="q1-yes">Yes</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="q1" id="q1-no" value="no" />
          <label class="form-check-label" for="q1-no">No</label>
        </div>
      </div>

      <!-- Question 2 -->
      <div class="question-item">
        <p class="question-label">2. Often pass polls?</p>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="q2" id="q2-month" value="month" />
          <label class="form-check-label" for="q2-month">Once a month</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="q2" id="q2-week" value="week" />
          <label class="form-check-label" for="q2-week">Once a week</label>
        </div>
      </div>

      <!-- Question 3 -->
      <div class="question-item">
        <p class="question-label">3. How old are you?</p>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="q3" id="q3-1820" value="18-20" checked />
          <label class="form-check-label" for="q3-1820">18-20</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="q3" id="q3-2123" value="21-23" />
          <label class="form-check-label" for="q3-2123">21-23</label>
        </div>
      </div>

      <!-- Success message (shown after submit) -->
      <div id="vote-success" class="alert-success-inline" role="alert">
        Thank you! Your vote has been recorded successfully.
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary btn-retain" id="btn-vote-retain">Retain</button>
      </div>

    </form>
  </div>

  <!-- ===== LOGIN MODAL ===== -->
  <div class="modal fade login-modal" id="loginModal" tabindex="-1" role="dialog"
    aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="loginModalLabel">Sign In</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="login-form" novalidate>
            <div class="form-group">
              <label for="login-alias">Alias:</label>
              <input type="text" class="form-control" id="login-alias"
                placeholder="Joetbepack" autocomplete="username" />
            </div>
            <div class="form-group">
              <label for="login-password">Password:</label>
              <input type="password" class="form-control" id="login-password"
                placeholder="••••••••" autocomplete="current-password" />
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="remember-me" />
              <label class="form-check-label" for="remember-me">Remember me</label>
            </div>
            <button type="submit" class="btn btn-signin" id="btn-sign-in">Sign in</button>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-close-modal" data-dismiss="modal" id="btn-close-login">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 4 JS + jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <!-- Custom JS -->
  <script src="polls.js"></script>
</body>
</html>
