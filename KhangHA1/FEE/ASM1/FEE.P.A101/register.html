<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — CMS</title>
  <meta name="description" content="CMS Register page. Create a new account to access the Content Management System." />

  <!-- Bootstrap 4 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+H"
        crossorigin="anonymous" />

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

  <!-- Custom styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-box">
      <h5>Register</h5>

      <form id="register-form" novalidate>

        <div class="form-group">
          <input
            type="text"
            id="reg-username"
            name="username"
            class="form-control"
            placeholder="User name"
            maxlength="30"
            data-label="User name"
            autocomplete="username"
          />
          <div class="invalid-feedback"></div>
        </div>

        <div class="form-group">
          <input
            type="email"
            id="reg-email"
            name="email"
            class="form-control"
            placeholder="E-Mail"
            data-label="Email"
            autocomplete="email"
          />
          <div class="invalid-feedback"></div>
        </div>

        <div class="form-group">
          <input
            type="password"
            id="reg-password"
            name="password"
            class="form-control"
            placeholder="Password"
            maxlength="30"
            data-label="Password"
            autocomplete="new-password"
          />
          <div class="invalid-feedback"></div>
        </div>

        <div class="form-group">
          <input
            type="password"
            id="reg-repassword"
            name="repassword"
            class="form-control"
            placeholder="Re-Password"
            maxlength="30"
            data-label="Re-Password"
            autocomplete="new-password"
          />
          <div class="invalid-feedback"></div>
        </div>

        <button type="submit" class="btn btn-success btn-block" id="register-btn">
          Register
        </button>

      </form>

      <a href="login.html" class="auth-link">Click here to Login</a>
    </div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"
          integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
          crossorigin="anonymous"></script>
  <!-- Bootstrap 4 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
          crossorigin="anonymous"></script>
  <!-- Validation -->
  <script src="validation.js"></script>
</body>
</html>
