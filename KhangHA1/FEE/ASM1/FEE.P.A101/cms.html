<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMS — Content Management System</title>
  <meta name="description" content="CMS Dashboard — manage and view your content, edit your profile." />

  <!-- Bootstrap 4 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+H"
        crossorigin="anonymous" />

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

  <!-- Custom styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ========== NAVBAR ========== -->
  <nav class="cms-navbar" role="navigation" aria-label="CMS top navigation">
    <span class="brand">CMS</span>

    <div class="user-dropdown dropdown">
      <button
        id="user-dropdown-btn"
        class="user-btn btn dropdown-toggle"
        type="button"
        data-toggle="dropdown"
        aria-haspopup="true"
        aria-expanded="false"
      >
        <i class="fas fa-user-circle"></i>
      </button>
      <div class="dropdown-menu dropdown-menu-right" aria-labelledby="user-dropdown-btn">
        <a
          class="dropdown-item"
          href="#"
          id="nav-profile-link"
          role="button"
        >
          <i class="fas fa-user"></i> User Profile
        </a>
        <div class="dropdown-divider"></div>
        <a
          class="dropdown-item text-danger"
          href="login.html"
          id="nav-logout-link"
          role="button"
        >
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </div>
    </div>
  </nav>

  <!-- ========== SIDEBAR ========== -->
  <aside class="cms-sidebar" role="complementary" aria-label="CMS sidebar navigation">

    <!-- Search -->
    <div class="sidebar-search">
      <input
        type="text"
        id="sidebar-search"
        placeholder="Search..."
        aria-label="Search content"
      />
      <button type="button" aria-label="Search">
        <i class="fas fa-search"></i>
      </button>
    </div>

    <!-- Nav links -->
    <nav id="sidebar-nav" aria-label="Content navigation">
      <a
        class="nav-link active"
        id="link-view-contents"
        role="button"
        tabindex="0"
        data-page="view-contents.html"
        aria-current="page"
      >
        <i class="fas fa-list"></i> View contents
      </a>
      <a
        class="nav-link"
        id="link-form-content"
        role="button"
        tabindex="0"
        data-page="form-content.html"
      >
        <i class="fas fa-edit"></i> Form content
      </a>
    </nav>

  </aside>

  <!-- ========== MAIN AREA ========== -->
  <main class="cms-main" role="main" style="position:relative;">

    <!-- Loading overlay (shown for 5s on nav link click) -->
    <div id="loading-overlay" role="status" aria-live="polite" aria-label="Loading content">
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
      <div class="loading-text">Loading</div>
    </div>

    <!-- Dynamic content injected here via AJAX -->
    <div id="cms-content-area"></div>

  </main>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"
          integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
          crossorigin="anonymous"></script>
  <!-- Bootstrap 4 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
          crossorigin="anonymous"></script>
  <!-- Validation (handles profile & content form events via delegation) -->
  <script src="validation.js"></script>

  <script>
    $(function () {
      var LOAD_DELAY = 5000; // 5 seconds loading per spec

      // -------------------------------------------------------
      // loadPage — show Loading overlay, then fetch HTML fragment
      // -------------------------------------------------------
      function loadPage(pageFile, $activateLink) {
        // Update active sidebar link
        $('#sidebar-nav .nav-link').removeClass('active').removeAttr('aria-current');
        if ($activateLink) {
          $activateLink.addClass('active').attr('aria-current', 'page');
        }

        // Show loading overlay
        var $overlay = $('#loading-overlay');
        var $content = $('#cms-content-area');
        $content.hide();
        $overlay.addClass('show');

        // After 5 seconds, load the page via AJAX
        setTimeout(function () {
          $.ajax({
            url:      pageFile,
            method:   'GET',
            dataType: 'html',
            success: function (html) {
              $overlay.removeClass('show');
              $content.html(html).fadeIn(300);
            },
            error: function () {
              $overlay.removeClass('show');
              $content.html(
                '<div class="alert alert-danger">Failed to load content. Please try again.</div>'
              ).show();
            }
          });
        }, LOAD_DELAY);
      }

      // -------------------------------------------------------
      // Sidebar link click
      // -------------------------------------------------------
      $(document).on('click keydown', '#sidebar-nav .nav-link', function (e) {
        if (e.type === 'keydown' && e.which !== 13 && e.which !== 32) return;
        e.preventDefault();
        var page = $(this).data('page');
        loadPage(page, $(this));
      });

      // -------------------------------------------------------
      // Navbar "User Profile" dropdown click → load edit-profile
      // -------------------------------------------------------
      $('#nav-profile-link').on('click', function (e) {
        e.preventDefault();
        // Close dropdown
        $(this).closest('.dropdown').find('[data-toggle="dropdown"]').dropdown('hide');
        // No sidebar link active for profile
        $('#sidebar-nav .nav-link').removeClass('active').removeAttr('aria-current');
        loadPage('edit-profile.html', null);
      });

      // -------------------------------------------------------
      // Initial load — show View Contents on page load (no delay)
      // -------------------------------------------------------
      (function initialLoad() {
        var $content = $('#cms-content-area');
        $.ajax({
          url:      'view-contents.html',
          method:   'GET',
          dataType: 'html',
          success: function (html) {
            $content.html(html).show();
          },
          error: function () {
            $content.html(
              '<div class="alert alert-warning">Could not load initial content.</div>'
            ).show();
          }
        });
      })();

      // -------------------------------------------------------
      // Sidebar search — filter table rows in View Contents
      // -------------------------------------------------------
      $('#sidebar-search').on('input', function () {
        var term = $(this).val().toLowerCase().trim();
        $('#content-table tbody tr').each(function () {
          var text = $(this).text().toLowerCase();
          $(this).toggle(term === '' || text.indexOf(term) !== -1);
        });
      });

    });
  </script>

</body>
</html>
