<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(${pageName}, ~{::content})}">
<body>
    <div th:fragment="content">
        <div class="row">
            <div class="col-12">
                <div class="card-premium">
                    <div class="card-header-premium">
                        <h4 class="fw-bold mb-0" th:text="${pageName}">Mock Page</h4>
                    </div>
                    <div class="p-4 text-center">
                        <div class="display-1 text-muted mb-4">
                            <i class="bi bi-compass"></i>
                        </div>
                        <h4 class="fw-bold">Routing Successful!</h4>
                        <p class="text-muted">You have successfully navigated to the following dynamic path:</p>
                        <code class="d-inline-block bg-light px-3 py-2 border rounded text-primary fs-5" th:text="${pageUri}">/students</code>
                        <div class="mt-4">
                            <a th:href="@{/admin/menus}" class="btn btn-premium btn-sm">
                                <i class="bi bi-sliders me-1"></i> Edit this Menu Structure
                            </a>
                            <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm ms-2">
                                <i class="bi bi-house me-1"></i> Back to Dashboard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
