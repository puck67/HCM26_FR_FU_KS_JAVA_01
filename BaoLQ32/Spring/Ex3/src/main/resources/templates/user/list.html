<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: layout('User Management', ~{::content})}">
<body>
    <div th:fragment="content">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold text-dark mb-1">User Account Directory</h4>
                <p class="text-muted small mb-0">Manage system users, authorize security roles, and reset credentials.</p>
            </div>
            
            <a th:href="@{/users/new}" class="btn btn-premium btn-sm">
                <i class="bi bi-person-plus me-1"></i> Add New User
            </a>
        </div>
        
        <!-- Table container -->
        <div class="premium-card p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover table-premium mb-0 align-middle">
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Username</th>
                            <th>Full Name</th>
                            <th>Roles Assigned</th>
                            <th class="text-center">Account Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <!-- User ID -->
                            <td class="font-monospace text-muted" th:text="${user.id}">1</td>
                            
                            <!-- Username -->
                            <td>
                                <div class="fw-semibold text-dark" th:text="${user.username}">superadmin</div>
                            </td>
                            
                            <!-- Full Name -->
                            <td th:text="${user.fullName}">Super Administrator</td>
                            
                            <!-- Roles -->
                            <td>
                                <div class="d-flex flex-wrap gap-1">
                                    <span th:each="role : ${user.roles}" 
                                          class="badge px-2 py-1"
                                          th:classappend="${role.roleName == 'SUPER_ADMIN' ? 'bg-primary' : (role.roleName == 'ADMIN' ? 'bg-success' : 'bg-warning text-dark')}"
                                          th:text="${role.roleName}">
                                        ROLE
                                    </span>
                                </div>
                            </td>
                            
                            <!-- Status -->
                            <td class="text-center">
                                <span th:if="${user.isActive()}" class="badge badge-active">
                                    <i class="bi bi-check-circle-fill me-1"></i> Active
                                </span>
                                <span th:if="${!user.isActive()}" class="badge badge-inactive">
                                    <i class="bi bi-x-circle-fill me-1"></i> Inactive
                                </span>
                            </td>
                            
                            <!-- Action buttons -->
                            <td class="text-end">
                                <div class="d-flex justify-content-end gap-2 px-3">
                                    <!-- Edit User details -->
                                    <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary" title="Edit User">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    
                                    <!-- Reset Password -->
                                    <a th:href="@{/users/reset-password/{id}(id=${user.id})}" class="btn btn-sm btn-outline-warning" title="Reset Password">
                                        <i class="bi bi-key"></i>
                                    </a>
                                    
                                    <!-- Delete User -->
                                    <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post" 
                                          onsubmit="return confirm('Are you sure you want to delete this user account?');"
                                          th:if="${currentUser == null || currentUser.id != user.id}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete User">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                    
                                    <!-- Disabled Delete button for current logged in user -->
                                    <button th:if="${currentUser != null && currentUser.id == user.id}" 
                                            class="btn btn-sm btn-outline-secondary" 
                                            disabled 
                                            title="You cannot delete yourself">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
    </div>
</body>
</html>
