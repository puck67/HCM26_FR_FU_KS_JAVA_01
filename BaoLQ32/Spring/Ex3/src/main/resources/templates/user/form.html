<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(${user.id == null} ? 'Add User' : 'Edit User', ~{::content})}">
<body>
    <div th:fragment="content">
        
        <div class="mb-4">
            <a th:href="@{/users}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Back to User List
            </a>
        </div>
        
        <div class="row">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="premium-card">
                    <h5 class="fw-bold mb-4" th:text="${user.id == null} ? 'Create User Account' : 'Edit User Profile'">Create User Account</h5>
                    
                    <form th:action="${user.id == null} ? @{/users/new} : @{/users/edit/{id}(id=${user.id})}" th:object="${user}" method="post">
                        <!-- Hidden ID field for Edit -->
                        <input type="hidden" th:field="*{id}" th:if="${user.id != null}">
                        
                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label text-muted small fw-semibold">Username</label>
                            <input type="text" id="username" th:field="*{username}" class="form-control" 
                                   th:readonly="${user.id != null}" 
                                   placeholder="e.g. jdoe" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username Error</div>
                            <small class="text-muted" th:if="${user.id != null}">Username cannot be changed after creation.</small>
                        </div>
                        
                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label text-muted small fw-semibold">Full Name</label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control" 
                                   placeholder="e.g. John Doe" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Full Name Error</div>
                        </div>
                        
                        <!-- Password: ONLY for ADD mode -->
                        <div class="mb-3" th:if="${user.id == null}">
                            <label for="password" class="form-label text-muted small fw-semibold">Password</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control" 
                                   placeholder="Create a strong password" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password Error</div>
                        </div>
                        
                        <!-- Status Dropdown -->
                        <div class="mb-3">
                            <label for="status" class="form-label text-muted small fw-semibold">Account Status</label>
                            <select id="status" th:field="*{status}" class="form-select">
                                <option value="ACTIVE">Active (Can Log In)</option>
                                <option value="INACTIVE">Inactive / Locked (Blocked from Logging In)</option>
                            </select>
                        </div>
                        
                        <!-- Role Checkboxes -->
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-semibold d-block">Authorize Roles</label>
                            <div class="row g-2 px-2">
                                <div class="col-12" th:each="role : ${allRoles}">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="selectedRoles" 
                                               th:value="${role.id}" 
                                               th:id="'role-' + ${role.id}"
                                               th:checked="${user.roles.contains(role)}">
                                        <label class="form-check-label text-dark" th:for="'role-' + ${role.id}">
                                            <span class="fw-semibold" th:text="${role.roleName}">SUPER_ADMIN</span>
                                            <span class="text-muted small" th:if="${role.roleName == 'SUPER_ADMIN'}">(Super user with all privileges)</span>
                                            <span class="text-muted small" th:if="${role.roleName == 'ADMIN'}">(System admin can manage users)</span>
                                            <span class="text-muted small" th:if="${role.roleName == 'TEACHER'}">(Faculty / Lecturer access)</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Action buttons -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-premium btn-sm">
                                <i class="bi bi-check-circle me-1"></i> Save Account
                            </button>
                            <a th:href="@{/users}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
