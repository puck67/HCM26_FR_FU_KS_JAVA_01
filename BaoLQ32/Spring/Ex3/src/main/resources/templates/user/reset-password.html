<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Reset Password', ~{::content})}">
<body>
    <div th:fragment="content">
        
        <div class="mb-4">
            <a th:href="@{/users}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Back to User List
            </a>
        </div>
        
        <div class="row">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="premium-card">
                    <h5 class="fw-bold mb-4">
                        <i class="bi bi-key-fill text-warning me-2"></i>
                        Reset Credentials
                    </h5>
                    <p class="text-muted small">
                        Updating password for user account: <strong class="text-dark" th:text="${user.username}">username</strong>.
                    </p>
                    
                    <form th:action="@{/users/reset-password/{id}(id=${user.id})}" method="post">
                        <!-- New Password -->
                        <div class="mb-3">
                            <label for="newPassword" class="form-label text-muted small fw-semibold">New Password</label>
                            <input type="password" id="newPassword" name="newPassword" class="form-control" 
                                   placeholder="Enter new password" required autofocus>
                        </div>
                        
                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label text-muted small fw-semibold">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" 
                                   placeholder="Retype password to confirm" required>
                        </div>
                        
                        <!-- Actions -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning text-dark fw-semibold btn-sm">
                                <i class="bi bi-shield-lock me-1"></i> Update Password
                            </button>
                            <a th:href="@{/users}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
