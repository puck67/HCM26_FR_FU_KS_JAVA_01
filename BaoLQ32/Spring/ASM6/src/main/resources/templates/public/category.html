<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Courses in ' + ${selectedCategory})}"></head>
<body>
    <header th:replace="~{layout/fragments :: header('')}"></header>

    <main class="main-container has-sidebar">
        <!-- Courses List -->
        <section class="content-section">
            <h2 class="widget-title" style="font-size: 1.5rem; margin-bottom: 1.5rem; border:none; padding: 0;">
                <i class="fa-solid fa-tags"></i> Category: <span th:text="${selectedCategory}">Category Name</span>
            </h2>

            <div th:if="${coursePage.empty}" class="card">
                <p class="text-secondary" style="text-align: center;">No published courses found in this category.</p>
            </div>

            <article th:each="course : ${coursePage.content}" class="card course-card">
                <div class="course-header">
                    <h3 class="course-title">
                        <a th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.title}">Course Title</a>
                    </h3>
                    <span class="status-badge status-published">Published</span>
                </div>
                <p class="course-desc" th:text="${course.description}">Short summary of the course.</p>
                <div class="course-meta">
                    <span><i class="fa-solid fa-calendar-days"></i> <span th:text="${#temporals.format(course.createdAt, 'dd MMM yyyy')}">Date</span></span>
                    <span><i class="fa-solid fa-tags"></i> <span th:text="${course.category}">Spring, Java</span></span>
                    <span><i class="fa-solid fa-comment"></i> <span th:text="${course.reviews.size()}">0</span> Reviews</span>
                </div>
            </article>

            <!-- Pagination -->
            <ul th:if="${coursePage.totalPages > 1}" class="pagination">
                <li class="page-item" th:classappend="${coursePage.first} ? 'disabled'">
                    <a th:if="${!coursePage.first}" th:href="@{/category/{name}(name=${selectedCategory}, page=${coursePage.number - 1})}">Previous</a>
                    <span th:if="${coursePage.first}">Previous</span>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, coursePage.totalPages - 1)}" th:classappend="${i == coursePage.number} ? 'active'">
                    <a th:if="${i != coursePage.number}" th:href="@{/category/{name}(name=${selectedCategory}, page=${i})}" th:text="${i + 1}">1</a>
                    <span th:if="${i == coursePage.number}" th:text="${i + 1}">1</span>
                </li>
                <li class="page-item" th:classappend="${coursePage.last} ? 'disabled'">
                    <a th:if="${!coursePage.last}" th:href="@{/category/{name}(name=${selectedCategory}, page=${coursePage.number + 1})}">Next</a>
                    <span th:if="${coursePage.last}">Next</span>
                </li>
            </ul>
        </section>

        <!-- Sidebar -->
        <aside th:replace="~{layout/fragments :: sidebar}"></aside>
    </main>

    <footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
