<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Manage Courses')}"></head>
<body>
    <header th:replace="~{layout/fragments :: header('manage_courses')}"></header>

    <main class="main-container">
        <!-- Alert message -->
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fa-solid fa-circle-check"></i>
            <span th:text="${successMessage}">Success!</span>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 style="font-size: 1.8rem; font-weight: 700;">
                <i class="fa-solid fa-book-open"></i> Manage Courses
            </h2>
            <a th:href="@{/instructor/courses/new}" class="btn-primary">
                <i class="fa-solid fa-plus"></i> Create New Course
            </a>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Categories</th>
                            <th>Created At</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${courses.empty}">
                            <td colspan="6" style="text-align: center;" class="text-secondary">No courses found.</td>
                        </tr>
                        <tr th:each="course : ${courses}">
                            <td th:text="${course.id}">1</td>
                            <td>
                                <a th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.title}" target="_blank" style="font-weight: 500;">Course Title</a>
                            </td>
                            <td th:text="${course.category}">Categories</td>
                            <td th:text="${#temporals.format(course.createdAt, 'dd MMM yyyy HH:mm')}">Date</td>
                            <td>
                                <span class="status-badge" 
                                      th:classappend="${course.status == 1 ? 'status-draft' : (course.status == 2 ? 'status-published' : 'status-archived')}"
                                      th:text="${course.status == 1 ? 'Draft' : (course.status == 2 ? 'Published' : 'Archived')}">
                                    Status
                                </span>
                            </td>
                            <td>
                                <div style="display: flex; gap: 0.5rem; align-items: center;">
                                    <!-- Status toggles -->
                                    <form th:if="${course.status != 2}" th:action="@{/instructor/courses/status/{id}(id=${course.id})}" method="post" style="display: inline;">
                                        <input type="hidden" name="status" value="2">
                                        <button type="submit" class="btn-outline" style="padding: 0.2rem 0.6rem; font-size: 0.8rem; border-color: var(--success-color); color: var(--success-color);">Publish</button>
                                    </form>
                                    <form th:if="${course.status == 2}" th:action="@{/instructor/courses/status/{id}(id=${course.id})}" method="post" style="display: inline;">
                                        <input type="hidden" name="status" value="1">
                                        <button type="submit" class="btn-outline" style="padding: 0.2rem 0.6rem; font-size: 0.8rem; border-color: var(--warning-color); color: var(--warning-color);">Unpublish</button>
                                    </form>
                                    <form th:if="${course.status != 3}" th:action="@{/instructor/courses/status/{id}(id=${course.id})}" method="post" style="display: inline;">
                                        <input type="hidden" name="status" value="3">
                                        <button type="submit" class="btn-outline" style="padding: 0.2rem 0.6rem; font-size: 0.8rem; border-color: var(--text-muted); color: var(--text-muted);">Archive</button>
                                    </form>

                                    <!-- Edit / Delete -->
                                    <a th:href="@{/instructor/courses/edit/{id}(id=${course.id})}" class="btn-outline" style="padding: 0.2rem 0.6rem; font-size: 0.8rem; border-color: var(--accent-color); color: var(--accent-color);">
                                        <i class="fa-solid fa-pen"></i> Edit
                                    </a>
                                    
                                    <form th:action="@{/instructor/courses/delete/{id}(id=${course.id})}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this course?');">
                                        <button type="submit" class="btn-outline" style="padding: 0.2rem 0.6rem; font-size: 0.8rem; border-color: var(--error-color); color: var(--error-color);">
                                            <i class="fa-solid fa-trash"></i> Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
