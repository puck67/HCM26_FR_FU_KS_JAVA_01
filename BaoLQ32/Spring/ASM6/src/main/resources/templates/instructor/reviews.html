<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Manage Reviews')}"></head>
<body>
    <header th:replace="~{layout/fragments :: header('manage_reviews')}"></header>

    <main class="main-container">
        <!-- Alert message -->
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fa-solid fa-circle-check"></i>
            <span th:text="${successMessage}">Success!</span>
        </div>

        <h2 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 1.5rem;">
            <i class="fa-solid fa-comments"></i> Manage Reviews
        </h2>

        <div class="card">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Author</th>
                            <th>Email</th>
                            <th>Rating</th>
                            <th>Content</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${reviews.empty}">
                            <td colspan="7" style="text-align: center;" class="text-secondary">No reviews found.</td>
                        </tr>
                        <tr th:each="rev : ${reviews}">
                            <td>
                                <a th:href="@{/courses/{id}(id=${rev.course.id})}" th:text="${rev.course.title}" target="_blank" style="font-weight: 500;">Course</a>
                            </td>
                            <td th:text="${rev.authorName}">Author</td>
                            <td th:text="${rev.email}">Email</td>
                            <td>
                                <div class="review-stars">
                                    <i th:each="star : ${#numbers.sequence(1, 5)}" 
                                       th:class="${star <= rev.rating} ? 'fa-solid fa-star' : 'fa-regular fa-star'"></i>
                                </div>
                            </td>
                            <td th:text="${rev.content}">Content text</td>
                            <td>
                                <span class="status-badge" 
                                      th:classappend="${rev.status == 1 ? 'status-draft' : 'status-published'}"
                                      th:text="${rev.status == 1 ? 'Pending' : 'Approved'}">
                                    Status
                                </span>
                            </td>
                            <td>
                                <div style="display: flex; gap: 0.5rem; align-items: center;">
                                    <!-- Approve button for Pending reviews -->
                                    <form th:if="${rev.status == 1}" th:action="@{/instructor/reviews/approve/{id}(id=${rev.id})}" method="post" style="display: inline;">
                                        <button type="submit" class="btn-outline" style="padding: 0.2rem 0.6rem; font-size: 0.8rem; border-color: var(--success-color); color: var(--success-color);">
                                            <i class="fa-solid fa-check"></i> Approve
                                        </button>
                                    </form>

                                    <!-- Delete button -->
                                    <form th:action="@{/instructor/reviews/delete/{id}(id=${rev.id})}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this review?');">
                                        <button type="submit" class="btn-outline" style="padding: 0.2rem 0.6rem; font-size: 0.8rem; border-color: var(--error-color); color: var(--error-color);">
                                            <i class="fa-solid fa-trash"></i> Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
