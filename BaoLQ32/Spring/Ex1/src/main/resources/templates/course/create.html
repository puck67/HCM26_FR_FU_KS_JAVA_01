<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: html}">
<head>
    <title>Thêm mới Khóa học</title>
</head>
<body>
    <div th:fragment="content">
        
        <!-- Success Alert and Lesson Detail Link (matching Screenshot 2) -->
        <div th:if="${isSuccess}">
            <div class="alert-custom-success">
                ✔ Add a new Course successfully!
            </div>
            <div class="lesson-detail-link-section">
                <a th:href="@{/courses/{code}/{date}/lessons(code=${course.id.courseCode},date=${#temporals.format(course.id.startDate, 'yyyy-MM-dd')})}">Lesson Detail</a>
                <span>Thêm chi tiết bài học</span>
            </div>
        </div>

        <!-- Error Alert if any (duplicate keys, etc.) -->
        <div th:if="${errorMessage}" class="alert-custom-danger">
            ✖ <span th:text="${errorMessage}">Mã khóa học + Ngày khai giảng là duy nhất!</span>
        </div>

        <!-- Create New Course Form Box -->
        <div class="form-container-box">
            <div class="box-header">
                Create New Course
            </div>
            <div class="box-body">
                <form th:action="@{/courses/new}" th:object="${course}" method="post">
                    
                    <!-- Form Row for ID and Start Date -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="courseCode">Mã khóa học / Course ID</label>
                            <input type="text" 
                                   id="courseCode"
                                   th:field="*{id.courseCode}" 
                                   th:readonly="${isSuccess}"
                                   class="form-control" 
                                   required>
                            <div style="color: red; font-size: 12px; margin-top: 4px;" th:if="${#fields.hasErrors('id.courseCode')}" th:errors="*{id.courseCode}">Mã lỗi</div>
                        </div>

                        <div class="form-group">
                            <label for="startDate">Ngày khai giảng / Start Date</label>
                            <input type="date" 
                                   id="startDate"
                                   th:field="*{id.startDate}" 
                                   th:readonly="${isSuccess}"
                                   class="form-control" 
                                   required>
                            <div style="color: red; font-size: 12px; margin-top: 4px;" th:if="${#fields.hasErrors('id.startDate')}" th:errors="*{id.startDate}">Ngày lỗi</div>
                        </div>
                    </div>

                    <!-- Course Name -->
                    <div class="form-group">
                        <label for="courseName">Tên khóa học / Course Name</label>
                        <input type="text" 
                               id="courseName"
                               th:field="*{courseName}" 
                               th:readonly="${isSuccess}"
                               class="form-control" 
                               required>
                        <div style="color: red; font-size: 12px; margin-top: 4px;" th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}">Tên lỗi</div>
                    </div>

                    <!-- Category -->
                    <div class="form-group">
                        <label for="category">Danh mục / Category</label>
                        <select id="category" 
                                th:field="*{category}" 
                                th:disabled="${isSuccess}"
                                class="form-select" 
                                required>
                            <option value="" disabled selected>-- Chọn danh mục --</option>
                            <option value="Technology">Technology</option>
                            <option value="Business">Business</option>
                            <option value="Design">Design</option>
                            <option value="Language">Language</option>
                        </select>
                        <input type="hidden" th:if="${isSuccess}" th:field="*{category}">
                        <div style="color: red; font-size: 12px; margin-top: 4px;" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Danh mục lỗi</div>
                    </div>

                    <!-- Instructor -->
                    <div class="form-group">
                        <label for="instructor">Giảng viên / Instructor</label>
                        <input type="text" 
                               id="instructor"
                               th:field="*{instructor}" 
                               th:readonly="${isSuccess}"
                               class="form-control" 
                               required>
                        <div style="color: red; font-size: 12px; margin-top: 4px;" th:if="${#fields.hasErrors('instructor')}" th:errors="*{instructor}">Giảng viên lỗi</div>
                    </div>

                    <!-- Form Actions -->
                    <div class="form-actions" style="justify-content: space-between; align-items: center;">
                        <div style="display: flex; gap: 10px;">
                            <button type="submit" th:if="${!isSuccess}" class="btn-custom-save">Save Course</button>
                            <a th:href="@{/courses/new}" th:if="${isSuccess}" class="btn-custom-save" style="text-decoration: none;">Add Another</a>
                            <a th:href="@{/courses}" class="btn-custom-cancel">Cancel</a>
                        </div>
                        <div style="font-size: 13px; color: #333333; font-weight: bold;">
                            Add a new Course (Course Detail Screen)
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</body>
</html>
