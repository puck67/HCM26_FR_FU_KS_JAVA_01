<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polls Management Dashboard - Vote</title>
  <!-- Bootstrap 4.6.2 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="vote.html">Polls</a>
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link active" href="vote.html" id="nav-vote-btn">Vote</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="create.html" id="nav-create-btn">Create</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="list.html" id="nav-list-btn">List</a>
        </li>
      </ul>
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <button class="btn btn-green" id="btn-login-trigger" data-toggle="modal" data-target="#loginModal">Login</button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- VOTE PAGE SECTION -->
  <div class="container page-section" id="vote-section">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card-custom">
          <!-- Alert Container for Validation Messages -->
          <div id="vote-alert-container"></div>
          
          <h2 class="card-title-custom" id="vote-poll-title">Great poll</h2>
          
          <form id="vote-form" class="mt-4" novalidate>
            <!-- Questions will be dynamically rendered here -->
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- LOGIN MODAL -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
      <div class="modal-content modal-content-custom">
        <div class="modal-body p-4 text-center">
          <form id="login-form" novalidate class="text-left d-inline-block w-100" style="max-width: 320px;">
            <div id="login-alert-container"></div>
            
            <div class="form-group" id="login-alias-group">
              <label for="login-alias" class="font-weight-bold text-dark">Alias:</label>
              <input type="text" class="form-control" id="login-alias" placeholder="JoeSixpack" required>
              <div class="invalid-feedback-custom">Alias is required and must be between 3 and 255 characters.</div>
            </div>
            
            <div class="form-group" id="login-password-group">
              <label for="login-password" class="font-weight-bold text-dark">Password:</label>
              <input type="password" class="form-control" id="login-password" placeholder="********" required>
              <div class="invalid-feedback-custom">Password is required and must be at least 6 characters.</div>
            </div>
            
            <div class="form-group form-check mb-4">
              <input type="checkbox" class="form-check-input" id="login-remember">
              <label class="form-check-label text-muted" for="login-remember">Remember me</label>
            </div>
            
            <div class="form-group text-left">
              <button type="submit" class="btn btn-green">Sign In</button>
            </div>
          </form>
          
          <div class="mt-4 pt-3 border-top w-100 text-center">
            <button type="button" class="btn btn-green" data-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <!-- jQuery 3.6.0, Popper.js 1.16.1, Bootstrap 4.6.2 JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

  <script>
    $(document).ready(function() {
      // Mock Poll Data Store Helper
      var defaultPolls = [
        {
          id: 98,
          title: "Great poll",
          status: "active",
          questions: [
            {
              text: "it is necessary to you?",
              mandatory: true,
              multiple: false,
              answers: ["Yes", "No"]
            },
            {
              text: "Often pass polls?",
              mandatory: false,
              multiple: false,
              answers: ["Once a month", "Once a week"]
            },
            {
              text: "How old are you?",
              mandatory: false,
              multiple: false,
              answers: ["18-20", "21-23"]
            }
          ]
        }
      ];

      function getPolls() {
        var stored = localStorage.getItem('polls');
        if (!stored) {
          localStorage.setItem('polls', JSON.stringify(defaultPolls));
          return defaultPolls;
        }
        return JSON.parse(stored);
      }

      var polls = getPolls();

      // Read poll ID from URL query parameters (default to 98)
      function getQueryParam(param) {
        var urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
      }

      var pollId = parseInt(getQueryParam('id')) || 98;
      var currentActivePollId = pollId;

      // ----------------------------------------------------
      // VOTE PAGE RENDERING & VALIDATION
      // ----------------------------------------------------
      function renderVotePage(id) {
        var poll = polls.find(function(p) { return p.id === id; });
        if (!poll) {
          // If specified poll not found, fallback to the first active poll
          poll = polls.find(function(p) { return p.status === 'active'; });
        }
        
        if (!poll) {
          $('#vote-form').html('<div class="text-center text-muted py-5">No active poll selected. Please choose one from the List.</div>');
          $('#vote-poll-title').text('No Poll Selected');
          return;
        }
        
        currentActivePollId = poll.id;
        $('#vote-poll-title').text(poll.title);
        
        var $form = $('#vote-form');
        $form.empty();
        
        poll.questions.forEach(function(q, qIdx) {
          var isRequired = q.mandatory;
          var isMultiple = q.multiple;
          var inputType = isMultiple ? 'checkbox' : 'radio';
          var asterisk = isRequired ? '<span class="text-danger">*</span>' : '';
          
          var optionsHtml = '';
          q.answers.forEach(function(opt, optIdx) {
            var inputId = `q-${poll.id}-${qIdx}-${optIdx}`;
            var inputName = `q-${poll.id}-${qIdx}`;
            // Set the first option of the 3rd question (How old are you?) checked by default matching figure
            var checkedAttr = (poll.id === 98 && qIdx === 2 && optIdx === 0) ? 'checked' : '';
            
            optionsHtml += `
              <div class="form-check mb-1">
                <input class="form-check-input" type="${inputType}" id="${inputId}" name="${inputName}" value="${opt}" ${checkedAttr}>
                <label class="form-check-label text-dark" for="${inputId}">${opt}</label>
              </div>
            `;
          });
          
          var questionHtml = `
            <div class="question-block mb-4" data-required="${isRequired}" data-question-index="${qIdx}">
              <p class="font-weight-bold text-dark mb-2" style="font-size: 1.1rem;">${qIdx + 1}. ${q.text} ${asterisk}</p>
              <div class="options-container pl-2">
                ${optionsHtml}
              </div>
              <div class="invalid-feedback-custom"><i class="fas fa-exclamation-circle mr-1"></i>This question is mandatory. Please select an answer.</div>
            </div>
          `;
          $form.append(questionHtml);
        });
        
        $form.append(`
          <div class="text-center mt-5">
            <button type="submit" class="btn btn-green px-4">Retain</button>
          </div>
        `);
      }

      // Handle Vote Submit
      $('#vote-form').on('submit', function(e) {
        e.preventDefault();
        $('#vote-alert-container').empty();
        $('.question-block').removeClass('is-invalid-group');
        
        var hasErrors = false;
        var errorCount = 0;
        
        $('.question-block').each(function() {
          var $block = $(this);
          var isRequired = $block.data('required') === true;
          
          if (isRequired) {
            var checkedCount = $block.find('input:checked').length;
            if (checkedCount === 0) {
              $block.addClass('is-invalid-group');
              hasErrors = true;
              errorCount++;
            }
          }
        });
        
        if (hasErrors) {
          var errorMsg = `
            <div class="alert alert-danger border mb-4">
              <strong>Validation Failure:</strong> There are mandatory questions that require an answer. Please review the highlighted questions below.
            </div>
          `;
          $('#vote-alert-container').html(errorMsg);
          $([document.documentElement, document.body]).animate({
              scrollTop: $("#vote-alert-container").offset().top - 120
          }, 300);
        } else {
          var successMsg = `
            <div class="alert alert-success border mb-4">
              <strong>Form Completed Successfully!</strong> Thank you for participating in this poll.
            </div>
          `;
          $('#vote-alert-container').html(successMsg);
          $([document.documentElement, document.body]).animate({
              scrollTop: $("#vote-alert-container").offset().top - 120
          }, 300);
          
          // Clear selections (except default check)
          $('#vote-form').find('input').prop('checked', false);
          $('#q-98-2-0').prop('checked', true);
        }
      });

      // ----------------------------------------------------
      // SHARED USER SESSION LOGIC
      // ----------------------------------------------------
      function checkUserSession() {
        var currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
          $('#btn-login-trigger').removeClass('btn-success').addClass('btn-danger').html(`Logout (${currentUser})`).addClass('btn-logout-mode');
        } else {
          $('#btn-login-trigger').removeClass('btn-danger btn-logout-mode').addClass('btn-success').html('Login');
        }
      }

      // Handle Login Form Submission
      $('#login-form').on('submit', function(e) {
        e.preventDefault();
        $('#login-alert-container').empty();
        $('#login-alias-group, #login-password-group').removeClass('is-invalid-group');
        
        var alias = $('#login-alias').val().trim();
        var password = $('#login-password').val().trim();
        var hasErrors = false;
        
        if (alias.length < 3 || alias.length > 255) {
          $('#login-alias-group').addClass('is-invalid-group');
          hasErrors = true;
        }
        
        if (password.length < 6 || password.length > 255) {
          $('#login-password-group').addClass('is-invalid-group');
          hasErrors = true;
        }
        
        if (hasErrors) {
          var errorHtml = `
            <div class="alert alert-danger border py-2 px-3 mb-3" style="font-size: 0.9rem;">
              Please fill in all mandatory fields correctly.
            </div>
          `;
          $('#login-alert-container').html(errorHtml);
        } else {
          localStorage.setItem('currentUser', alias);
          var successHtml = `
            <div class="alert alert-success border py-2 px-3 mb-3" style="font-size: 0.9rem;">
              Successfully logged in!
            </div>
          `;
          $('#login-alert-container').html(successHtml);
          
          setTimeout(function() {
            $('#loginModal').modal('hide');
            $('#login-form')[0].reset();
            $('#login-alert-container').empty();
            checkUserSession();
          }, 1000);
        }
      });

      // Handle Logout action
      $(document).on('click', '.btn-logout-mode', function(e) {
        e.preventDefault();
        localStorage.removeItem('currentUser');
        checkUserSession();
        alert('Logged out successfully.');
      });

      // Real-time Validation Feedback Clearer
      $(document).on('input change', '.form-control, .answer-input, .question-text-input', function() {
        var $input = $(this);
        var val = $input.val().trim();
        var isValid = false;
        
        if ($input.attr('id') === 'poll-name' || $input.hasClass('question-text-input')) {
          isValid = (val.length >= 3 && val.length <= 255);
        } else if ($input.hasClass('answer-input')) {
          isValid = (val.length >= 3 && val.length <= 200);
        } else if ($input.attr('id') === 'login-alias') {
          isValid = (val.length >= 3 && val.length <= 255);
        } else if ($input.attr('id') === 'login-password') {
          isValid = (val.length >= 6 && val.length <= 255);
        }
        
        if (isValid) {
          $input.closest('.form-group, .question-text-group, .answer-group, #login-alias-group, #login-password-group').removeClass('is-invalid-group');
        }
      });

      // Initialize page elements
      renderVotePage(currentActivePollId);
      checkUserSession();
    });
  </script>
</body>
</html>
