<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping List Manager (Pure JS)</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Font Awesome for nice icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Toggle -->
  <div class="nav-toggle">
    <a href="index.html" class="active"><i class="fa-solid fa-code mr-1"></i> Pure JS Version</a>
    <a href="jquery.html"><i class="fa-brands fa-js mr-1"></i> jQuery Version</a>
  </div>

  <div class="container">
    <h1 class="header-title">Shopping List Manager</h1>

    <!-- Validation Error Alert -->
    <div id="error-alert" class="alert-error">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span id="error-msg"></span>
    </div>

    <!-- Inputs Row -->
    <form id="shopping-form" class="input-form" novalidate>
      <div class="input-group">
        <label for="item-name">Item Name</label>
        <input type="text" id="item-name" class="input-control" placeholder="e.g., Apples" required>
      </div>
      
      <div class="input-group">
        <label for="item-cost">Item Cost ($)</label>
        <input type="number" id="item-cost" class="input-control" placeholder="e.g., 2.50" step="0.01" min="0.01" required>
      </div>

      <button type="submit" id="btn-add" class="btn-add">
        Add Item <i class="fa-solid fa-plus"></i>
      </button>
    </form>

    <!-- Table Section -->
    <div class="table-wrapper">
      <table class="shopping-table" id="items-table">
        <thead>
          <tr>
            <th style="width: 50%;">Item Name</th>
            <th class="text-center" style="width: 25%;">Cost ($)</th>
            <th class="text-center" style="width: 25%;">Action</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Initial rows matching the screenshot will be dynamically inserted here -->
        </tbody>
      </table>
    </div>

    <!-- Grand Total -->
    <div class="total-panel">
      <span class="total-title">Grand Total:</span>
      <span id="grand-total" class="total-amount">$0.00</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
