<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – CMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <h5>Register</h5>

        <form id="registerForm" novalidate>
            <!-- Username -->
            <div>
                <input type="text" id="username" class="form-control"
                       placeholder="User name" maxlength="30">
                <div class="invalid-feedback"></div>
            </div>

            <!-- Email -->
            <div>
                <input type="email" id="email" class="form-control"
                       placeholder="E-mail" maxlength="50">
                <div class="invalid-feedback"></div>
            </div>

            <!-- Password -->
            <div>
                <input type="password" id="password" class="form-control"
                       placeholder="Password" maxlength="30">
                <div class="invalid-feedback"></div>
            </div>

            <!-- Re Password -->
            <div>
                <input type="password" id="rePassword" class="form-control"
                       placeholder="Re Password" maxlength="30">
                <div class="invalid-feedback"></div>
            </div>

            <button type="submit" class="btn btn-primary mt-1">Register</button>
        </form>

        <a class="link-below" href="login.html">Click here to Login</a>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="js/validate.js"></script>
<script>
    const REGISTER_RULES = {
        username:   { required: true, minLength: 3, maxLength: 30 },
        email:      { required: true, minLength: 5, email: true },
        password:   { required: true, minLength: 8, maxLength: 30 },
        rePassword: { required: true, minLength: 8, maxLength: 30, match: 'password' }
    };

    Validator.attachLive(REGISTER_RULES);

    $('#registerForm').on('submit', function (e) {
        e.preventDefault();
        const ok = Validator.validateForm(REGISTER_RULES);
        if (ok) {
            alert('Registration successful! Please login.');
            window.location.href = 'login.html';
        }
    });
</script>
</body>
</html>
