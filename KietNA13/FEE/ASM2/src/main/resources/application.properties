# Server Configuration
server.port=8080

# ── Storage Configuration ──────────────────────────────────────────────────────
storage.upload-dir=./uploads

# Whitelist of allowed file extensions (comma-separated, no dots, case-insensitive).
# Any file whose extension is NOT in this list will be rejected.
storage.allowed-extensions=pdf,doc,docx,xls,xlsx,ppt,pptx,txt,zip,rar,png,jpg,jpeg,gif,mp4,csv

# ── Multipart Upload Limits ────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Field Length Constraints (used by UploadValidator) ────────────────────────
validation.title.min-length=3
validation.title.max-length=200
validation.description.min-length=10
validation.description.max-length=1000

# ── Thymeleaf ──────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.lms=DEBUG
