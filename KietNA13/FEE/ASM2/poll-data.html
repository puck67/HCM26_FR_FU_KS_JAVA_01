<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Poll Data</title>
</head>
<body>
  <div id="poll-container" data-poll-id="1" data-poll-name="Great poll">
    <div class="poll-question" data-question-id="1" data-mandatory="true" data-multiple="false">
      <span class="question-text">it is necessary to you?</span>
      <div class="poll-answer" data-answer-id="1">Yes</div>
      <div class="poll-answer" data-answer-id="2">No</div>
    </div>
    <div class="poll-question" data-question-id="2" data-mandatory="false" data-multiple="false">
      <span class="question-text">Often pass polls?</span>
      <div class="poll-answer" data-answer-id="1">Once a month</div>
      <div class="poll-answer" data-answer-id="2">Once a week</div>
    </div>
    <div class="poll-question" data-question-id="3" data-mandatory="false" data-multiple="true">
      <span class="question-text">How old are you?</span>
      <div class="poll-answer" data-answer-id="1">18-20</div>
      <div class="poll-answer" data-answer-id="2">21-23</div>
    </div>
  </div>
</body>
</html>
