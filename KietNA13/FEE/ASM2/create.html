<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Polls – Create a new interview poll with custom questions and answers.">
  <title>Polls – Create Interview</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .modal { display: none !important; }
    .modal.show { display: block !important; }
  </style>
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand navbar-dark" role="navigation" aria-label="Main navigation">
    <a class="navbar-brand" href="index.html">Polls</a>
    <div class="navbar-collapse" id="mainNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="index.html" id="nav-vote">Vote</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="create.html" id="nav-create">Create</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="list.html" id="nav-list">List</a>
        </li>
      </ul>
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <button class="btn nav-link border-0 bg-transparent" id="btn-login-nav"
            style="color:#aaa!important;" type="button">Login</button>
        </li>
        <li class="nav-item" style="display:none;">
          <button class="btn nav-link border-0 bg-transparent" id="btn-logout-nav"
            style="color:#aaa!important;" type="button"></button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="container">
    <div class="page-card">
      <h1 style="font-size:1.6rem;font-weight:700;margin-bottom:1.25rem;">Create Interview</h1>

      <!-- Validation summary (BEFORE all fields — per spec) -->
      <div id="create-validation-summary" class="validation-summary" role="alert" aria-live="assertive"></div>
      <!-- Success banner -->
      <div id="create-success-banner" class="success-banner" role="status" aria-live="polite"></div>

      <form id="create-form" novalidate>
        <!-- Poll Name -->
        <div class="form-group">
          <label for="input-poll-name" class="sr-only">Name poll</label>
          <input type="text" id="input-poll-name" class="form-control"
            placeholder="Name poll" maxlength="255" autocomplete="off">
        </div>

        <!-- Questions will be appended here by create.js -->
        <div id="questions-wrap"></div>

        <!-- Add question button -->
        <div class="mt-2 mb-3">
          <button type="button" id="btn-add-question" class="btn btn-success btn-sm">
            + Add question
          </button>
        </div>

        <!-- Retain -->
        <div>
          <button type="submit" id="btn-create-retain" class="btn btn-success px-4">Retain</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== LOGIN MODAL ===== -->
  <div class="modal fade" id="loginModal" tabindex="-1" role="dialog"
    aria-labelledby="loginModalLabel" aria-modal="true">
    <div class="modal-dialog modal-sm" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="loginModalLabel">Sign In</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div id="login-error" class="invalid-feedback mb-2" style="display:none;font-size:0.82rem;"></div>
          <div class="form-group">
            <label for="login-alias"><strong>Alias:</strong></label>
            <input type="text" id="login-alias" class="form-control form-control-sm"
              placeholder="JoeSixpack" maxlength="100" autocomplete="username">
          </div>
          <div class="form-group">
            <label for="login-password"><strong>Password:</strong></label>
            <input type="password" id="login-password" class="form-control form-control-sm"
              placeholder="••••••••" maxlength="100" autocomplete="current-password">
          </div>
          <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" id="login-remember">
            <label class="form-check-label" for="login-remember" style="cursor:pointer;">Remember me</label>
          </div>
          <button type="button" id="btn-sign-in" class="btn btn-success">Sign In</button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-close-modal" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
  <script src="app.js"></script>
  <script src="create.js"></script>
</body>
</html>
