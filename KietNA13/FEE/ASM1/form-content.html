<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Content - CMS</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="styles.css">
    <script>
        (function() {
            var currentUser = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
            if (!currentUser) {
                window.location.href = 'login.html';
            }
        })();
    </script>
</head>
<body>

    <!-- ════════ NAVBAR ════════ -->
    <nav class="navbar">
        <span class="navbar-brand">CMS</span>
        <div class="ml-auto">
            <div class="dropdown">
                <button class="btn btn-sm dropdown-toggle"
                        type="button"
                        id="userDropdown"
                        data-toggle="dropdown"
                        aria-haspopup="true"
                        aria-expanded="false"
                        style="font-size:13px; padding:3px 10px;">
                    <i class="fa fa-user"></i>
                </button>
                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
                    <a class="dropdown-item" href="edit-profile.html" id="menuUserProfile">
                        <i class="fa fa-user mr-1"></i> User Profile
                    </a>
                    <a class="dropdown-item" href="login.html" id="menuLogout">
                        <i class="fa fa-sign-out mr-1"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ════════ APP LAYOUT ════════ -->
    <div class="app-layout">

        <!-- ── SIDEBAR ── -->
        <div class="sidebar-wrapper">
            <div class="sidebar-search-group">
                <input type="text" class="form-control" id="sidebarSearch" placeholder="Search...">
                <button class="btn btn-search" type="button" id="btnSearch">
                    <i class="fa fa-search"></i>
                </button>
            </div>
            <nav class="sidebar-nav">
                <a href="view-contents.html" id="linkViewContents" class="sidebar-link">
                    <i class="fa fa-th-list nav-icon text-primary"></i> View contents
                </a>
                <a href="form-content.html" id="linkFormContent" class="sidebar-link">
                    <i class="fa fa-pencil-square-o nav-icon text-primary"></i> Form content
                </a>
            </nav>
        </div>

        <!-- ── MAIN CONTENT ── -->
        <div class="main-content" id="mainContent">
            <h2 class="page-heading">Add Content</h2>

            <div class="form-panel">
                <div class="form-panel-header">Content Form Elements</div>
                <div class="form-panel-body">

                    <!-- AJAX Alert -->
                    <div class="ajax-alert alert-success-custom" id="ajaxSuccess">
                        <i class="fa fa-check-circle mr-1"></i> Content added successfully!
                    </div>
                    <div class="ajax-alert alert-error-custom" id="ajaxError">
                        <i class="fa fa-exclamation-circle mr-1"></i> An error occurred. Please try again.
                    </div>

                    <form id="contentForm" action="#" method="post" novalidate>

                        <!-- Title -->
                        <div class="form-group">
                            <label class="form-label-custom" for="title">Title</label>
                            <input type="text"
                                   class="form-control"
                                   id="title"
                                   name="title"
                                   placeholder="Enter the title"
                                   maxlength="200">
                            <div class="char-counter" id="titleCounter">0 / 200</div>
                            <div class="invalid-feedback" id="titleError"></div>
                        </div>

                        <!-- Brief -->
                        <div class="form-group">
                            <label class="form-label-custom" for="brief">Brief</label>
                            <textarea class="form-control"
                                      id="brief"
                                      name="brief"
                                      rows="4"
                                      maxlength="150"></textarea>
                            <div class="char-counter" id="briefCounter">0 / 150</div>
                            <div class="invalid-feedback" id="briefError"></div>
                        </div>

                        <!-- Content -->
                        <div class="form-group">
                            <label class="form-label-custom" for="content">Content</label>
                            <textarea class="form-control"
                                      id="content"
                                      name="content"
                                      rows="6"
                                      maxlength="1000"></textarea>
                            <div class="char-counter" id="contentCounter">0 / 1000</div>
                            <div class="invalid-feedback" id="contentError"></div>
                        </div>

                        <!-- Buttons -->
                        <div class="form-group mb-0">
                            <button type="submit" class="btn btn-sm mr-1" id="btnSubmitContent">Submit Button</button>
                            <button type="reset"  class="btn btn-sm"      id="btnResetContent">Reset Button</button>
                        </div>

                    </form>
                </div>
            </div>
        </div><!-- /main-content -->

    </div><!-- /app-layout -->

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
    $(document).ready(() => {
        // Retrieve current active user session
        const userString = localStorage.getItem('currentUser') ?? sessionStorage.getItem('currentUser');
        const currentUser = JSON.parse(userString ?? '{}');

        // Sync username in navbar dropdown
        if (currentUser.username) {
            $('#userDropdown').html(`<i class="fa fa-user mr-1"></i> ${currentUser.username}`);
        }

        // Handle Logout button
        $('#menuLogout').on('click', e => {
            e.preventDefault();
            localStorage.removeItem('currentUser');
            sessionStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });

        /* ════════════════════════════════════════════
           AJAX SIDEBAR LOADING (5-second loading screen)
           ════════════════════════════════════════════ */
        $('.sidebar-link').on('click', function (e) {
            e.preventDefault();
            const targetUrl = $(this).attr('href');

            $('#mainContent').html(`
                <div class="loading-screen">
                   <h3>Loading</h3>
                   <div class="loading-dots">
                       <span></span><span></span><span></span>
                   </div>
                </div>
            `);

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 500);
        });

        /* ════════════════════════════════════════════
           CHARACTER COUNTERS
           ════════════════════════════════════════════ */
        $('#title').on('input', function () {
            const len = $(this).val().length;
            $('#titleCounter').text(`${len} / 200`).toggleClass('over-limit', len > 200);
            clearError($(this), 'titleError');
        });

        $('#brief').on('input', function () {
            const len = $(this).val().length;
            $('#briefCounter').text(`${len} / 150`).toggleClass('over-limit', len > 150);
            clearError($(this), 'briefError');
        });

        $('#content').on('input', function () {
            const len = $(this).val().length;
            $('#contentCounter').text(`${len} / 1000`).toggleClass('over-limit', len > 1000);
            clearError($(this), 'contentError');
        });

        /* ════════════════════════════════════════════
           VALIDATION HELPERS
           ════════════════════════════════════════════ */
        const setError = ($input, errorDivId, message) => {
            $input.addClass('is-invalid').removeClass('is-valid');
            $(`#${errorDivId}`).text(message).show();
        };

        const clearError = ($input, errorDivId) => {
            $input.removeClass('is-invalid is-valid');
            $(`#${errorDivId}`).text('').hide();
        };

        const setValid = $input => {
            $input.removeClass('is-invalid').addClass('is-valid');
        };

        /* ── Reset button ── */
        $('#btnResetContent').on('click', () => {
            $('.form-control').removeClass('is-invalid is-valid');
            $('.invalid-feedback').text('').hide();
            $('#ajaxSuccess, #ajaxError').hide();
            $('#titleCounter').text('0 / 200').removeClass('over-limit');
            $('#briefCounter').text('0 / 150').removeClass('over-limit');
            $('#contentCounter').text('0 / 1000').removeClass('over-limit');
        });

        /* ════════════════════════════════════════════
           FORM SUBMIT VALIDATION
           ════════════════════════════════════════════ */
        $('#contentForm').on('submit', e => {
            e.preventDefault();
            $('#ajaxSuccess, #ajaxError').hide();

            let valid = true;
            const titleVal   = $('#title').val().trim();
            const briefVal   = $('#brief').val().trim();
            const contentVal = $('#content').val().trim();

            /* --- Title: required, min 10, max 200 --- */
            if (titleVal === '') {
                setError($('#title'), 'titleError', 'Title is required.');
                valid = false;
            } else if (titleVal.length < 10) {
                setError($('#title'), 'titleError', 'Title must be at least 10 characters.');
                valid = false;
            } else if (titleVal.length > 200) {
                setError($('#title'), 'titleError', 'Title must not exceed 200 characters.');
                valid = false;
            } else {
                setValid($('#title'));
            }

            /* --- Brief: required, min 30, max 150 --- */
            if (briefVal === '') {
                setError($('#brief'), 'briefError', 'Brief is required.');
                valid = false;
            } else if (briefVal.length < 30) {
                setError($('#brief'), 'briefError', 'Brief must be at least 30 characters.');
                valid = false;
            } else if (briefVal.length > 150) {
                setError($('#brief'), 'briefError', 'Brief must not exceed 150 characters.');
                valid = false;
            } else {
                setValid($('#brief'));
            }

            /* --- Content: required, min 50, max 1000 --- */
            if (contentVal === '') {
                setError($('#content'), 'contentError', 'Content is required.');
                valid = false;
            } else if (contentVal.length < 50) {
                setError($('#content'), 'contentError', 'Content must be at least 50 characters.');
                valid = false;
            } else if (contentVal.length > 1000) {
                setError($('#content'), 'contentError', 'Content must not exceed 1000 characters.');
                valid = false;
            } else {
                setValid($('#content'));
            }

            /* --- If all valid: simulate AJAX submit --- */
            if (valid) {
                const $btn = $('#btnSubmitContent');
                $btn.prop('disabled', true).text('Saving...');

                setTimeout(() => {
                    const contents = JSON.parse(localStorage.getItem('contents') ?? '[]');
                    let nextId = 1;
                    if (contents.length > 0) {
                        nextId = Math.max(...contents.map(c => c.id)) + 1;
                    }

                    // Format date: DD/MM/YYYY<br>HH:MM
                    const now = new Date();
                    const day = String(now.getDate()).padStart(2, '0');
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const year = now.getFullYear();
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    const formattedDate = `${day}/${month}/${year}<br>${hours}:${minutes}`;

                    const newContent = {
                        id: nextId,
                        title: titleVal,
                        brief: briefVal,
                        content: contentVal,
                        date: formattedDate
                    };

                    contents.push(newContent);
                    localStorage.setItem('contents', JSON.stringify(contents));

                    // Reset form and counters
                    $('#title').val('');
                    $('#brief').val('');
                    $('#content').val('');
                    $('.form-control').removeClass('is-valid is-invalid');
                    $('#titleCounter').text('0 / 200').removeClass('over-limit');
                    $('#briefCounter').text('0 / 150').removeClass('over-limit');
                    $('#contentCounter').text('0 / 1000').removeClass('over-limit');

                    $btn.prop('disabled', false).text('Submit Button');
                    $('#ajaxSuccess').fadeIn(300);
                    setTimeout(() => { $('#ajaxSuccess').fadeOut(300); }, 3000);
                }, 50);
            }
        });
    });
    </script>
</body>
</html>
