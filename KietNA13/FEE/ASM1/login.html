<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CMS</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="styles.css">
    <script>
        (function() {
            var currentUser = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
            if (currentUser) {
                window.location.href = 'view-contents.html';
            }
        })();
    </script>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <h5>Please Sign In</h5>

            <!-- Ajax Alert -->
            <div class="ajax-alert alert-error-custom" id="loginAlert"></div>

            <form id="loginForm" action="#" method="post" novalidate>
                <!-- Email -->
                <div class="form-group">
                    <input type="text"
                           class="form-control"
                           id="email"
                           name="email"
                           placeholder="E-mail"
                           maxlength="50">
                    <div class="invalid-feedback" id="emailError"></div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           placeholder="Password"
                           maxlength="30">
                    <div class="invalid-feedback" id="passwordError"></div>
                </div>

                <!-- Remember Me -->
                <div class="form-group form-check" style="margin-bottom:12px;">
                    <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                    <label class="form-check-label" for="rememberMe" style="font-size:13px;">Remember Me</label>
                </div>

                <!-- Submit -->
                <div class="form-group">
                    <button type="submit" class="btn btn-block" id="btnLogin">Login</button>
                </div>

                <div>
                    <a href="register.html" id="linkRegister">Click here to Register</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
    $(document).ready(() => {
        // Seed default user if no users exist
        const defaultUsers = [
            {
                username: 'Default User',
                email: 'your_email@example.com',
                password: 'your_password',
                firstName: 'John',
                lastName: 'Doe',
                phone: '0987654321',
                description: 'Hello, this is a default profile description.'
            }
        ];
        if (!localStorage.getItem('users')) {
            localStorage.setItem('users', JSON.stringify(defaultUsers));
        }

        // Auto-fill email if Remember Me was previously checked
        const rememberedEmail = localStorage.getItem('rememberedEmail');
        if (rememberedEmail) {
            $('#email').val(rememberedEmail);
            $('#rememberMe').prop('checked', true);
        }

        /* ── Helper: show / clear field error ── */
        const setError = ($input, errorDivId, message) => {
            $input.addClass('is-invalid').removeClass('is-valid');
            $(`#${errorDivId}`).text(message).show();
        };

        const clearError = ($input, errorDivId) => {
            $input.removeClass('is-invalid is-valid');
            $(`#${errorDivId}`).text('').hide();
        };

        const setValid = $input => {
            $input.removeClass('is-invalid').addClass('is-valid');
        };

        const isValidEmail = email => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

        /* ── Clear error on user input ── */
        $('#email').on('input', function () { clearError($(this), 'emailError'); });
        $('#password').on('input', function () { clearError($(this), 'passwordError'); });

        /* ── Form Submit Validation ── */
        $('#loginForm').on('submit', e => {
            e.preventDefault();
            $('#loginAlert').hide().text('');

            let valid = true;
            const emailVal    = $('#email').val().trim();
            const passwordVal = $('#password').val();

            /* --- Validate Email --- */
            if (emailVal === '') {
                setError($('#email'), 'emailError', 'Email is required.');
                valid = false;
            } else if (emailVal.length < 5) {
                setError($('#email'), 'emailError', 'Email must be at least 5 characters.');
                valid = false;
            } else if (emailVal.length > 50) {
                setError($('#email'), 'emailError', 'Email must not exceed 50 characters.');
                valid = false;
            } else if (!isValidEmail(emailVal)) {
                setError($('#email'), 'emailError', 'Please enter a valid email address (e.g. name@example.com).');
                valid = false;
            } else {
                setValid($('#email'));
            }

            /* --- Validate Password --- */
            if (passwordVal === '') {
                setError($('#password'), 'passwordError', 'Password is required.');
                valid = false;
            } else if (passwordVal.length < 8) {
                setError($('#password'), 'passwordError', 'Password must be at least 8 characters.');
                valid = false;
            } else if (passwordVal.length > 30) {
                setError($('#password'), 'passwordError', 'Password must not exceed 30 characters.');
                valid = false;
            } else {
                setValid($('#password'));
            }

            /* --- If all valid: navigate --- */
            if (valid) {
                const users = JSON.parse(localStorage.getItem('users') ?? '[]');
                const user = users.find(u => u.email?.toLowerCase() === emailVal.toLowerCase() && u.password === passwordVal);

                if (user) {
                    const remember = $('#rememberMe').is(':checked');
                    if (remember) {
                        localStorage.setItem('rememberedEmail', emailVal);
                        localStorage.setItem('currentUser', JSON.stringify(user));
                    } else {
                        localStorage.removeItem('rememberedEmail');
                        sessionStorage.setItem('currentUser', JSON.stringify(user));
                    }
                    window.location.href = 'view-contents.html';
                } else {
                    $('#loginAlert').text('Email or password is incorrect. Please try again.').show();
                }
            }
        });
    });
    </script>
</body>
</html>
