<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CMS</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="styles.css">
    <script>
        (function() {
            var currentUser = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
            if (!currentUser) {
                window.location.href = 'login.html';
            }
        })();
    </script>
</head>
<body>

    <!-- ════════ NAVBAR ════════ -->
    <nav class="navbar">
        <span class="navbar-brand">CMS</span>
        <div class="ml-auto">
            <div class="dropdown">
                <button class="btn btn-sm dropdown-toggle"
                        type="button"
                        id="userDropdown"
                        data-toggle="dropdown"
                        aria-haspopup="true"
                        aria-expanded="false"
                        style="font-size:13px; padding:3px 10px;">
                    <i class="fa fa-user"></i>
                </button>
                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
                    <a class="dropdown-item" href="edit-profile.html" id="menuUserProfile">
                        <i class="fa fa-user mr-1"></i> User Profile
                    </a>
                    <a class="dropdown-item" href="login.html" id="menuLogout">
                        <i class="fa fa-sign-out mr-1"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ════════ APP LAYOUT ════════ -->
    <div class="app-layout">

        <!-- ── SIDEBAR ── -->
        <div class="sidebar-wrapper">
            <div class="sidebar-search-group">
                <input type="text" class="form-control" id="sidebarSearch" placeholder="Search...">
                <button class="btn btn-search" type="button" id="btnSearch">
                    <i class="fa fa-search"></i>
                </button>
            </div>
            <nav class="sidebar-nav">
                <a href="view-contents.html" id="linkViewContents" class="sidebar-link">
                    <i class="fa fa-th-list nav-icon text-primary"></i> View contents
                </a>
                <a href="form-content.html" id="linkFormContent" class="sidebar-link">
                    <i class="fa fa-pencil-square-o nav-icon text-primary"></i> Form content
                </a>
            </nav>
        </div>

        <!-- ── MAIN CONTENT ── -->
        <div class="main-content" id="mainContent">
            <h2 class="page-heading">Edit Profile</h2>

            <div class="form-panel">
                <div class="form-panel-header">Profile Form Elements</div>
                <div class="form-panel-body">

                    <!-- AJAX Alert -->
                    <div class="ajax-alert alert-success-custom" id="ajaxSuccess">
                        <i class="fa fa-check-circle mr-1"></i> Profile updated successfully!
                    </div>
                    <div class="ajax-alert alert-error-custom" id="ajaxError">
                        <i class="fa fa-exclamation-circle mr-1"></i> An error occurred. Please try again.
                    </div>

                    <form id="editProfileForm" action="#" method="post" novalidate>

                        <!-- First Name -->
                        <div class="form-group">
                            <label class="form-label-custom" for="firstName">First Name</label>
                            <input type="text"
                                   class="form-control"
                                   id="firstName"
                                   name="firstName"
                                   placeholder="Enter the first name"
                                   maxlength="30">
                            <div class="invalid-feedback" id="firstNameError"></div>
                        </div>

                        <!-- Last Name -->
                        <div class="form-group">
                            <label class="form-label-custom" for="lastName">Last Name</label>
                            <input type="text"
                                   class="form-control"
                                   id="lastName"
                                   name="lastName"
                                   placeholder="Enter the last name"
                                   maxlength="30">
                            <div class="invalid-feedback" id="lastNameError"></div>
                        </div>

                        <!-- Email (static – not validated) -->
                        <div class="form-group">
                            <label class="form-label-custom">Email</label>
                            <div class="email-static" id="userEmailStatic">your_email@example.com</div>
                        </div>

                        <!-- Phone -->
                        <div class="form-group">
                            <label class="form-label-custom" for="phone">Phone</label>
                            <input type="text"
                                   class="form-control"
                                   id="phone"
                                   name="phone"
                                   placeholder="Enter your phone number"
                                   maxlength="13">
                            <div class="invalid-feedback" id="phoneError"></div>
                        </div>

                        <!-- Description -->
                        <div class="form-group">
                            <label class="form-label-custom" for="description">Description</label>
                            <textarea class="form-control"
                                      id="description"
                                      name="description"
                                      rows="4"
                                      maxlength="200"></textarea>
                            <div class="char-counter" id="descCounter">0 / 200</div>
                            <div class="invalid-feedback" id="descriptionError"></div>
                        </div>

                        <!-- Buttons -->
                        <div class="form-group mb-0">
                            <button type="submit" class="btn btn-sm mr-1" id="btnSubmitProfile">Submit Button</button>
                            <button type="reset"  class="btn btn-sm"      id="btnResetProfile">Reset Button</button>
                        </div>

                    </form>
                </div>
            </div>
        </div><!-- /main-content -->

    </div><!-- /app-layout -->

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
    $(document).ready(() => {
        // Retrieve current active user session
        const userString = localStorage.getItem('currentUser') ?? sessionStorage.getItem('currentUser');
        const currentUser = JSON.parse(userString ?? '{}');

        // Populate fields with logged-in user data
        $('#firstName').val(currentUser.firstName ?? '');
        $('#lastName').val(currentUser.lastName ?? '');
        $('#phone').val(currentUser.phone ?? '');
        $('#description').val(currentUser.description ?? '');
        $('#userEmailStatic').text(currentUser.email ?? '');

        // Update counter initially
        const initialDescLen = $('#description').val().length;
        $('#descCounter').text(`${initialDescLen} / 200`);

        // Sync username in navbar dropdown
        if (currentUser.username) {
            $('#userDropdown').html(`<i class="fa fa-user mr-1"></i> ${currentUser.username}`);
        }

        // Handle Logout button
        $('#menuLogout').on('click', e => {
            e.preventDefault();
            localStorage.removeItem('currentUser');
            sessionStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });

        /* ════════════════════════════════════════════
           AJAX SIDEBAR LOADING (5-second loading screen)
           ════════════════════════════════════════════ */
        $('.sidebar-link').on('click', function (e) {
            e.preventDefault();
            const targetUrl = $(this).attr('href');

            // Replace main content with loading screen
            $('#mainContent').html(`
                <div class="loading-screen">
                   <h3>Loading</h3>
                   <div class="loading-dots">
                       <span></span><span></span><span></span>
                   </div>
                </div>
            `);

            // Navigate after 0.5 seconds (simulates AJAX call)
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 500);
        });

        /* ════════════════════════════════════════════
           VALIDATION HELPERS
           ════════════════════════════════════════════ */
        const setError = ($input, errorDivId, message) => {
            $input.addClass('is-invalid').removeClass('is-valid');
            $(`#${errorDivId}`).text(message).show();
        };

        const clearError = ($input, errorDivId) => {
            $input.removeClass('is-invalid is-valid');
            $(`#${errorDivId}`).text('').hide();
        };

        const setValid = $input => {
            $input.removeClass('is-invalid').addClass('is-valid');
        };

        const isDigitsOnly = val => /^\d+$/.test(val);

        /* ── Clear errors on input ── */
        $('#firstName').on('input',    function () { clearError($(this), 'firstNameError'); });
        $('#lastName').on('input',     function () { clearError($(this), 'lastNameError'); });
        $('#phone').on('input',        function () { clearError($(this), 'phoneError'); });
        $('#description').on('input',  function () {
            clearError($(this), 'descriptionError');
            const len = $(this).val().length;
            $('#descCounter').text(`${len} / 200`)
                .toggleClass('over-limit', len > 200);
        });

        /* ── Reset button clears validation state ── */
        $('#btnResetProfile').on('click', e => {
            e.preventDefault();
            $('.form-control').removeClass('is-invalid is-valid');
            $('.invalid-feedback').text('').hide();
            $('#ajaxSuccess, #ajaxError').hide();
            // Re-populate with stored data rather than resetting blank
            $('#firstName').val(currentUser.firstName ?? '');
            $('#lastName').val(currentUser.lastName ?? '');
            $('#phone').val(currentUser.phone ?? '');
            $('#description').val(currentUser.description ?? '');
            const descLen = $('#description').val().length;
            $('#descCounter').text(`${descLen} / 200`).removeClass('over-limit');
        });

        /* ════════════════════════════════════════════
           FORM SUBMIT – AJAX SIMULATION
           ════════════════════════════════════════════ */
        $('#editProfileForm').on('submit', e => {
            e.preventDefault();
            $('#ajaxSuccess, #ajaxError').hide();

            let valid = true;
            const firstNameVal  = $('#firstName').val().trim();
            const lastNameVal   = $('#lastName').val().trim();
            const phoneVal      = $('#phone').val().trim();
            const descVal       = $('#description').val().trim();

            /* --- First Name: required, min 3, max 30 --- */
            if (firstNameVal === '') {
                setError($('#firstName'), 'firstNameError', 'First Name is required.');
                valid = false;
            } else if (firstNameVal.length < 3) {
                setError($('#firstName'), 'firstNameError', 'First Name must be at least 3 characters.');
                valid = false;
            } else if (firstNameVal.length > 30) {
                setError($('#firstName'), 'firstNameError', 'First Name must not exceed 30 characters.');
                valid = false;
            } else {
                setValid($('#firstName'));
            }

            /* --- Last Name: required, min 3, max 30 --- */
            if (lastNameVal === '') {
                setError($('#lastName'), 'lastNameError', 'Last Name is required.');
                valid = false;
            } else if (lastNameVal.length < 3) {
                setError($('#lastName'), 'lastNameError', 'Last Name must be at least 3 characters.');
                valid = false;
            } else if (lastNameVal.length > 30) {
                setError($('#lastName'), 'lastNameError', 'Last Name must not exceed 30 characters.');
                valid = false;
            } else {
                setValid($('#lastName'));
            }

            /* --- Phone: required, min 9, max 13, digits only --- */
            if (phoneVal === '') {
                setError($('#phone'), 'phoneError', 'Phone number is required.');
                valid = false;
            } else if (!isDigitsOnly(phoneVal)) {
                setError($('#phone'), 'phoneError', 'Phone number must contain digits only.');
                valid = false;
            } else if (phoneVal.length < 9) {
                setError($('#phone'), 'phoneError', 'Phone number must be at least 9 digits.');
                valid = false;
            } else if (phoneVal.length > 13) {
                setError($('#phone'), 'phoneError', 'Phone number must not exceed 13 digits.');
                valid = false;
            } else {
                setValid($('#phone'));
            }

            /* --- Description: optional, max 200 --- */
            if (descVal.length > 200) {
                setError($('#description'), 'descriptionError', 'Description must not exceed 200 characters.');
                valid = false;
            } else if (descVal !== '') {
                setValid($('#description'));
            }

            /* --- If all valid: simulate AJAX call --- */
            if (valid) {
                const $btn = $('#btnSubmitProfile');
                $btn.prop('disabled', true).text('Saving...');

                // Simulate near-instant AJAX response locally
                setTimeout(() => {
                    // Update user properties
                    currentUser.firstName = firstNameVal;
                    currentUser.lastName = lastNameVal;
                    currentUser.phone = phoneVal;
                    currentUser.description = descVal;

                    // Update session storage
                    if (localStorage.getItem('currentUser')) {
                        localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    } else {
                        sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
                    }

                    // Update users list
                    const users = JSON.parse(localStorage.getItem('users') ?? '[]');
                    const index = users.findIndex(u => u.email && currentUser.email && u.email.toLowerCase() === currentUser.email.toLowerCase());
                    if (index !== -1) {
                        users[index] = currentUser;
                    } else {
                        users.push(currentUser);
                    }
                    localStorage.setItem('users', JSON.stringify(users));

                    $btn.prop('disabled', false).text('Submit Button');
                    $('#ajaxSuccess').fadeIn(300);
                    // Auto-hide success after 3 seconds
                    setTimeout(() => {
                        $('#ajaxSuccess').fadeOut(300);
                    }, 3000);
                }, 50);
            }
        });
    });
    </script>
</body>
</html>
