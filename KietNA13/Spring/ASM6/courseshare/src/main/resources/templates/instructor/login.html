<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Instructor Login')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <div class="card login-wrapper">
            <h2 style="text-align:center; margin-bottom: 2rem;">Instructor Login</h2>
            
            <div th:if="${param.error}" class="badge badge-danger" style="display:block; padding:1rem; margin-bottom:1rem; text-align:center;">
                Invalid username and password.
            </div>
            
            <div th:if="${param.logout}" class="badge badge-success" style="display:block; padding:1rem; margin-bottom:1rem; text-align:center;">
                You have been logged out.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
