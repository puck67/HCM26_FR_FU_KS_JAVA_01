<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Reviews')}"></head>
<body class="d-flex flex-column min-vh-100">

    <header th:replace="~{fragments/layout :: header('reviews')}"></header>

    <main class="main-container flex-grow-1">

        
        <div th:replace="~{fragments/components :: alert-panel}"></div>

        <div th:replace="~{fragments/crud-toolbar :: toolbar(
            'Review Moderation',
            null,
            null,
            null,
            null,
            'fa-solid fa-comments'
        )}"></div>

        
        <section class="mb-5">
            <div class="d-flex align-items-center mb-3 pb-2 border-bottom">
                <span class="badge bg-warning text-dark me-2 px-3 py-2" style="font-size:.85rem;">
                    <i class="fa-solid fa-clock me-1"></i>Pending
                </span>
                <h4 class="mb-0 fw-bold text-dark">Pending Reviews</h4>
                <span class="ms-2 text-muted small"
                      th:text="'(' + ${pendingPage.totalElements} + ' reviews)'"></span>
            </div>

            
            <div th:if="${pendingPage.isEmpty()}" class="alert alert-light border py-4 text-center text-muted">
                <i class="fa-regular fa-face-smile fa-lg me-2"></i>No pending reviews — all caught up!
            </div>

            
            <div th:each="review : ${pendingPage.content}"
                 class="card border-0 shadow-sm mb-3"
                 style="border-left: 4px solid #f59e0b !important; border-radius: var(--radius);">
                <div class="card-body py-3 px-4">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <div class="fw-bold text-dark mb-1">
                                Course:
                                <a th:href="@{/course/{id}(id=${review.course.id})}"
                                   th:text="${review.course.title}"
                                   class="text-decoration-none text-primary">Title</a>
                            </div>
                            <div class="text-muted mb-1" style="font-size:.9rem;">
                                <i class="fa-solid fa-user me-1"></i>
                                <strong>Reviewer:</strong>
                                <span th:text="${review.authorName}">Name</span>
                                <span class="text-muted ms-2" style="font-size:.8rem;"
                                      th:text="'&lt;' + ${review.email} + '&gt;'">&lt;email&gt;</span>
                            </div>
                            
                            <span th:replace="~{fragments/components :: star-rating(rating=${review.rating})}"></span>
                            <p class="text-secondary mt-2 mb-0" th:text="${review.content}">Content</p>
                            <small class="text-muted">
                                <i class="fa-solid fa-calendar-days me-1"></i>
                                <span th:text="${#temporals.format(review.createdDate, 'dd-MM-yyyy HH:mm')}">Date</span>
                            </small>
                        </div>
                        
                        <div class="d-flex gap-2 ms-3 mt-1">
                            <a th:href="@{/instructor/reviews/approve/{id}(id=${review.id})}"
                               class="btn btn-success btn-sm px-3">
                                <i class="fa-solid fa-check me-1"></i>Approve
                            </a>
                            <a th:href="@{/instructor/reviews/delete/{id}(id=${review.id})}"
                               class="btn btn-danger btn-sm px-3"
                               onclick="return confirm('Delete this pending review?')">
                                <i class="fa-solid fa-trash me-1"></i>Delete
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            
            <nav th:if="${pendingPage.totalPages > 1}" aria-label="Pending pagination"
                 class="d-flex justify-content-center mt-3">
                <ul class="pagination pagination-sm">
                    <li class="page-item" th:classappend="${pendingPage.first ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/instructor/reviews(pendingPage=0)}">&laquo;</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, pendingPage.totalPages - 1)}"
                        th:classappend="${i == pendingPage.number ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/instructor/reviews(pendingPage=${i})}"
                           th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${pendingPage.last ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/instructor/reviews(pendingPage=${pendingPage.totalPages - 1})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </section>

        
        <section>
            <div class="d-flex align-items-center mb-3 pb-2 border-bottom">
                <span class="badge bg-success text-white me-2 px-3 py-2" style="font-size:.85rem;">
                    <i class="fa-solid fa-circle-check me-1"></i>Approved
                </span>
                <h4 class="mb-0 fw-bold text-dark">Approved Reviews</h4>
                <span class="ms-2 text-muted small"
                      th:text="'(' + ${approvedPage.totalElements} + ' reviews)'"></span>
            </div>

            
            <div th:if="${approvedPage.isEmpty()}" class="alert alert-light border py-4 text-center text-muted">
                <i class="fa-solid fa-comment-slash fa-lg me-2"></i>No approved reviews yet.
            </div>

            
            <div th:each="review : ${approvedPage.content}"
                 class="card border-0 shadow-sm mb-3"
                 style="border-left: 4px solid #10b981 !important; border-radius: var(--radius);">
                <div class="card-body py-3 px-4">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <div class="fw-bold text-dark mb-1">
                                Course:
                                <a th:href="@{/course/{id}(id=${review.course.id})}"
                                   th:text="${review.course.title}"
                                   class="text-decoration-none text-primary">Title</a>
                            </div>
                            <div class="text-muted mb-1" style="font-size:.9rem;">
                                <i class="fa-solid fa-user me-1"></i>
                                <strong>Reviewer:</strong>
                                <span th:text="${review.authorName}">Name</span>
                                <span class="text-muted ms-2" style="font-size:.8rem;"
                                      th:text="'&lt;' + ${review.email} + '&gt;'">&lt;email&gt;</span>
                            </div>
                            
                            <span th:replace="~{fragments/components :: star-rating(rating=${review.rating})}"></span>
                            <p class="text-secondary mt-2 mb-0" th:text="${review.content}">Content</p>
                            <small class="text-muted">
                                <i class="fa-solid fa-calendar-days me-1"></i>
                                <span th:text="${#temporals.format(review.createdDate, 'dd-MM-yyyy HH:mm')}">Date</span>
                            </small>
                        </div>
                        
                        <div class="ms-3 mt-1">
                            <a th:href="@{/instructor/reviews/delete/{id}(id=${review.id})}"
                               class="btn btn-danger btn-sm px-3"
                               onclick="return confirm('Delete this approved review?')">
                                <i class="fa-solid fa-trash me-1"></i>Delete
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            
            <nav th:if="${approvedPage.totalPages > 1}" aria-label="Approved pagination"
                 class="d-flex justify-content-center mt-3">
                <ul class="pagination pagination-sm">
                    <li class="page-item" th:classappend="${approvedPage.first ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/instructor/reviews(approvedPage=0)}">&laquo;</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, approvedPage.totalPages - 1)}"
                        th:classappend="${i == approvedPage.number ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/instructor/reviews(approvedPage=${i})}"
                           th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${approvedPage.last ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/instructor/reviews(approvedPage=${approvedPage.totalPages - 1})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </section>

    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
