<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="toolbar(title, createUrl, exportUrl, importUrl, createLabel, icon)">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark mb-0">
            <i th:class="${icon != null ? icon : 'fa-solid fa-list'} + ' text-primary me-2'"></i>
            <span th:text="${title}">Title</span>
        </h2>
        <div class="d-flex gap-2">
            <a th:if="${createUrl != null}" th:href="${createUrl}" class="btn btn-primary-custom">
                <i class="fa-solid fa-plus me-1"></i>
                <span th:text="${createLabel != null ? createLabel : 'Add New'}">Create</span>
            </a>
        </div>
    </div>
</th:block>
</body>
</html>
