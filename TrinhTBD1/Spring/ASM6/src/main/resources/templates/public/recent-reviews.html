<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Recent Reviews')}"></head>
<body class="d-flex flex-column min-vh-100">

    <header th:replace="~{fragments/layout :: header('reviews')}"></header>

    <main class="main-container flex-grow-1" style="max-width:800px;">
        <h2 class="mb-4 fw-bold">
            <i class="fa-solid fa-comments text-primary me-2"></i>Most Recent Reviews
        </h2>

        <div th:if="${reviewPage.isEmpty()}">
            <div th:replace="~{fragments/components :: empty-state(message='No reviews found.')}"></div>
        </div>

        <div th:each="review : ${reviewPage.content}" class="custom-card mb-3">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                    <h5 class="mb-1 text-primary fw-bold">
                        <a th:href="@{/course/{id}(id=${review.course.id})}" th:text="${review.course.title}">Course</a>
                    </h5>
                    <span class="review-author" th:text="${review.authorName}">Author</span>
                </div>
                
                <span th:replace="~{fragments/components :: star-rating(rating=${review.rating})}"></span>
            </div>
            <div class="review-date mb-2" style="font-size:.8rem;color:var(--text-muted);">
                <i class="fa-solid fa-calendar-days me-1"></i>
                <span th:text="${#temporals.format(review.createdDate, 'dd-MM-yyyy HH:mm')}">Date</span>
            </div>
            <p class="mb-0 text-secondary" th:text="${review.content}">Content</p>
        </div>

        
        <nav th:replace="~{fragments/components :: pagination(page=${reviewPage}, url='/reviews/recent')}"></nav>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
