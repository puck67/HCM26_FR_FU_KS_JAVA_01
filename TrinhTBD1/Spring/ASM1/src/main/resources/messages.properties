# Custom validation messages for Course
NotEmpty.course.title=Course title must not be empty.
Size.course.title=Course title must have at least 5 characters.

NotEmpty.course.instructorName=Instructor name must not be empty.
Size.course.instructorName=Instructor name must have at least 2 characters.

NotEmpty.course.instructorEmail=Instructor email must not be empty.
Email.course.instructorEmail=Instructor email must be a valid email address.

NotEmpty.course.description=Description must not be empty.
Size.course.description=Description must be between 10 and 200 characters long.

NotNull.course.durationHours=Duration must not be null.
Min.course.durationHours=Duration must be at least 1 hour.

# Type mismatch custom messages for invalid data types
typeMismatch.course.durationHours=Duration must be a valid integer.
typeMismatch.durationHours=Duration must be a valid integer.
typeMismatch.java.lang.Integer=Value must be a valid integer.
