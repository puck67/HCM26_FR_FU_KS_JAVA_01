<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Dynamic Menu System'">Dynamic Menu System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <aside th:fragment="sidebar" class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-cpu-fill"></i>
            <span>EduPortal OS</span>
        </div>
        
        <ul class="nav-menu">
            <li th:each="menu1 : ${sidebarMenus}" class="nav-item" th:classappend="${menu1.children != null && !menu1.children.isEmpty() ? 'has-children' : ''}">
                <a th:href="${menu1.url != null && !menu1.url.trim().isEmpty() ? menu1.url : '#'}" class="nav-link">
                    <i th:class="${menu1.icon != null && !menu1.icon.isEmpty() ? 'bi ' + menu1.icon : 'bi bi-circle-fill'}"></i>
                    <span th:text="${menu1.name}">Level 1 Menu</span>
                    <i th:if="${menu1.children != null && !menu1.children.isEmpty()}" class="bi bi-chevron-down arrow"></i>
                </a>
                
                <ul th:if="${menu1.children != null && !menu1.children.isEmpty()}" class="sub-menu">
                    <li th:each="menu2 : ${menu1.children}" class="nav-item" th:classappend="${menu2.children != null && !menu2.children.isEmpty() ? 'has-children' : ''}">
                        <a th:href="${menu2.url != null && !menu2.url.trim().isEmpty() ? menu2.url : '#'}" class="nav-link">
                            <i th:class="${menu2.icon != null && !menu2.icon.isEmpty() ? 'bi ' + menu2.icon : 'bi bi-circle'}"></i>
                            <span th:text="${menu2.name}">Level 2 Menu</span>
                            <i th:if="${menu2.children != null && !menu2.children.isEmpty()}" class="bi bi-chevron-down arrow"></i>
                        </a>
                        
                        <ul th:if="${menu2.children != null && !menu2.children.isEmpty()}" class="sub-sub-menu">
                            <li th:each="menu3 : ${menu2.children}" class="nav-item">
                                <a th:href="${menu3.url != null && !menu3.url.trim().isEmpty() ? menu3.url : '#'}" class="nav-link">
                                    <i th:class="${menu3.icon != null && !menu3.icon.isEmpty() ? 'bi ' + menu3.icon : 'bi bi-dash'}"></i>
                                    <span th:text="${menu3.name}">Level 3 Menu</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </li>
        </ul>
    </aside>

    <header th:fragment="topbar(pageTitle)" class="topbar">
        <div class="topbar-title" th:text="${pageTitle}">Page Title</div>
        
        <div class="topbar-actions">
            <div class="role-selector">
                <label for="roleSelect"><i class="bi bi-person-lock me-1"></i> Current Role:</label>
                <select id="roleSelect" onchange="location.href='/switch-role?role=' + this.value">
                    <option value="ADMIN" th:selected="${currentRole == 'ADMIN'}">Administrator</option>
                    <option value="TEACHER" th:selected="${currentRole == 'TEACHER'}">Teacher / Instructor</option>
                    <option value="STUDENT" th:selected="${currentRole == 'STUDENT'}">Student</option>
                </select>
            </div>
            
            <a href="/menus" class="btn-premium">
                <i class="bi bi-sliders2-vertical"></i> Manage Menus
            </a>
        </div>
    </header>

</body>
</html>
