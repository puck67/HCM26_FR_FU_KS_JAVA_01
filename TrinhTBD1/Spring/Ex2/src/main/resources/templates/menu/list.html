<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Menu Management')}"></head>
<body>

    <div class="app-container">
        <div th:replace="~{layout/main :: sidebar}"></div>

        <div class="main-wrapper">
            <div th:replace="~{layout/main :: topbar('Menu Management')}"></div>

            <main class="content-body">
                
                <div th:if="${successMessage}" class="alert-custom alert-success animate__animated animate__fadeIn">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${successMessage}">Success message.</span>
                </div>
                <div th:if="${errorMessage}" class="alert-custom alert-danger animate__animated animate__fadeIn">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${errorMessage}">Error message.</span>
                </div>

                <div class="glass-card">
                    <div th:replace="~{fragments/crud-toolbar :: toolbar(
                        ${pageTitle},
                        @{|/${entityName}/new|},
                        null,
                        null,
                        ${createButtonText}
                    )}"></div>

                    <div class="table-responsive">
                        <table class="table-premium">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>URL</th>
                                    <th>Icon</th>
                                    <th>Parent Menu</th>
                                    <th class="text-center">Display Order</th>
                                    <th>Status</th>
                                    <th>Roles</th>
                                    <th class="text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="m : ${menus}">
                                    <td th:text="${m.id}">1</td>
                                    <td>
                                        <span th:if="${m.parent != null}" th:text="'├── ' + ${m.name}" style="font-family: monospace; color: var(--text-secondary);"></span>
                                        <strong th:if="${m.parent == null}" th:text="${m.name}">Root Name</strong>
                                    </td>
                                    <td>
                                        <code th:if="${m.url != null && !m.url.trim().isEmpty()}" th:text="${m.url}">/url</code>
                                        <span th:if="${m.url == null || m.url.trim().isEmpty()}" class="text-muted">None</span>
                                    </td>
                                    <td>
                                        <i th:if="${m.icon != null && !m.icon.trim().isEmpty()}" th:class="'bi ' + ${m.icon} + ' me-2'" style="color: var(--accent-cyan);"></i>
                                        <span th:text="${m.icon != null && !m.icon.trim().isEmpty() ? m.icon : 'None'}" class="text-muted" style="font-size: 0.85rem;"></span>
                                    </td>
                                    <td>
                                        <span th:if="${m.parent != null}" th:text="${m.parent.name}">Parent Name</span>
                                        <span th:if="${m.parent == null}" class="text-muted">Root Level</span>
                                    </td>
                                    <td class="text-center" th:text="${m.displayOrder}">0</td>
                                    <td>
                                        <span th:if="${m.status}" class="badge-custom badge-success">
                                            <i class="bi bi-circle-fill" style="font-size: 0.4rem;"></i> Active
                                        </span>
                                        <span th:if="${!m.status}" class="badge-custom badge-danger">
                                            <i class="bi bi-circle-fill" style="font-size: 0.4rem;"></i> Inactive
                                        </span>
                                    </td>
                                    <td>
                                        <span th:if="${m.roles != null && !m.roles.trim().isEmpty()}">
                                            <span th:each="role : ${#strings.arraySplit(m.roles, ',')}" class="badge-custom badge-role" th:text="${#strings.trim(role)}">ROLE</span>
                                        </span>
                                        <span th:if="${m.roles == null || m.roles.trim().isEmpty()}" class="text-muted">All Roles</span>
                                    </td>
                                    <td class="text-center">
                                        <div class="action-links justify-content-center">
                                            <a th:href="@{/menus/edit/{id}(id=${m.id})}" class="btn-action edit" title="Edit Menu">
                                                <i class="bi bi-pencil-square"></i>
                                            </a>
                                            <a th:href="@{/menus/delete/{id}(id=${m.id})}" class="btn-action delete" title="Delete Menu" 
                                               onclick="return confirm('Are you sure you want to delete this menu? WARNING: This will cascade delete all of its sub-menus and descendants!')">
                                                <i class="bi bi-trash3-fill"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(menus)}">
                                    <td colspan="9" class="text-center text-muted py-5">
                                        <i class="bi bi-exclamation-circle" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i>
                                        No menus registered in the system.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
