<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Visitor</title>
    <!-- Bootstrap 4.6.2 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- FontAwesome 5 Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom CSS Stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <!-- Main Container -->
    <div class="container mt-2" style="max-width: 960px;">
        
        <!-- Header Lake Sunrise Banner Container -->
        <div class="banner-container">
            <img src="assets/images/banner.png" alt="Lake Sunrise Banner" class="banner-img">
        </div>

        <!-- Clean, highly visible Navigation Tabs below the Banner -->
        <div class="nav-tabs-custom">
            <a href="person.html" class="tab-item inactive"><i class="fas fa-user-plus"></i> Register Visitor</a>
            <a href="search.html" class="tab-item active"><i class="fas fa-search"></i> Search Visitors</a>
            <a href="help.html" class="tab-item inactive"><i class="fas fa-question-circle"></i> Help & FAQ</a>
        </div>

        <!-- Main Content Card -->
        <div class="main-card">
            
            <!-- Section Title Box styled like Figure 2 -->
            <div class="section-title-box">
                <h2 class="text-success font-weight-bold" id="page-title">Search Visitor</h2>
            </div>

            <!-- Search Inputs Section matching Figure 2 exactly -->
            <div class="form-group row align-items-center">
                <label for="searchInput" class="col-md-2 form-label-custom font-weight-bold" style="max-width: 120px;">First name:</label>
                <div class="col-md-3">
                    <input type="text" class="form-control form-control-custom" id="searchInput" placeholder="">
                </div>
                <div class="col-md-7 d-flex align-items-center flex-wrap">
                    <button class="btn btn-green mr-2" id="searchBtn">
                        Search...
                    </button>
                    <small class="text-dark" id="search-help">
                        (Type First name Visitor and Click Search button)
                    </small>
                </div>
            </div>

            <!-- Responsive Visitor Table Box -->
            <div class="visitor-table-container">
                <div class="table-responsive">
                    <table class="table visitor-table" id="visitorTable">
                        <thead>
                            <tr>
                                <th scope="col" style="width: 13%;">First name</th>
                                <th scope="col" style="width: 13%;">Last name</th>
                                <th scope="col" style="width: 10%;">Gender</th>
                                <th scope="col" style="width: 14%;">Telephone</th>
                                <th scope="col" style="width: 12%;">You're in</th>
                                <th scope="col" style="width: 18%;">Hobbies</th>
                                <th scope="col" style="width: 20%;">Description</th>
                            </tr>
                        </thead>
                        <tbody id="visitorTableBody">
                            <!-- Dynamic records loaded from LocalStorage via JQuery -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>


    </div>

    <!-- JQuery, Popper.js, Bootstrap 4 JS CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    
    <!-- Custom Search and highlight JQuery script -->
    <script src="assets/js/search.js"></script>
</body>
</html>
