<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Information</title>
    <!-- Bootstrap 4.6.2 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- FontAwesome 5 Icons CDN (Optional for form aesthetics) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom CSS Stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <!-- Main Container -->
    <div class="container mt-2" style="max-width: 960px;">
        
        <!-- Header Lake Sunrise Banner Container -->
        <div class="banner-container">
            <img src="assets/images/banner.png" alt="Lake Sunrise Banner" class="banner-img">
        </div>

        <!-- Clean, highly visible Navigation Tabs below the Banner -->
        <div class="nav-tabs-custom">
            <a href="person.html" class="tab-item active"><i class="fas fa-user-plus"></i> Register Visitor</a>
            <a href="search.html" class="tab-item inactive"><i class="fas fa-search"></i> Search Visitors</a>
            <a href="help.html" class="tab-item inactive"><i class="fas fa-question-circle"></i> Help & FAQ</a>
        </div>

        <!-- Main Form Card -->
        <div class="main-card">
            
            <!-- Section Title Box styled like Figure 1 -->
            <div class="section-title-box">
                <h2 class="text-success font-weight-bold" id="page-title">Visitor Information</h2>
            </div>

            <!-- Registration Form -->
            <form id="visitorForm" novalidate>
                
                <!-- First Name Field -->
                <div class="form-group row">
                    <label for="firstName" class="col-md-3 form-label-custom">First name:</label>
                    <div class="col-md-9">
                        <input type="text" class="form-control form-control-custom" id="firstName" name="firstName" placeholder="Enter First name" required>
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <!-- Last Name Field -->
                <div class="form-group row">
                    <label for="lastName" class="col-md-3 form-label-custom">Last name:</label>
                    <div class="col-md-9">
                        <input type="text" class="form-control form-control-custom" id="lastName" name="lastName" placeholder="Enter Last name" required>
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <!-- Gender Field -->
                <div class="form-group row">
                    <label for="gender" class="col-md-3 form-label-custom">Gender:</label>
                    <div class="col-md-9">
                        <select class="form-control form-control-custom col-md-3" id="gender" name="gender">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <!-- Telephone Field -->
                <div class="form-group row">
                    <label for="telephone" class="col-md-3 form-label-custom">Telephone:</label>
                    <div class="col-md-9">
                        <input type="tel" class="form-control form-control-custom" id="telephone" name="telephone" placeholder="Enter Telephone">
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <!-- Email Field -->
                <div class="form-group row">
                    <label for="email" class="col-md-3 form-label-custom">Email:</label>
                    <div class="col-md-9">
                        <input type="email" class="form-control form-control-custom" id="email" name="email" placeholder="Enter Email">
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <!-- Location Radio Buttons Grid matching figure exactly -->
                <div class="form-group row" id="location-error-anchor">
                    <label class="col-md-3 form-label-custom">You are in:</label>
                    <div class="col-md-9">
                        <div class="options-grid">
                            <label class="options-grid-item">
                                <input type="radio" name="youAreIn" value="Europe"> Europe
                            </label>
                            <label class="options-grid-item">
                                <input type="radio" name="youAreIn" value="Africa"> Africa
                            </label>
                        </div>
                        <div class="options-grid">
                            <label class="options-grid-item">
                                <input type="radio" name="youAreIn" value="Australia"> Australia
                            </label>
                            <label class="options-grid-item">
                                <input type="radio" name="youAreIn" value="Asia"> Asia
                            </label>
                            <label class="options-grid-item">
                                <input type="radio" name="youAreIn" value="America"> America
                            </label>
                        </div>
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <!-- Hobbies Checkboxes Grid matching figure exactly -->
                <div class="form-group row">
                    <label class="col-md-3 form-label-custom">What are your hobbies:</label>
                    <div class="col-md-9">
                        <div class="options-grid">
                            <label class="options-grid-item">
                                <input type="checkbox" name="hobbies" value="Swimming"> Swimming
                            </label>
                            <label class="options-grid-item">
                                <input type="checkbox" name="hobbies" value="Cooking"> Cooking
                            </label>
                            <label class="options-grid-item">
                                <input type="checkbox" name="hobbies" value="Shopping"> Shopping
                            </label>
                        </div>
                        <div class="options-grid">
                            <label class="options-grid-item">
                                <input type="checkbox" name="hobbies" value="Sport"> Sport
                            </label>
                            <label class="options-grid-item">
                                <input type="checkbox" name="hobbies" value="Dance"> Dance
                            </label>
                            <label class="options-grid-item">
                                <input type="checkbox" name="hobbies" value="Sing"> Sing
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Description Field -->
                <div class="form-group row">
                    <label for="description" class="col-md-3 form-label-custom">Description:</label>
                    <div class="col-md-9">
                        <textarea class="form-control form-control-custom" id="description" name="description" rows="5" placeholder="Enter Description"></textarea>
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <!-- Centered Green Register Button -->
                <div class="row mt-4">
                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-green px-4 font-weight-bold" id="registerBtn">
                            Register
                        </button>
                    </div>
                </div>

            </form>
        </div>


    </div>

    <!-- Success Modal (Custom, clean, no branding) -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border: none; border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);">
                <div class="modal-header bg-success text-white" style="border-top-left-radius: 8px; border-top-right-radius: 8px; background-color: var(--primary-green) !important; border-color: var(--dark-green) !important;">
                    <h5 class="modal-title font-weight-bold" id="successModalLabel">
                        <i class="fas fa-check-circle mr-2"></i> Registration Successful
                    </h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body p-4" id="successModalBody" style="background-color: #ffffff;">
                    <!-- Success details populated dynamically via JQuery -->
                </div>
                <div class="modal-footer" style="border-top: none; background-color: #ffffff; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;">
                    <button type="button" class="btn btn-green px-4 font-weight-bold" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JQuery, Popper.js, Bootstrap 4 JS CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    
    <!-- Custom validation script -->
    <script src="assets/js/validation.js"></script>
</body>
</html>
