<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping List Manager - Vanilla JS</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container">
    <h1>Shopping List Manager</h1>

    <div id="error-message" class="error-box"></div>

    <form id="shopping-form" novalidate onsubmit="return false;">
      <div class="form-group-container">
        <div class="form-group name">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" placeholder="e.g., Apples" autocomplete="off">
        </div>
        <div class="form-group cost">
          <label for="item-cost">Item Cost ($)</label>
          <input type="number" id="item-cost" placeholder="e.g., 2.50" step="0.01">
        </div>
        <button type="button" id="btn-add" class="btn-add">Add Item +</button>
      </div>
    </form>

    <div class="table-wrapper">
      <table id="shopping-table">
        <thead>
          <tr>
            <th>Item Name</th>
            <th class="cost-col">Cost ($)</th>
            <th class="action-col">Action</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div class="total-container">
      <span class="total-title">Grand Total:</span>
      <span id="grand-total" class="total-value">$0.00</span>
    </div>
  </div>

  <script src="js/app-vanilla.js"></script>
</body>

</html>
