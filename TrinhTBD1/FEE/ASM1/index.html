<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS - Content Management System</title>
  <!-- SEO Tags -->
  <meta name="description" content="Content Management System Admin Panel dashboard.">
  
  <!-- CSS Stylesheets -->
  <!-- Bootstrap 4.6.2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Custom Overrides -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Full-Page Loading Spinner Overlay (5 Seconds simulated AJAX delay) -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner-green"></div>
    <p class="loading-text">Loading content...</p>
    <p class="loading-subtext">Fetching data via secure AJAX channels</p>
  </div>

  <!-- Main Top Navigation Header -->
  <nav class="navbar navbar-expand-lg cms-navbar fixed-top">
    <a class="navbar-brand cms-brand" href="index.html">CMS</a>
    
    <!-- Collapsible Right Items -->
    <div class="ml-auto">
      <div class="dropdown user-profile-dropdown">
        <a class="dropdown-toggle" href="#" role="button" id="userDropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
          <i class="fas fa-user-circle mr-2" style="font-size: 1.4rem; color: #6c757d;"></i>
          <span id="user-profile-name">User Profile</span>
        </a>
        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
          <a class="dropdown-item" href="#" id="nav-edit-profile">
            <i class="fas fa-user-cog"></i> User Profile
          </a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item text-danger" href="#" id="nav-logout">
            <i class="fas fa-sign-out-alt text-danger"></i> Logout
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Left Sidebar Panel -->
  <aside class="cms-sidebar">
    <!-- Sidebar Search Form -->
    <div class="input-group sidebar-search-group">
      <input type="text" class="form-control" placeholder="Search..." id="sidebar-search-input">
      <div class="input-group-append">
        <button class="btn btn-outline-secondary" type="button" id="sidebar-search-btn">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>

    <!-- Navigation Menu List -->
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item">
        <a href="#" class="sidebar-nav-link active" data-target="templates/view-contents.html">
          <i class="fas fa-table"></i> View contents
        </a>
      </li>
      <li class="sidebar-nav-item">
        <a href="#" class="sidebar-nav-link" data-target="templates/add-content.html">
          <i class="far fa-edit"></i> Form content
        </a>
      </li>
    </ul>
  </aside>

  <!-- Dynamic Content Workspace Container -->
  <main class="cms-main-content">
    <div class="container-fluid py-4" id="main-content">
      <!-- AJAX loads View Content, Form Content or Edit Profile dynamically here -->
    </div>
  </main>

  <!-- JavaScript Dependencies -->
  <!-- jQuery 3.5.1 -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
  <!-- Bootstrap 4 Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom Scripts -->
  <script src="js/scripts.js"></script>
</body>
</html>
