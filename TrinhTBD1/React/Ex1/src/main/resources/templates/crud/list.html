<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <nav class="main-nav">
            <a th:href="@{/teachers}" th:classappend="${entityName == 'teachers'} ? 'active' : ''">Teachers</a>
            <a th:href="@{/students}" th:classappend="${entityName == 'students'} ? 'active' : ''">Students</a>
            <a th:href="@{/tasks}" th:classappend="${entityName == 'tasks'} ? 'active' : ''">Tasks</a>
        </nav>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div th:replace="~{fragments/crud-toolbar :: toolbar(${pageTitle}, @{|/${entityName}/create|}, @{|/${entityName}/export|}, 'javascript:document.getElementById(\'importExcelFile\').click()', ${createButtonText})}"></div>

        <form id="importForm" th:action="@{|/${entityName}/import|}" method="post" enctype="multipart/form-data" style="display:none;">
            <input type="file" id="importExcelFile" name="file" accept=".xlsx" onchange="document.getElementById('importForm').submit()">
        </form>

        <div class="table-wrapper">
            <p th:if="${#lists.isEmpty(rows)}" class="no-data">No data available.</p>
            <table th:if="${!#lists.isEmpty(rows)}" class="crud-table">
                <thead>
                    <tr>
                        <th th:each="header : ${headers}" th:text="${header}"></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row : ${rows}">
                        <td th:each="entry : ${row.entrySet()}" th:if="${entry.key != 'rowId'}" th:text="${entry.value}"></td>
                        <td>
                            <div class="row-actions">
                                <a th:href="@{|/${entityName}/edit/${row.rowId}|}" class="btn-action btn-edit">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
                                    </svg>
                                    <span>Edit</span>
                                </a>
                                <a href="#" th:data-url="@{|/${entityName}/delete/${row.rowId}|}" class="btn-action btn-delete delete-btn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                                        <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                                    </svg>
                                    <span>Delete</span>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="deleteModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>Confirm Delete</h3>
            <p>Are you sure you want to delete this item? This action cannot be undone.</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-cancel" onclick="closeDeleteModal()">Cancel</button>
                <a id="confirmDeleteBtn" href="#" class="btn btn-delete-confirm">Delete</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.delete-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    var url = this.getAttribute('data-url');
                    document.getElementById('confirmDeleteBtn').href = url;
                    document.getElementById('deleteModal').style.display = 'flex';
                });
            });
        });
        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
        }
    </script>
</body>
</html>
