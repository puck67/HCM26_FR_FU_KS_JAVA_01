# Database Configuration Properties
# Fills requirement: '2. Kết nối h2, longterm, k fix code'
# This file is loaded dynamically by HibernateUtils to avoid hardcoding database details.
db.driver=org.h2.Driver
db.url=jdbc:h2:./data/movietheaterdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
db.username=sa
db.password=
db.dialect=org.hibernate.dialect.H2Dialect
db.hbm2ddl.auto=update
db.show_sql=true
db.format_sql=true
