<div class="page-title">View Content</div>

<div class="card card-custom">
    <div class="card-header">
        View Content List
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-custom mb-0" id="contentsTable">
                <thead>
                    <tr>
                        <th style="width: 5%">#</th>
                        <th style="width: 25%">Title</th>
                        <th style="width: 55%">Brief</th>
                        <th style="width: 15%">Created Date</th>
                    </tr>
                </thead>
                <tbody id="contentsTableBody">
                    <!-- Dynamic content will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center">
        <div class="text-muted small" id="paginationInfo">
            Showing 1 to 3 of 3 entries
        </div>
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-custom mb-0" id="contentsPagination">
                <!-- Dynamic pagination links will be inserted here -->
            </ul>
        </nav>
    </div>
</div>
