<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Dashboard</title>
    <!-- Bootstrap 4.6.2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <span>CMS Link</span>
                <button type="button" id="sidebarCollapse" class="btn btn-link text-white p-0 d-md-none">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            
            <div class="sidebar-search">
                <div class="input-group">
                    <input type="text" class="form-control" id="sidebarSearch" placeholder="Search...">
                    <div class="input-group-append">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                    </div>
                </div>
            </div>

            <ul class="list-unstyled components">
                <li id="menu-view" class="active">
                    <a href="#" data-page="view_contents"><i class="fas fa-list mr-2"></i> View contents</a>
                </li>
                <li id="menu-form">
                    <a href="#" data-page="form_content"><i class="fas fa-edit mr-2"></i> Form content</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <!-- Top Navbar -->
            <nav class="navbar navbar-expand-lg navbar-light navbar-custom">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapseBtn" class="btn btn-outline-success d-none d-md-block mr-3">
                        <i class="fas fa-align-left"></i>
                    </button>
                    
                    <span class="navbar-brand mb-0 h1 d-md-none">CMS</span>

                    <div class="ml-auto">
                        <ul class="navbar-nav">
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle font-weight-bold" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                    <i class="fas fa-user-circle mr-1"></i> <span id="navUsername">User Profile</span>
                                </a>
                                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown">
                                    <a class="dropdown-item" href="#" id="dropdownProfile" data-page="edit_profile"><i class="fas fa-user-cog mr-2"></i> User Profile</a>
                                    <div class="dropdown-divider"></div>
                                    <a class="dropdown-item text-danger" href="#" id="btnLogout"><i class="fas fa-sign-out-alt mr-2"></i> Logout</a>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <!-- Main Content Body -->
            <div class="main-body">
                <!-- Loading Overlay (Visible during 5-second AJAX delay) -->
                <div id="loadingOverlay" class="loading-overlay">
                    <div class="spinner-custom"></div>
                    <div class="loading-timer" id="loadingTimer">Loading page in 5s...</div>
                </div>

                <!-- Page Fragment Container -->
                <div id="mainContentContainer">
                    <!-- Dynamic views will load here -->
                </div>
            </div>
        </div>
    </div>

    <!-- JS dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <!-- Custom application logic -->
    <script src="app.js"></script>
</body>
</html>
