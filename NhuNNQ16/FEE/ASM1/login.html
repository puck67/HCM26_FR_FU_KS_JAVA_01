<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Login</title>
    <!-- Bootstrap 4.6.2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Mock FPT Logo using simple text styling or search for image. Let's make it look clean -->
            <div class="auth-logo">
                <h2 class="text-success font-weight-bold"><i class="fas fa-cubes"></i> CMS Portal</h2>
                <p class="text-muted small">Content Management System</p>
            </div>
            
            <h3>Please Sign In</h3>
            
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">E-mail</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        </div>
                        <input type="email" class="form-control" id="loginEmail" placeholder="E-mail" required minlength="8" maxlength="50">
                        <div class="invalid-feedback" id="emailFeedback">
                            Email is required (8 - 50 characters) and must be a valid format.
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        </div>
                        <input type="password" class="form-control" id="loginPassword" placeholder="Password" required minlength="8" maxlength="30">
                        <div class="invalid-feedback" id="passwordFeedback">
                            Password is required (8 - 30 characters).
                        </div>
                    </div>
                </div>
                
                <div class="form-group form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label text-muted" for="rememberMe">Remember Me</label>
                </div>
                
                <button type="submit" class="btn btn-custom-green btn-block mt-4 py-2">Login</button>
            </form>
            
            <div id="loginAlert" class="alert alert-danger mt-3 d-none" role="alert">
                Invalid email or password.
            </div>
            
            <div class="text-center mt-3">
                <a href="register.html" class="text-success">Click here to Register</a>
            </div>
        </div>
    </div>

    <!-- JS dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // Setup default user credentials if they don't exist
            if (!localStorage.getItem('cmsUsers')) {
                const defaultUsers = [
                    {
                        username: 'admin',
                        email: 'admin@cms.com',
                        password: 'password123',
                        firstName: 'Admin',
                        lastName: 'User',
                        phone: '0123456789',
                        description: 'System administrator default account.'
                    }
                ];
                localStorage.setItem('cmsUsers', JSON.stringify(defaultUsers));
            }

            // Setup default contents if they don't exist
            if (!localStorage.getItem('cmsContents')) {
                const defaultContents = [
                    {
                        id: 1,
                        title: 'Lorem ipsum dolor sit amet',
                        brief: 'Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.',
                        content: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.',
                        createdDate: '31/08/2016 12:03'
                    },
                    {
                        id: 2,
                        title: 'Vestibulum tincidunt est vitae',
                        brief: 'Aliquam ornare lacus adipiscing, posuere lectus et, fringilla augue.',
                        content: 'Vestibulum tincidunt est vitae ultrices accumsan. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.',
                        createdDate: '31/08/2016 13:13'
                    },
                    {
                        id: 3,
                        title: 'Aliquam ornare lacus',
                        brief: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vestibulum tincidunt est vitae ultrices accumsan.',
                        content: 'Aliquam ornare lacus adipiscing, posuere lectus et, fringilla augue. Excepteur sint occaecat cupidatat non proident.',
                        createdDate: '01/09/2016 15:09'
                    }
                ];
                localStorage.setItem('cmsContents', JSON.stringify(defaultContents));
            }

            // Form Submit and Validation
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();
                
                const emailInput = $('#loginEmail')[0];
                const passwordInput = $('#loginPassword')[0];
                let isValid = true;

                // Reset validation classes
                $('#loginEmail, #loginPassword').removeClass('is-invalid');
                $('#loginAlert').addClass('d-none');

                // Validate Email
                if (!emailInput.checkValidity() || emailInput.value.length < 8 || emailInput.value.length > 50) {
                    $('#loginEmail').addClass('is-invalid');
                    isValid = false;
                }

                // Validate Password
                if (!passwordInput.checkValidity() || passwordInput.value.length < 8 || passwordInput.value.length > 30) {
                    $('#loginPassword').addClass('is-invalid');
                    isValid = false;
                }

                if (isValid) {
                    const email = $('#loginEmail').val().trim();
                    const password = $('#loginPassword').val();
                    const users = JSON.parse(localStorage.getItem('cmsUsers') || '[]');

                    // Find user
                    const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);

                    if (user) {
                        // Save session
                        localStorage.setItem('currentCmsUser', JSON.stringify(user));
                        // Redirect to main page
                        window.location.href = 'index.html';
                    } else {
                        $('#loginAlert').removeClass('d-none').text('Invalid email or password.');
                    }
                }
            });
        });
    </script>
</body>
</html>
