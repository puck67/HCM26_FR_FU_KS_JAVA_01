<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Course Created | LMS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,.1);
            padding: 48px 56px;
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }

        h2 {
            color: #1a3c6e;
            font-size: 1.6rem;
            margin-bottom: 12px;
        }

        p {
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        a.btn {
            display: inline-block;
            background: #1a3c6e;
            color: #fff;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 6px;
            font-weight: 600;
            font-size: .95rem;
            transition: background .2s;
        }

        a.btn:hover { background: #153263; }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">🎉</div>
    <h2>Course Created Successfully!</h2>
    <p>Thank you for adding a new course to the LMS.<br>
        It will be available to students shortly.</p>
    <a th:href="@{/courses/new}" class="btn">Add Another Course</a>
</div>

</body>
</html>
