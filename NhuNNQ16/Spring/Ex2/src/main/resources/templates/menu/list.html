<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::main}, 'Menu Management')}">
<body>
    <main class="animated-fade">
        
        <!-- Reusable Generic Toolbar Fragment -->
        <div th:replace="~{fragments/crud-toolbar :: toolbar(${pageTitle}, @{/menus/create}, null, null, ${createButtonText})}"></div>
        
        <!-- Table List Panel -->
        <div class="p-4 glass-panel mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0 text-dark">System Navigation Tree</h4>
                <span class="badge bg-secondary px-3 py-2 rounded-pill" th:text="${#lists.size(menus)} + ' Total Menus'">0 Total Menus</span>
            </div>

            <div class="table-responsive">
                <table class="custom-table w-100">
                    <thead>
                        <tr>
                            <th>Menu Name</th>
                            <th>Target URL</th>
                            <th>Icon</th>
                            <th>Display Order</th>
                            <th>Roles</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${menus}">
                            <!-- Name with hierarchy indentation -->
                            <td class="fw-medium text-dark" th:text="${m.displayName}">
                                └── Student Management
                            </td>
                            
                            <!-- URL -->
                            <td>
                                <code th:text="${m.url != null ? m.url : 'GROUP HEADER'}" 
                                      th:classappend="${m.url == null ? 'text-muted' : 'text-info'}">
                                    /students
                                </code>
                            </td>
                            
                            <!-- Icon -->
                            <td>
                                <span class="d-flex align-items-center gap-2">
                                    <i th:class="${m.icon != null ? m.icon : 'bi bi-app'} + ' text-secondary'"></i>
                                    <small class="text-muted" th:text="${m.icon != null ? m.icon : 'None'}">bi bi-speedometer2</small>
                                </span>
                            </td>
                            
                            <!-- Display Order -->
                            <td th:text="${m.displayOrder}" class="text-center">1</td>
                            
                            <!-- Allowed Roles -->
                            <td>
                                <span th:if="${m.roles != null && !m.roles.isEmpty()}">
                                    <span th:each="role : ${#strings.arraySplit(m.roles, ',')}" 
                                          class="badge badge-role" 
                                          th:text="${role.trim()}">
                                        ADMIN
                                    </span>
                                </span>
                                <span th:if="${m.roles == null || m.roles.isEmpty()}" class="text-muted small">Public</span>
                            </td>
                            
                            <!-- Status -->
                            <td>
                                <span th:if="${m.status}" class="badge badge-active">Active</span>
                                <span th:if="${!m.status}" class="badge badge-inactive">Inactive</span>
                            </td>
                            
                            <!-- Actions (Edit & Strategy Delete) -->
                            <td class="text-end">
                                <div class="d-flex justify-content-end align-items-center gap-2">
                                    <!-- Edit Link -->
                                    <a th:href="@{/menus/edit/{id}(id=${m.id})}" class="btn btn-sm btn-outline-primary px-3" title="Edit Menu">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </a>
                                    
                                    <!-- Delete Form with option switcher -->
                                    <form th:action="@{/menus/delete/{id}(id=${m.id})}" method="POST" class="d-inline-block">
                                        <div class="input-group input-group-sm">
                                            <select name="deleteOption" class="form-select border-secondary" style="font-size: 0.8rem; padding: 0.2rem 0.5rem; max-width: 110px;" title="Delete Strategy">
                                                <option value="RESTRICT">Restrict</option>
                                                <option value="CASCADE">Cascade</option>
                                            </select>
                                            <button type="submit" class="btn btn-sm btn-outline-danger px-3" onclick="return confirm('Are you sure you want to delete this menu item?')">
                                                <i class="bi bi-trash"></i> Delete
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
