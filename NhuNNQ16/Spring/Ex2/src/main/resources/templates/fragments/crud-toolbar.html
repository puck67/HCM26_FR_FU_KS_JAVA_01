<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
    <th:block th:fragment="toolbar(title, createUrl, exportUrl, importUrl, createLabel)">
        <div class="d-flex justify-content-between align-items-center mb-4 animated-fade">
            <div>
                <h2 class="mb-0 text-dark fw-bold" th:text="${title}">Page Title</h2>
            </div>
            <div class="d-flex gap-2">
                <a th:if="${createUrl != null}" th:href="${createUrl}" class="btn btn-primary d-flex align-items-center gap-2">
                    <i class="bi bi-plus-circle"></i> <span th:text="${createLabel}">Add New</span>
                </a>
                <a th:if="${exportUrl != null}" th:href="${exportUrl}" class="btn btn-outline-secondary d-flex align-items-center gap-2">
                    <i class="bi bi-download"></i> Export
                </a>
                <a th:if="${importUrl != null}" th:href="${importUrl}" class="btn btn-outline-secondary d-flex align-items-center gap-2">
                    <i class="bi bi-upload"></i> Import
                </a>
            </div>
        </div>
    </th:block>
</body>
</html>
