<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="d-flex">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="flex-grow-1 p-4">
            <h2>User Form</h2>
            <form th:action="@{/users/save}" th:object="${user}" method="post" class="bg-white p-4 shadow-sm mt-3" style="max-width: 600px;">
                <input type="hidden" th:field="*{userId}" />
                
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" th:field="*{username}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" th:field="*{fullName}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" th:field="*{status}">
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Roles</label>
                    <select multiple class="form-select" th:field="*{roles}" required>
                        <option th:each="role : ${rolesList}" 
                                th:value="${role.roleId}" 
                                th:text="${role.roleName}"></option>
                    </select>
                    <small class="text-muted">Hold Ctrl/Cmd to select multiple roles.</small>
                </div>
                
                <button type="submit" class="btn btn-success">Save</button>
                <a th:href="@{/users}" class="btn btn-secondary">Cancel</a>
            </form>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
