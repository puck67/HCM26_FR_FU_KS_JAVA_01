<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Role Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="d-flex">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="flex-grow-1 p-4">
            <h2>Role Form</h2>
            <form th:action="@{/roles/save}" th:object="${role}" method="post" class="bg-white p-4 shadow-sm mt-3" style="max-width: 500px;">
                <input type="hidden" th:field="*{roleId}" />
                <div class="mb-3">
                    <label class="form-label">Role Name</label>
                    <input type="text" class="form-control" th:field="*{roleName}" required>
                </div>
                <button type="submit" class="btn btn-success">Save</button>
                <a th:href="@{/roles}" class="btn btn-secondary">Cancel</a>
            </form>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
