<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Manage Lessons</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="page-title">Manage Lessons</h2>
        
        <div class="card-container" style="border-left: 4px solid var(--primary); margin-bottom: 30px;">
            <h4 style="margin-top: 0; margin-bottom: 12px; color: var(--text-main); font-weight: 700;">Course Summary</h4>
            <div style="margin-bottom: 8px; color: var(--text-muted);"><strong>Course ID:</strong> <span th:text="${course.id.courseCode}"></span></div>
            <div style="color: var(--text-muted);"><strong>Start Date:</strong> <span th:text="${course.id.startDate}"></span></div>
        </div>

        <div class="card-container" style="margin-bottom: 40px;">
            <h4 style="margin-top: 0; color: var(--text-main); font-weight: 700; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 24px;">Add / Edit Lesson</h4>
            <form th:action="@{'/courses/' + ${course.id.courseCode} + '/lessons'(startDate=${course.id.startDate})}" th:object="${lesson}" method="post">
                <input type="hidden" th:field="*{id}">
                <div style="display: flex; gap: 24px;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Lesson Name</label>
                        <input type="text" th:field="*{lessonName}" required class="form-input">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Duration (mins)</label>
                        <input type="number" th:field="*{duration}" required class="form-input">
                    </div>
                </div>
                <div style="display: flex; gap: 24px;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Content Type</label>
                        <select th:field="*{contentType}" class="form-input">
                            <option value="Video">Video</option>
                            <option value="Document">Document</option>
                            <option value="Quiz">Quiz</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Status</label>
                        <select th:field="*{status}" class="form-input">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 16px; justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: 24px; margin-top: 16px;">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href=window.location.pathname + '?startDate=' + new URLSearchParams(window.location.search).get('startDate')">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Save Lesson</button>
                </div>
            </form>
        </div>

        <div class="card-container">
            <h4 style="margin-top: 0; color: var(--text-main); font-weight: 700; margin-bottom: 24px;">List of Lessons for <span th:text="${course.id.courseCode}"></span></h4>
            <table class="modern-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Lesson Name</th>
                        <th>Duration</th>
                        <th>Content Type</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="l : ${lessons}">
                        <td th:text="${l.id}"></td>
                        <td th:text="${l.lessonName}"></td>
                        <td th:text="${l.duration}"></td>
                        <td th:text="${l.contentType}"></td>
                        <td th:text="${l.status}"></td>
                        <td>
                            <a th:href="@{'/courses/' + ${course.id.courseCode} + '/lessons/edit/' + ${l.id}(startDate=${course.id.startDate})}" style="color: var(--primary); text-decoration: none; font-weight: 600; margin-right: 12px;"><i class="fa-solid fa-pen-to-square"></i></a>
                            <a href="#" th:data-course-code="${course.id.courseCode}" th:data-start-date="${course.id.startDate}" th:data-lesson-id="${l.id}" onclick="confirmDelete(this.getAttribute('data-course-code'), this.getAttribute('data-start-date'), this.getAttribute('data-lesson-id')); return false;" style="color: #ef4444; text-decoration: none; font-weight: 600;"><i class="fa-solid fa-trash"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(lessons)}">
                        <td colspan="6" class="empty-data">No lessons found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <th:block layout:fragment="script">
        <script>
            function confirmDelete(courseCode, startDate, id) {
                if (confirm('Do you want to delete this lesson?')) {
                    window.location.href = '/courses/' + courseCode + '/lessons/delete/' + id + '?startDate=' + startDate;
                }
            }
        </script>
    </th:block>
</body>
</html>
