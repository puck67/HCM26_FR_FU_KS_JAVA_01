<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div th:fragment="sidebar" class="sidebar">
        <!-- Brand/Logo Area -->
        <div class="sidebar-logo" style="margin-bottom: 30px; padding: 0 16px;">
            <div class="title" style="font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 12px; color: var(--text-main);">
                <i class="fa-solid fa-book-open" style="color: var(--primary); background: var(--primary-light); padding: 10px; border-radius: 12px; font-size: 1.2rem;"></i>
                LMS PRO
            </div>
        </div>

        <!-- Navigation Links -->
        <div class="sidebar-nav" style="display: flex; flex-direction: column; gap: 8px;">
            <a th:each="menu : ${dynamicMenus}" th:href="@{${menu.url}}" style="color: var(--sidebar-text); padding: 14px 20px; border-radius: var(--radius-md); font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 16px; transition: var(--transition); text-decoration: none;">
                <i th:class="${menu.icon}" style="font-size: 1.2rem; width: 24px; text-align: center; transition: var(--transition);"></i>
                <div class="menu-text">
                    <span th:text="${menu.title}"></span>
                </div>
            </a>
            
            <div th:if="${#lists.isEmpty(dynamicMenus)}" style="padding: 20px; color: #a0aec0; text-align: center; font-size: 0.9rem;">
                No menus available
            </div>
        </div>
    </div>
</body>
</html>
