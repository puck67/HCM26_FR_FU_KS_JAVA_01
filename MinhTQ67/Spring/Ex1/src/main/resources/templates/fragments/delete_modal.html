<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div th:fragment="deleteModal" id="deleteConfirmModal" class="custom-modal">
        <div class="modal-content" style="max-width: 450px; text-align: center;">
            <div class="modal-header" style="justify-content: center; border-bottom: none; margin-bottom: 10px;">
                <div style="background: #FFE4E6; color: var(--danger); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto;">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
            </div>
            <h3 style="font-size: 1.6rem; color: var(--text-main); margin-bottom: 16px;">Are you sure?</h3>
            <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 30px;" id="deleteConfirmText">Do you really want to delete this item? This process cannot be undone.</p>
            <form id="deleteConfirmForm" method="post" style="display: flex; justify-content: center; gap: 15px;">
                <button type="button" class="btn btn-secondary" onclick="closeModal('deleteConfirmModal')">Cancel</button>
                <button type="submit" class="btn btn-primary" style="background: var(--danger); box-shadow: 0 10px 20px rgba(238, 93, 80, 0.2);"><i class="fa-solid fa-trash"></i> Delete</button>
            </form>
        </div>
        <script>
            function confirmDelete(actionUrl, itemName) {
                if (itemName) {
                    document.getElementById('deleteConfirmText').innerText = "Do you really want to delete '" + itemName + "'? This process cannot be undone.";
                } else {
                    document.getElementById('deleteConfirmText').innerText = "Do you really want to delete this item? This process cannot be undone.";
                }
                document.getElementById('deleteConfirmForm').action = actionUrl;
                openModal('deleteConfirmModal');
            }
        </script>
    </div>
</body>
</html>
