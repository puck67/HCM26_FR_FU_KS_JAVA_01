# Server config
server.port=8080

# H2 Database config for development
spring.datasource.url=jdbc:h2:mem:courseshare;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MySQL configuration (Commented out for future use)
# spring.datasource.url=jdbc:mysql://localhost:3306/courseshare?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf config
spring.thymeleaf.cache=false
