<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Courses')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>Manage Courses</h2>
                <a href="/instructor/course/new" class="btn btn-primary">+ Create New Course</a>
            </div>

            <div th:if="${message}" class="badge badge-success" style="display:block; padding:1rem; margin-bottom:1rem;" th:text="${message}"></div>

            <table class="table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Categories</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${coursePage.content}">
                        <td th:text="${course.title}">Title</td>
                        <td>
                            <span th:if="${course.status == 1}" class="badge badge-secondary">Draft</span>
                            <span th:if="${course.status == 2}" class="badge badge-success">Published</span>
                            <span th:if="${course.status == 3}" class="badge badge-warning">Archived</span>
                        </td>
                        <td th:text="${course.category}">Categories</td>
                        <td>
                            <div class="table-actions">
                                <a th:href="@{/instructor/course/{id}/edit(id=${course.id})}" class="btn btn-primary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Edit</a>
                                <a th:href="@{/instructor/course/{id}/delete(id=${course.id})}" class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="return confirm('Are you sure you want to delete this course?');">Delete</a>
                                
                                <a th:if="${course.status != 2}" th:href="@{/instructor/course/{id}/status(id=${course.id}, status=2)}" class="btn btn-success" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Publish</a>
                                <a th:if="${course.status == 2}" th:href="@{/instructor/course/{id}/status(id=${course.id}, status=1)}" class="btn btn-warning" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Unpublish</a>
                                <a th:if="${course.status != 3}" th:href="@{/instructor/course/{id}/status(id=${course.id}, status=3)}" class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Archive</a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(coursePage.content)}">
                        <td colspan="4" style="text-align:center;">No courses found.</td>
                    </tr>
                </tbody>
            </table>

            <!-- Pagination -->
            <ul class="pagination" th:if="${coursePage.totalPages > 1}">
                <li th:each="i : ${#numbers.sequence(1, coursePage.totalPages)}" th:classappend="${i == coursePage.number + 1} ? 'active'">
                    <a th:href="@{/instructor/courses(page=${i})}" th:text="${i}"></a>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
