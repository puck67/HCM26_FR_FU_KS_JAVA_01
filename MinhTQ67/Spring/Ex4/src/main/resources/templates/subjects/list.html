<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Subjects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="d-flex">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Subject Management</h2>
                <a th:href="@{/subjects/add}" class="btn btn-primary">Add New Subject</a>
            </div>
            
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            
            <table class="table table-bordered bg-white shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Duration (hrs)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="subject : ${subjects}">
                        <td th:text="${subject.subjectId}"></td>
                        <td th:text="${subject.subjectCode}"></td>
                        <td th:text="${subject.subjectName}"></td>
                        <td th:text="${subject.duration}"></td>
                        <td>
                            <a th:href="@{/subjects/edit/{id}(id=${subject.subjectId})}" class="btn btn-sm btn-warning">Edit</a>
                            <a th:href="@{/materials(subjectId=${subject.subjectId})}" class="btn btn-sm btn-info">View Materials</a>
                            <a th:href="@{/subjects/delete/{id}(id=${subject.subjectId})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this subject and all its materials?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
</body>
</html>
