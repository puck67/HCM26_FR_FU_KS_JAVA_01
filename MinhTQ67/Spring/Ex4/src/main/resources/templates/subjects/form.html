<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Subject Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="d-flex">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="flex-grow-1 p-4">
            <h2>Subject Form</h2>
            <form th:action="@{/subjects/save}" th:object="${subject}" method="post" class="bg-white p-4 shadow-sm mt-3" style="max-width: 600px;">
                <input type="hidden" th:field="*{subjectId}" />
                <div class="mb-3">
                    <label class="form-label">Subject Code</label>
                    <input type="text" class="form-control" th:field="*{subjectCode}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Subject Name</label>
                    <input type="text" class="form-control" th:field="*{subjectName}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Duration (hours)</label>
                    <input type="number" class="form-control" th:field="*{duration}" required>
                </div>
                <button type="submit" class="btn btn-success">Save</button>
                <a th:href="@{/subjects}" class="btn btn-secondary">Cancel</a>
            </form>
        </main>
    </div>
</body>
</html>
