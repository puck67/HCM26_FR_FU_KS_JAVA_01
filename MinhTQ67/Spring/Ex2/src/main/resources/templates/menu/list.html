<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Menu Management</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-header">
            <h2><i class="bi bi-list-nested text-primary me-2"></i> Menu Management</h2>
            <a th:href="@{/menus/add}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Add New Menu</a>
        </div>
        
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show d-flex align-items-center shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill fs-4 me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-4 me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="table-container mt-4">
            <table class="table">
                <thead>
                    <tr>
                        <th width="5%">ID</th>
                        <th width="25%">Name</th>
                        <th width="15%">URL</th>
                        <th width="15%">Icon</th>
                        <th width="15%">Parent</th>
                        <th width="5%">Order</th>
                        <th width="10%">Status</th>
                        <th width="10%" class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="menu : ${menus}">
                        <td th:text="${menu.id}">1</td>
                        <td class="fw-medium text-primary">
                            <span th:if="${menu.parent != null}" class="text-muted"><i class="bi bi-arrow-return-right me-1"></i></span>
                            <span th:text="${menu.name}">Menu Name</span>
                        </td>
                        <td class="text-muted" th:text="${menu.url}">/url</td>
                        <td><i th:class="${menu.icon} + ' me-1 text-primary'"></i> <span th:text="${menu.icon}"></span></td>
                        <td>
                            <span th:if="${menu.parent != null}" class="badge bg-secondary" th:text="${menu.parent.name}"></span>
                            <span th:if="${menu.parent == null}" class="text-muted">-</span>
                        </td>
                        <td th:text="${menu.displayOrder}">1</td>
                        <td>
                            <span th:class="${menu.status} ? 'badge badge-active' : 'badge badge-inactive'" th:text="${menu.status ? 'Active' : 'Inactive'}"></span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/menus/edit/{id}(id=${menu.id})}" class="action-link" title="Edit"><i class="bi bi-pencil-square"></i></a>
                            <a th:href="@{/menus/delete/{id}(id=${menu.id})}" class="action-link delete" onclick="return confirm('Are you sure you want to delete this menu?');" title="Delete"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(menus)}">
                        <td colspan="8" class="text-center py-4 text-muted">No menus found. Create one!</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
