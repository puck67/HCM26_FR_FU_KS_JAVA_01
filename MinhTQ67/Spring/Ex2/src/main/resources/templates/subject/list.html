<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Subject Management</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-header">
            <h2><i class="bi bi-book text-primary me-2"></i> Subject Management</h2>
            <button class="btn btn-primary" disabled><i class="bi bi-plus-circle me-1"></i> Add New Subject</button>
        </div>

        <div class="table-container mt-4">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th width="10%">ID</th>
                        <th width="20%">Code</th>
                        <th width="50%">Subject Name</th>
                        <th width="20%">Credits</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="subject : ${subjects}">
                        <td th:text="${subject.id}"></td>
                        <td><span class="badge bg-light text-dark border border-secondary border-opacity-25" th:text="${subject.code}"></span></td>
                        <td class="fw-medium text-primary" th:text="${subject.name}"></td>
                        <td><span class="badge bg-info text-white rounded-pill px-3" th:text="${subject.credits} + ' Credits'"></span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(subjects)}">
                        <td colspan="4" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                            No subjects found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
