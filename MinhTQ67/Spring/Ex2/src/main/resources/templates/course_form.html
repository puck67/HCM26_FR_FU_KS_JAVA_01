<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Add Course</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-header">
            <h2><i class="bi bi-journal-plus text-primary me-2"></i> Course Management</h2>
        </div>

        <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center mb-4">
            <i class="bi bi-check-circle-fill fs-4 me-2"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${savedCourse}" class="mb-4 d-flex justify-content-end">
            <a th:href="@{'/courses/' + ${savedCourse.id.courseCode} + '/lessons'(startDate=${savedCourse.id.startDate})}" class="btn btn-primary">
                <i class="bi bi-list-task me-1"></i> Manage Lessons
            </a>
        </div>

        <div class="form-container">
            <h4 class="mb-4 text-primary fw-bold">Create New Course</h4>
            <form th:action="@{/courses/new}" th:object="${course}" method="post">
                <div class="row mb-3">
                    <div class="col-md-6 form-group">
                        <label>Course ID</label>
                        <input type="text" th:field="*{id.courseCode}" class="form-control" placeholder="e.g. IT101" required>
                    </div>
                    <div class="col-md-6 form-group">
                        <label>Start Date</label>
                        <input type="date" th:field="*{id.startDate}" class="form-control" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-12 form-group">
                        <label>Course Name</label>
                        <input type="text" th:field="*{courseName}" class="form-control" placeholder="Introduction to Programming" required>
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col-md-6 form-group">
                        <label>Category</label>
                        <select th:field="*{category}" class="form-select">
                            <option value="Technology">Technology</option>
                            <option value="Business">Business</option>
                            <option value="Design">Design</option>
                        </select>
                    </div>
                    <div class="col-md-6 form-group">
                        <label>Instructor</label>
                        <input type="text" th:field="*{instructor}" class="form-control" placeholder="John Doe" required>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 border-top pt-4">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='/'">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Course</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
