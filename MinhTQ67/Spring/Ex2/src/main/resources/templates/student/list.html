<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Student Management</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-header">
            <h2><i class="bi bi-person-badge text-primary me-2"></i> Student Management</h2>
            <button class="btn btn-primary" disabled><i class="bi bi-plus-circle me-1"></i> Add New Student</button>
        </div>

        <div class="table-container mt-4">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th width="10%">ID</th>
                        <th width="25%">Full Name</th>
                        <th width="20%">Email</th>
                        <th width="20%">Major</th>
                        <th width="15%">Enrollment</th>
                        <th width="10%">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${students}">
                        <td th:text="${student.id}"></td>
                        <td class="fw-medium text-primary" th:text="${student.name}"></td>
                        <td class="text-muted" th:text="${student.email}"></td>
                        <td th:text="${student.major}"></td>
                        <td th:text="${#temporals.format(student.enrollmentDate, 'dd/MM/yyyy')}"></td>
                        <td>
                            <span class="badge" th:classappend="${student.status == 'Active' ? 'badge-active' : 'badge-inactive'}" th:text="${student.status}"></span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                            No students found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
