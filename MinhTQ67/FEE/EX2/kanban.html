<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex2 - Kanban Task Board</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
</head>
<body class="bg-light min-vh-100 py-4">

  <div class="container-fluid px-4" style="max-width: 1100px;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div class="d-flex align-items-center gap-2">
        <div class="bg-primary text-white rounded-3 d-flex align-items-center justify-content-center"
             style="width:42px;height:42px;font-size:1.3rem;">
          <i class="bi bi-kanban"></i>
        </div>
        <div>
          <h1 class="fw-bold mb-0 fs-4">My Project Board</h1>
          <p class="text-muted mb-0 small">Interactive Kanban Lite</p>
        </div>
      </div>

      <!-- Problem 03: Search bar -->
      <div class="input-group" style="max-width: 260px;">
        <span class="input-group-text bg-white">
          <i class="bi bi-search text-muted"></i>
        </span>
        <input
          type="text"
          id="search-input"
          class="form-control border-start-0"
          placeholder="Search tasks..."
        />
      </div>
    </div>

    <!-- Kanban Board: 3 columns -->
    <div class="row g-3" id="kanban-board">

      <!-- Column: To Do -->
      <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-primary text-white text-center fw-bold text-uppercase py-2 rounded-top">
            <i class="bi bi-list-task me-2"></i>To Do
          </div>
          <div class="card-body p-3">
            <!-- Add task input -->
            <div class="input-group mb-3">
              <input
                type="text"
                class="form-control form-control-sm task-input"
                placeholder="Add a task to To Do"
                data-column="todo"
              />
              <button
                class="btn btn-primary btn-sm btn-add-task"
                data-column="todo"
              >
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>
            <!-- Task cards container -->
            <div class="task-list d-flex flex-column gap-2" id="col-todo">
              <!-- Cards added here -->
            </div>
          </div>
        </div>
      </div>

      <!-- Column: In Progress -->
      <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-warning text-dark text-center fw-bold text-uppercase py-2 rounded-top">
            <i class="bi bi-hourglass-split me-2"></i>In Progress
          </div>
          <div class="card-body p-3">
            <div class="input-group mb-3">
              <input
                type="text"
                class="form-control form-control-sm task-input"
                placeholder="Add a task to In Progress"
                data-column="inprogress"
              />
              <button
                class="btn btn-warning btn-sm btn-add-task"
                data-column="inprogress"
              >
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>
            <div class="task-list d-flex flex-column gap-2" id="col-inprogress">
            </div>
          </div>
        </div>
      </div>

      <!-- Column: Done -->
      <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-success text-white text-center fw-bold text-uppercase py-2 rounded-top">
            <i class="bi bi-check2-all me-2"></i>Done
          </div>
          <div class="card-body p-3">
            <div class="input-group mb-3">
              <input
                type="text"
                class="form-control form-control-sm task-input"
                placeholder="Add a task to Done"
                data-column="done"
              />
              <button
                class="btn btn-success btn-sm btn-add-task"
                data-column="done"
              >
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>
            <div class="task-list d-flex flex-column gap-2" id="col-done">
            </div>
          </div>
        </div>
      </div>

    </div><!-- /row -->

    <!-- Footer -->
    <p class="text-center text-muted small mt-4">
      Ex2 · Interactive Kanban Task Board · jQuery + Bootstrap 5
    </p>

  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Custom JS -->
  <script src="kanban.js"></script>
</body>
</html>
