<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopping List & Budget Tracker</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
</head>
<body class="bg-light py-5">

  <div class="container" style="max-width: 800px;">

    <!-- Header -->
    <div class="text-center mb-4">
      <div class="bg-primary text-white rounded-3 d-inline-flex align-items-center justify-content-center mb-3"
           style="width:60px; height:60px; font-size:1.8rem;">
        <i class="bi bi-cart3"></i>
      </div>
      <h1 class="fw-bold text-primary mb-0">Shopping List Manager</h1>
      <p class="text-muted small text-uppercase letter-spacing-2">Budget Tracker</p>
    </div>

    <!-- Main Card -->
    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4">

        <!-- Alert -->
        <div id="alert-box" class="d-none mb-3"></div>

        <!-- Form: Problem 01 -->
        <h5 class="fw-bold text-primary mb-3">
          <span class="badge bg-primary me-2">01</span> Add Item
        </h5>

        <div class="row g-3 align-items-end mb-4">
          <div class="col-md-5">
            <label for="item-name" class="form-label fw-semibold text-muted small text-uppercase">Item Name</label>
            <input
              type="text"
              id="item-name"
              class="form-control"
              placeholder="e.g., Apples"
            />
          </div>

          <div class="col-md-4">
            <label for="item-cost" class="form-label fw-semibold text-muted small text-uppercase">Item Cost ($)</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input
                type="number"
                id="item-cost"
                class="form-control"
                placeholder="e.g., 2.50"
                min="0"
                step="0.01"
              />
            </div>
          </div>

          <div class="col-md-3">
            <button id="btn-add" class="btn btn-primary w-100">
              <i class="bi bi-plus-lg me-1"></i> Add Item
            </button>
          </div>
        </div>

        <hr class="text-muted"/>

        <!-- Table: Problem 02 -->
        <h5 class="fw-bold text-primary mb-3">
          <span class="badge bg-primary me-2">02</span> Shopping List
        </h5>

        <!-- Empty state -->
        <div id="empty-state" class="text-center text-muted py-5">
          <i class="bi bi-cart-x fs-1 d-block mb-2 opacity-50"></i>
          <p class="mb-0">Your list is empty.<br/>Add items above to get started.</p>
        </div>

        <!-- Table -->
        <div class="table-responsive d-none" id="table-wrapper">
          <table class="table table-bordered table-hover align-middle mb-0" id="shopping-table">
            <thead class="table-dark">
              <tr>
                <th><i class="bi bi-box-seam me-2"></i>Item Name</th>
                <th class="text-center" style="width: 160px;"><i class="bi bi-cash-coin me-1"></i>Cost ($)</th>
                <th class="text-center" style="width: 130px;">Action</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <!-- Rows appended here -->
            </tbody>
          </table>
        </div>

      </div><!-- /card-body -->

      <!-- Grand Total Footer -->
      <div class="card-footer bg-white border-top border-2 px-4 py-3">
        <div class="d-flex justify-content-between align-items-center">
          <span class="fw-bold fs-5 text-primary">
            <i class="bi bi-receipt-cutoff me-2"></i>Grand Total:
          </span>
          <span class="fw-bold fs-3 text-warning" id="grand-total">$0.00</span>
        </div>
      </div>

    </div><!-- /card -->

    <!-- Footer -->
    <p class="text-center text-muted small mt-4">
      Ex1 · Dynamic Shopping List &amp; Budget Tracker · jQuery + Bootstrap 5
    </p>

  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
