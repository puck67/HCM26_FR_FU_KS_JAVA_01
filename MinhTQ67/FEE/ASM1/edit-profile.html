<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Profile - CMS</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="cms-page">

<div class="cms-wrapper">
  <!-- Sidebar -->
  <div class="cms-sidebar">
    <div class="search-area">
      <div class="input-group input-group-sm">
        <input type="text" class="form-control" placeholder="Search..."/>
        <div class="input-group-append">
          <span class="input-group-text">&#128269;</span>
        </div>
      </div>
    </div>
    <nav>
      <a href="view-contents.html" class="nav-link sidebar-nav" data-href="view-contents.html">
        <span class="icon">&#9776;</span> View contents
      </a>
      <a href="form-content.html" class="nav-link sidebar-nav" data-href="form-content.html">
        <span class="icon">&#9998;</span> Form content
      </a>
    </nav>
  </div>

  <!-- Body -->
  <div class="cms-body">
    <!-- Topbar -->
    <div class="cms-topbar">
      <span class="brand">CMS</span>
      <div class="topbar-right">
        <div class="dropdown">
          <button class="btn btn-sm dropdown-toggle" data-toggle="dropdown">
            &#128100;
          </button>
          <div class="dropdown-menu dropdown-menu-right">
            <a class="dropdown-item" href="edit-profile.html">&#128100; User Profile</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" href="login.html">&#8594; Logout</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="cms-content-wrap">
      <div id="loading-overlay" style="display:none">
        <span>Loading</span>
      </div>
      <div class="cms-content">
        <h2>Edit Profile</h2>
        <div class="cms-panel">
          <div class="cms-panel-header">Profile Form Elements</div>
          <div class="cms-panel-body">
            <form id="editProfileForm" class="cms-form" novalidate>

              <div class="form-group">
                <label>First Name</label>
                <input type="text" class="form-control" id="firstName"
                       placeholder="Enter the first name" maxlength="30"/>
                <div class="error-msg" id="firstNameError"></div>
              </div>

              <div class="form-group">
                <label>Last Name</label>
                <input type="text" class="form-control" id="lastName"
                       placeholder="Enter the last name" maxlength="30"/>
                <div class="error-msg" id="lastNameError"></div>
              </div>

              <div class="form-group">
                <label>Email</label>
                <span class="email-static">your_email@example.com</span>
              </div>

              <div class="form-group">
                <label>Phone</label>
                <input type="text" class="form-control" id="phone"
                       placeholder="Enter your phone number" maxlength="13"/>
                <div class="error-msg" id="phoneError"></div>
              </div>

              <div class="form-group">
                <label>Description</label>
                <textarea class="form-control" id="description" rows="3" maxlength="200"></textarea>
              </div>

              <button type="submit" class="btn btn-primary">Submit Button</button>
              <button type="reset" class="btn btn-secondary">Reset Button</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="cms-toast" id="toast">&#10003; Profile updated successfully!</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
<script>
  // Sidebar nav — loading 5 seconds
  $('.sidebar-nav').on('click', function(e) {
    e.preventDefault();
    const href = $(this).data('href');
    $('#loading-overlay').fadeIn(150);
    setTimeout(function() { window.location.href = href; }, 5000);
  });

  // Form validation + Ajax submit
  $('#editProfileForm').on('submit', function(e) {
    e.preventDefault();
    let ok = true;
    const fn    = $('#firstName').val().trim();
    const ln    = $('#lastName').val().trim();
    const phone = $('#phone').val().trim();

    $('input, textarea').removeClass('is-invalid');
    $('.error-msg').text('').hide();

    // First Name: required, min 3, max 30
    if (!fn) {
      $('#firstName').addClass('is-invalid'); $('#firstNameError').text('First Name is required.').show(); ok = false;
    } else if (fn.length < 3) {
      $('#firstName').addClass('is-invalid'); $('#firstNameError').text('First Name must be at least 3 characters.').show(); ok = false;
    }

    // Last Name: required, min 3, max 30
    if (!ln) {
      $('#lastName').addClass('is-invalid'); $('#lastNameError').text('Last Name is required.').show(); ok = false;
    } else if (ln.length < 3) {
      $('#lastName').addClass('is-invalid'); $('#lastNameError').text('Last Name must be at least 3 characters.').show(); ok = false;
    }

    // Phone: required, min 9, max 13
    if (!phone) {
      $('#phone').addClass('is-invalid'); $('#phoneError').text('Phone is required.').show(); ok = false;
    } else if (phone.length < 9) {
      $('#phone').addClass('is-invalid'); $('#phoneError').text('Phone must be at least 9 digits.').show(); ok = false;
    }

    if (ok) {
      const $btn = $(this).find('[type=submit]');
      $btn.prop('disabled', true).text('Saving...');
      // Ajax call to update profile
      $.ajax({
        url: '#',
        method: 'POST',
        data: { firstName: fn, lastName: ln, phone: phone, description: $('#description').val() }
      }).always(function() {
        $btn.prop('disabled', false).text('Submit Button');
        const $t = $('#toast');
        $t.fadeIn(200);
        setTimeout(function() { $t.fadeOut(400); }, 3000);
      });
    }
  });
</script>
</body>
</html>
