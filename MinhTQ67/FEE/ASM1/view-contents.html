<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>View Contents - CMS</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="cms-page">

<div class="cms-wrapper">
  <!-- Sidebar -->
  <div class="cms-sidebar">
    <div class="search-area">
      <div class="input-group input-group-sm">
        <input type="text" class="form-control" placeholder="Search..."/>
        <div class="input-group-append">
          <span class="input-group-text">&#128269;</span>
        </div>
      </div>
    </div>
    <nav>
      <a href="view-contents.html" class="nav-link active sidebar-nav" data-href="view-contents.html">
        <span class="icon">&#9776;</span> View contents
      </a>
      <a href="form-content.html" class="nav-link sidebar-nav" data-href="form-content.html">
        <span class="icon">&#9998;</span> Form content
      </a>
    </nav>
  </div>

  <!-- Body -->
  <div class="cms-body">
    <!-- Topbar -->
    <div class="cms-topbar">
      <span class="brand">CMS</span>
      <div class="topbar-right">
        <div class="dropdown">
          <button class="btn btn-sm dropdown-toggle" data-toggle="dropdown">
            &#128100;
          </button>
          <div class="dropdown-menu dropdown-menu-right">
            <a class="dropdown-item" href="edit-profile.html">&#128100; User Profile</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" href="login.html">&#8594; Logout</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="cms-content-wrap">
      <div id="loading-overlay">
        <span>Loading</span>
      </div>
      <div class="cms-content" id="mainContent" style="display:none">
        <h2>View Content</h2>
        <div class="cms-panel">
          <div class="cms-panel-header">View Content List</div>
          <div class="cms-panel-body p-0">
            <table class="table table-bordered content-table mb-0" id="contentTable">
              <thead>
                <tr>
                  <th style="width:36px">#</th>
                  <th style="width:200px">Title</th>
                  <th>Brief</th>
                  <th style="width:110px">Created Date</th>
                </tr>
              </thead>
              <tbody id="contentBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
<script>
  // Sample data (simulates Ajax response)
  const sampleData = [
    { id: 1, title: 'Lorem ipsum dolor sit amet', brief: 'Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.', created: '31/08/2016 12:03' },
    { id: 2, title: 'Vestibulum tincidunt est vitae', brief: 'Aliquam ornare lacus adipiscing, posuere lectus et, fringilla augue.', created: '31/08/2016 13:13' },
    { id: 3, title: 'Aliquam ornare lacus adipiscing', brief: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vestibulum tincidunt est vitae ultrices accumsan.', created: '01/09/2016 15:09' }
  ];

  // Ajax simulation: show loading 5 seconds, then render table
  $(document).ready(function() {
    $.ajax({
      url: '#',
      method: 'GET',
      complete: function() {}
    }).always(function() {
      setTimeout(function() {
        // Render rows
        const rows = sampleData.map(function(item) {
          return '<tr>' +
            '<td>' + item.id + '</td>' +
            '<td>' + item.title + '</td>' +
            '<td>' + item.brief + '</td>' +
            '<td>' + item.created + '</td>' +
          '</tr>';
        }).join('');
        $('#contentBody').html(rows);

        // Hide loading, show content
        $('#loading-overlay').fadeOut(200, function() {
          $('#mainContent').fadeIn(200);
        });
      }, 5000);
    });
  });

  // Sidebar nav — loading 5 seconds
  $('.sidebar-nav').on('click', function(e) {
    e.preventDefault();
    const href = $(this).data('href');
    $('#mainContent').hide();
    $('#loading-overlay').fadeIn(150);
    setTimeout(function() { window.location.href = href; }, 5000);
  });
</script>
</body>
</html>
