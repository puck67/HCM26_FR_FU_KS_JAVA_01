<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="auth-page">

  <div class="auth-box">
    <h5>Please Sign In</h5>
    <form id="loginForm" novalidate>
      <input type="email" class="form-control" id="email" name="email"
             placeholder="E-mail" maxlength="50"/>
      <div class="error-msg" id="emailError"></div>

      <input type="password" class="form-control" id="password" name="password"
             placeholder="Password" maxlength="30"/>
      <div class="error-msg" id="passwordError"></div>

      <div class="form-check mt-1">
        <input type="checkbox" class="form-check-input" id="rememberMe"/>
        <label class="form-check-label" for="rememberMe">Remember Me</label>
      </div>

      <button type="submit" class="btn btn-primary mt-1">Login</button>
      <a href="register.html" class="auth-link">Click here to Register</a>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
  <script>
    function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

    $('#loginForm').on('submit', function(e) {
      e.preventDefault();
      let ok = true;
      const email = $('#email').val().trim();
      const pwd   = $('#password').val();

      $('#email, #password').removeClass('is-invalid');
      $('.error-msg').text('').hide();

      if (!email) {
        $('#email').addClass('is-invalid'); $('#emailError').text('Email is required.').show(); ok = false;
      } else if (email.length < 5) {
        $('#email').addClass('is-invalid'); $('#emailError').text('Email must be at least 5 characters.').show(); ok = false;
      } else if (!isValidEmail(email)) {
        $('#email').addClass('is-invalid'); $('#emailError').text('Invalid email format.').show(); ok = false;
      } else if (email.length > 50) {
        $('#email').addClass('is-invalid'); $('#emailError').text('Email must not exceed 50 characters.').show(); ok = false;
      }

      if (!pwd) {
        $('#password').addClass('is-invalid'); $('#passwordError').text('Password is required.').show(); ok = false;
      } else if (pwd.length < 8) {
        $('#password').addClass('is-invalid'); $('#passwordError').text('Password must be at least 8 characters.').show(); ok = false;
      } else if (pwd.length > 30) {
        $('#password').addClass('is-invalid'); $('#passwordError').text('Password must not exceed 30 characters.').show(); ok = false;
      }

      if (ok) { window.location.href = 'view-contents.html'; }
    });
  </script>
</body>
</html>
