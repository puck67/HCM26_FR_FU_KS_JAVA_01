<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex3 - Dynamic Image Gallery & Rating System</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

  <style>
    /* Chỉ những thứ Bootstrap không có sẵn */

    /* Star rating */
    .star {
      font-size: 1.2rem;
      cursor: pointer;
      color: #ccc;
      transition: color 0.15s;
    }
    .star.filled       { color: #f59e0b; }
    .star.hover-fill   { color: #fbbf24; }

    /* Image placeholder */
    .img-placeholder {
      width: 100%;
      height: 150px;
      border-radius: 8px 8px 0 0;
      position: relative;
      overflow: hidden;
    }

    /* Favorite button overlay */
    .btn-favorite {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-size: 1.3rem;
      color: #ccc;
      transition: color 0.2s, transform 0.2s;
    }
    .btn-favorite.active     { color: #ef4444; }
    .btn-favorite:hover      { transform: scale(1.2); }

    /* Add to Favorites overlay on image */
    .fav-overlay {
      position: absolute;
      bottom: 6px;
      right: 8px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 4px;
      pointer-events: none;
    }

    /* Footer pulse animation target */
    #avg-rating-val,
    #total-fav-val {
      display: inline-block;
    }
  </style>
</head>
<body class="bg-light py-4">

  <div class="container" style="max-width: 1000px;">

    <!-- Header -->
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="bg-warning text-white rounded-3 d-flex align-items-center justify-content-center"
           style="width:46px;height:46px;font-size:1.4rem;">
        <i class="bi bi-images"></i>
      </div>
      <div>
        <h1 class="fw-bold mb-0 fs-3">My Image Gallery</h1>
        <p class="text-muted mb-0 small">Dynamic Rating System · Ex3</p>
      </div>
    </div>

    <!-- Gallery Grid — Problem 01: Bootstrap row + col -->
    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-5 g-3" id="gallery-grid">
      <!-- Cards generated by JS -->
    </div>

    <!-- Summary Footer — Problem 01 -->
    <div class="card border-2 mt-4 shadow-sm">
      <div class="card-body py-3">
        <div class="row align-items-center text-center">

          <div class="col-6 border-end">
            <div class="d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-bar-chart-fill text-primary fs-5"></i>
              <div class="text-start">
                <div class="text-muted small text-uppercase fw-semibold" style="font-size:.7rem;letter-spacing:.05em;">Average Rating</div>
                <div class="fw-bold fs-5">
                  <span id="avg-rating-val">0.0</span>
                  <span class="text-muted fw-normal fs-6"> Stars</span>
                  <span class="text-muted fw-normal fs-6" id="avg-based"> (based on 0 items)</span>
                </div>
              </div>
            </div>
          </div>

          <div class="col-6">
            <div class="d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-heart-fill text-danger fs-5"></i>
              <div class="text-start">
                <div class="text-muted small text-uppercase fw-semibold" style="font-size:.7rem;letter-spacing:.05em;">Total Favorites</div>
                <div class="fw-bold fs-5">
                  <span id="total-fav-val">0</span>
                  <span class="text-muted fw-normal fs-6"> items</span>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-muted small mt-3">
      Ex3 · Dynamic Image Gallery &amp; Rating System · jQuery + Bootstrap 5
    </p>

  </div><!-- /container -->

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Custom JS -->
  <script src="gallery.js"></script>
</body>
</html>
