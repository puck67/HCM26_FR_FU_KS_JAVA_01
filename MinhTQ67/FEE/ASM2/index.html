<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polls – Vote</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <a class="navbar-brand font-weight-bold" href="index.html">Polls</a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item active"><a class="nav-link" href="index.html">Vote</a></li>
      <li class="nav-item"><a class="nav-link" href="create.html">Create</a></li>
      <li class="nav-item"><a class="nav-link" href="list.html">List</a></li>
    </ul>
    <button class="btn btn-sm ml-auto" id="btnLogin">Login</button>
  </div>
</nav>

<!-- Poll Content -->
<div class="poll-container">
  <h1 class="poll-title">Great poll</h1>

  <div class="mb-4">
    <p class="mb-1">1. It is necessary to you? <span class="text-danger">*</span></p>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="q1" id="q1y" value="yes" />
      <label class="form-check-label" for="q1y">Yes</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="q1" id="q1n" value="no" />
      <label class="form-check-label" for="q1n">No</label>
    </div>
  </div>

  <div class="mb-4">
    <p class="mb-1">2. Often pass polls?</p>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="q2" id="q2a" value="month" />
      <label class="form-check-label" for="q2a">Once a month</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="q2" id="q2b" value="week" />
      <label class="form-check-label" for="q2b">Once a week</label>
    </div>
  </div>

  <div class="mb-4">
    <p class="mb-1">3. How old are you?</p>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="q3" id="q3a" value="18-20" checked />
      <label class="form-check-label" for="q3a">18-20</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="q3" id="q3b" value="21-23" />
      <label class="form-check-label" for="q3b">21-23</label>
    </div>
  </div>

  <button class="btn" type="button">Retain</button>
</div>

<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1" role="dialog" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-body p-4">
        <div id="loginError" class="alert-validation" style="display:none;"></div>
        <div class="form-group">
          <label for="alias">Alias:</label>
          <input type="text" class="form-control" id="alias" placeholder="JoeSixpack" />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" class="form-control" id="password" placeholder="••••••••" />
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="rememberMe" />
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <button class="btn" type="button" id="btnSignIn">Sign In</button>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
<script>
  // Open login modal
  $('#btnLogin').on('click', function () {
    $('#loginModal').modal('show');
  });

  // Sign In validation
  $('#btnSignIn').on('click', function () {
    var alias = $('#alias').val().trim();
    var pwd = $('#password').val().trim();
    var errors = [];

    $('#alias, #password').removeClass('field-error');
    $('label[for="alias"], label[for="password"]').removeClass('error-label');
    $('#loginError').hide();

    if (!alias) {
      errors.push('Alias is required.');
      $('#alias').addClass('field-error');
      $('label[for="alias"]').addClass('error-label');
    }
    if (!pwd) {
      errors.push('Password is required.');
      $('#password').addClass('field-error');
      $('label[for="password"]').addClass('error-label');
    }

    if (errors.length > 0) {
      $('#loginError').html(errors.join('<br>')).show();
    } else {
      alert('Signed in successfully!');
      $('#loginModal').modal('hide');
    }
  });
</script>
</body>
</html>
