<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assessment Materials</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1, h2 { color: #333; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 80px; resize: vertical; }
        button { padding: 8px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .alert-success { background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 16px; }
        .alert-error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #f2f2f2; }
        a { color: #007bff; }
    </style>
</head>
<body>
    <h1>Upload Assessment Material</h1>

    <div class="alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert-error" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{/assessments/upload}" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required />
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description"></textarea>
        </div>
        <div class="form-group">
            <label for="file">File</label>
            <input type="file" id="file" name="file" required />
        </div>
        <button type="submit">Upload</button>
    </form>

    <h2>Uploaded Materials</h2>
    <div th:if="${#lists.isEmpty(materials)}">
        <p>No materials uploaded yet.</p>
    </div>
    <table th:unless="${#lists.isEmpty(materials)}">
        <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>File</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="material : ${materials}">
                <td th:text="${material.title}"></td>
                <td th:text="${material.description}"></td>
                <td>
                    <a th:href="@{/assessments/download/{fn}(fn=${material.fileName})}"
                       th:text="${material.fileName}">Download</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
