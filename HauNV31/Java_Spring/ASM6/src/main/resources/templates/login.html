<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Instructor Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-bar">
            <a th:href="@{/}" class="logo">
                <span>📚</span> Course Sharing
            </a>
            <ul class="nav-links">
                <li><a th:href="@{/}">Home</a></li>
            </ul>
        </div>
    </header>

    <main class="container login-wrapper">
        <div class="card login-box">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Instructor Sign In</h2>
            
            <div th:if="${error}" class="alert alert-danger" th:text="${error}">
                Error message
            </div>

            <form th:action="@{/instructor/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">Sign In</button>
            </form>
        </div>
    </main>
</body>
</html>
