<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Project Board - Kanban</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include jQuery for Problem 03 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="board-wrapper">
        <div class="header">
            <h1>My Project Board</h1>
            <!-- Global search for Problem 03 -->
            <input type="text" id="searchInput" placeholder="Search tasks...">
        </div>
        
        <div class="kanban-board">
            <!-- TO DO COLUMN -->
            <div class="kanban-col" id="col-todo" data-status="todo">
                <div class="col-header bg-todo">
                    <h2>TO DO</h2>
                </div>
                <div class="col-body bg-todo-light">
                    <div class="input-container">
                        <input type="text" class="task-input" placeholder="Add a task to To Do">
                        <button class="add-btn">+</button>
                    </div>
                    <div class="cards-container">
                        <!-- Cards will be appended here -->
                    </div>
                </div>
            </div>

            <!-- IN PROGRESS COLUMN -->
            <div class="kanban-col" id="col-inprogress" data-status="inprogress">
                <div class="col-header bg-inprogress">
                    <h2>IN PROGRESS</h2>
                </div>
                <div class="col-body bg-inprogress-light">
                    <div class="input-container">
                        <input type="text" class="task-input" placeholder="Add a task to In Progress">
                        <button class="add-btn">+</button>
                    </div>
                    <div class="cards-container">
                    </div>
                </div>
            </div>

            <!-- DONE COLUMN -->
            <div class="kanban-col" id="col-done" data-status="done">
                <div class="col-header bg-done">
                    <h2>DONE</h2>
                </div>
                <div class="col-body bg-done-light">
                    <div class="input-container">
                        <input type="text" class="task-input" placeholder="Add a task to Done">
                        <button class="add-btn">+</button>
                    </div>
                    <div class="cards-container">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Active Script: Problem 03 (jQuery) -->
    <script src="script-jq.js"></script>
    
    <!-- Problem 02 (Pure JS). Uncomment below and comment above to test -->
    <!-- <script src="script.js"></script> -->
</body>
</html>
