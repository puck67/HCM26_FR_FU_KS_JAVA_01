<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List Manager</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include jQuery for Problem 03 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Shopping List Manager</h1>
        <div class="input-section">
            <div class="input-group">
                <label for="itemName">Item Name</label>
                <input type="text" id="itemName" placeholder="e.g., Apples">
            </div>
            <div class="input-group">
                <label for="itemCost">Item Cost ($)</label>
                <input type="number" id="itemCost" placeholder="e.g., 2.50" min="0" step="0.01">
            </div>
            <button id="addItemBtn">Add Item +</button>
        </div>

        <table id="shoppingTable">
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Cost ($)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="shoppingBody">
                <!-- Items will be appended here -->
            </tbody>
        </table>

        <div class="footer">
            <span class="total-label">Grand Total:</span>
            <span class="total-amount" id="grandTotal">$0.00</span>
        </div>
    </div>
    
    <!-- Link to the jQuery implementation (Problem 3). 
         If you want to use the Pure JS implementation (Problem 2), 
         comment out the script below and uncomment the script.js link. -->
    <script src="script-jq.js"></script>
    <!-- <script src="script.js"></script> -->
</body>
</html>
