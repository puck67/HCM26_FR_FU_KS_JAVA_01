<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CMS</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Register</div>
                <div class="card-body">
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="username">User name</label>
                            <input type="text" class="form-control" id="username" placeholder="User name">
                            <div class="error-message" id="usernameError">User name is required.</div>
                        </div>
                        <div class="form-group">
                            <label for="regEmail">E-mail</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="E-mail">
                            <div class="error-message" id="regEmailError">Please enter a valid email address.</div>
                        </div>
                        <div class="form-group">
                            <label for="regPassword">Password</label>
                            <input type="password" class="form-control" id="regPassword" placeholder="Password">
                            <div class="error-message" id="regPasswordError">Password is required.</div>
                        </div>
                        <div class="form-group">
                            <label for="rePassword">Re-password</label>
                            <input type="password" class="form-control" id="rePassword" placeholder="Re-password">
                            <div class="error-message" id="rePasswordError">Passwords do not match.</div>
                        </div>
                        <button type="submit" class="btn btn-custom btn-block">Register</button>
                    </form>
                    <div class="mt-3">
                        <a href="login.html">Click here to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- jQuery and Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
