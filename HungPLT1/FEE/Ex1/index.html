<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List Manager - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
            align-items: center;
        }
        .menu-btn {
            display: inline-block;
            width: 100%;
            max-width: 350px;
            background-color: var(--button-blue);
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .menu-btn:hover {
            background-color: var(--button-blue-hover);
        }
        .menu-desc {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="manager-card">
        <h1>Shopping List Manager</h1>
        <p class="menu-desc">Vui lòng chọn phiên bản chạy của bài tập:</p>
        
        <div class="menu-container">
            <a href="vanilla.html" class="menu-btn">Bài 2: Phiên bản JavaScript thuần</a>
            <a href="jquery.html" class="menu-btn">Bài 3: Phiên bản jQuery Refactored</a>
        </div>
    </div>
    <script>
        document.querySelectorAll('.menu-btn').forEach(btn => {
            const clearFocus = (event) => {
                event.preventDefault();
                btn.blur();
                if (document.activeElement) {
                    document.activeElement.blur();
                }
            };
            btn.addEventListener('mousedown', clearFocus);
            btn.addEventListener('pointerdown', clearFocus);
        });
    </script>
</body>
</html>
