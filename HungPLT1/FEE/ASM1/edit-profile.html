<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CMS</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar">
            <div class="sidebar-header">
                CMS
            </div>
            <div class="sidebar-search">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Search...">
                    <div class="input-group-append">
                        <span class="input-group-text">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </span>
                    </div>
                </div>
            </div>
            <ul class="list-unstyled components">
                <li>
                    <a href="view-content.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                            <line x1="9" y1="9" x2="21" y2="9"></line>
                            <line x1="9" y1="15" x2="21" y2="15"></line>
                        </svg>
                        View contents
                    </a>
                </li>
                <li>
                    <a href="add-content.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                        Form content
                    </a>
                </li>
            </ul>
        </nav>

        <div class="main-content">
            <header class="top-navbar">
                <span class="navbar-brand-text">CMS Portal</span>
                <div class="dropdown">
                    <button class="btn dropdown-toggle" type="button" id="userMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </button>
                    <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userMenuButton">
                        <a class="dropdown-menu-item dropdown-item active" href="edit-profile.html">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            User Profile
                        </a>
                        <a class="dropdown-menu-item dropdown-item" href="login.html">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            Logout
                        </a>
                    </div>
                </div>
            </header>

            <div class="content-body">
                <h2 class="content-title">Edit Profile</h2>
                <div class="panel-card">
                    <div class="panel-header">Profile Form Elements</div>
                    <div class="panel-body">
                        <form id="profile-form" novalidate>
                            <div class="form-group">
                                <label for="firstname" class="font-weight-bold">First Name</label>
                                <input type="text" class="form-control" id="firstname" placeholder="Enter the first name" required maxlength="30">
                            </div>
                            <div class="form-group">
                                <label for="lastname" class="font-weight-bold">Last Name</label>
                                <input type="text" class="form-control" id="lastname" placeholder="Enter the last name" required maxlength="30">
                            </div>
                            <div class="form-group">
                                <label for="email" class="font-weight-bold">Email</label>
                                <input type="email" class="form-control" id="email" value="your_email@example.com" disabled>
                            </div>
                            <div class="form-group">
                                <label for="phone" class="font-weight-bold">Phone</label>
                                <input type="text" class="form-control" id="phone" placeholder="Enter your phone number" required>
                            </div>
                            <div class="form-group">
                                <label for="description" class="font-weight-bold">Description</label>
                                <textarea class="form-control" id="description" rows="4" placeholder="Enter description" maxlength="200"></textarea>
                            </div>
                            <div class="form-group mt-4">
                                <button type="submit" class="btn mr-2">Submit Button</button>
                                <button type="reset" class="btn">Reset Button</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/validation.js"></script>
</body>
</html>
