<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CMS</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">Register</div>
            <div class="auth-body">
                <form id="register-form" action="login.html" method="GET" novalidate>
                    <div class="form-group">
                        <input type="text" class="form-control" id="username" placeholder="User name" required maxlength="50">
                    </div>
                    <div class="form-group">
                        <input type="email" class="form-control" id="email" placeholder="E-mail" required maxlength="50">
                    </div>
                    <div class="form-group">
                        <input type="password" class="form-control" id="password" placeholder="Password" required maxlength="50">
                    </div>
                    <div class="form-group">
                        <input type="password" class="form-control" id="repassword" placeholder="Re Password" required>
                    </div>
                    <button type="submit" class="btn btn-block">Register</button>
                    <div class="text-center mt-3">
                        <a href="login.html" class="btn-link">Click here to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/validation.js"></script>
</body>
</html>
