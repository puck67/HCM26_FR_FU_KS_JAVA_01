<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polls - Home</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="vote.html">Polls</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="vote.html">Vote</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="create.html">Create</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="list.html">List</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="login-nav-btn">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="poll-card">
                    <h2 class="poll-title">Great poll</h2>
                    <form id="vote-form" novalidate>
                        <div class="question-item">
                            <div class="question-title">1. It is necessary to you? <span class="required-star">*</span></div>
                            <div class="form-check option-item">
                                <input class="form-check-input" type="radio" name="necessary" id="necessaryYes" value="Yes" required>
                                <label class="form-check-label" for="necessaryYes">Yes</label>
                            </div>
                            <div class="form-check option-item">
                                <input class="form-check-input" type="radio" name="necessary" id="necessaryNo" value="No">
                                <label class="form-check-label" for="necessaryNo">No</label>
                            </div>
                        </div>

                        <div class="question-item">
                            <div class="question-title">2. Often pass polls?</div>
                            <div class="form-check option-item">
                                <input class="form-check-input" type="radio" name="frequency" id="freqMonth" value="Once a month">
                                <label class="form-check-label" for="freqMonth">Once a month</label>
                            </div>
                            <div class="form-check option-item">
                                <input class="form-check-input" type="radio" name="frequency" id="freqWeek" value="Once a week">
                                <label class="form-check-label" for="freqWeek">Once a week</label>
                            </div>
                        </div>

                        <div class="question-item">
                            <div class="question-title">3. How old are you?</div>
                            <div class="form-check option-item">
                                <input class="form-check-input" type="checkbox" name="age" id="age18" value="18-20">
                                <label class="form-check-label" for="age18">18-20</label>
                            </div>
                            <div class="form-check option-item">
                                <input class="form-check-input" type="checkbox" name="age" id="age21" value="21-23">
                                <label class="form-check-label" for="age21">21-23</label>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn px-4">Retain</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="login-modal-container"></div>

    <script src="js/jquery.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
