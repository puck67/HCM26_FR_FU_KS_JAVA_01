<div class="login-modal-overlay" id="login-overlay-mask">
    <div class="login-card">
        <div class="login-card-header">Please Sign In</div>
        <form id="login-popup-form" novalidate>
            <div id="login-error-summary"></div>
            <div class="form-group">
                <label for="alias" class="font-weight-bold">Alias:</label>
                <input type="text" class="form-control" id="alias" placeholder="JoeSixpack" required>
            </div>
            <div class="form-group">
                <label for="password" class="font-weight-bold">Password:</label>
                <input type="password" class="form-control" id="password" placeholder="********" required>
            </div>
            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
            </div>
            <button type="submit" class="btn btn-block mb-2">Sign In</button>
            <button type="button" class="btn btn-block btn-secondary" id="login-close-btn">Close</button>
        </form>
    </div>
</div>
