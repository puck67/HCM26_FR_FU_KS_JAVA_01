<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Instructor Login - CourseShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">CourseShare</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center" style="margin-top: 100px;">
        <div class="col-md-5">
            <div class="card login-card p-4">
                <div class="card-body">
                    <h3 class="text-center fw-bold mb-4">Instructor Login</h3>
                    
                    <div th:if="${param.error}" class="alert alert-danger py-2">
                        Invalid username or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success py-2">
                        You have been logged out.
                    </div>

                    <form th:action="@{/instructor/login-process}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label text-muted fw-bold">Username</label>
                            <input type="text" class="form-control py-2" id="username" name="username" placeholder="Enter username" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label text-muted fw-bold">Password</label>
                            <input type="password" class="form-control py-2" id="password" name="password" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
