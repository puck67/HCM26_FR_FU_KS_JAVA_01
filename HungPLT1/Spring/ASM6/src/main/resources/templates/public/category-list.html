<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Category: ' + ${categoryName} + ' - CourseShare'">CourseShare - Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">CourseShare</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/instructor/login">Login</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row g-4">

        <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0" th:text="'Courses in Category: ' + ${categoryName}">Courses in Category</h3>
                <a href="/" class="btn btn-outline-secondary btn-sm">Clear Filter</a>
            </div>

            <div th:if="${courses == null or #lists.isEmpty(courses)}" class="alert alert-info">
                No courses found in this category.
            </div>

            <div th:each="course : ${courses}" class="card mb-3">
                <div class="card-body p-4">
                    <h5 class="card-title fw-bold" th:text="${course.title}">Course Title Example</h5>
                    <p class="card-text text-muted" th:text="${course.description}">Short description goes here...</p>
                    
                    <div class="mb-3" th:if="${course.category != null and !course.category.isEmpty()}">
                        <span th:each="tag : ${#strings.arraySplit(course.category, ',')}"
                              th:text="${#strings.trim(tag)}"
                              class="badge bg-secondary me-1">
                        </span>
                    </div>

                    <a th:href="@{'/course/' + ${course.id}}" class="btn btn-primary btn-sm">View Details</a>
                </div>
            </div>

            <nav th:if="${totalPages > 1}" class="mt-4">
                <ul class="pagination pagination-sm">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{'/category/' + ${categoryName}(page=${currentPage - 1})}">&laquo;</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{'/category/' + ${categoryName}(page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{'/category/' + ${categoryName}(page=${currentPage + 1})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="col-md-4">

            <div class="card mb-4">
                <div class="card-header py-3">Categories</div>
                <div class="card-body category-cloud p-3">
                    <span th:each="cat : ${categories}">
                        <a th:href="@{'/category/' + ${cat.name}}"
                           th:text="${cat.name}"
                           th:class="${cat.frequency > 10} ? 'size-3' : (${cat.frequency > 5} ? 'size-2' : 'size-1')"
                           th:classappend="${cat.name == categoryName ? 'border border-primary fw-bold text-decoration-underline' : ''}">
                        </a>
                    </span>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
