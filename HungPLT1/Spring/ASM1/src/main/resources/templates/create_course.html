<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Course - LMS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 20%, rgb(4, 5, 23) 0%, rgb(19, 21, 48) 90%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h2 {
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            transition: color 0.3s;
        }

        input, textarea {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.875rem 1.25rem;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus, textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            background: rgba(30, 41, 59, 0.8);
        }

        .input-error {
            border-color: #f87171;
            background: rgba(239, 68, 68, 0.05);
        }

        .input-error:focus {
            border-color: #f87171;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }

        .error-message {
            color: #f87171;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 12px;
            padding: 1rem;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            margin-top: 1rem;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>New Course</h2>
            <p>Fill out the form below to create a new course in the LMS.</p>
        </div>
        <form action="#" th:action="@{/courses/create}" th:object="${course}" method="post">
            <div class="form-group">
                <label for="title">Course Title</label>
                <input type="text" id="title" th:field="*{title}" th:classappend="${#fields.hasErrors('title')} ? 'input-error' : ''" placeholder="Enter course title"/>
                <div class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</div>
            </div>
            <div class="form-group">
                <label for="instructorName">Instructor Name</label>
                <input type="text" id="instructorName" th:field="*{instructorName}" th:classappend="${#fields.hasErrors('instructorName')} ? 'input-error' : ''" placeholder="Enter instructor name"/>
                <div class="error-message" th:if="${#fields.hasErrors('instructorName')}" th:errors="*{instructorName}">Instructor name error</div>
            </div>
            <div class="form-group">
                <label for="instructorEmail">Instructor Email</label>
                <input type="text" id="instructorEmail" th:field="*{instructorEmail}" th:classappend="${#fields.hasErrors('instructorEmail')} ? 'input-error' : ''" placeholder="email@example.com"/>
                <div class="error-message" th:if="${#fields.hasErrors('instructorEmail')}" th:errors="*{instructorEmail}">Email error</div>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" th:classappend="${#fields.hasErrors('description')} ? 'input-error' : ''" placeholder="Enter course description (10-200 characters)"></textarea>
                <div class="error-message" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</div>
            </div>
            <div class="form-group">
                <label for="durationHours">Duration (Hours)</label>
                <input type="number" id="durationHours" th:field="*{durationHours}" th:classappend="${#fields.hasErrors('durationHours')} ? 'input-error' : ''" placeholder="Min 1"/>
                <div class="error-message" th:if="${#fields.hasErrors('durationHours')}" th:errors="*{durationHours}">Duration error</div>
            </div>
            <button type="submit">Create Course</button>
        </form>
    </div>
</body>
</html>
