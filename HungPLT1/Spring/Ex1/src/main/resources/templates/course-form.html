<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Add a new course to the LMS system"/>
    <title>LMS Management - Add Course</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
    <!-- Banner -->
    <header th:replace="~{fragments/layout :: banner}"></header>

    <div class="main-container">
        <!-- Menu Left -->
        <nav th:replace="~{fragments/layout :: menuLeft('newCourse')}"></nav>

        <!-- Body Content -->
        <main class="body-content">

            <!-- Success Alert -->
            <div th:if="${successMessage}" class="alert alert-success" id="success-alert">
                <svg class="alert-icon" viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <span th:text="${successMessage}">Success</span>
            </div>

            <!-- Lesson Detail Link (shown after save) -->
            <div th:if="${savedCourseCode}" class="lesson-link-section">
                <a th:href="@{'/courses/' + ${savedCourseCode} + '/' + ${savedStartDate} + '/lessons'}"
                   class="lesson-detail-link" id="lesson-detail-link">Lesson Detail</a>
                <span class="lesson-detail-hint">Thêm chi tiết bài học</span>
            </div>

            <!-- Course Form -->
            <div class="form-container">
                <h2 class="form-title">Create New Course</h2>

                <form th:action="@{/courses/save}" method="post" id="course-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="courseCode">Mã khóa học / Course ID</label>
                            <input type="text" id="courseCode" name="courseCode"
                                   th:value="${savedCourseCode}" required/>
                        </div>
                        <div class="form-group">
                            <label for="startDate">Ngày khai giảng / Start Date</label>
                            <input type="date" id="startDate" name="startDate"
                                   th:value="${savedStartDate}" required/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="courseName">Tên khóa học / Course Name</label>
                        <input type="text" id="courseName" name="courseName"
                               th:value="${savedCourseName}" required/>
                    </div>

                    <div class="form-group">
                        <label for="category">Danh mục / Category</label>
                        <select id="category" name="category" required>
                            <option value="">-- Select Category --</option>
                            <option value="Technology" th:selected="${savedCategory == 'Technology'}">Technology</option>
                            <option value="Business" th:selected="${savedCategory == 'Business'}">Business</option>
                            <option value="Design" th:selected="${savedCategory == 'Design'}">Design</option>
                            <option value="Science" th:selected="${savedCategory == 'Science'}">Science</option>
                            <option value="Language" th:selected="${savedCategory == 'Language'}">Language</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="instructor">Giảng viên / Instructor</label>
                        <input type="text" id="instructor" name="instructor"
                               th:value="${savedInstructor}" required/>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="save-course-btn">Save Course</button>
                        <button type="reset" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
