<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Manage students in the LMS system"/>
    <title>LMS Management - Quản lý Học viên</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
</head>
<body>
    <!-- Banner -->
    <header th:replace="~{fragments/layout :: banner}"></header>

    <div class="main-container">
        <!-- Menu Left -->
        <nav th:replace="~{fragments/layout :: menuLeft('students')}"></nav>

        <!-- Body Content -->
        <main class="body-content">

            <!-- Success Alert -->
            <div th:if="${successMessage}" class="alert alert-success" id="success-alert">
                <svg class="alert-icon" viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <span th:text="${successMessage}">Success</span>
            </div>

            <!-- Header Actions -->
            <div class="lesson-link-section" style="justify-content: space-between; align-items: center;">
                <h2 class="table-title" style="margin-bottom: 0;">Danh sách Học viên / Student Management</h2>
                <a th:href="@{/students/new}" class="btn btn-primary" id="add-student-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    Thêm Học viên
                </a>
            </div>

            <!-- Students Table -->
            <div class="table-container" id="students-table-section" style="margin-top: 16px;">
                <table class="data-table" id="students-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Họ và tên</th>
                            <th>Email</th>
                            <th>Số điện thoại</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="student : ${students}" th:id="'student-row-' + ${student.id}">
                            <td th:text="${student.id}">1</td>
                            <td th:text="${student.name}" style="font-weight: 500;">Nguyen Van A</td>
                            <td th:text="${student.email}">a@gmail.com</td>
                            <td th:text="${student.phone != null && !student.phone.isEmpty() ? student.phone : '-'}">0987654321</td>
                            <td class="action-links">
                                <a th:href="@{'/students/edit/' + ${student.id}}"
                                   class="action-edit"
                                   th:id="'edit-student-' + ${student.id}">Edit</a>
                                <span class="action-separator">/</span>
                                <a th:href="@{'/students/' + ${student.id} + '/delete'}"
                                   class="action-delete"
                                   th:id="'delete-student-' + ${student.id}">Delete</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="5" class="empty-table">Chưa có học viên nào. Hãy thêm học viên mới!</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <!-- Custom Delete Confirmation Modal -->
    <div id="delete-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <svg class="modal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
                <span class="modal-title">Confirm Delete</span>
            </div>
            <div class="modal-body">
                <p>Do you want to delete this student?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-modal btn-yes" id="confirm-delete-btn">Yes</button>
                <button type="button" class="btn-modal btn-no" id="cancel-delete-btn">No</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var deleteModal = document.getElementById('delete-modal');
            var confirmDeleteBtn = document.getElementById('confirm-delete-btn');
            var cancelDeleteBtn = document.getElementById('cancel-delete-btn');
            var deleteUrl = '';

            // Get all delete links
            var deleteLinks = document.querySelectorAll('.action-delete');
            deleteLinks.forEach(function(link) {
                link.addEventListener('click', function(e) {
                    e.preventDefault(); // Stop navigation
                    deleteUrl = this.getAttribute('href'); // Save the URL
                    deleteModal.style.display = 'flex'; // Show modal
                });
            });

            // Handle Cancel button click
            cancelDeleteBtn.addEventListener('click', function() {
                deleteModal.style.display = 'none'; // Hide modal
                deleteUrl = ''; // Clear URL
            });

            // Handle Yes button click
            confirmDeleteBtn.addEventListener('click', function() {
                if (deleteUrl) {
                    window.location.href = deleteUrl; // Go to delete URL
                }
            });

            // Close modal when clicking outside the modal box
            deleteModal.addEventListener('click', function(e) {
                if (e.target === deleteModal) {
                    deleteModal.style.display = 'none';
                    deleteUrl = '';
                }
            });
        });
    </script>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
