<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ==================== BANNER FRAGMENT ==================== -->
<header th:fragment="banner" class="banner">
    <div class="banner-content">
        <div class="banner-logo">
            <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="8" width="24" height="28" rx="2" fill="#fff" opacity="0.9"/>
                <rect x="12" y="4" width="24" height="28" rx="2" fill="#fff"/>
                <line x1="16" y1="12" x2="32" y2="12" stroke="#4a7c9b" stroke-width="2"/>
                <line x1="16" y1="17" x2="32" y2="17" stroke="#4a7c9b" stroke-width="2"/>
                <line x1="16" y1="22" x2="28" y2="22" stroke="#4a7c9b" stroke-width="2"/>
            </svg>
            <span class="banner-title">LMS MANAGEMENT SYSTEM</span>
        </div>
        <div class="banner-center" th:text="${bannerText != null ? bannerText : 'Banner'}">Banner</div>
        <div class="banner-right">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/>
                </svg>
                <input type="text" placeholder="Search" class="search-input"/>
            </div>
            <div class="user-avatar">
                <svg viewBox="0 0 24 24" fill="white" width="24" height="24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
        </div>
    </div>
</header>

<!-- ==================== MENU LEFT FRAGMENT ==================== -->
<nav th:fragment="menuLeft(activeMenu)" class="menu-left">
    <a href="/courses/new" class="menu-item" th:classappend="${activeMenu == 'newCourse'} ? 'active' : ''">
        <div class="menu-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
        </div>
        <div class="menu-text">
            <span class="menu-label-vi">Thêm mới Khóa học</span>
            <span class="menu-label-en">Add a new Course</span>
        </div>
    </a>
    <a href="/courses" class="menu-item" th:classappend="${activeMenu == 'courses'} ? 'active' : ''">
        <div class="menu-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/>
            </svg>
        </div>
        <div class="menu-text">
            <span class="menu-label-vi">Quản lý Khóa học</span>
            <span class="menu-label-en">Courses Management</span>
        </div>
    </a>
    <a href="/students" class="menu-item" th:classappend="${activeMenu == 'students'} ? 'active' : ''">
        <div class="menu-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
            </svg>
        </div>
        <div class="menu-text">
            <span class="menu-label-vi">Quản lý Học viên</span>
            <span class="menu-label-en">Students Management</span>
        </div>
    </a>
</nav>
