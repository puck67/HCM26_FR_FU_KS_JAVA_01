<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Registration</h3>
                    </div>
                    <div class="card-body">
                        <form id="registerForm">
                            <div class="form-group">
                                <label for="userName">User name</label>
                                <input type="text" class="form-control" id="userName" placeholder="User name" size="50" required>
                            </div>
                            <div class="form-group">
                                <label for="regEmail">E-mail</label>
                                <input type="email" class="form-control" id="regEmail" placeholder="E-mail" size="50" required>
                            </div>
                            <div class="form-group">
                                <label for="regPassword">Password</label>
                                <input type="password" class="form-control" id="regPassword" placeholder="Password" size="50" required>
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">Re Password</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Re Password" size="50" required>
                            </div>
                            <button type="submit" class="btn btn-block">Register</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="index.html">Click here to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
