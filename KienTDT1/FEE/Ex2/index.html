<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Lite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>My Project Board</h1>

    <!-- Problem 03 -->
    

    <div class="board" id="board">

        <div class="column todo" id="todoTasks">
            <h2>TO DO</h2>

            <div class="add-task">
                <input type="text" class="task-input" placeholder="Add a task to To Do">
                <button class="add-btn">+</button>
            </div>
        </div>

        <div class="column progress" id="progressTasks">
            <h2>IN PROGRESS</h2>

            <div class="add-task">
                <input type="text" class="task-input" placeholder="Add a task to In Progress">
                <button class="add-btn">+</button>
            </div>
        </div>

        <div class="column done" id="doneTasks">
            <h2>DONE</h2>

            <div class="add-task">
                <input type="text" class="task-input" placeholder="Add a task to Done">
                <button class="add-btn">+</button>
            </div>
        </div>

    </div>
</div>
<script src="script.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="jquery-script.js"></script>
</body>
</html>
