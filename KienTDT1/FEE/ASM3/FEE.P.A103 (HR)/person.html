<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Person Screen</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.6.2/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container mt-4">

    <img src="images/banner.svg"
         class="img-fluid w-100 banner-image">

    <div class="card">

        <div class="card-header section-title">
            Visitor Information
        </div>

        <div class="card-body">

            <form id="visitorForm">

                <div class="form-group row">
                    <label class="col-md-3">First name</label>
                    <div class="col-md-9">
                        <input type="text"
                               id="firstName"
                               class="form-control"
                               placeholder="First name">
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-md-3">Last name</label>
                    <div class="col-md-9">
                        <input type="text"
                               id="lastName"
                               class="form-control"
                               placeholder="Last name">
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-md-3">Gender</label>
                    <div class="col-md-9">

                        <select id="gender"
                                class="form-control">

                            <option>Male</option>
                            <option>Female</option>

                        </select>

                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-md-3">Telephone</label>
                    <div class="col-md-9">

                        <input type="text"
                               id="telephone"
                               class="form-control"
                               placeholder="Telephone">

                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-md-3">Email</label>
                    <div class="col-md-9">

                        <input type="email"
                               id="email"
                               class="form-control"
                               placeholder="Email">

                    </div>
                </div>

                <div class="form-group row">

                    <label class="col-md-3">
                        You are in
                    </label>

                    <div class="col-md-9">

                        <div class="form-check form-check-inline">
                            <input type="radio"
                                   name="region"
                                   value="Europe">
                            Europe
                        </div>

                        <div class="form-check form-check-inline">
                            <input type="radio"
                                   name="region"
                                   value="Africa">
                            Africa
                        </div>

                        <div class="form-check form-check-inline">
                            <input type="radio"
                                   name="region"
                                   value="Australia">
                            Australia
                        </div>

                        <div class="form-check form-check-inline">
                            <input type="radio"
                                   name="region"
                                   value="Asia">
                            Asia
                        </div>

                        <div class="form-check form-check-inline">
                            <input type="radio"
                                   name="region"
                                   value="America">
                            America
                        </div>

                    </div>

                </div>

                <div class="form-group row">

                    <label class="col-md-3">
                        Hobbies
                    </label>

                    <div class="col-md-9">

                        <input type="checkbox" value="Swimming"> Swimming
                        <input type="checkbox" value="Cooking"> Cooking
                        <input type="checkbox" value="Shopping"> Shopping
                        <input type="checkbox" value="Sport"> Sport
                        <input type="checkbox" value="Dance"> Dance
                        <input type="checkbox" value="Singing"> Singing

                    </div>

                </div>

                <div class="form-group row">

                    <label class="col-md-3">
                        Description
                    </label>

                    <div class="col-md-9">

                        <textarea id="description"
                                  rows="5"
                                  class="form-control"
                                  placeholder="Description"></textarea>

                    </div>

                </div>

                <div class="text-center">

                    <button type="button"
                            id="btnRegister"
                            class="btn btn-success">
                        Register
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
