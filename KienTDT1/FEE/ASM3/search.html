<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Visitor</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.6.2/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container mt-4">

    <img src="images/banner.svg"
         class="img-fluid w-100 banner-image">

    <div class="card">

        <div class="card-header section-title">
            Search Visitor
        </div>

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-8">

                    <input type="text"
                           id="txtSearch"
                           class="form-control"
                           placeholder="Type Firstname Visitor and Click Search button">

                </div>

                <div class="col-md-4">

                    <button class="btn btn-success"
                            id="btnSearch">
                        Search
                    </button>

                </div>

            </div>

            <div class="table-responsive">

                <table class="table table-bordered">

                    <thead>

                    <tr>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Gender</th>
                        <th>Telephone</th>
                        <th>Email</th>
                        <th>Region</th>
                        <th>Hobbies</th>
                        <th>Description</th>
                    </tr>

                    </thead>

                    <tbody id="visitorTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
