<!DOCTYPE html>
<html>
<head>
    <title>Vote</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <a class="navbar-brand" href="#">Polls</a>

    <div class="navbar-nav">
        <a class="nav-link" href="index.html">Vote</a>
        <a class="nav-link" href="create.html">Create</a>
        <a class="nav-link" href="list.html">List</a>
    </div>

    <div class="ml-auto">
        <a class="nav-link text-white"
           href="#"
           data-toggle="modal"
           data-target="#loginModal">
            Login
        </a>
    </div>

</nav>

<div class="container mt-5">

    <h1>Great poll</h1>

    <p>1. it is necessary to you ? *</p>

    <div class="form-check">
        <input type="radio" name="q1" class="form-check-input">
        <label class="form-check-label">Yes</label>
    </div>

    <div class="form-check">
        <input type="radio" name="q1" class="form-check-input">
        <label class="form-check-label">No</label>
    </div>

    <br>

    <p>2. Often pass polls?</p>

    <div class="form-check">
        <input type="radio" name="q2" class="form-check-input">
        <label class="form-check-label">Once a month</label>
    </div>

    <div class="form-check">
        <input type="radio" name="q2" class="form-check-input">
        <label class="form-check-label">Once a week</label>
    </div>

    <br>

    <p>3. How old are you?</p>

    <div class="form-check">
        <input type="radio" name="q3" class="form-check-input">
        <label class="form-check-label">18-20</label>
    </div>

    <div class="form-check">
        <input type="radio" name="q3" class="form-check-input">
        <label class="form-check-label">21-23</label>
    </div>

    <br>

    <button class="btn btn-white">
        Retain
    </button>

</div>

<!-- Login Modal -->

<div class="modal fade" id="loginModal">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-body">

                <label>Alias:</label>

                <input type="text"
                       class="form-control"
                       placeholder="JoeSixpack">

                <br>

                <label>Password:</label>

                <input type="password"
                       class="form-control"
                       placeholder="********">

                <br>

                <div class="form-check">

                    <input type="checkbox"
                           class="form-check-input">

                    <label class="form-check-label">
                        Remember me
                    </label>

                </div>

                <br>

                <button class="btn btn-green">
                    Sign In
                </button>

            </div>

            <div class="modal-footer">

                <button class="btn btn-white"
                        data-dismiss="modal">
                    Close
                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/main.js"></script>

</body>
</html>
