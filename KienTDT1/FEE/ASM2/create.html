<!DOCTYPE html>
<html>
<head>
    <title>Create Poll</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <a class="navbar-brand">Polls</a>

    <div class="navbar-nav">
        <a class="nav-link" href="index.html">Vote</a>
        <a class="nav-link" href="create.html">Create</a>
        <a class="nav-link" href="list.html">List</a>
    </div>

</nav>

<div class="container mt-5">

    <h1>Create Interview</h1>

    <div id="errorBox"
         class="alert alert-danger d-none">
    </div>

    <input id="pollName"
           class="form-control"
           placeholder="Name poll">

    <br>

    <div id="questionContainer">

        <div class="question-block border p-3 mb-3">

            <input class="form-control question"
                   placeholder="Enter your question">

            <br>

            <div class="form-check">
                <input type="checkbox"
                       class="form-check-input">

                <label class="form-check-label">
                    Mandatory
                </label>
            </div>

            <br>

            <div class="form-check">
                <input type="checkbox"
                       class="form-check-input">

                <label class="form-check-label">
                    You can select multiple options
                </label>
            </div>

            <br>

            <label>Possible answers</label>

            <div class="answerContainer">

                <div class="input-group mb-2">

                    <input type="text"
                           class="form-control answer"
                           placeholder="Type your answer">

                    <div class="input-group-append">

                        <button type="button"
                                class="btn btn-info addAnswer">
                            +
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <button id="addQuestion"
            class="btn btn-green">
        + Add question
    </button>

    <br><br>

    <button id="btnSave"
            class="btn btn-white">
        Retain
    </button>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="js/main.js"></script>

</body>
</html>
