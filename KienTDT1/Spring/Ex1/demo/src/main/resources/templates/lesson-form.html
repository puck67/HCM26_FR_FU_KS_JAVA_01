<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lesson Detail</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <header class="banner">
        <h1>LMS Management System</h1>
    </header>
    <main class="main">
        <nav class="menu-left">
            <ul>
                <li><a th:href="@{/courses/new}">Add a new Course</a></li>
                <li><a th:href="@{/courses}">Courses Management</a></li>
                <li><a th:href="@{/students}">Students Management</a></li>
            </ul>
        </nav>
        <section class="body-content">
            <div class="summary">
                <div><strong>Course Code:</strong> <span th:text="${course.courseCode}"></span></div>
                <div><strong>Start Date:</strong> <span th:text="${course.startDate}"></span></div>
            </div>

            <form class="form-panel"
                  th:action="@{/courses/{courseCode}/{startDate}/lessons(courseCode=${course.courseCode},startDate=${course.startDate})}"
                  th:object="${lesson}"
                  method="post">
                <input type="hidden" th:field="*{id}">
                <div class="form-row">
                    <label for="lessonName">Lesson Name</label>
                    <input id="lessonName" type="text" th:field="*{lessonName}" required>
                </div>
                <div class="form-row">
                    <label for="duration">Duration</label>
                    <input id="duration" type="number" min="1" th:field="*{duration}" required>
                </div>
                <div class="form-row">
                    <label for="contentType">Content Type</label>
                    <select id="contentType" th:field="*{contentType}" required>
                        <option value="">-- Select --</option>
                        <option value="Video">Video</option>
                        <option value="Theory">Theory</option>
                        <option value="Practice">Practice</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="status">Status</label>
                    <select id="status" th:field="*{status}" required>
                        <option value="">-- Select --</option>
                        <option value="Draft">Draft</option>
                        <option value="Open">Open</option>
                        <option value="Locked">Locked</option>
                    </select>
                </div>
                <div class="actions">
                    <button type="submit">Save Lesson</button>
                </div>
            </form>

            <table th:if="${!lessons.isEmpty()}">
                <thead>
                <tr>
                    <th>Lesson Name</th>
                    <th>Duration</th>
                    <th>Content Type</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${lessons}">
                    <td th:text="${item.lessonName}"></td>
                    <td th:text="${item.duration}"></td>
                    <td th:text="${item.contentType}"></td>
                    <td th:text="${item.status}"></td>
                    <td>
                        <a th:href="@{/courses/{courseCode}/{startDate}/lessons(courseCode=${course.courseCode},startDate=${course.startDate},editId=${item.id})}">Edit</a>
                        |
                        <a th:href="@{/courses/{courseCode}/{startDate}/lessons/{lessonId}/delete(courseCode=${course.courseCode},startDate=${course.startDate},lessonId=${item.id})}"
                           onclick="return confirm('Do you want to delete this lesson?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <p class="empty" th:if="${lessons.isEmpty()}">No lessons have been added for this course.</p>
        </section>
    </main>
    <footer class="footer">Copyright © LMS Management System</footer>
</div>
</body>
</html>
