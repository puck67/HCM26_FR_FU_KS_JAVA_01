<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Dashboard</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Dashboard</h2>
        <a th:href="@{/menus}" class="btn btn-outline-primary">
            <i class="bi bi-list-ul"></i> Manage Menus
        </a>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card stat-card p-4">
                <div class="text-muted">Total Menus</div>
                <h2 class="mt-2 mb-0 text-primary" th:text="${totalMenus}">0</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card p-4">
                <div class="text-muted">Total Parent Menus</div>
                <h2 class="mt-2 mb-0 text-success" th:text="${totalParents}">0</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card p-4">
                <div class="text-muted">Total Sub Menus</div>
                <h2 class="mt-2 mb-0 text-info" th:text="${totalSubs}">0</h2>
            </div>
        </div>
    </div>

    <div class="card stat-card mt-4 p-4">
        <h5>Dynamic Menu System</h5>
        <p class="text-muted mb-0">
            Sidebar is loaded from database. Switch role above to see role-based menus.
            Add new menus via Menu Management without editing sidebar HTML.
        </p>
    </div>
</div>
</body>
</html>
