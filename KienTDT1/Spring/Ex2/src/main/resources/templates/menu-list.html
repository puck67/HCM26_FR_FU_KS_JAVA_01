<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Menu List</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Menu Management</h2>
        <a th:href="@{/menus/add}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Add Menu
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card stat-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>URL</th>
                    <th>Icon</th>
                    <th>Parent</th>
                    <th>Order</th>
                    <th>Status</th>
                    <th>Roles</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${menus}">
                    <td th:text="${m.id}"></td>
                    <td th:text="${m.name}"></td>
                    <td th:text="${m.url != null ? m.url : '-'}"></td>
                    <td>
                        <i th:if="${m.icon != null}" th:class="'bi ' + ${m.icon}"></i>
                        <span th:if="${m.icon == null}">-</span>
                    </td>
                    <td th:text="${m.parent != null ? m.parent.name : 'Root'}"></td>
                    <td th:text="${m.displayOrder}"></td>
                    <td>
                        <span th:class="${m.status} ? 'badge bg-success' : 'badge bg-secondary'"
                              th:text="${m.status} ? 'Active' : 'Inactive'"></span>
                    </td>
                    <td>
                        <span th:each="r, stat : ${m.roles}"
                              class="badge bg-info text-dark me-1"
                              th:text="${r.name}"></span>
                        <span th:if="${#sets.isEmpty(m.roles)}" class="text-muted">All</span>
                    </td>
                    <td>
                        <a th:href="@{/menus/edit/{id}(id=${m.id})}" class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a th:href="@{/menus/delete/{id}(id=${m.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Delete this menu?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
