<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${isEdit} ? 'Edit Menu' : 'Add Menu'">Menu Form</title>
</head>
<body>
<div th:fragment="content">
    <h2 th:text="${isEdit} ? 'Edit Menu' : 'Add Menu'" class="mb-4"></h2>

    <div class="card stat-card p-4">
        <form th:action="@{/menus/save}" th:object="${menu}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" th:field="*{name}" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">URL</label>
                    <input type="text" class="form-control" th:field="*{url}" placeholder="/example">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Icon (Bootstrap Icons)</label>
                    <input type="text" class="form-control" th:field="*{icon}" placeholder="bi-house">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Parent Menu</label>
                    <select name="parentId" class="form-select">
                        <option value="">Root (No Parent)</option>
                        <option th:each="p : ${parents}"
                                th:value="${p.id}"
                                th:text="${p.name}"
                                th:selected="${menu.parent != null and menu.parent.id == p.id}">
                        </option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Display Order</label>
                    <input type="number" class="form-control" th:field="*{displayOrder}" value="0">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select class="form-select" th:field="*{status}">
                        <option th:value="true">Active</option>
                        <option th:value="false">Inactive</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Roles (empty = all roles)</label>
                    <select name="roleIds" class="form-select" multiple size="3">
                        <option th:each="r : ${allRoles}"
                                th:value="${r.id}"
                                th:text="${r.name}"
                                th:selected="${menu.roles != null and !menu.roles.?[id == r.id].empty}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Save
                </button>
                <a th:href="@{/menus}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
