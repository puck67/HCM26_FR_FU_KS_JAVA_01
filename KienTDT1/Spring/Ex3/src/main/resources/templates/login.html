<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LMS Security</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            padding: 2.5rem 2rem;
            transition: transform 0.2s;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.75rem;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }

        .form-label {
            font-weight: 500;
            font-size: 0.875rem;
            color: #475569;
        }

        .form-control {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn-login {
            background: linear-gradient(90deg, #4f46e5 0%, #6366f1 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-login:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.35);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            font-size: 0.825rem;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            border: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-icon">
            <i class="fa-solid fa-lock"></i>
        </div>
        
        <h4 class="text-center fw-bold mb-1 text-dark">Sign In</h4>
        <p class="text-center text-muted small mb-4">Access your system panel</p>

        <!-- Alerts -->
        <div th:if="${param.error}" class="alert alert-danger mb-3">
            <span th:if="${session != null and session.SPRING_SECURITY_LAST_EXCEPTION != null}"
                  th:text="${session.SPRING_SECURITY_LAST_EXCEPTION.message}">
                Invalid Username or Password.
            </span>
            <span th:unless="${session != null and session.SPRING_SECURITY_LAST_EXCEPTION != null}">
                Invalid Username or Password.
            </span>
        </div>

        <div th:if="${param.logout}" class="alert alert-success mb-3">
            You have been signed out successfully.
        </div>

        <!-- Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-radius: 8px 0 0 8px; border-color: #cbd5e1;"><i class="fa-regular fa-user text-muted"></i></span>
                    <input type="text" id="username" name="username" class="form-control border-start-0" style="border-radius: 0 8px 8px 0;" placeholder="Enter username" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-radius: 8px 0 0 8px; border-color: #cbd5e1;"><i class="fa-solid fa-key text-muted"></i></span>
                    <input type="password" id="password" name="password" class="form-control border-start-0" style="border-radius: 0 8px 8px 0;" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100 mb-2">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
            </button>
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
