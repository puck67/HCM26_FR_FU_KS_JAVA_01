<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: main-layout(~{::content}, 'Role Management')}">
<body>
    <div th:fragment="content">
        
        <!-- Header Actions -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <p class="text-secondary m-0">Define organizational roles for system-wide access control authorization rules.</p>
            </div>
            <div>
                <a th:href="@{/roles/add}" class="btn btn-primary d-flex align-items-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add New Role</span>
                </a>
            </div>
        </div>

        <!-- Roles Table Card -->
        <div class="card">
            <div class="card-header bg-white d-flex align-items-center justify-content-between">
                <h5 class="m-0 fw-bold"><i class="fa-solid fa-user-shield text-primary me-2"></i>System Roles</h5>
                <span class="badge bg-secondary" th:text="${roles.size()} + ' Total Roles'">0 Roles</span>
            </div>
            
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-secondary small text-uppercase">
                        <tr>
                            <th class="ps-4">Role ID</th>
                            <th>Role Name</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="role : ${roles}">
                            <td class="ps-4 fw-semibold text-secondary" th:text="'#' + ${role.roleId}"></td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="rounded-circle bg-light d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                                        <i class="fa-solid fa-shield-halved text-info" style="font-size: 0.9rem;"></i>
                                    </div>
                                    <span class="fw-semibold text-dark" th:text="${role.roleName}"></span>
                                </div>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group gap-1">
                                    <a th:href="@{/roles/edit/{id}(id=${role.roleId})}" class="btn btn-sm btn-outline-primary" title="Edit Role">
                                        <i class="fa-solid fa-pen"></i> Edit
                                    </a>
                                    <!-- Delete option (disables delete of SUPER_ADMIN as protective measure) -->
                                    <a th:if="${!#strings.equals(role.roleName, 'SUPER_ADMIN')}"
                                       th:href="@{/roles/delete/{id}(id=${role.roleId})}" 
                                       th:data-rolename="${role.roleName}"
                                       onclick="return confirm('Are you sure you want to delete role: ' + this.getAttribute('data-rolename') + '? This will clear the role from all associated users.');" 
                                       class="btn btn-sm btn-outline-danger" 
                                       title="Delete Role">
                                        <i class="fa-solid fa-trash-can"></i> Delete
                                    </a>
                                    <button th:if="${#strings.equals(role.roleName, 'SUPER_ADMIN')}"
                                            class="btn btn-sm btn-outline-secondary" 
                                            disabled 
                                            title="SUPER_ADMIN role cannot be deleted">
                                        <i class="fa-solid fa-lock"></i> Locked
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
