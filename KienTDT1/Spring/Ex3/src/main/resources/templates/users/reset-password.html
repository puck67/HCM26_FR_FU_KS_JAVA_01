<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main-layout(~{::content}, 'Reset Password')}">
<body>
    <div th:fragment="content">
        
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <!-- Back Link -->
                <div class="mb-3">
                    <a th:href="@{/users}" class="text-decoration-none text-secondary">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to User List
                    </a>
                </div>

                <!-- Form Card -->
                <div class="card shadow-sm">
                    <div class="card-header bg-white border-bottom py-3">
                        <h5 class="fw-bold m-0 text-warning"><i class="fa-solid fa-key me-2"></i>Reset User Password</h5>
                    </div>
                    
                    <div class="card-body p-4">
                        <form th:action="@{/users/reset-password/{id}(id=${user.userId})}" method="post">
                            
                            <!-- Username (Readonly) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" class="form-control bg-light" th:value="${user.username}" readonly>
                            </div>

                            <!-- Full Name (Readonly) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" class="form-control bg-light" th:value="${user.fullName}" readonly>
                            </div>

                            <!-- New Password -->
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">New Password <span class="text-danger">*</span></label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Enter new secure password" required minlength="4">
                                <div class="form-text">Minimum password length is 4 characters.</div>
                            </div>

                            <hr class="my-4">

                            <!-- Actions -->
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/users}" class="btn btn-outline-secondary px-4">Cancel</a>
                                <button type="submit" class="btn btn-warning px-4 text-dark fw-semibold">
                                    <i class="fa-solid fa-rotate-left me-1"></i> Update Password
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
