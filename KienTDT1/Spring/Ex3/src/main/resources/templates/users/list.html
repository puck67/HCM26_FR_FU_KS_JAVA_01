<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{fragments/layout :: main-layout(~{::content}, 'User Management')}">
<body>
    <div th:fragment="content">
        
        <!-- Header Actions -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <p class="text-secondary m-0">Manage system users, assign access privileges, and change account statuses.</p>
            </div>
            <div>
                <a th:href="@{/users/add}" class="btn btn-primary d-flex align-items-center gap-2">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Add New User</span>
                </a>
            </div>
        </div>

        <!-- Users Table Card -->
        <div class="card">
            <div class="card-header bg-white d-flex align-items-center justify-content-between">
                <h5 class="m-0 fw-bold"><i class="fa-solid fa-users text-primary me-2"></i>User Database</h5>
                <span class="badge bg-secondary" th:text="${users.size()} + ' Total Users'">0 Users</span>
            </div>
            
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-secondary small text-uppercase">
                        <tr>
                            <th class="ps-4">User ID</th>
                            <th>Username</th>
                            <th>Full Name</th>
                            <th>Roles</th>
                            <th>Status</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="ps-4 fw-semibold text-secondary" th:text="'#' + ${user.userId}"></td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="rounded-circle bg-light d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                                        <i class="fa-regular fa-user text-primary" style="font-size: 0.9rem;"></i>
                                    </div>
                                    <span class="fw-medium text-dark" th:text="${user.username}"></span>
                                </div>
                            </td>
                            <td th:text="${user.fullName}"></td>
                            <td>
                                <span th:each="role : ${user.roles}" 
                                      class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-10 rounded-pill me-1 small" 
                                      th:text="${role.roleName}">
                                </span>
                            </td>
                            <td>
                                <span th:if="${#strings.equalsIgnoreCase(user.status, 'Active')}" class="badge-active">
                                    <i class="fa-solid fa-circle-check me-1" style="font-size: 0.75rem;"></i>Active
                                </span>
                                <span th:if="${#strings.equalsIgnoreCase(user.status, 'Inactive')}" class="badge-inactive">
                                    <i class="fa-solid fa-circle-xmark me-1" style="font-size: 0.75rem;"></i>Inactive
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group gap-1">
                                    <a th:href="@{/users/edit/{id}(id=${user.userId})}" class="btn btn-sm btn-outline-primary" title="Edit User">
                                        <i class="fa-solid fa-user-pen"></i> Edit
                                    </a>
                                    <a th:href="@{/users/reset-password/{id}(id=${user.userId})}" class="btn btn-sm btn-outline-warning" title="Reset Password">
                                        <i class="fa-solid fa-key"></i> Reset
                                    </a>
                                    <a th:href="@{/users/delete/{id}(id=${user.userId})}" 
                                       th:data-username="${user.username}"
                                       onclick="return confirm('Are you sure you want to delete user: ' + this.getAttribute('data-username') + '?');" 
                                       class="btn btn-sm btn-outline-danger" 
                                       title="Delete User">
                                        <i class="fa-solid fa-trash-can"></i> Delete
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
