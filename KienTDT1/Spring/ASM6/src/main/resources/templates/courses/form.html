<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.id} ? 'Edit Course' : 'New Course'">Course Form - LMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Learning Management System</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/courses" class="active">Courses</a>
                <a href="/students">Students</a>
                <a href="/enrollments">Enrollments</a>
            </nav>
        </header>
        <main>
            <div class="page-header">
                <h2 th:text="${course.id} ? 'Edit Course' : 'New Course'">Course Form</h2>
            </div>
            <div class="form-container">
                <form th:action="${course.id} ? @{/courses/update/{id}(id=${course.id})} : @{/courses/save}" th:object="${course}" method="post">
                    <div class="form-group">
                        <label for="code">Course Code:</label>
                        <input type="text" id="code" th:field="*{code}" required>
                    </div>
                    <div class="form-group">
                        <label for="name">Course Name:</label>
                        <input type="text" id="name" th:field="*{name}" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description:</label>
                        <textarea id="description" th:field="*{description}" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="credits">Credits:</label>
                        <input type="number" id="credits" th:field="*{credits}" required min="1">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" th:text="${course.id} ? 'Update' : 'Save'">Save</button>
                        <a href="/courses" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
        <footer>
            <p>&copy; 2024 Learning Management System</p>
        </footer>
    </div>
</body>
</html>
