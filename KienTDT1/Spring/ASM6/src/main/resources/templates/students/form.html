<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${student.id} ? 'Edit Student' : 'New Student'">Student Form - LMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Learning Management System</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/courses">Courses</a>
                <a href="/students" class="active">Students</a>
                <a href="/enrollments">Enrollments</a>
            </nav>
        </header>
        <main>
            <div class="page-header">
                <h2 th:text="${student.id} ? 'Edit Student' : 'New Student'">Student Form</h2>
            </div>
            <div class="form-container">
                <form th:action="${student.id} ? @{/students/update/{id}(id=${student.id})} : @{/students/save}" th:object="${student}" method="post">
                    <div class="form-group">
                        <label for="studentId">Student ID:</label>
                        <input type="text" id="studentId" th:field="*{studentId}" required>
                    </div>
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" th:field="*{name}" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" th:field="*{email}" required>
                    </div>
                    <div class="form-group">
                        <label for="enrollmentDate">Enrollment Date:</label>
                        <input type="date" id="enrollmentDate" th:field="*{enrollmentDate}" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" th:text="${student.id} ? 'Update' : 'Save'">Save</button>
                        <a href="/students" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
        <footer>
            <p>&copy; 2024 Learning Management System</p>
        </footer>
    </div>
</body>
</html>
