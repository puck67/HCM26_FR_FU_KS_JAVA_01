<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List Manager - jQuery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Load jQuery via CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Shopping List Manager <small>(jQuery version)</small></h1>
        
        <div class="form-group">
            <div class="input-control">
                <label for="item-name">Item Name</label>
                <input type="text" id="item-name" placeholder="e.g., Apples">
            </div>
            <div class="input-control">
                <label for="item-cost">Item Cost ($)</label>
                <input type="number" id="item-cost" placeholder="e.g., 2.50" step="0.01">
            </div>
            <button id="add-btn">Add Item +</button>
        </div>

        <table id="shopping-table">
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Cost ($)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Items will be added here -->
            </tbody>
        </table>

        <div class="footer">
            <span class="total-label">Grand Total:</span>
            <span id="grand-total" class="total-amount">$0.00</span>
        </div>
    </div>

    <!-- Script version for Problem 03 -->
    <script src="app-jquery.js"></script>
</body>
</html>
