<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Visitor</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <div class="container mt-4 mb-5 shadow p-0 main-container" style="max-width: 900px;">
        <img src="banner.png" alt="Banner" class="banner-img">
        <div class="px-4 pb-4 m-3 inner-container border">
            <h5 class="title-text pt-3 mb-4">Search Visitor</h5>
            <div class="form-inline mb-4">
                <label for="searchInput" class="mr-2">First name:</label>
                <input type="text" class="form-control mr-2" id="searchInput" placeholder="Search keyword...">
                <button type="button" class="btn btn-success mr-2" id="btnSearch">Search...</button>
                <span style="font-size: 0.9em; color: gray;">(Type First name Visitor and Click Search button)</span>
            </div>
            
            <div class="table-responsive">
                <table class="table table-bordered table-striped" id="visitorTable">
                    <thead class="thead-light">
                        <tr>
                            <th>First name</th>
                            <th>Last name</th>
                            <th>Gender</th>
                            <th>Telephone</th>
                            <th>You're in</th>
                            <th>Hobbies</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
