<div class="popup-overlay" id="loginPopup">
    <div class="popup-content">
        <form id="loginForm">
            <div class="form-group">
                <label>Alias:</label>
                <input type="text" class="form-control" id="alias" placeholder="JoeSixpack">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" class="form-control" id="password" placeholder="********">
            </div>
            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <button type="submit" class="btn">Sign In</button>
            </div>
            <div class="text-center mt-3">
                <button type="button" class="btn btn-secondary bg-white text-dark border-secondary" id="closeLoginBtn">Close</button>
            </div>
        </form>
    </div>
</div>
