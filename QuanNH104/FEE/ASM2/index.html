<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote - Polls</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand" href="index.html">Polls</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="index.html">Vote</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="create.html">Create</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="list.html">List</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link login-btn" href="#" id="loginBtn">Login</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container main-container">
        <h2>Great poll</h2>
        <form>
            <div class="form-group mt-4">
                <label>1. It is necessary to you? <span class="text-danger">*</span></label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q1" id="q1a" value="Yes">
                    <label class="form-check-label" for="q1a">Yes</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q1" id="q1b" value="No">
                    <label class="form-check-label" for="q1b">No</label>
                </div>
            </div>

            <div class="form-group mt-4">
                <label>2. Often pass polls?</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q2" id="q2a" value="Once a month">
                    <label class="form-check-label" for="q2a">Once a month</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q2" id="q2b" value="Once a week">
                    <label class="form-check-label" for="q2b">Once a week</label>
                </div>
            </div>

            <div class="form-group mt-4">
                <label>3. How old are you?</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q3" id="q3a" value="18-20" checked>
                    <label class="form-check-label" for="q3a">18-20</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q3" id="q3b" value="21-23">
                    <label class="form-check-label" for="q3b">21-23</label>
                </div>
            </div>

            <button type="submit" class="btn mt-4">Retain</button>
        </form>
    </div>

    <div id="loginPopupContainer"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
