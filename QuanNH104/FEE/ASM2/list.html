<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List - Polls</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <a class="navbar-brand" href="index.html">Polls</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Vote</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="create.html">Create</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="list.html">List</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link login-btn" href="#" id="loginBtn">Login</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container main-container">
        
        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <a class="nav-link active bg-success text-white" id="active-tab" data-toggle="tab" href="#active" role="tab">Active</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link bg-dark text-white ml-2" id="drafts-tab" data-toggle="tab" href="#drafts" role="tab">Drafts</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link bg-light text-dark ml-2" id="closed-tab" data-toggle="tab" href="#closed" role="tab">Closed</a>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="active" role="tabpanel">
                <table class="table table-bordered table-striped">
                    <thead class="thead-light">
                        <tr>
                            <th scope="col" style="width: 10%;">#</th>
                            <th scope="col" style="width: 60%;">The list of questions and issues within</th>
                            <th scope="col" style="width: 30%;">Management</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="poll-row-56">
                            <td>56</td>
                            <td>Great poll</td>
                            <td>
                                <button class="btn btn-sm">View results</button>
                                <button class="btn btn-sm">Close poll</button>
                                <button class="btn btn-sm btn-delete" data-id="56">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="tab-pane fade" id="drafts" role="tabpanel">
                <p>No drafts available.</p>
            </div>
            <div class="tab-pane fade" id="closed" role="tabpanel">
                <p>No closed polls.</p>
            </div>
        </div>

    </div>

    <div id="loginPopupContainer"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
