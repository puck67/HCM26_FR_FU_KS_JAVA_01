<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List Manager (Bootstrap + jQuery)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5" style="max-width: 850px;">
        <header class="app-header text-center mb-5">
            <h1>Shopping List Manager</h1>
        </header>

        <div class="custom-card">


            <div class="row g-3 align-items-end mb-4">
                <div class="col-md-6">
                    <label for="jquery-item-name" class="form-label">Item Name</label>
                    <input type="text" id="jquery-item-name" class="form-control" placeholder="e.g., Apples"
                        autocomplete="off">
                    <div id="jquery-name-error" class="invalid-feedback">Vui lòng nhập tên sản phẩm.</div>
                </div>
                <div class="col-md-3">
                    <label for="jquery-item-cost" class="form-label">Item Cost ($)</label>
                    <input type="number" id="jquery-item-cost" class="form-control" placeholder="e.g., 2.50" step="0.01"
                        min="0">
                    <div id="jquery-cost-error" class="invalid-feedback">Giá tiền phải lớn hơn 0.</div>
                </div>
                <div class="col-md-3">
                    <button id="jquery-add-btn"
                        class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2"
                        style="height: 38px;">
                        <span>Add Item</span>
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <div class="table-responsive mb-4">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                        <tr>
                            <th style="width: 50%;">Item Name</th>
                            <th style="width: 25%; text-align: right;">Cost ($)</th>
                            <th style="width: 25%; text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="jquery-item-list">
                        <tr class="empty-row">
                            <td colspan="3" class="text-center text-muted fst-italic">Please add new items!</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="grand-total-box">
                <span class="grand-total-label">Grand Total:</span>
                <span id="jquery-total" class="grand-total-value">$0.00</span>
            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="jquery-app.js"></script>
</body>

</html>
