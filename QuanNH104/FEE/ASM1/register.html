<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-container">

    <div class="auth-card">
        <div class="card-header text-center">
            Register
        </div>
        <div class="card-body">
            <form id="register-form">
                <div class="form-group">
                    <input type="text" id="register-username" class="form-control" placeholder="User name" required maxlength="50">
                </div>
                <div class="form-group">
                    <input type="email" id="register-email" class="form-control" placeholder="E-mail" required maxlength="50">
                </div>
                <div class="form-group">
                    <input type="password" id="register-password" class="form-control" placeholder="Password" required maxlength="50">
                </div>
                <div class="form-group">
                    <input type="password" id="register-repassword" class="form-control" placeholder="Re Password" required>
                </div>
                <button type="submit" class="btn btn-green btn-block">Register</button>
            </form>
            <div class="text-center mt-3">
                <a href="login.html">Click here to Login</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
