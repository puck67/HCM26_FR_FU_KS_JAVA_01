<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Edit Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-cms justify-content-between">
        <a class="navbar-brand" href="view-content.html">CMS</a>
        <div class="user-dropdown dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <i class="fas fa-user-circle mr-1"></i><span id="navbar-username">User name</span>
            </a>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
                <a class="dropdown-item" href="edit-profile.html"><i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>User Profile</a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="#" id="logout-btn"><i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 sidebar-cms d-md-block">
                <div class="sidebar-search">
                    <div class="input-group">
                        <input type="text" id="sidebar-search-input" class="form-control" placeholder="Search...">
                        <div class="input-group-append">
                            <span class="input-group-text" id="sidebar-search-btn">
                                <i class="fas fa-search text-muted"></i>
                            </span>
                        </div>
                    </div>
                </div>
                <ul class="sidebar-nav">
                    <li class="sidebar-nav-item">
                        <a href="view-content.html" class="sidebar-nav-link">
                            <i class="fas fa-table"></i> View contents
                        </a>
                    </li>
                    <li class="sidebar-nav-item">
                        <a href="add-content.html" class="sidebar-nav-link">
                            <i class="far fa-edit"></i> Form content
                        </a>
                    </li>
                </ul>
            </nav>

            <main class="col-md-9 col-lg-10 main-content">
                <h1 class="page-title">Edit Profile</h1>

                <div class="card cms-card">
                    <div class="card-header">
                        Profile Form Elements
                    </div>
                    <div class="card-body">
                        <form id="edit-profile-form">
                            <div class="form-group">
                                <label for="profile-firstname" class="font-weight-bold">First Name</label>
                                <input type="text" id="profile-firstname" class="form-control" placeholder="Enter the first name" maxlength="50">
                            </div>
                            <div class="form-group">
                                <label for="profile-lastname" class="font-weight-bold">Last Name</label>
                                <input type="text" id="profile-lastname" class="form-control" placeholder="Enter the last name" maxlength="30">
                            </div>
                            <div class="form-group">
                                <label for="profile-email" class="font-weight-bold">Email</label>
                                <input type="email" id="profile-email" class="form-control" placeholder="your_email@example.com" disabled maxlength="30">
                            </div>
                            <div class="form-group">
                                <label for="profile-phone" class="font-weight-bold">Phone</label>
                                <input type="text" id="profile-phone" class="form-control" placeholder="Enter your phone number">
                            </div>
                            <div class="form-group">
                                <label for="profile-description" class="font-weight-bold">Description</label>
                                <textarea id="profile-description" class="form-control" rows="4"></textarea>
                            </div>
                            <div class="form-group mt-4">
                                <button type="submit" class="btn btn-green mr-2">Submit Button</button>
                                <button type="reset" class="btn btn-green">Reset Button</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
