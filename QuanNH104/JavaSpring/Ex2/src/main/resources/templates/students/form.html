<div xmlns:th="http://www.thymeleaf.org" th:fragment="body">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2 class="card-title" th:text="${isEdit} ? 'Cập nhật Học viên' : 'Thêm Học viên Mới'">Thêm Học viên Mới</h2>
        
        <!-- Error Alerts -->
        <div th:if="${errorMessage}" class="alert alert-danger">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span th:text="${errorMessage}">Lỗi xảy ra</span>
        </div>

        <form th:action="${isEdit} ? @{/students/update/{id}(id=${student.id})} : @{/students/save}" 
              th:object="${student}" method="post">
            
            <!-- Student Name -->
            <div class="form-group">
                <label for="name">Họ và tên học viên</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Nhập họ và tên đầy đủ...">
                <div class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Tên lỗi</div>
            </div>

            <!-- Student Age -->
            <div class="form-group">
                <label for="age">Tuổi học viên</label>
                <input type="number" id="age" th:field="*{age}" class="form-control" placeholder="Nhập tuổi học viên...">
                <div class="form-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Tuổi lỗi</div>
            </div>

            <!-- Buttons -->
            <div class="btn-group" style="margin-top: 30px;">
                <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Cập nhật' : 'Thêm mới'">Lưu</button>
                <a th:href="@{/students}" class="btn btn-secondary">Hủy bỏ</a>
            </div>
        </form>
    </div>
</div>
