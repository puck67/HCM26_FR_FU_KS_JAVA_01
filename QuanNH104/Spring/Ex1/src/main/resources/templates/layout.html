<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Course Management System</title>
    <!-- Link to Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- 1. BANNER SECTION -->
    <header class="banner">
        <div class="logo-area">
            <!-- Book/Graduation Icon SVG -->
            <svg class="logo-icon-svg" viewBox="0 0 24 24">
                <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
                <path d="M19 14.22V19c0 1.1-.9 2-2 2H7c-1.1 0-2-.9-2-2v-4.78l7 3.82 7-3.82z"/>
            </svg>
            <div class="logo-text">
                <h1>LMS MANAGEMENT SYSTEM</h1>
            </div>
        </div>

        <div class="header-right">
            <!-- Search bar -->
            <div class="search-box">
                <input type="text" placeholder="Search">
                <!-- Search icon -->
                <svg class="search-icon" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </div>
            <!-- User profile icon -->
            <svg class="profile-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
        </div>
    </header>

    <div class="main-wrapper">
        <!-- 2. MENU LEFT SECTION -->
        <aside class="menu-left">
            <ul class="nav-links">
                <!-- Add a new Course -->
                <li th:classappend="${activePage == 'courses-create'} ? 'active'">
                    <a th:href="@{/courses/create}">
                        <!-- Plus inside circle icon -->
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
                        </svg>
                        <div class="nav-text-container">
                            <span>Thêm mới Khóa học</span>
                            <span class="nav-subtext">Add a new Course</span>
                        </div>
                    </a>
                </li>
                <!-- Courses Management -->
                <li th:classappend="${activePage == 'courses-management'} ? 'active'">
                    <a th:href="@{/courses}">
                        <!-- Book icon -->
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M12 11.55C9.64 9.35 6.48 8 3 8v11c3.48 0 6.64 1.35 9 3.55 2.36-2.2 5.52-3.55 9-3.55V8c-3.48 0-6.64 1.35-9 3.55zM2 6c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2s-2-.9-2-2V8c0-1.1.9-2 2-2zm20 2c0-1.1-.9-2-2-2s-2 .9-2 2v12c0 1.1.9 2 2 2s2-.9 2-2V8z"/>
                        </svg>
                        <div class="nav-text-container">
                            <span>Quản lý Khóa học</span>
                            <span class="nav-subtext">Courses Management</span>
                        </div>
                    </a>
                </li>
                <!-- Students Management -->
                <li th:classappend="${activePage == 'students-management'} ? 'active'">
                    <a th:href="@{/students}">
                        <!-- Group of people icon -->
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                        </svg>
                        <div class="nav-text-container">
                            <span>Quản lý Học viên</span>
                            <span class="nav-subtext">Students Management</span>
                        </div>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- 3. BODY SECTION -->
        <main class="body-content">
            <!-- Dynamic Content Injected Here -->
            <div th:replace="~{__${content}__}"></div>
        </main>
    </div>

    <!-- 4. FOOTER SECTION -->
    <footer class="main-footer">
        <div class="footer-text">&copy; 2023 - All rights reserved. Built with Spring Framework</div>
        
        <!-- Social Icons -->
        <div class="social-icons">
            <!-- Facebook -->
            <svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2m13 2h-2.5A3.5 3.5 0 0 0 12 8.5V11h-2v3h2v7h3v-7h3v-3h-3V9a1 1 0 0 1 1-1h2V5z"/></svg>
            <!-- Twitter -->
            <svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2m13 4.71c-.5-.07-1 .04-1.45.32c.57-.43 1-1 1.2-1.68c-.6.35-1.25.6-1.95.73c-1.3-1.4-3.3-1.6-4.9-.4c-1.1.8-1.6 2.1-1.3 3.4c-2.7-.13-5.2-1.4-6.9-3.5c-.9 1.5-.5 3.5 1 4.5c-.5 0-1-.15-1.4-.4v.08c0 1.7 1.2 3.2 2.9 3.5c-.5.15-1.1.13-1.6 0c.5 1.5 1.9 2.6 3.6 2.6c-1.5 1.2-3.4 1.8-5.4 1.8c-.35 0-.7 0-1 0c1.8 1.2 4 1.8 6.2 1.8c7.5 0 11.6-6.2 11.6-11.6v-.5c.8-.6 1.4-1.3 2-2.1z"/></svg>
            <!-- Instagram -->
            <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2m-.8 2a3.8 3.8 0 0 0-3.8 3.8v8.4c0 2.1 1.7 3.8 3.8 3.8h8.4c2.1 0 3.8-1.7 3.8-3.8V7.8C19.2 5.7 17.5 4 15.4 4H7.8m4.2 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9m0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5m4.2-.75a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z"/></svg>
            <!-- Youtube -->
            <svg viewBox="0 0 24 24"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9c.07.8.1 1.49.1 2.09v1.68c0 .6-.03 1.29-.1 2.09c-.06.8-.15 1.43-.28 1.9c-.2.72-.73 1.25-1.45 1.45c-.47.13-1.1.22-1.9.28c-.8.07-1.49.1-2.09.1H9.16c-.6 0-1.29-.03-2.09-.1c-.8-.06-1.43-.15-1.9-.28c-.72-.2-1.25-.73-1.45-1.45c-.13-.47-.22-1.1-.28-1.9c-.07-.8-.1-1.49-.1-2.09v-1.68c0-.6.03-1.29.1-2.09c.06-.8.15-1.43.28-1.9c.2-.72.73-1.25 1.45-1.45c.47-.13 1.1-.22 1.9-.28c.8-.07 1.49-.1 2.09-.1h7.68c.6 0 1.29.03 2.09.1c.8.06 1.43.15 1.9.28c.72.2 1.25.73 1.45 1.45z"/></svg>
        </div>
    </footer>

</body>
</html>
