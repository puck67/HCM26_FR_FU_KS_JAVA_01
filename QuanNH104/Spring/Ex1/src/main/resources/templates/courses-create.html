<div xmlns:th="http://www.thymeleaf.org" th:fragment="body">
    <!-- Success Alert -->
    <div th:if="${successMessage}" class="alert-box alert-success" style="margin-bottom: 20px; text-align: left; background-color: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent); color: var(--accent); padding: 12px 20px; border-radius: 8px; display: flex; align-items: center; gap: 8px;">
        <svg class="alert-icon-svg" viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: currentColor;">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <span th:text="${successMessage}">Add a new Course successfully!</span>
    </div>

    <!-- Error Alert -->
    <div th:if="${errorMessage}" class="alert-box alert-danger" style="margin-bottom: 20px; text-align: left; background-color: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; padding: 12px 20px; border-radius: 8px; display: flex; align-items: center; gap: 8px;">
        <svg class="alert-icon-svg" viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: currentColor;">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span th:text="${errorMessage}">Error message</span>
    </div>

    <!-- Lesson Detail Link -->
    <div th:if="${showLessonDetailLink}" style="margin-bottom: 25px; text-align: left; display: flex; align-items: center; gap: 10px;">
        <a th:href="${lessonDetailUrl}" class="lesson-detail-link" style="color: #60a5fa; text-decoration: underline; font-weight: 600; font-size: 1.25rem; display: flex; align-items: center; gap: 6px;">
            Lesson Detail
        </a>
        <span style="color: #ef4444; font-size: 1.15rem; font-weight: 600;">Thêm chi tiết bài học</span>
    </div>

    <div class="card" style="text-align: left; max-width: 750px; margin: 0 auto;">
        <h3 style="margin-bottom: 25px; font-weight: 600; color: #ffffff; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.5px;">Create New Course</h3>
        
        <form th:action="@{/courses/save}" th:object="${course}" method="post">
            <div class="form-grid">
                <!-- Mã khóa học -->
                <div class="form-group">
                    <label for="courseCode" style="margin-bottom: 6px; font-size: 13px; color: var(--text-muted); font-weight: 500;">Mã khóa học / Course ID</label>
                    <input type="text" id="courseCode" th:field="*{id.courseCode}" required placeholder="e.g. CR5101" th:readonly="${showLessonDetailLink}" style="background-color: rgba(15, 23, 42, 0.4); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 14px; color: #ffffff;" />
                    <div th:if="${#fields.hasErrors('id.courseCode')}" th:errors="*{id.courseCode}" style="color: #ef4444; font-size: 12px; margin-top: 5px;"></div>
                </div>
                
                <!-- Ngày khai giảng -->
                <div class="form-group">
                    <label for="startDate" style="margin-bottom: 6px; font-size: 13px; color: var(--text-muted); font-weight: 500;">Ngày khai giảng / Start Date</label>
                    <input type="date" id="startDate" th:field="*{id.startDate}" required th:readonly="${showLessonDetailLink}" style="background-color: rgba(15, 23, 42, 0.4); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 14px; color: #ffffff;" />
                    <div th:if="${#fields.hasErrors('id.startDate')}" th:errors="*{id.startDate}" style="color: #ef4444; font-size: 12px; margin-top: 5px;"></div>
                </div>

                <!-- Tên khóa học -->
                <div class="form-group full-width">
                    <label for="courseName" style="margin-bottom: 6px; font-size: 13px; color: var(--text-muted); font-weight: 500;">Tên khóa học / Course Name</label>
                    <input type="text" id="courseName" th:field="*{courseName}" required placeholder="e.g. Java Web Development" style="background-color: rgba(15, 23, 42, 0.4); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 14px; color: #ffffff;" />
                    <div th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}" style="color: #ef4444; font-size: 12px; margin-top: 5px;"></div>
                </div>

                <!-- Danh mục -->
                <div class="form-group full-width">
                    <label for="category" style="margin-bottom: 6px; font-size: 13px; color: var(--text-muted); font-weight: 500;">Danh mục / Category</label>
                    <select id="category" th:field="*{category}" style="background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 14px; color: #ffffff; cursor: pointer;">
                        <option value="Technology">Technology</option>
                        <option value="Business">Business</option>
                        <option value="Design">Design</option>
                        <option value="Other">Other</option>
                    </select>
                    <div th:if="${#fields.hasErrors('category')}" th:errors="*{category}" style="color: #ef4444; font-size: 12px; margin-top: 5px;"></div>
                </div>

                <!-- Giảng viên -->
                <div class="form-group full-width">
                    <label for="instructor" style="margin-bottom: 6px; font-size: 13px; color: var(--text-muted); font-weight: 500;">Giảng viên / Instructor</label>
                    <input type="text" id="instructor" th:field="*{instructor}" placeholder="e.g. Dr. Nguyen Van A" style="background-color: rgba(15, 23, 42, 0.4); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 14px; color: #ffffff;" />
                    <div th:if="${#fields.hasErrors('instructor')}" th:errors="*{instructor}" style="color: #ef4444; font-size: 12px; margin-top: 5px;"></div>
                </div>
            </div>

            <div class="btn-group" style="margin-top: 25px; display: flex; gap: 12px;">
                <button type="submit" class="btn btn-primary" style="background-color: var(--accent-blue); color: #ffffff; border: none; border-radius: 6px; padding: 10px 20px; font-weight: 600; cursor: pointer; transition: background-color 0.2s;">Save Course</button>
                <a th:href="@{/}" class="btn btn-secondary" style="background-color: rgba(255, 255, 255, 0.05); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 20px; font-weight: 600; text-decoration: none; text-align: center; transition: background-color 0.2s;">Cancel</a>
            </div>
        </form>
    </div>
</div>
