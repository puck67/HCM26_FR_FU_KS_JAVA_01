<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý người dùng - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hover-bg:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Chèn Header -->
    <div th:replace="~{fragments :: header}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Chèn Sidebar -->
            <div th:replace="~{fragments :: sidebar}"></div>

            <!-- Nội dung chính -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="card p-4 border-0 shadow-sm rounded-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="fw-bold mb-0">Danh sách người dùng</h2>
                        <a th:href="@{/users/add}" class="btn btn-success btn-sm px-3 py-2 fw-semibold">+ Thêm người dùng</a>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle border-top">
                            <thead class="table-light text-secondary">
                                <tr>
                                    <th>ID</th>
                                    <th>Username</th>
                                    <th>Họ tên</th>
                                    <th>Trạng thái</th>
                                    <th>Vai trò</th>
                                    <th class="text-center" style="width: 280px;">Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.userId}">1</td>
                                    <td th:text="${user.username}" class="fw-bold">username</td>
                                    <td th:text="${user.fullName}">Full Name</td>
                                    <td>
                                        <span th:if="${#strings.equalsIgnoreCase(user.status, 'Active') || #strings.equalsIgnoreCase(user.status, 'ACTIVE')}" class="badge bg-success">Hoạt động</span>
                                        <span th:if="${!#strings.equalsIgnoreCase(user.status, 'Active') && !#strings.equalsIgnoreCase(user.status, 'ACTIVE')}" class="badge bg-danger">Khóa (Inactive)</span>
                                    </td>
                                    <td>
                                        <span th:each="role : ${user.roles}" th:text="${role.roleName}" class="badge bg-secondary me-1">ROLE</span>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/users/edit/{id}(id=${user.userId})}" class="btn btn-warning btn-sm me-1 fw-semibold text-dark">Sửa</a>
                                        <a th:href="@{/users/reset-password/{id}(id=${user.userId})}" class="btn btn-primary btn-sm me-1 fw-semibold">Reset Pass</a>
                                        <a th:href="@{/users/delete/{id}(id=${user.userId})}" class="btn btn-danger btn-sm fw-semibold" onclick="return confirm('Bạn có chắc chắn muốn xóa người dùng này?')">Xóa</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
