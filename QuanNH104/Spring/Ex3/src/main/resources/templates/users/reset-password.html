<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hover-bg:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Chèn Header -->
    <div th:replace="~{fragments :: header}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Chèn Sidebar -->
            <div th:replace="~{fragments :: sidebar}"></div>

            <!-- Nội dung chính -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="card p-4 border-0 shadow-sm rounded-3 mx-auto" style="max-width: 500px;">
                    <h2 class="fw-bold mb-4">Đặt lại mật khẩu</h2>
                    
                    <form th:action="@{/users/reset-password/{id}(id=${user.userId})}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Tài khoản</label>
                            <input type="text" id="username" th:value="${user.username}" class="form-control bg-light text-muted" readonly style="cursor: not-allowed;">
                        </div>
                        
                        <div class="mb-4">
                            <label for="newPassword" class="form-label fw-semibold">Mật khẩu mới</label>
                            <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Nhập mật khẩu mới" required minlength="4">
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">Đặt lại mật khẩu</button>
                            <a th:href="@{/users}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
