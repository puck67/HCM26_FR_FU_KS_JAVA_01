<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Sửa người dùng - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hover-bg:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Chèn Header -->
    <div th:replace="~{fragments :: header}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Chèn Sidebar -->
            <div th:replace="~{fragments :: sidebar}"></div>

            <!-- Nội dung chính -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="card p-4 border-0 shadow-sm rounded-3 mx-auto" style="max-width: 600px;">
                    <h2 class="fw-bold mb-4">Chỉnh sửa người dùng</h2>
                    
                    <form th:action="@{/users/edit/{id}(id=${user.userId})}" th:object="${user}" method="post">
                        <input type="hidden" th:field="*{userId}">
                        <input type="hidden" th:field="*{password}">
                        
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <input type="text" id="username" th:field="*{username}" class="form-control" required>
                            <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Tên đăng nhập không hợp lệ</span>
                        </div>
                        
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Họ tên</label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control" required>
                            <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Họ tên không hợp lệ</span>
                        </div>
                        
                        <div class="mb-3">
                            <label for="status" class="form-label fw-semibold">Trạng thái</label>
                            <select id="status" th:field="*{status}" class="form-select">
                                <option value="Active">Hoạt động (Active)</option>
                                <option value="Inactive">Khóa (Inactive)</option>
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Vai trò</label>
                            <div class="d-flex flex-wrap gap-3 mt-1">
                                <div th:each="role : ${allRoles}" class="form-check">
                                    <input class="form-check-input" type="checkbox" th:field="*{roles}" th:value="${role.roleId}" th:id="${'role_' + role.roleId}">
                                    <label class="form-check-label" th:for="${'role_' + role.roleId}" th:text="${role.roleName}">ROLE</label>
                                </div>
                            </div>
                            <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('roles')}" th:errors="*{roles}">Hãy chọn ít nhất một vai trò</span>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">Cập nhật</button>
                            <a th:href="@{/users}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
