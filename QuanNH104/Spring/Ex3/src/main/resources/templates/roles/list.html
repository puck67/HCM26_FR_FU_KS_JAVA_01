<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý vai trò - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hover-bg:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Chèn Header -->
    <div th:replace="~{fragments :: header}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Chèn Sidebar -->
            <div th:replace="~{fragments :: sidebar}"></div>

            <!-- Nội dung chính -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="card p-4 border-0 shadow-sm rounded-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="fw-bold mb-0">Danh sách vai trò</h2>
                        <a th:href="@{/roles/add}" class="btn btn-success btn-sm px-3 py-2 fw-semibold">+ Thêm vai trò</a>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle border-top">
                            <thead class="table-light text-secondary">
                                <tr>
                                    <th style="width: 150px;">ID</th>
                                    <th>Tên vai trò</th>
                                    <th class="text-center" style="width: 200px;">Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="role : ${roles}">
                                    <td th:text="${role.roleId}">1</td>
                                    <td>
                                        <span th:text="${role.roleName}" class="badge bg-primary" style="font-size: 0.9rem;">ROLE</span>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/roles/edit/{id}(id=${role.roleId})}" class="btn btn-warning btn-sm me-1 fw-semibold text-dark">Sửa</a>
                                        <a th:href="@{/roles/delete/{id}(id=${role.roleId})}" class="btn btn-danger btn-sm fw-semibold" onclick="return confirm('Bạn có chắc chắn muốn xóa vai trò này?')">Xóa</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
