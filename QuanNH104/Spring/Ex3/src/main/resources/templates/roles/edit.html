<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Sửa vai trò - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hover-bg:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Chèn Header -->
    <div th:replace="~{fragments :: header}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Chèn Sidebar -->
            <div th:replace="~{fragments :: sidebar}"></div>

            <!-- Nội dung chính -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="card p-4 border-0 shadow-sm rounded-3 mx-auto" style="max-width: 500px;">
                    <h2 class="fw-bold mb-4">Chỉnh sửa vai trò</h2>
                    
                    <form th:action="@{/roles/edit/{id}(id=${role.roleId})}" th:object="${role}" method="post">
                        <input type="hidden" th:field="*{roleId}">
                        
                        <div class="mb-4">
                            <label for="roleName" class="form-label fw-semibold">Tên vai trò</label>
                            <input type="text" id="roleName" th:field="*{roleName}" class="form-control" required>
                            <span class="text-danger small mt-1 d-block" th:if="${#fields.hasErrors('roleName')}" th:errors="*{roleName}">Tên vai trò không hợp lệ</span>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">Cập nhật</button>
                            <a th:href="@{/roles}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
