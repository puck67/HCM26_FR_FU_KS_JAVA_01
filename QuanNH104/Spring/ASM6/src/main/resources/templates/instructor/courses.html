<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header('Quản lý Khóa học')}"></head>
<body>

    <!-- Navbar -->
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
        
        <!-- Header area -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="m-0 fs-3 text-dark">
                    <i class="fa-solid fa-book-open text-primary me-2"></i>Danh sách Khóa học
                </h2>
                <p class="text-secondary small m-0">Quản lý các khóa học trong hệ thống CourseShare</p>
            </div>
            <a th:href="@{/instructor/courses/new}" class="btn btn-primary-custom">
                <i class="fa-solid fa-plus me-1"></i>Tạo khóa học mới
            </a>
        </div>

        <!-- Alert messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert" style="border-radius: 12px;">
            <i class="fa-solid fa-circle-check me-2"></i>[[${successMessage}]]
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius: 12px;">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>[[${errorMessage}]]
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Courses Table Card -->
        <div class="card card-custom">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="py-3 ps-4" style="width: 25%;">Tiêu đề</th>
                            <th class="py-3" style="width: 20%;">Danh mục</th>
                            <th class="py-3" style="width: 15%;">Trạng thái</th>
                            <th class="py-3" style="width: 15%;">Ngày tạo</th>
                            <th class="py-3 pe-4 text-end" style="width: 25%;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="course : ${courses}">
                            <!-- Title -->
                            <td class="ps-4">
                                <a th:href="@{/courses/{id}(id=${course.id})}" target="_blank" class="text-decoration-none fw-semibold text-dark hover-primary" th:text="${course.title}">Title</a>
                            </td>
                            <!-- Categories -->
                            <td>
                                <span th:each="cat : ${#strings.arraySplit(course.category != null ? course.category : '', ',')}"
                                      class="badge bg-secondary-subtle text-secondary me-1 rounded-pill px-2 py-1 small"
                                      th:text="${#strings.trim(cat)}">HTML</span>
                                <span th:if="${#strings.isEmpty(course.category)}" class="text-muted small italic">Không có</span>
                            </td>
                            <!-- Status -->
                            <td>
                                <span th:class="'badge-custom badge-status-' + ${course.status}"
                                      th:text="${lookupService.getValue('COURSE_STATUS', #strings.toString(course.status))}">
                                    Draft
                                </span>
                            </td>
                            <!-- Created At -->
                            <td class="text-secondary small" th:text="${#temporals.format(course.createdAt, 'dd/MM/yyyy')}">
                                19/06/2026
                            </td>
                            <!-- Actions -->
                            <td class="pe-4 text-end">
                                <!-- Status switches -->
                                <div class="btn-group me-2" role="group">
                                    <!-- Nếu đang ở Draft (1) hoặc Archived (3) thì cho phép Publish (2) -->
                                    <a th:if="${course.status != 2}"
                                       th:href="@{/instructor/courses/{id}/status/2(id=${course.id})}"
                                       class="btn btn-outline-success btn-sm border-0"
                                       title="Publish khóa học">
                                        <i class="fa-solid fa-circle-play"></i>
                                    </a>
                                    <!-- Nếu đang ở Published (2) thì cho phép Unpublish/Draft (1) -->
                                    <a th:if="${course.status == 2}"
                                       th:href="@{/instructor/courses/{id}/status/1(id=${course.id})}"
                                       class="btn btn-outline-warning btn-sm border-0"
                                       title="Unpublish (Đặt nháp)">
                                        <i class="fa-solid fa-circle-pause"></i>
                                    </a>
                                    <!-- Nếu chưa Archived (3) thì cho phép Archive -->
                                    <a th:if="${course.status != 3}"
                                       th:href="@{/instructor/courses/{id}/status/3(id=${course.id})}"
                                       class="btn btn-outline-secondary btn-sm border-0"
                                       title="Lưu trữ (Archive)">
                                        <i class="fa-solid fa-box-archive"></i>
                                    </a>
                                </div>
                                
                                <!-- Edit, Delete -->
                                <a th:href="@{/instructor/courses/{id}/edit(id=${course.id})}" class="btn btn-outline-primary btn-sm border-0 me-1" title="Chỉnh sửa">
                                    <i class="fa-solid fa-pen"></i>
                                </a>
                                <a th:href="@{/instructor/courses/{id}/delete(id=${course.id})}"
                                   class="btn btn-outline-danger btn-sm border-0"
                                   title="Xóa khóa học"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa khóa học này cùng toàn bộ các đánh giá của nó? Hành động này không thể hoàn tác!')">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        
                        <!-- Empty table body -->
                        <tr th:if="${#lists.isEmpty(courses)}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="fa-regular fa-folder-open fs-2 mb-2 d-block"></i>Chưa có khóa học nào. Hãy nhấn "Tạo khóa học mới".
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <nav class="mt-4" th:if="${totalPages > 1}">
            <ul class="pagination pagination-custom justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/instructor/courses(page=${currentPage - 1})}"><i class="fa-solid fa-angle-left"></i></a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/instructor/courses(page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/instructor/courses(page=${currentPage + 1})}"><i class="fa-solid fa-angle-right"></i></a>
                </li>
            </ul>
        </nav>
        
    </div>

    <!-- Footer -->
    <div th:replace="~{layout :: footer}"></div>

    <!-- Scripts -->
    <div th:replace="~{layout :: scripts}"></div>

</body>
</html>
