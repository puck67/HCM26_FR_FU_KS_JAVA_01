<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header(${isNew} ? 'Tạo khóa học mới' : 'Chỉnh sửa khóa học')}"></head>
<body>

    <!-- Navbar -->
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5" style="max-width: 900px;">
        <!-- Breadcrumb / Back Navigation -->
        <div class="mb-4">
            <a th:href="@{/instructor/courses}" class="text-decoration-none text-muted small hover-primary">
                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại Danh sách Khóa học
            </a>
        </div>

        <!-- Header Title -->
        <div class="mb-4">
            <h2 class="fs-3 m-0 text-dark">
                <i class="fa-solid" th:classappend="${isNew} ? 'fa-plus text-success' : 'fa-pen text-primary'"></i>
                [[${isNew} ? 'Tạo khóa học mới' : 'Chỉnh sửa khóa học']]
            </h2>
            <p class="text-secondary small m-0">Điền thông tin chi tiết của khóa học dưới đây.</p>
        </div>

        <!-- Form Card -->
        <div class="card card-custom p-4">
            <form th:action="${isNew} ? @{/instructor/courses} : @{/instructor/courses/{id}(id=${course.id})}"
                  th:object="${course}"
                  method="post">
                  
                <!-- Course Title -->
                <div class="mb-3">
                    <label for="title" class="form-label fw-semibold text-secondary">Tiêu đề khóa học</label>
                    <input type="text" class="form-control" id="title" th:field="*{title}" placeholder="Nhập tiêu đề khóa học..." required style="border-radius: 8px;">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Lỗi tiêu đề</div>
                </div>

                <div class="row">
                    <!-- Categories -->
                    <div class="col-md-6 mb-3">
                        <label for="category" class="form-label fw-semibold text-secondary">Danh mục (Tags)</label>
                        <input type="text" class="form-control" id="category" th:field="*{category}" placeholder="Ví dụ: HTML, CSS, JavaScript" style="border-radius: 8px;">
                        <span class="text-muted small d-block mt-1">Cách nhau bởi dấu phẩy (e.g. Java, Spring)</span>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Lỗi danh mục</div>
                    </div>
                    
                    <!-- Status -->
                    <div class="col-md-6 mb-3">
                        <label for="status" class="form-label fw-semibold text-secondary">Trạng thái ban đầu</label>
                        <select class="form-select" id="status" th:field="*{status}" required style="border-radius: 8px;">
                            <option value="1">Draft (Bản nháp)</option>
                            <option value="2">Published (Công khai)</option>
                            <option value="3">Archived (Lưu trữ)</option>
                        </select>
                    </div>
                </div>

                <!-- Short Description -->
                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold text-secondary">Mô tả ngắn</label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="3" placeholder="Nhập mô tả tóm tắt của khóa học..." required style="border-radius: 8px;"></textarea>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Lỗi mô tả</div>
                </div>

                <!-- Detailed Content (Markdown) -->
                <div class="mb-4">
                    <label for="content" class="form-label fw-semibold text-secondary d-flex justify-content-between align-items-center">
                        <span>Nội dung chi tiết (Định dạng Markdown)</span>
                        <span class="badge bg-light text-secondary border border-secondary-subtle" style="font-weight: 500;">
                            <i class="fa-brands fa-markdown me-1"></i>Hỗ trợ Markdown
                        </span>
                    </label>
                    <textarea class="form-control font-monospace" id="content" th:field="*{content}" rows="12" placeholder="# Tiêu đề lớn&#10;&#10;Viết nội dung khóa học ở đây bằng Markdown...&#10;&#10;## Đề mục phụ&#10;- Ý chính 1&#10;- Ý chính 2&#10;&#10;**Chữ in đậm** hoặc *in nghiêng*." required style="border-radius: 8px; font-size: 0.9rem;"></textarea>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">Lỗi nội dung</div>
                </div>

                <!-- Actions -->
                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a th:href="@{/instructor/courses}" class="btn btn-outline-secondary" style="border-radius: 10px;">
                        Hủy bỏ
                    </a>
                    <button type="submit" class="btn btn-primary-custom" style="border-radius: 10px;">
                        <i class="fa-solid fa-save me-1"></i> Lưu thông tin
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{layout :: footer}"></div>

    <!-- Scripts -->
    <div th:replace="~{layout :: scripts}"></div>

</body>
</html>
