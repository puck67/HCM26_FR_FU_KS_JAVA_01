<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header('Nhận xét gần đây')}"></head>
<body>

    <!-- Navbar -->
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5" style="max-width: 800px;">
        <div class="d-flex align-items-center mb-4">
            <h2 class="m-0 fs-3 text-dark">
                <i class="fa-solid fa-comments text-warning me-2"></i>Đánh giá gần đây từ học viên
            </h2>
        </div>

        <div class="card card-custom p-4">
            <div class="review-list">
                <div class="review-item py-3" th:each="rev : ${reviews}">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <span class="review-author fs-5 d-block" th:text="${rev.authorName}">John Doe</span>
                            <span class="text-muted small">
                                Tại khóa học: <a th:href="@{/courses/{id}(id=${rev.course.id})}" class="text-decoration-none fw-semibold text-primary" th:text="${rev.course.title}">Java Programming</a>
                            </span>
                        </div>
                        <div class="text-end">
                            <div class="rating-stars mb-1">
                                <i class="fa-solid fa-star" th:each="star : ${#numbers.sequence(1, rev.rating)}"></i>
                                <i class="fa-regular fa-star" th:if="${rev.rating < 5}" th:each="star : ${#numbers.sequence(rev.rating + 1, 5)}"></i>
                            </div>
                            <span class="review-meta d-block">
                                <i class="fa-regular fa-clock me-1"></i>[[${#temporals.format(rev.createdAt, 'dd/MM/yyyy HH:mm')}]]
                            </span>
                        </div>
                    </div>
                    <p class="text-secondary mb-0 bg-light p-3 rounded" style="border-left: 3px solid var(--accent-color);" th:text="${rev.content}">
                        Nội dung đánh giá...
                    </p>
                </div>

                <!-- Empty State -->
                <div th:if="${#lists.isEmpty(reviews)}" class="text-muted text-center py-5">
                    <i class="fa-regular fa-message mb-3 fs-1 d-block text-muted"></i>Chưa có đánh giá nào được duyệt.
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{layout :: footer}"></div>

    <!-- Scripts -->
    <div th:replace="~{layout :: scripts}"></div>

</body>
</html>
