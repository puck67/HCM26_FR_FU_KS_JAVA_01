<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Giảng viên - CourseShare</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Premium CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="text-center mb-4">
                <a th:href="@{/}" class="text-decoration-none d-inline-block">
                    <span class="fs-1 text-primary"><i class="fa-solid fa-graduation-cap"></i></span>
                    <h2 class="fs-3 mt-2 mb-0 navbar-brand-custom">CourseShare</h2>
                </a>
                <p class="text-secondary small mt-2">Đăng nhập tài khoản dành cho Giảng viên</p>
            </div>

            <!-- Error Notification -->
            <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show small py-2" role="alert" style="border-radius: 8px;">
                Tên đăng nhập hoặc mật khẩu không đúng.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.6rem;"></button>
            </div>
            
            <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show small py-2" role="alert" style="border-radius: 8px;">
                Bạn đã đăng xuất thành công.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.6rem;"></button>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">
                <!-- Username Input -->
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-secondary">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted" style="border-radius: 8px 0 0 8px;"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Nhập tên đăng nhập..." required style="border-radius: 0 8px 8px 0;">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold text-secondary">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted" style="border-radius: 8px 0 0 8px;"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Nhập mật khẩu..." required style="border-radius: 0 8px 8px 0;">
                    </div>
                </div>

                <!-- Action Button -->
                <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mt-3">
                    Đăng nhập <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
                </button>
                
                <div class="text-center mt-4">
                    <a th:href="@{/}" class="text-decoration-none small text-muted hover-primary">
                        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại Trang chủ
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
