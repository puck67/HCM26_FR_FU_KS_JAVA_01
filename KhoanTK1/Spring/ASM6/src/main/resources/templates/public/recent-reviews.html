<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Recent Reviews')}">
    <title>Recent Reviews - Course Sharing System</title>
</head>
<body>

    <!-- Header Navigation -->
    <div th:replace="~{fragments/layout :: header}"></div>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="row">
            
            <!-- Reviews List -->
            <div class="col-lg-8 mb-4">
                
                <!-- Page Title -->
                <div class="mb-4">
                    <h2 class="text-dark fw-bold mb-1">
                        <i class="fa-solid fa-comments text-primary me-2"></i>Recent Student Reviews
                    </h2>
                    <p class="text-muted mb-0">See what our students are saying about their learning experiences.</p>
                </div>

                <!-- Reviews Feed -->
                <div th:if="${allReviews != null and !allReviews.isEmpty()}">
                    <div th:each="rev : ${allReviews}" class="card mb-3">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div>
                                    <h5 class="mb-0 fw-semibold text-dark" th:text="${rev.authorName}">Student Name</h5>
                                    <small class="text-muted">
                                        Reviewed Course: 
                                        <a th:href="@{/course/{id}(id=${rev.course.id})}" class="text-primary fw-medium" style="text-decoration: none;" th:text="${rev.course.title}">
                                            Course Title
                                        </a>
                                    </small>
                                </div>
                                <span class="star-rating">
                                    <i th:each="star : ${#numbers.sequence(1, rev.rating)}" class="fa-solid fa-star"></i><i th:each="star : ${rev.rating < 5 ? #numbers.sequence(rev.rating + 1, 5) : {}}" class="fa-regular fa-star"></i>
                                </span>
                            </div>
                            
                            <p class="card-text text-muted bg-light p-3 rounded" style="font-style: italic;" th:text="'&ldquo; ' + ${rev.content} + ' &rdquo;'">
                                Review content...
                            </p>
                            
                            <div class="text-end text-muted small">
                                <i class="fa-regular fa-clock me-1"></i>
                                Submitted on <span th:text="${#temporals.format(rev.createdAt, 'dd MMMM yyyy HH:mm')}">Date</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- No Reviews Found -->
                <div th:if="${allReviews == null or allReviews.isEmpty()}" class="card py-5 text-center">
                    <div class="card-body">
                        <i class="fa-regular fa-comments fa-3x text-muted mb-3"></i>
                        <h4 class="text-muted">No student reviews available yet</h4>
                        <p class="text-muted mb-0">Check back later once courses receive reviews.</p>
                    </div>
                </div>

            </div>

            <!-- Sidebar -->
            <div th:replace="~{fragments/layout :: sidebar}"></div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
