<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Information - Register</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Google Fonts for premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Top Banner Gradient -->
    <div class="hero-banner-wrap">
        <div class="hero-gradient-bg">
            <h1 class="display-5 font-weight-bold" style="color: #f59e0b; margin: 0; font-size: 2.2rem; letter-spacing: 1px;">VISITOR PORTAL</h1>
            <p class="lead mb-0 text-white-50" style="font-size: 1rem; text-transform: uppercase; letter-spacing: 2px;">Guest Management Registry</p>
        </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light navigation-bar-theme">
        <div class="container">
            <span class="navbar-brand font-weight-bold" style="color: #102a43;">Guest Registry</span>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="person.html">Register Visitor</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="search.html">Search Visitor</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="help.html">Help & Guide</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-8">
                
                <!-- Page Title Header (Gold text in Navy box) -->
                <div class="section-header-card">
                    <h2>Visitor Information</h2>
                </div>

                <!-- Registration Form Panel -->
                <div class="panel-entry-card">
                    <!-- Success Notification -->
                    <div id="alert-notify-success" class="notify-card-success collapse" role="alert">
                        <strong>Success!</strong> Visitor has been successfully registered and saved.
                    </div>

                    <form id="visitor-entry-form" novalidate>
                        
                        <!-- First name (labeled "Fist name:") -->
                        <div class="form-group row">
                            <label for="input-given-name" class="col-sm-4 col-form-label form-label-right">Fist name:</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="input-given-name" name="firstName" placeholder="Type Fist name" maxlength="20" required>
                                <div id="err-given-name" class="validation-feedback-msg"></div>
                            </div>
                        </div>

                        <!-- Last name -->
                        <div class="form-group row">
                            <label for="input-family-name" class="col-sm-4 col-form-label form-label-right">Last name:</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="input-family-name" name="lastName" placeholder="Type Last name" maxlength="20" required>
                                <div id="err-family-name" class="validation-feedback-msg"></div>
                            </div>
                        </div>

                        <!-- Gender -->
                        <div class="form-group row">
                            <label for="select-sex-type" class="col-sm-4 col-form-label form-label-right">Gender:</label>
                            <div class="col-sm-8">
                                <select class="form-control" id="select-sex-type" name="gender">
                                    <option value="Male" selected>Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <!-- Telephone -->
                        <div class="form-group row">
                            <label for="input-phone-num" class="col-sm-4 col-form-label form-label-right">Telephone:</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="input-phone-num" name="telephone" placeholder="Type Telephone" maxlength="11">
                                <div id="err-phone-num" class="validation-feedback-msg"></div>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="form-group row">
                            <label for="input-mailbox" class="col-sm-4 col-form-label form-label-right">Email:</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" id="input-mailbox" name="email" placeholder="Type Email" maxlength="50">
                                <div id="err-mailbox" class="validation-feedback-msg"></div>
                            </div>
                        </div>

                        <!-- You are in (Radio buttons group) -->
                        <div class="form-group row">
                            <label class="col-sm-4 col-form-label form-label-right">You are in:</label>
                            <div class="col-sm-8">
                                <!-- Row 1: Europe, Africa -->
                                <div class="d-block mb-1">
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="region_locale" id="loc-europe" value="Europe">
                                        <label class="form-check-label" for="loc-europe">Europe</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="region_locale" id="loc-africa" value="Africa">
                                        <label class="form-check-label" for="loc-africa">Africa</label>
                                    </div>
                                </div>
                                <!-- Row 2: Australia, Asia, America -->
                                <div class="d-block">
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="region_locale" id="loc-australia" value="Australia">
                                        <label class="form-check-label" for="loc-australia">Australia</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="region_locale" id="loc-asia" value="Asia">
                                        <label class="form-check-label" for="loc-asia">Asia</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="region_locale" id="loc-america" value="America">
                                        <label class="form-check-label" for="loc-america">America</label>
                                    </div>
                                </div>
                                <div id="err-region-locale" class="validation-feedback-msg"></div>
                            </div>
                        </div>

                        <!-- Hobbies (Checkboxes group) -->
                        <div class="form-group row">
                            <label class="col-sm-4 col-form-label form-label-right">What are your hobbies:</label>
                            <div class="col-sm-8">
                                <!-- Row 1: Swimming, Cooking, Shopping -->
                                <div class="d-block mb-1">
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" name="leisure_activities" id="hobby-swim" value="Swimming">
                                        <label class="form-check-label" for="hobby-swim">Swimming</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" name="leisure_activities" id="hobby-cook" value="Cooking">
                                        <label class="form-check-label" for="hobby-cook">Cooking</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" name="leisure_activities" id="hobby-shop" value="Shopping">
                                        <label class="form-check-label" for="hobby-shop">Shopping</label>
                                    </div>
                                </div>
                                <!-- Row 2: Sport, Dance, Sing -->
                                <div class="d-block">
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" name="leisure_activities" id="hobby-play" value="Sport">
                                        <label class="form-check-label" for="hobby-play">Sport</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" name="leisure_activities" id="hobby-groove" value="Dance">
                                        <label class="form-check-label" for="hobby-groove">Dance</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" name="leisure_activities" id="hobby-vocal" value="Sing">
                                        <label class="form-check-label" for="hobby-vocal">Sing</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="form-group row">
                            <label for="input-remarks-field" class="col-sm-4 col-form-label form-label-right">Description:</label>
                            <div class="col-sm-8">
                                <textarea class="form-control" id="input-remarks-field" name="description" placeholder="Type Description" rows="4" maxlength="200"></textarea>
                                <div id="err-remarks-field" class="validation-feedback-msg"></div>
                            </div>
                        </div>

                        <!-- Register Button -->
                        <div class="row mt-4">
                            <div class="col-12 text-center">
                                <button type="submit" id="btn-submit-registry" class="btn btn-navy-gold">Register</button>
                            </div>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 4 and jQuery JS dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="person.js"></script>
</body>
</html>
