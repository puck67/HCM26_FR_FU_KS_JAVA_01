<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping List Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1>Shopping List Manager</h1>

    <form id="item-form">
      <div class="input-row">
        <div class="input-group">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" placeholder="e.g., Apples" required autocomplete="off">
        </div>

        <div class="input-group">
          <label for="item-cost">Item Cost ($)</label>
          <input type="number" id="item-cost" placeholder="e.g., 2.50" step="0.01" min="0.01" required>
        </div>

        <button type="submit" id="add-btn">Add Item +</button>
      </div>
    </form>

    <table>
      <thead>
        <tr>
          <th class="col-name">Item Name</th>
          <th class="col-cost">Cost ($)</th>
          <th class="col-action">Action</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr>
          <td class="col-name">Apples</td>
          <td class="col-cost">$3.49</td>
          <td class="col-action">
            <button type="button" class="btn-remove">
              <span class="remove-x">&times;</span> Remove
            </button>
          </td>
        </tr>
        <tr>
          <td class="col-name">Milk (1 Gallon)</td>
          <td class="col-cost">$4.15</td>
          <td class="col-action">
            <button type="button" class="btn-remove">
              <span class="remove-x">&times;</span> Remove
            </button>
          </td>
        </tr>
        <tr>
          <td class="col-name">Bread (Whole Wheat)</td>
          <td class="col-cost">$2.79</td>
          <td class="col-action">
            <button type="button" class="btn-remove">
              <span class="remove-x">&times;</span> Remove
            </button>
          </td>
        </tr>
        <tr>
          <td class="col-name">Eggs (Dozen)</td>
          <td class="col-cost">$5.20</td>
          <td class="col-action">
            <button type="button" class="btn-remove">
              <span class="remove-x">&times;</span> Remove
            </button>
          </td>
        </tr>
        <tr>
          <td class="col-name">Cereal (Cheerios)</td>
          <td class="col-cost">$4.89</td>
          <td class="col-action">
            <button type="button" class="btn-remove">
              <span class="remove-x">&times;</span> Remove
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="total-container">
      <div class="total-title">Grand Total:</div>
      <div id="grand-total" class="total-amount">$20.52</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
