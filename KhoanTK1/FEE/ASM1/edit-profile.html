<div class="content-card">
    <div class="content-card-title">
        <i class="fas fa-user-edit"></i> Edit Profile
    </div>

    <div id="profileAlert" class="alert d-none" role="alert"></div>

    <form id="profileForm" novalidate>
        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="profileFirstName">First Name</label>
                <input type="text" class="form-control" id="profileFirstName" placeholder="Enter your first name"
                    required minlength="3" maxlength="30">
                <div class="invalid-feedback">
                    First Name is required and must be between 3 and 30 characters.
                </div>
            </div>

            <div class="form-group col-md-6">
                <label for="profileLastName">Last Name</label>
                <input type="text" class="form-control" id="profileLastName" placeholder="Enter your last name" required
                    minlength="3" maxlength="30">
                <div class="invalid-feedback">
                    Last Name is required and must be between 3 and 30 characters.
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="profileEmail">Email</label>
                <input type="email" class="form-control" id="profileEmail" readonly>
                <small class="form-text text-muted">Email address cannot be changed.</small>
            </div>

            <div class="form-group col-md-6">
                <label for="profilePhone">Phone Number</label>
                <input type="text" class="form-control" id="profilePhone"
                    placeholder="Enter your phone number (e.g. 0912345678)" required minlength="9" maxlength="13">
                <div class="invalid-feedback">
                    Phone is required and must be between 9 and 13 digits.
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="profileDescription">Description</label>
            <textarea class="form-control" id="profileDescription" rows="4"
                placeholder="Brief description about yourself..." maxlength="200"></textarea>
            <div class="d-flex justify-content-between mt-1">
                <small class="text-muted ml-auto"><span id="charCount">0</span>/200 characters</small>
            </div>
        </div>

        <button type="submit" class="btn btn-success px-4 py-2 mt-2" id="btnSubmitProfile">
            <i class="fas fa-save mr-2"></i>Submit
        </button>
    </form>
</div>

<script>
    // Local scripts for interaction
    $(document).ready(function () {
        // Track characters left in the textarea
        $('#profileDescription').on('input', function () {
            var len = $(this).val().length;
            $('#charCount').text(len);
            if (len > 200) {
                $(this).addClass('is-invalid');
            } else {
                $(this).removeClass('is-invalid');
            }
        });

        // Initialize characters count if there is existing data
        $('#charCount').text($('#profileDescription').val().length);
    });
</script>
