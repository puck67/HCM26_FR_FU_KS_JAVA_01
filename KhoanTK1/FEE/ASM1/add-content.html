<div class="content-card">
    <div class="content-card-title">
        <i class="fas fa-plus-circle"></i> Add Content
    </div>

    <div id="contentAlert" class="alert d-none" role="alert"></div>

    <form id="contentForm" novalidate>
        <div class="form-group">
            <label for="contentTitle">Title</label>
            <input type="text" class="form-control" id="contentTitle" placeholder="Enter content title (minimum 10 characters)" required minlength="10" maxlength="200">
            <div class="invalid-feedback">
                Title is required and must be between 10 and 200 characters.
            </div>
        </div>

        <div class="form-group">
            <label for="contentBrief">Brief</label>
            <textarea class="form-control" id="contentBrief" rows="3" placeholder="Brief summary of the content (30 to 150 characters)" required minlength="30" maxlength="150"></textarea>
            <div class="d-flex justify-content-between mt-1">
                <div class="invalid-feedback">
                    Brief summary is required and must be between 30 and 150 characters.
                </div>
                <small class="text-muted ml-auto"><span id="briefCharCount">0</span>/150 characters</small>
            </div>
        </div>

        <div class="form-group">
            <label for="contentBody">Content</label>
            <textarea class="form-control" id="contentBody" rows="8" placeholder="Detailed content (50 to 1000 characters)" required minlength="50" maxlength="1000"></textarea>
            <div class="d-flex justify-content-between mt-1">
                <div class="invalid-feedback">
                    Detailed content is required and must be between 50 and 1000 characters.
                </div>
                <small class="text-muted ml-auto"><span id="bodyCharCount">0</span>/1000 characters</small>
            </div>
        </div>

        <div class="form-group mt-4">
            <button type="submit" class="btn btn-success px-4 py-2 mr-2" id="btnSubmitContent">
                <i class="fas fa-check mr-2"></i>Submit
            </button>
            <button type="reset" class="btn btn-success px-4 py-2" id="btnResetContent">
                <i class="fas fa-undo mr-2"></i>Reset
            </button>
        </div>
    </form>
</div>

<script>
    $(document).ready(function() {
        // Track brief characters
        $('#contentBrief').on('input', function() {
            var len = $(this).val().length;
            $('#briefCharCount').text(len);
            if (len < 30 || len > 150) {
                $(this).addClass('is-invalid');
            } else {
                $(this).removeClass('is-invalid');
            }
        });

        // Track content characters
        $('#contentBody').on('input', function() {
            var len = $(this).val().length;
            $('#bodyCharCount').text(len);
            if (len < 50 || len > 1000) {
                $(this).addClass('is-invalid');
            } else {
                $(this).removeClass('is-invalid');
            }
        });
        
        // Reset button behavior to clear indicators and character counters
        $('#btnResetContent').on('click', function() {
            setTimeout(function() {
                $('#briefCharCount').text('0');
                $('#bodyCharCount').text('0');
                $('.form-control').removeClass('is-invalid is-valid');
                $('#contentAlert').addClass('d-none');
            }, 50);
        });
    });
</script>
