<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Login</title>
    <!-- Bootstrap 4 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- FontAwesome 5.15.4 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-4">
                <h3><i class="fas fa-desktop text-success mr-2"></i>CMS Login</h3>
                <p>Enter your credentials to access the dashboard</p>
            </div>
            
            <form id="loginForm" novalidate>
                <!-- Alert for successful registration/errors -->
                <div id="loginAlert" class="alert d-none" role="alert"></div>

                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                        </div>
                        <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required minlength="5" maxlength="50">
                        <div class="invalid-feedback" id="loginEmailFeedback">
                            Email is required and must be between 5 and 50 characters.
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                        </div>
                        <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required minlength="8" maxlength="30">
                        <div class="invalid-feedback" id="loginPasswordFeedback">
                            Password is required and must be between 8 and 30 characters.
                        </div>
                    </div>
                </div>

                <div class="form-group form-check d-flex justify-content-between align-items-center mt-2 mb-4">
                    <div>
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label text-muted" style="text-transform: none; font-weight: normal; font-size: 0.9rem;" for="rememberMe">Remember Me</label>
                    </div>
                    <a href="#" class="auth-link font-weight-normal" style="font-size: 0.9rem;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-block btn-success py-2 font-weight-bold" id="btnLogin">
                    <i class="fas fa-sign-in-alt mr-2"></i>Login
                </button>
            </form>

            <div class="text-center mt-4">
                <span class="text-muted">Don't have an account? </span>
                <a href="register.html" class="auth-link">Register</a>
            </div>
        </div>
    </div>

    <!-- jQuery, Popper.js, Bootstrap 4 JS CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
