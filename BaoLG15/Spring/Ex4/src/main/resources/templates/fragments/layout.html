<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="main-layout(content)">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle} ?: 'Material System'"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .wrapper { display: flex; flex: 1; }
    .sidebar { width: 250px; background: #212529; color: white; min-height: 100%; padding: 20px 10px; }
    .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 10px; border-radius: 4px; }
    .sidebar a:hover, .sidebar a.active { background: #343a40; color: white; }
    .main-content { flex: 1; padding: 30px; background: #f8f9fa; }
    footer { background: #e9ecef; text-align: center; padding: 10px; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Training Material Management System</a>
  </div>
</nav>

<div class="wrapper">
  <div class="sidebar">
    <h5 class="px-2 pb-3 border-bottom border-secondary">Menu</h5>
    <a href="/dashboard" th:classappend="${pageTitle == 'Dashboard'} ? 'active'">📊 Dashboard</a>
    <div class="mt-3 px-2 text-secondary text-uppercase small font-weight-bold">Training Management</div>
    <a href="/subjects" th:classappend="${pageTitle == 'Subject Management' || pageTitle == 'Material Management'} ? 'active'">📚 Subject Management</a>
  </div>

  <div class="main-content">
    <div th:replace="${content}"></div>
  </div>
</div>

<footer>
  <span class="text-muted">© 2026 Training Department. All rights reserved.</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
