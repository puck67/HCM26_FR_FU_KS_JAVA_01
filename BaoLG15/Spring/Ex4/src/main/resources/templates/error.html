<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main-layout(~{::div})}">
<body>
<div class="text-center py-5">
  <div class="display-1 text-danger">⚠️</div>
  <h2 class="mt-3 text-dark">An Error Occurred</h2>
  <p class="lead text-secondary mt-2" th:text="${errorMessage} ?: 'Something went wrong on the server.'"></p>
  <button onclick="history.back()" class="btn btn-primary mt-4">↩️ Go Back</button>
</div>
</body>
</html>
