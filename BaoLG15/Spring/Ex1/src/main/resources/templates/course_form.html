<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::#course-form-content})}">
<head>
    <title>Thêm mới Khóa học - LMS</title>
</head>
<body>
    <div id="course-form-content">
        <!-- Success Alert -->
        <div th:if="${successMessage}" class="alert alert-success">
            <span class="alert-icon"><i class="fa-solid fa-circle-check"></i></span>
            <span th:text="${successMessage}">Add a new Course successfully!</span>
        </div>

        <!-- Lesson Detail Link -->
        <div th:if="${showLessonDetailLink}" style="margin-bottom: 1.5rem; text-align: center;">
            <a th:href="@{/courses/{code}/{date}/lessons(code=${course.course_code}, date=${#dates.format(course.start_date, 'yyyy-MM-dd')})}" class="action-link" style="font-size: 1.25rem; font-weight: 600; text-decoration: underline;">
                Lesson Detail
            </a>
            <span style="font-size: 1.25rem; font-weight: 600; color: #1e3a8a; margin-left: 0.5rem;">Thêm chi tiết bài học</span>
        </div>

        <!-- Course Form Card -->
        <div class="page-card">
            <div class="card-header">
                <h2 class="card-title">Create New Course</h2>
            </div>
            
            <form th:action="@{/courses/save}" th:object="${course}" method="post">
                <div class="form-grid">
                    <!-- Course Code -->
                    <div class="form-group">
                        <label for="course_code">Mã khóa học / Course ID</label>
                        <input type="text" id="course_code" th:field="*{course_code}" placeholder="e.g. CRS101" th:classappend="${#fields.hasErrors('course_code')} ? 'input-error'" th:readonly="${!isNew}">
                        <div class="error-message" th:if="${#fields.hasErrors('course_code')}" th:errors="*{course_code}">Mã khóa học lỗi</div>
                    </div>

                    <!-- Start Date -->
                    <div class="form-group">
                        <label for="start_date">Ngày khai giảng / Start Date</label>
                        <input type="date" id="start_date" th:field="*{start_date}" th:classappend="${#fields.hasErrors('start_date')} ? 'input-error'" th:readonly="${!isNew}">
                        <div class="error-message" th:if="${#fields.hasErrors('start_date')}" th:errors="*{start_date}">Ngày khai giảng lỗi</div>
                    </div>

                    <!-- Course Name -->
                    <div class="form-group full-width">
                        <label for="course_name">Tên khóa học / Course Name</label>
                        <input type="text" id="course_name" th:field="*{course_name}" placeholder="e.g. Java Web Development" th:classappend="${#fields.hasErrors('course_name')} ? 'input-error'">
                        <div class="error-message" th:if="${#fields.hasErrors('course_name')}" th:errors="*{course_name}">Tên khóa học lỗi</div>
                    </div>

                    <!-- Category -->
                    <div class="form-group">
                        <label for="category">Danh mục / Category</label>
                        <select id="category" th:field="*{category}" th:classappend="${#fields.hasErrors('category')} ? 'input-error'">
                            <option value="">-- Chọn danh mục --</option>
                            <option value="Technology">Technology</option>
                            <option value="Business">Business</option>
                            <option value="Language">Language</option>
                            <option value="Design">Design</option>
                        </select>
                        <div class="error-message" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Danh mục lỗi</div>
                    </div>

                    <!-- Instructor -->
                    <div class="form-group">
                        <label for="instructor">Giảng viên / Instructor</label>
                        <input type="text" id="instructor" th:field="*{instructor}" placeholder="e.g. Dr. Nguyen Van A" th:classappend="${#fields.hasErrors('instructor')} ? 'input-error'">
                        <div class="error-message" th:if="${#fields.hasErrors('instructor')}" th:errors="*{instructor}">Giảng viên lỗi</div>
                    </div>
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn btn-primary">Save Course</button>
                    <a th:href="@{/courses}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
