<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:replace="~{layout/layout :: html('Role Management', ~{::#main-content})}">
    <div id="main-content">
        <!-- Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card card-custom">
            <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold text-dark"><i class="bi bi-shield-lock text-primary me-2"></i>System Roles</h4>
                <a href="/roles/add" class="btn btn-primary btn-sm d-flex align-items-center">
                    <i class="bi bi-plus-lg me-1"></i> Add Role
                </a>
            </div>
            <div class="table-responsive px-4 pb-4">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Role ID</th>
                            <th>Role Name</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="role : ${roles}">
                            <td class="fw-semibold" th:text="${role.role_id}"></td>
                            <td>
                                <span class="badge bg-secondary fs-6" th:text="${role.role_name}"></span>
                            </td>
                            <td class="text-end">
                                <div class="btn-group">
                                    <a th:href="@{/roles/edit/{id}(id=${role.role_id})}" class="btn btn-outline-primary btn-sm">
                                        <i class="bi bi-pencil"></i> Edit
                                    </a>
                                    <form th:action="@{/roles/delete/{id}(id=${role.role_id})}" method="post" 
                                          style="display: inline-block;" 
                                          onsubmit="return confirm('Are you sure you want to delete this role?');">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(roles)}">
                            <td colspan="3" class="text-center py-4 text-muted">No roles found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
