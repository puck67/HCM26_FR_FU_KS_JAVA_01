<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:replace="~{layout/layout :: html('Dashboard', ~{::#main-content})}">
    <div id="main-content">
        <div class="row">
            <div class="col-12">
                <div class="card card-custom p-4 mb-4">
                    <h2 class="fw-bold mb-2">Welcome, <span th:text="${username}" class="text-primary"></span>!</h2>
                    <p class="text-muted">You have successfully logged in to the User & Security Management System. Use the sidebar to navigate to authorized sections.</p>
                </div>
            </div>
        </div>

        <div class="row mt-2">
            <div class="col-md-6 mb-4" sec:authorize="hasAnyRole('SUPER_ADMIN', 'ADMIN')">
                <div class="card card-custom p-4 bg-primary text-white h-100">
                    <div class="d-flex align-items-center">
                        <div class="me-4 fs-1"><i class="bi bi-people"></i></div>
                        <div>
                            <h5 class="card-title mb-1">User Management</h5>
                            <p class="card-text small opacity-75">View, edit, create or delete users.</p>
                            <a href="/users" class="btn btn-light btn-sm mt-2 text-primary fw-semibold">Go to Users</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4" sec:authorize="hasRole('SUPER_ADMIN')">
                <div class="card card-custom p-4 bg-dark text-white h-100">
                    <div class="d-flex align-items-center">
                        <div class="me-4 fs-1 text-primary"><i class="bi bi-shield-lock"></i></div>
                        <div>
                            <h5 class="card-title mb-1">Role Management</h5>
                            <p class="card-text small opacity-75">Create, update or delete user roles.</p>
                            <a href="/roles" class="btn btn-primary btn-sm mt-2">Go to Roles</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
