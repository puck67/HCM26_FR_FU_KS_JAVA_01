<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:replace="~{layout/layout :: html('User Management', ~{::#main-content})}">
    <div id="main-content">
        <!-- Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card card-custom">
            <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold text-dark"><i class="bi bi-people-fill text-primary me-2"></i>User Directory</h4>
                <a href="/users/add" class="btn btn-primary btn-sm d-flex align-items-center">
                    <i class="bi bi-plus-lg me-1"></i> Add User
                </a>
            </div>
            <div class="table-responsive px-4 pb-4">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>User ID</th>
                            <th>Full Name</th>
                            <th>Username</th>
                            <th>Roles</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="fw-semibold" th:text="${user.user_id}"></td>
                            <td th:text="${user.full_name}"></td>
                            <td class="text-primary fw-medium" th:text="${user.username}"></td>
                            <td>
                                <span th:each="role : ${user.roles}" 
                                      th:text="${role.role_name}" 
                                      class="badge bg-secondary me-1">
                                </span>
                            </td>
                            <td>
                                <span th:if="${user.status.name() == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                                <span th:if="${user.status.name() == 'INACTIVE'}" class="badge bg-danger">INACTIVE</span>
                            </td>
                            <td class="text-end">
                                <div class="btn-group">
                                    <a th:href="@{/users/edit/{id}(id=${user.user_id})}" class="btn btn-outline-primary btn-sm" title="Edit">
                                        <i class="bi bi-pencil"></i> Edit
                                    </a>
                                    <a th:href="@{/users/reset-password/{id}(id=${user.user_id})}" class="btn btn-outline-warning btn-sm" title="Reset Password">
                                        <i class="bi bi-key"></i> Reset
                                    </a>
                                    <form th:action="@{/users/delete/{id}(id=${user.user_id})}" method="post" 
                                          style="display: inline-block;" 
                                          onsubmit="return confirm('Are you sure you want to delete this user?');">
                                        <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="text-center py-4 text-muted">No users found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
