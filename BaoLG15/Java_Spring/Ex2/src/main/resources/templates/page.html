<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml"
      th:replace="~{layout :: html(content=~{::section})}">
<body>
<section>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-5 text-center">
            <div class="mb-4">
                <div class="display-1 text-primary">
                    <i class="bi bi-compass"></i>
                </div>
            </div>
            <h1 class="fw-bold mb-3" th:text="${pageTitle}">/page</h1>
            <p class="text-secondary lead mb-4">You have successfully navigated to the page mapped by the dynamic menu.</p>
            <hr class="my-4 mx-auto" style="max-width: 400px; border-color: var(--card-border);">
            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/}" class="btn btn-primary">
                    <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
                </a>
                <div sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/menus}" class="btn btn-outline-secondary">
                        <i class="bi bi-list-columns-reverse me-1"></i> View Menu Structure
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
