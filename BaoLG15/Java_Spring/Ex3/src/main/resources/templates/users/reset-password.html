<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:replace="~{layout/layout :: html('Reset Password', ~{::#main-content})}">
    <div id="main-content">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card card-custom">
                    <div class="card-header bg-white py-3 border-0">
                        <h4 class="mb-0 fw-bold text-dark"><i class="bi bi-key-fill text-warning me-2"></i>Reset Password</h4>
                    </div>
                    <div class="card-body px-4 pb-4">
                        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <form th:action="@{/users/reset-password}" th:object="${resetPasswordRequest}" method="post">
                            <input type="hidden" th:field="*{user_id}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">User Account</label>
                                <input type="text" class="form-control bg-light" th:value="${username}" readonly>
                            </div>

                            <div class="mb-4">
                                <label for="newPassword" class="form-label fw-semibold">New Password</label>
                                <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" 
                                       th:errorclass="is-invalid" placeholder="Enter new password">
                                <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a href="/users" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-warning px-4 text-dark fw-semibold">Reset Password</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
