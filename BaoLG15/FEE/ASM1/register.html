<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register an account for CMS - Content Management System">
    <title>CMS - Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                Register
            </div>
            <div class="auth-body">
                <div id="registerAlertContainer"></div>
                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <input type="text" class="form-control" id="registerUsername" name="username" placeholder="User name" required maxlength="30">
                        <div class="invalid-feedback" id="usernameFeedback"></div>
                    </div>
                    <div class="form-group mt-3">
                        <input type="email" class="form-control" id="registerEmail" name="email" placeholder="E-mail" required>
                        <div class="invalid-feedback" id="regEmailFeedback"></div>
                    </div>
                    <div class="form-group mt-3">
                        <input type="password" class="form-control" id="registerPassword" name="password" placeholder="Password" required maxlength="30">
                        <div class="invalid-feedback" id="regPasswordFeedback"></div>
                    </div>
                    <div class="form-group mt-3">
                        <input type="password" class="form-control" id="registerRePassword" name="rePassword" placeholder="Re Password" required maxlength="30">
                        <div class="invalid-feedback" id="rePasswordFeedback"></div>
                    </div>
                    <button type="submit" class="btn btn-success btn-block mt-4" id="btnRegister">Register</button>
                </form>
                <div class="text-center mt-3">
                    <a href="login.html" class="btn btn-link text-success p-0" id="linkLogin">Click here to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
