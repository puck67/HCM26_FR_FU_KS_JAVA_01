<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to CMS - Content Management System">
    <title>CMS - Sign In</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                Please Sign In
            </div>
            <div class="auth-body">
                <div id="loginAlertContainer"></div>
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <input type="email" class="form-control" id="loginEmail" name="email" placeholder="E-mail" required maxlength="50">
                        <div class="invalid-feedback" id="emailFeedback"></div>
                    </div>
                    <div class="form-group mt-3">
                        <input type="password" class="form-control" id="loginPassword" name="password" placeholder="Password" required maxlength="30">
                        <div class="invalid-feedback" id="passwordFeedback"></div>
                    </div>
                    <div class="form-group form-check mt-3">
                        <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember Me</label>
                    </div>
                    <button type="submit" class="btn btn-success btn-block mt-4" id="btnLogin">Login</button>
                </form>
                <div class="text-center mt-3">
                    <a href="register.html" class="btn btn-link text-success p-0" id="linkRegister">Click here to Register</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
