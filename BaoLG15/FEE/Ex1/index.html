<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Shopping List</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <div class="container">
        <h1>Shopping List Manager</h1>

        <div class="form-container">
            <div class="input-group">
                <label for="item-name">Item Name</label>
                <input type="text" id="item-name" placeholder="e.g., Apples">
            </div>
            <div class="input-group">
                <label for="item-cost">Item Cost ($)</label>
                <input type="number" id="item-cost" placeholder="e.g., 2.50" min="0" step="0.01">
            </div>
            <div class="input-group button-group">
                <button id="add-item-btn">Add Item <span>+</span></button>
            </div>
        </div>

        <table id="shopping-list">
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Cost ($)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <div class="footer">
            <div class="grand-total-label">Grand Total:</div>
            <div class="grand-total-amount" id="grand-total">$0.00</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
