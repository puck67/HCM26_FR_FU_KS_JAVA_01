<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Project Board (Native JS)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="kanban-container">
        <header class="board-header">
            <h1>My Project Board</h1>
            <div class="board-actions">
                <div class="user-profile">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="20" fill="#E2E8F0" />
                        <path
                            d="M20 20C22.2091 20 24 18.2091 24 16C24 13.7909 22.2091 12 20 12C17.7909 12 16 13.7909 16 16C16 18.2091 17.7909 20 20 20Z"
                            fill="#718096" />
                        <path d="M13 28C13 25.3333 16 23 20 23C24 23 27 25.3333 27 28" stroke="#718096" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </div>
                <div class="calendar-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M19 4H5C3.89543 4 3 4.89543 3 6V20C3 21.1046 3.89543 22 5 22H19C20.1046 22 21 21.1046 21 20V6C21 4.89543 20.1046 4 19 4Z"
                            stroke="#718096" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M16 2V6" stroke="#718096" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M8 2V6" stroke="#718096" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M3 10H21" stroke="#718096" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
            </div>
        </header>

        <main class="kanban-board">
            <div class="column" data-column="todo" id="col-todo">
                <div class="column-header">TO DO</div>
                <div class="add-task-container">
                    <input type="text" class="add-task-input" placeholder="Add a task to To Do">
                    <button class="add-task-btn">+</button>
                </div>
                <div class="task-list">
                    <div class="task-card">
                        <div class="task-title-label">Title</div>
                        <div class="task-title">Website Homepage Redesign</div>
                        <div class="task-actions">
                            <button class="task-btn btn-primary">Start</button>
                            <button class="task-btn">Edit</button>
                            <button class="task-btn btn-move">Move ▾</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="column" data-column="progress" id="col-progress">
                <div class="column-header">IN PROGRESS</div>
                <div class="add-task-container">
                    <input type="text" class="add-task-input" placeholder="Add a task to In Progress">
                    <button class="add-task-btn">+</button>
                </div>
                <div class="task-list">
                    <div class="task-card">
                        <div class="task-title-label">Title</div>
                        <div class="task-title">User Testing Sessions</div>
                        <div class="task-actions">
                            <button class="task-btn">Edit</button>
                            <button class="task-btn btn-move">Move ▾</button>
                            <button class="task-btn btn-success">Done</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="column" data-column="done" id="col-done">
                <div class="column-header">DONE</div>
                <div class="add-task-container">
                    <input type="text" class="add-task-input" placeholder="Add a task to Done">
                    <button class="add-task-btn">+</button>
                </div>
                <div class="task-list">
                    <div class="task-card">
                        <div class="task-title-label">Title</div>
                        <div class="task-title">Completed Features List</div>
                        <div class="task-actions">
                            <button class="task-btn">Edit</button>
                            <button class="task-btn">Archive</button>
                            <button class="task-btn btn-delete">Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
