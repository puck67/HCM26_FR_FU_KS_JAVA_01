<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Lesson Detail</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="summary-box">
            <h4>Course Summary</h4>
            Mã khóa học / Course ID: <span th:text="${course.courseCode}"></span><br>
            Ngày khai giảng / Start Date: <span th:text="${course.startDate}"></span>
        </div>

        <div style="border: 1px solid #ced4da; padding: 20px; border-radius: 4px; position: relative;">
            <h3 style="color: #dc3545; position: absolute; right: 20px; top: 10px;">Chức năng 3.2: Chi tiết Bài học</h3>
            <h4>Add/Edit Lesson Detail</h4>
            <form th:action="@{/courses/{code}/{date}/lessons(code=${course.courseCode}, date=${course.startDate})}" th:object="${lesson}" method="post">
                <input type="hidden" th:field="*{id}">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Tên bài học / Lesson Name</label>
                        <input type="text" class="form-control" th:field="*{lessonName}" required>
                    </div>
                    <div class="form-group">
                        <label>Thời lượng / Duration (mins)</label>
                        <input type="number" class="form-control" th:field="*{duration}" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Loại nội dung / Content Type</label>
                        <select class="form-control" th:field="*{contentType}">
                            <option value="Video">Video</option>
                            <option value="Lý thuyết">Lý thuyết</option>
                            <option value="Thực hành">Thực hành</option>
                            <option value="Document">Document</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Trạng thái / Status</label>
                        <select class="form-control" th:field="*{status}">
                            <option value="Bản nháp">Bản nháp (Draft)</option>
                            <option value="Đang mở">Đang mở (Active)</option>
                            <option value="Đã khóa">Đã khóa (Inactive)</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Save Lesson</button>
                <a th:href="@{/courses/{code}/{date}/lessons(code=${course.courseCode}, date=${course.startDate})}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>

        <h3 style="margin-top: 30px;">List of Lessons for <span th:text="${course.courseCode}"></span></h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Lesson Name</th>
                    <th>Duration</th>
                    <th>Content Type</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="l : ${lessons}">
                    <td th:text="${l.id}"></td>
                    <td th:text="${l.lessonName}"></td>
                    <td th:text="${l.duration}"></td>
                    <td th:text="${l.contentType}"></td>
                    <td th:text="${l.status}"></td>
                    <td>
                        <a th:href="@{/courses/{code}/{date}/lessons/{lessonId}/edit(code=${course.courseCode}, date=${course.startDate}, lessonId=${l.id})}" class="action-link">Edit</a> / 
                        <a th:href="@{/courses/{code}/{date}/lessons/{lessonId}/delete(code=${course.courseCode}, date=${course.startDate}, lessonId=${l.id})}" class="action-link delete" onclick="return confirm('Do you want to delete this lesson?');">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
