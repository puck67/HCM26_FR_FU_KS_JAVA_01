<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">LMS Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Banner Component -->
        <header class="app-banner">
            <div class="logo-section">
                <span class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></span>
                <span class="logo-text">LMS MANAGEMENT SYSTEM</span>
            </div>
            <div class="banner-title">Banner</div>
            <div class="banner-user">
                <div class="search-box">
                    <input type="text" placeholder="Search...">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <i class="fa-solid fa-user-circle" style="font-size: 1.5rem; cursor: pointer; margin-left: 1rem;"></i>
            </div>
        </header>

        <div class="main-wrapper">
            <!-- MenuLeft Component -->
            <aside class="app-sidebar">
                <div class="sidebar-title">MenuLeft</div>
                
                <a th:href="@{/courses/new}" class="menu-item" th:classappend="${activePage == 'new-course' ? 'active' : ''}">
                    <i class="fa-solid fa-circle-plus menu-item-icon"></i>
                    <div class="menu-item-text">
                        <span>Thêm mới Khóa học</span>
                        <small>Add a new Course</small>
                    </div>
                </a>
                
                <a th:href="@{/courses}" class="menu-item" th:classappend="${activePage == 'courses' ? 'active' : ''}">
                    <i class="fa-solid fa-book menu-item-icon"></i>
                    <div class="menu-item-text">
                        <span>Quản lý Khóa học</span>
                        <small>Courses Management</small>
                    </div>
                </a>
                
                <a th:href="@{/students}" class="menu-item" th:classappend="${activePage == 'students' ? 'active' : ''}">
                    <i class="fa-solid fa-users menu-item-icon"></i>
                    <div class="menu-item-text">
                        <span>Quản lý Học viên</span>
                        <small>Students Management</small>
                    </div>
                </a>
            </aside>

            <!-- Body Component -->
            <main class="app-body">
                <div th:replace="${content}">
                    <!-- Content injected here -->
                </div>
            </main>
        </div>

        <!-- Footer Component -->
        <footer class="app-footer">
            <div>Footer</div>
            <div>© 2023 - All rights reserved. Built with Spring Framework</div>
            <div class="footer-socials">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </footer>
    </div>
</body>
</html>
