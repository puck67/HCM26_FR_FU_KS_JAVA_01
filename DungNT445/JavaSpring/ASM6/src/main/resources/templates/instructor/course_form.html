<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(${course.id == null ? 'Create Course' : 'Edit Course'})}"></head>
<body>
    <header th:replace="~{layout/fragments :: header('manage_courses')}"></header>

    <main class="main-container">
        <div style="max-width: 800px; margin: 0 auto; width: 100%;">
            <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem;">
                <a th:href="@{/instructor/courses}" class="btn-outline" style="padding: 0.5rem 1rem;">
                    <i class="fa-solid fa-arrow-left"></i> Back to List
                </a>
                <h2 style="font-size: 1.8rem; font-weight: 700;">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span th:text="${course.id == null ? 'Create New Course' : 'Edit Course'}">Course Form</span>
                </h2>
            </div>

            <div class="card">
                <form th:action="${course.id == null} ? @{/instructor/courses/new} : @{/instructor/courses/edit/{id}(id=${course.id})}" th:object="${course}" method="post">
                    <div class="form-group">
                        <label for="title">Course Title</label>
                        <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="Enter course title" required />
                        <div class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</div>
                    </div>

                    <div class="form-group">
                        <label for="description">Short Description / Summary</label>
                        <input type="text" id="description" th:field="*{description}" class="form-control" placeholder="Enter a brief summary" required />
                        <div class="error-message" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="category">Categories (comma-separated)</label>
                            <input type="text" id="category" th:field="*{category}" class="form-control" placeholder="e.g. Spring, Java, Web" />
                            <div class="error-message" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Category error</div>
                        </div>

                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" th:field="*{status}" class="form-control" required>
                                <option value="1">Draft</option>
                                <option value="2">Published</option>
                                <option value="3">Archived</option>
                            </select>
                            <div class="error-message" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Status error</div>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 2rem;">
                        <label for="content">Full Details / Content (supports Markdown)</label>
                        <textarea id="content" th:field="*{content}" class="form-control" rows="12" placeholder="# Course Content..." required style="font-family: monospace;"></textarea>
                        <div class="error-message" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">Content error</div>
                    </div>

                    <button type="submit" class="btn-primary" style="width: 100%; padding: 0.75rem;">
                        <i class="fa-solid fa-floppy-disk"></i> Save Course
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
