<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CourseShare - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .category-cloud a {
            text-decoration: none;
            margin-right: 10px;
            display: inline-block;
        }

        .size-1 {
            font-size: 14px;
            font-weight: normal;
        }

        .size-2 {
            font-size: 18px;
            font-weight: bold;
        }

        .size-3 {
            font-size: 24px;
            font-weight: 900;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">CourseShare</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="/">Home</a>
            <a class="nav-link" href="/instructor/login">Login</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">

        <div class="col-md-8">
            <h3 class="mb-4">Recent Published Courses</h3>

            <div th:each="course : ${courses}" class="card mb-3 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${course.title}">Course Title Example</h5>
                    <p class="card-text text-muted" th:text="${course.description}">Short description goes here...</p>
                    <p class="card-text">
                        <small class="text-secondary">Categories: </small>
                        <span class="badge bg-secondary me-1" th:text="${course.category}">HTML, Design</span>
                    </p>
                    <a th:href="@{'/course/' + ${course.id}}" class="btn btn-primary btn-sm">View Details</a>
                </div>
            </div>

            <nav th:if="${totalPages > 1}" class="mt-4">
                <ul class="pagination pagination-sm">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/(page=${currentPage - 1})}">&laquo;</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/(page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/(page=${currentPage + 1})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="col-md-4">

            <div class="card mb-4 shadow-sm">
                <div class="card-header bg-secondary text-white">Categories</div>
                <div class="card-body category-cloud">
                        <span th:each="cat : ${categories}">
                            <a th:href="@{'/category/' + ${cat.name}}"
                               th:text="${cat.name}"
                               th:class="${cat.frequency > 10} ? 'size-3 text-primary' : (${cat.frequency > 5} ? 'size-2 text-success' : 'size-1 text-secondary')">
                            </a>
                        </span>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">Most Recent Reviews</div>
                <div class="list-group list-group-flush">
                    <div th:each="review : ${recentReviews}" class="list-group-item">
                        <strong th:text="${review.authorName}">John Doe</strong>
                        <div class="text-warning" th:if="${review.rating > 0}">
                            <span th:each="star : ${#numbers.sequence(1, review.rating)}">&#9733;</span>
                        </div>
                        <p class="mb-0 text-muted small" th:text="${review.content}">Review content snippet...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
