<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Menu Management')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="flex-grow-1 p-4 bg-light w-100">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Menu Management</h2>
            <a th:href="@{/menus/new}" class="btn btn-success"><i class="bi bi-plus"></i> Add Menu</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="card">
            <div class="card-body overflow-auto">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>URL</th>
                            <th>Icon</th>
                            <th>Parent</th>
                            <th>Order</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${menus}">
                            <td th:text="${m.id}">1</td>
                            <td th:text="${m.name}">Name</td>
                            <td th:text="${m.url}">/url</td>
                            <td><i th:class="${m.icon}"></i> <span th:text="${m.icon}" class="ms-1"></span></td>
                            <td th:text="${m.parent != null ? m.parent.name : '-'}">Parent</td>
                            <td th:text="${m.displayOrder}">1</td>
                            <td>
                                <span th:if="${m.status}" class="badge bg-success">Active</span>
                                <span th:unless="${m.status}" class="badge bg-danger">Inactive</span>
                            </td>
                            <td>
                                <a th:href="@{/menus/edit/{id}(id=${m.id})}" class="btn btn-sm btn-primary"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/menus/delete/{id}(id=${m.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this menu?');"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
