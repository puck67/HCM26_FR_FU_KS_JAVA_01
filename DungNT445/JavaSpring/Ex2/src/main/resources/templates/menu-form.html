<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Menu Form')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="flex-grow-1 p-4 bg-light w-100">
        <h2 class="mb-4" th:text="${menu.id == null ? 'Create Menu' : 'Edit Menu'}">Edit Menu</h2>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/menus/save}" th:object="${menu}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="mb-3">
                        <label class="form-label">Menu Name</label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">URL</label>
                        <input type="text" class="form-control" th:field="*{url}" placeholder="/dashboard">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Icon (Bootstrap Icon Class)</label>
                        <input type="text" class="form-control" th:field="*{icon}" placeholder="bi-house">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Parent Menu</label>
                        <select class="form-select" th:field="*{parent.id}">
                            <option value="">-- No Parent (Root Menu) --</option>
                            <option th:each="p : ${allMenus}" 
                                    th:if="${p.id != menu.id}" 
                                    th:value="${p.id}" 
                                    th:text="${p.name}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Display Order</label>
                        <input type="number" class="form-control" th:field="*{displayOrder}" required>
                    </div>

                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{status}" id="statusCheck">
                            <label class="form-check-label" for="statusCheck">Active Status</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Menu</button>
                    <a th:href="@{/menus}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
