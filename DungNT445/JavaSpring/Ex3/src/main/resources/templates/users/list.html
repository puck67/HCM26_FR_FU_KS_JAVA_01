<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: layout(content=~{::main})}">
<body>
<main>
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">User Management</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <a href="/users/add" class="btn btn-sm btn-primary">
                <i class="bi bi-person-plus"></i> Add User
            </a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Full Name</th>
                    <th>Status</th>
                    <th>Roles</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.userId}"></td>
                    <td class="fw-bold" th:text="${user.username}"></td>
                    <td th:text="${user.fullName}"></td>
                    <td>
                        <span th:class="${user.status.name() == 'ACTIVE'} ? 'badge bg-success' : 'badge bg-danger'" 
                              th:text="${user.status}"></span>
                    </td>
                    <td>
                        <span th:each="role : ${user.roles}" class="badge bg-info text-dark me-1" th:text="${role.roleName}"></span>
                    </td>
                    <td>
                        <a th:href="@{/users/edit/{id}(id=${user.userId})}" class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <form th:action="@{/users/delete/{id}(id=${user.userId})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this user?');">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="6" class="text-center">No users found</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
