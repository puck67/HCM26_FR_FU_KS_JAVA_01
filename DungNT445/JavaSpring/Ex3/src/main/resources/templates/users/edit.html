<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: layout(content=~{::main})}">
<body>
<main>
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Edit User</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <a href="/users" class="btn btn-sm btn-secondary">
                <i class="bi bi-arrow-left"></i> Back to List
            </a>
        </div>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        <span th:if="${param.error[0] == 'roles'}">Please select at least one role!</span>
    </div>

    <div class="row">
        <!-- Edit User Form -->
        <div class="col-md-8">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-white"><h5 class="mb-0">User Details</h5></div>
                <div class="card-body">
                    <form th:action="@{/users/edit/{id}(id=${user.userId})}" method="post" th:object="${user}">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" th:field="*{fullName}" required>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="status" class="form-label">Status</label>
                                <select class="form-select" id="status" th:field="*{status}" required>
                                    <option value="ACTIVE">ACTIVE</option>
                                    <option value="INACTIVE">INACTIVE</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Roles</label>
                                <div>
                                    <div class="form-check form-check-inline" th:each="role : ${allRoles}">
                                        <input class="form-check-input" type="checkbox" name="roleIds" 
                                               th:value="${role.roleId}" 
                                               th:id="'role_'+${role.roleId}"
                                               th:checked="${#lists.contains(user.roles, role)}">
                                        <label class="form-check-label" th:for="'role_'+${role.roleId}" th:text="${role.roleName}"></label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Update User</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Reset Password Form -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 border-danger">
                <div class="card-header bg-danger text-white"><h5 class="mb-0">Reset Password</h5></div>
                <div class="card-body">
                    <form th:action="@{/users/reset-password/{id}(id=${user.userId})}" method="post">
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100" onclick="return confirm('Reset password for this user?');">
                            <i class="bi bi-key"></i> Confirm Reset
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
