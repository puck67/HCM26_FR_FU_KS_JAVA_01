<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: layout(content=~{::main})}">
<body>
<main>
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Add New Role</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <a href="/roles" class="btn btn-sm btn-secondary">
                <i class="bi bi-arrow-left"></i> Back to List
            </a>
        </div>
    </div>

    <div class="card shadow-sm border-0 col-md-6">
        <div class="card-body">
            <form th:action="@{/roles/add}" method="post" th:object="${role}">
                <div class="mb-3">
                    <label for="roleName" class="form-label">Role Name (e.g., ADMIN, USER)</label>
                    <input type="text" class="form-control" id="roleName" th:field="*{roleName}" required>
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
