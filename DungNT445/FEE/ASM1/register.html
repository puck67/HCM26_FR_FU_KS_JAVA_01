<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex align-items-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-light text-center">
                        Register
                    </div>
                    <div class="card-body">
                        <form id="registerForm" novalidate>
                            <div class="form-group">
                                <input type="text" name="username" class="form-control" placeholder="User name" required maxlength="50">
                                <div class="error-feedback"></div>
                            </div>
                            <div class="form-group">
                                <input type="email" name="email" class="form-control" placeholder="E-mail" required maxlength="50">
                                <div class="error-feedback"></div>
                            </div>
                            <div class="form-group">
                                <input type="password" name="password" class="form-control" placeholder="Password" required maxlength="50">
                                <div class="error-feedback"></div>
                            </div>
                            <div class="form-group">
                                <input type="password" name="repassword" class="form-control" placeholder="Re Password" required>
                                <div class="error-feedback"></div>
                            </div>
                            <button type="submit" class="btn btn-block btn-custom-green">Register</button>
                            <div class="text-center mt-3">
                                <a href="login.html" class="small text-success">Click here to Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
