<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Task Board</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Project Board</h1>
            <input type="text" id="searchInput" placeholder="Search tasks...">
        </div>
        
        <div class="board" id="kanbanBoard">
            <!-- To Do Column -->
            <div class="column todo-col">
                <div class="column-header">TO DO</div>
                <div class="add-task-container">
                    <input type="text" class="task-input" placeholder="Add a task to To Do">
                    <button class="add-btn">+</button>
                </div>
                <div class="task-list" id="todoList">
                    <!-- Tasks will be appended here -->
                </div>
            </div>

            <!-- In Progress Column -->
            <div class="column in-progress-col">
                <div class="column-header">IN PROGRESS</div>
                <div class="add-task-container">
                    <input type="text" class="task-input" placeholder="Add a task to In Progress">
                    <button class="add-btn">+</button>
                </div>
                <div class="task-list" id="inProgressList">
                    <!-- Tasks will be appended here -->
                </div>
            </div>

            <!-- Done Column -->
            <div class="column done-col">
                <div class="column-header">DONE</div>
                <div class="add-task-container">
                    <input type="text" class="task-input" placeholder="Add a task to Done">
                    <button class="add-btn">+</button>
                </div>
                <div class="task-list" id="doneList">
                    <!-- Tasks will be appended here -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
